name: Stage3 S3G1A Official Filing Source Probe

on:
  workflow_dispatch:
  push:
    branches: [stage3-point-in-time-features]
    paths:
      - 'scripts/probe_stage3_cninfo_filing_source.py'
      - 'config/security_code_transitions.json'
      - '.github/workflows/stage3-s3g1-filing-source-probe.yml'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/probe_stage3_cninfo_filing_source.py'
      - 'config/security_code_transitions.json'
      - '.github/workflows/stage3-s3g1-filing-source-probe.yml'

permissions:
  contents: read
  actions: read

env:
  G2_FROZEN_RUN: '30242396006'
  G2_INTERVALS_SHA256: '855835d153b52bc20ffde055cab20154534d3e1301815fa24a54d6e0cd2ace6f'

jobs:
  filing-source-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime dependency
        run: python -m pip install --disable-pip-version-check requests
      - name: Restore exact frozen Stage2 G2 lifecycle universe
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/stage2-g2
          gh run download "$G2_FROZEN_RUN" -R "$GITHUB_REPOSITORY" \
            -n stage2-g2-historical-evidence -D /tmp/stage2-g2
          test -f /tmp/stage2-g2/security_intervals.csv
          echo "$G2_INTERVALS_SHA256  /tmp/stage2-g2/security_intervals.csv" | sha256sum -c -
          cp /tmp/stage2-g2/security_intervals.csv data/security_lifecycle/security_intervals.csv
      - name: Probe CNINFO periodic filing source and preserve diagnostics
        shell: bash
        run: |
          set +e
          mkdir -p data/stage3_source_probe
          python scripts/probe_stage3_cninfo_filing_source.py \
            > data/stage3_source_probe/stdout.log \
            2> data/stage3_source_probe/stderr.log
          code=$?
          echo "S3G1A_EXIT=$code" >> "$GITHUB_ENV"
          cat data/stage3_source_probe/cninfo_periodic_filing_probe.json || true
          cat data/stage3_source_probe/stderr.log || true
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: stage3-s3g1a-filing-source-probe
          path: data/stage3_source_probe
          retention-days: 90
      - name: Preserve fail-closed probe status
        if: env.S3G1A_EXIT != '0'
        run: exit 1
