name: Stage3 S3G1J V17.30 Runtime Evidence Contract

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'governance/stage3_s3g1j_v17_30_runtime_wrapper_acceptance.json'
      - 'governance/stage3_s3g1j_v17_30_runtime_promotion.json'
      - 'governance/stage3_s3g1j_v17_30_residual_retention.json'
      - 'governance/stage3_s3g1j_runtime_manifest.json'
      - 'governance/stage3_workflow_activation_manifest.json'
      - 'governance/stage3_s3g4_final.json'
      - 'config/stage3_final_lock.json'
      - 'data/project_status.json'
      - '.github/workflows/stage3-s3g1j-v17-30-runtime-evidence-contract.yml'

permissions:
  contents: read
  actions: read
  pull-requests: read

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
      - name: Lock accepted V17.30 wrapper execution
        shell: bash
        run: |
          set -euo pipefail
          pr=$(gh api "repos/$GITHUB_REPOSITORY/pulls/123")
          test "$(jq -r '.state' <<<"$pr")" = closed
          test "$(jq -r '.merged' <<<"$pr")" = false
          test "$(jq -r '.head.sha' <<<"$pr")" = d26d7f543c20d717ed8c8a421e28838feecd7a03
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/31458469699")
          test "$(jq -r '.conclusion' <<<"$run")" = success
          test "$(jq -r '.head_sha' <<<"$run")" = d26d7f543c20d717ed8c8a421e28838feecd7a03
          artifact=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/9088925988")
          test "$(jq -r '.name' <<<"$artifact")" = stage3-s3g1j-v17-30-inactive-runtime-wrapper
          test "$(jq -r '.digest' <<<"$artifact")" = sha256:232b2e4a6c64b271193853d4e8fd32c0fdfd367344ecec720902fe8f090333dc
          test "$(jq -r '.expired' <<<"$artifact")" = false
      - name: Verify registered wrapper, raw basis, retained residuals and S3G4-complete boundary
        run: |
          python - <<'PY'
          import json
          w=json.load(open('governance/stage3_s3g1j_v17_30_runtime_wrapper_acceptance.json',encoding='utf-8'))
          p=json.load(open('governance/stage3_s3g1j_v17_30_runtime_promotion.json',encoding='utf-8'))
          rr=json.load(open('governance/stage3_s3g1j_v17_30_residual_retention.json',encoding='utf-8'))
          r=json.load(open('governance/stage3_s3g1j_runtime_manifest.json',encoding='utf-8'))
          a=json.load(open('governance/stage3_workflow_activation_manifest.json',encoding='utf-8'))
          l=json.load(open('config/stage3_final_lock.json',encoding='utf-8'))
          s=json.load(open('data/project_status.json',encoding='utf-8'))
          assert w['execution_pr']['number']==123
          assert w['execution_pr']['final_head_sha']=='d26d7f543c20d717ed8c8a421e28838feecd7a03'
          assert w['execution_pr']['closed_without_merge'] is True
          assert w['accepted_run']['run_id']==31458469699 and w['accepted_run']['artifact_id']==9088925988
          assert w['authorization']['formal_v17_30_runtime_promotion_governance_eligible'] is True
          assert w['authorization']['v17_30_runtime_authority_activated'] is False
          assert w['authorization']['fresh_v17_30_full_basis_execution_authorized'] is False
          assert p['generation']=='V17.30' and p['governance_pr']==125
          assert p['accepted_code_identity']['production_parser_git_blob']=='cc782817e5ee73fcae085d71f4896a0adc004dcd'
          assert p['accepted_code_identity']['extractor_git_blob']=='d74a2b1f8f0ec3af8d89ce259e83392d7f8cc20c'
          # Historical promotion checkpoint remains immutable.
          assert p['next_full_basis']['status']=='REQUIRED_NOT_STARTED'
          assert p['next_full_basis']['expected_values_are_not_production_acceptance'] is True
          assert r['formal_runtime']['runtime_generation']=='V17.30'
          latest=r['full_basis_last_completed_final']
          assert latest['generation']=='V17.30' and latest['run']==31518370789 and latest['artifact_id']==9112098872
          assert latest['numeric_observations']==1051826 and latest['document_error_count']==1362 and latest['unresolved_tie_count']==1279 and latest['verdict']=='FAIL_CLOSED'
          assert r['previous_last_completed_full_basis_final']['generation']=='V17.29'
          assert r['next_full_basis_required']['status']=='NONE_CURRENT_RUNTIME_ACCEPTED'
          current=a['accepted_production_runtime']
          assert current['generation']=='V17.30' and current['full_basis_execution_pending'] is False
          assert current['last_completed_full_basis_generation']=='V17.30' and current['last_completed_full_basis_run']==31518370789
          assert rr['accepted_run']['run_id']==31555404674 and rr['accepted_run']['artifact_id']==9125809076
          assert rr['retention_result']['retained_document_count']==1362 and rr['retention_result']['retained_unresolved_tie_count']==1279
          assert rr['retention_result']['raw_errors_removed'] is False and rr['retention_result']['retained_rows_usable_as_numeric_truth'] is False
          g=l['required_gates']['S3G1J_FINANCIAL_RAW_VALUES']
          assert g['run_id']==31518370789 and g['document_error_count']==1362 and g['unresolved_tie_count']==1279
          assert g['raw_data_verdict']=='FAIL_CLOSED'
          assert g['residual_retention_run_id']==31555404674 and g['residual_retention_gate_pass'] is True and g['final_gate_pass'] is True
          g4=l['required_gates']['S3G4_EARNINGS_SURPRISE']
          assert g4['run_id']==31557811596 and g4['artifact_id']==9126607328 and g4['final_gate_pass'] is True
          assert l['remaining_unlocked_gates']==[]
          assert s['stage3']['s3g1j']['accepted_run_id']==31518370789
          assert s['stage3']['s3g1j']['raw_data_verdict']=='FAIL_CLOSED'
          assert s['stage3']['s3g1j']['residual_retention_gate_pass'] is True and s['stage3']['s3g1j']['final_gate_pass'] is True
          assert s['stage3']['s3g4']['accepted_run_id']==31557811596 and s['stage3']['s3g4']['final_gate_pass'] is True
          assert s['stage3']['status'] in {'NOT_READY','PASS_FROZEN_HISTORICAL'} and s['stage3']['pending_final_gates']==[]
          assert s['freshness']['status']=='STALE'
          assert s['stage4_unlocked'] is False and s['alpha_training_allowed'] is False and s['live_signal_allowed'] is False
          print('V17_30_RUNTIME_RETAINED_RESIDUAL_AND_S3G4_COMPLETE_EVIDENCE_PASS')
          PY
