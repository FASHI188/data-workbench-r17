name: Stage3 S3G1J V16.7 Production Fallback Acceptance

on:
  pull_request:
    branches: [stage3-s3g1j-coordinate-table-v14]
    paths:
      - '.github/workflows/stage3-s3g1j-v16-7-production-acceptance.yml'
      - 'scripts/stage3_financial_pdf_parser_v10.py'
      - 'scripts/extract_stage3_financial_pdf_values_v10.py'
      - 'scripts/extract_stage3_financial_pdf_values_v11.py'
      - 'scripts/probe_stage3_s3g1j_v16_7_production_regression.py'
      - 'tests/test_stage3_v16_contextual_parser.py'
      - 'scripts/stage3_financial_spatial_alias_v16_7.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ github.token }}
  V13_SMOKE_RUN: '30382695045'
  V14_ACCEPTANCE_RUN: '30423298099'
  V15_ACCEPTANCE_RUN: '30425765965'
  V16_7_COLUMN_GATE_RUN: '30431702288'
  PYTHONPATH: scripts

jobs:
  validate-production-fallback:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests pymupdf
      - name: Require accepted upstream gates
        run: |
          test "$(gh run view "$V14_ACCEPTANCE_RUN" -R "$GITHUB_REPOSITORY" --json conclusion --jq .conclusion)" = success
          test "$(gh run view "$V15_ACCEPTANCE_RUN" -R "$GITHUB_REPOSITORY" --json conclusion --jq .conclusion)" = success
          test "$(gh run view "$V16_7_COLUMN_GATE_RUN" -R "$GITHUB_REPOSITORY" --json conclusion --jq .conclusion)" = success
      - name: Run contextual parser contract tests
        run: python -m unittest tests.test_stage3_v16_contextual_parser -v
      - name: Restore exact frozen V12.1 version ledger
        run: |
          rm -rf versions data/stage3_source_probe_v16_prod data/stage3_v16_prod_extract
          gh run download "$V13_SMOKE_RUN" -R "$GITHUB_REPOSITORY" \
            -n stage3-s3g1j-v13-smoke-versions -D versions
          test -f versions/stage3_financial_report_versions_v3.csv.gz
      - name: Build exact 12-residual frozen subset
        run: |
          python - <<'PY'
          import csv,gzip
          from pathlib import Path
          ids={
            '1200948256','1203240204','1202637566','1204557640','1205969212','1207547788',
            '1209728461','1212671853','1219442543','1221090309','1222949445','1223096939',
          }
          src=Path('versions/stage3_financial_report_versions_v3.csv.gz')
          dst=Path('versions/v16_12_residual_versions.csv.gz')
          with gzip.open(src,'rt',encoding='utf-8',newline='') as f:
            reader=csv.DictReader(f); rows=[r for r in reader if r['canonical_announcement_id'] in ids]; fields=reader.fieldnames
          assert len(rows)==12, [r['canonical_announcement_id'] for r in rows]
          with gzip.open(dst,'wt',encoding='utf-8',newline='') as f:
            w=csv.DictWriter(f,fieldnames=fields); w.writeheader(); w.writerows(rows)
          PY
      - name: Run explicit-context V16 extractor on 12 residuals
        continue-on-error: true
        run: |
          python scripts/extract_stage3_financial_pdf_values_v11.py \
            --versions versions/v16_12_residual_versions.csv.gz \
            --shard 0 --shards 1 --out data/stage3_v16_prod_extract
      - name: Enforce V14 differential regression and V16 production shape
        run: |
          python scripts/probe_stage3_s3g1j_v16_7_production_regression.py \
            --versions versions/stage3_financial_report_versions_v3.csv.gz \
            --extract-dir data/stage3_v16_prod_extract \
            --out data/stage3_source_probe_v16_prod/production_acceptance.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage3-s3g1j-v16-7-production-acceptance
          path: |
            data/stage3_source_probe_v16_prod/production_acceptance.json
            data/stage3_v16_prod_extract/*.manifest.json
            data/stage3_v16_prod_extract/financial_documents_shard*.csv.gz
            data/stage3_v16_prod_extract/financial_values_shard*.csv.gz
          retention-days: 90
          compression-level: 0
