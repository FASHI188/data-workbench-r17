name: Stage3 S3G1J V17.25 Production Acceptance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/stage3_financial_pdf_parser_v17.py'
      - 'scripts/accept_stage3_s3g1j_v17_25_production.py'
      - 'scripts/finalize_stage3_s3g1j_v17_25_production.py'
      - 'tests/test_stage3_v17_25_production_parser.py'
      - '.github/workflows/stage3-s3g1j-v17-25-production-acceptance.yml'

permissions:
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ github.token }}
  P0_RUN: '30687837626'
  P0_HEAD: 'ef083b267625a4942c6f4e736d2c8178aa4a594d'
  P0_ARTIFACT: 'stage3-s3g1j-p0-current-v17-24-diagnostic-v1'
  P0_DIGEST: 'sha256:b4e310fbb2b41d33d2c2c545589a6af53487dbfd1492dbb971d860fdcb4a14f0'
  P0_REPORT_SHA256: 'a3121a6a16261ed622a6b88fcc2db77fe791c317c133dddd2e45be8a523b943d'
  V17_24_RUN: '30685830808'
  V17_24_HEAD: '92de74e7898be36239dc163e3811c9ae3f732e60'
  V17_24_ARTIFACT: 'stage3-s3g1j-v17-24-production-acceptance-compat'
  V17_24_DIGEST: 'sha256:4865dd03537c70208d2a4358cf8b54ab65408510fce838017a4bf77bee30a98d'
  CANDIDATE_RUN: '30690306327'
  CANDIDATE_HEAD: 'db28bc96283e3d003527a5dd007ff056892e9db4'
  CANDIDATE_ARTIFACT: 'stage3-s3g1j-v17-25-generic-group-witness-candidate-safety-sharded'
  CANDIDATE_DIGEST: 'sha256:b63cdb341ab30d62bb25bf49cc8c94d3ffdc8df97fd9e39c9aada0629c867dd9'
  CANDIDATE_REPORT_SHA256: 'f985cc7d1d24f42e4908bc27a556dcd92393261907181a57237e25bdd412c331'
  PYTHONPATH: scripts

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
      - name: Install exact verified production dependencies
        run: python -m pip install --disable-pip-version-check --constraint requirements/constraints-verified.txt requests PyMuPDF
      - name: Lock P0, V17.24 and V17.25 candidate evidence
        shell: bash
        run: |
          set -euo pipefail
          gh_api_retry() {
            endpoint="$1"
            for attempt in 1 2 3 4 5 6; do
              if output=$(gh api "$endpoint" 2>gh-api-error.log); then
                printf '%s' "$output"
                return 0
              fi
              cat gh-api-error.log >&2 || true
              sleep $((attempt * 15))
            done
            return 1
          }
          lock_run_artifact() {
            run="$1"; expected_head="$2"; artifact="$3"; expected_digest="$4"
            run_json=$(gh_api_retry "repos/$GITHUB_REPOSITORY/actions/runs/$run")
            test "$(jq -r '.conclusion' <<<"$run_json")" = success
            test "$(jq -r '.head_sha' <<<"$run_json")" = "$expected_head"
            artifact_json=$(gh_api_retry "repos/$GITHUB_REPOSITORY/actions/runs/$run/artifacts")
            actual=$(jq -r --arg artifact "$artifact" '.artifacts[] | select(.name==$artifact) | .digest' <<<"$artifact_json")
            test -n "$actual"
            test "$actual" = "$expected_digest"
          }
          lock_run_artifact "$P0_RUN" "$P0_HEAD" "$P0_ARTIFACT" "$P0_DIGEST"
          lock_run_artifact "$V17_24_RUN" "$V17_24_HEAD" "$V17_24_ARTIFACT" "$V17_24_DIGEST"
          lock_run_artifact "$CANDIDATE_RUN" "$CANDIDATE_HEAD" "$CANDIDATE_ARTIFACT" "$CANDIDATE_DIGEST"
      - name: Download locked evidence once
        shell: bash
        run: |
          set -euo pipefail
          download_retry() {
            run="$1"; artifact="$2"; destination="$3"
            for attempt in 1 2 3 4 5 6; do
              rm -rf "$destination"
              if gh run download "$run" -R "$GITHUB_REPOSITORY" -n "$artifact" -D "$destination"; then
                return 0
              fi
              sleep $((attempt * 15))
            done
            return 1
          }
          mkdir -p inputs
          download_retry "$P0_RUN" "$P0_ARTIFACT" inputs/p0
          download_retry "$V17_24_RUN" "$V17_24_ARTIFACT" inputs/v17-24
          download_retry "$CANDIDATE_RUN" "$CANDIDATE_ARTIFACT" inputs/candidate
          test -f inputs/p0/report.json
          test -f inputs/v17-24/candidate/shard0.json
          test -f inputs/v17-24/candidate/shard1.json
          test -f inputs/v17-24/candidate/shard7.json
          test -f inputs/v17-24/candidate/shard9.json
          test -f inputs/candidate/report.json
          test "$(sha256sum inputs/p0/report.json | cut -d' ' -f1)" = "$P0_REPORT_SHA256"
          test "$(sha256sum inputs/candidate/report.json | cut -d' ' -f1)" = "$CANDIDATE_REPORT_SHA256"
      - name: Run V17.25 production contracts
        run: |
          python -m unittest tests.test_stage3_v17_25_generic_group_witness -v
          python -m unittest tests.test_stage3_v17_25_production_parser -v
          python -m py_compile \
            scripts/stage3_financial_pdf_parser_v17.py \
            scripts/accept_stage3_s3g1j_v17_25_production.py \
            scripts/finalize_stage3_s3g1j_v17_25_production.py
          python - <<'PY'
          import stage3_financial_pdf_parser_v15 as v1724
          import stage3_financial_pdf_parser_v17 as v1725
          assert v1724.METHOD=='V17_24_EXACT_CORRUPTED_GROUP_EQUITY_ALIAS_FINAL_FALLBACK'
          assert v1725.METHOD=='V17_25_EXACT_SOURCE_GENERIC_GROUP_WITNESS_PRODUCTION'
          assert v1725.TARGET_SOURCE_SHA256=='320e3a950a4768e73766d57a09bcf34d893d4da949b8ed5a1b2f887852e76229'
          print('S3G1J_V17_25_PRODUCTION_IMPORT_PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v17-25-production-acceptance-inputs
          path: inputs
          retention-days: 1
          compression-level: 0

  replay:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
      - run: python -m pip install --disable-pip-version-check --constraint requirements/constraints-verified.txt requests PyMuPDF
      - uses: actions/download-artifact@v4
        with:
          name: v17-25-production-acceptance-inputs
          path: inputs
      - name: Replay exact83 shard ${{ matrix.shard }}/8
        run: |
          python scripts/accept_stage3_s3g1j_v17_25_production.py \
            --p0-report inputs/p0/report.json \
            --candidate-report inputs/candidate/report.json \
            --v17-24-root inputs/v17-24 \
            --shard ${{ matrix.shard }} \
            --shards 8 \
            --out build/shard-${{ matrix.shard }}/report.json
      - uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.shard }}
          path: build/shard-${{ matrix.shard }}
          retention-days: 90
          compression-level: 0

  summarize:
    needs: replay
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
      - uses: actions/download-artifact@v4
        with:
          pattern: shard-*
          path: partials
      - name: Finalize exact83 production acceptance
        run: |
          python scripts/finalize_stage3_s3g1j_v17_25_production.py \
            --root partials \
            --out build/v17-25-production-acceptance/report.json
      - name: Enforce final production verdict
        run: |
          python - <<'PY'
          import json
          x=json.load(open('build/v17-25-production-acceptance/report.json',encoding='utf-8'))
          assert x['pass'] is True and x['errors']==[]
          assert x['input_count_exact83']==83
          assert x['source_sha_match_count']==83
          assert x['production_recovered_announcement_ids']==['1207035181','1212731093','1219311356','1221568845','1225153907']
          assert x['previous_v17_24_recovery_announcement_ids']==['1212731093','1219311356','1221568845','1225153907']
          assert x['incremental_v17_25_recovery_announcement_ids']==['1207035181']
          assert x['remaining_fail_closed_count']==78
          assert x['previous_82_results_required_equal_v17_24'] is True
          assert x['accounting_tolerance']=='0.005'
          assert x['global_row_tolerance_changed'] is False
          assert x['source_policy_changed'] is False
          assert x['e_equals_a_minus_l_inference'] is False
          assert x['production_data_changed'] is False
          assert x['stage3_status']=='NOT_READY'
          assert x['stage4_alpha_locked'] is True
          print(json.dumps({
              'recovered':x['production_recovered_announcement_ids'],
              'incremental':x['incremental_v17_25_recovery_announcement_ids'],
              'remaining_fail_closed_count':x['remaining_fail_closed_count'],
          },ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stage3-s3g1j-v17-25-production-acceptance
          path: build/v17-25-production-acceptance
          retention-days: 90
          compression-level: 0
