name: Stage3 Clean S3G1J V17.11 Exact-82 Structure Diagnostic

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/diagnose_stage3_s3g1j_v17_11_remaining.py'
      - '.github/workflows/stage3-clean-s3g1j-v17-11-remaining-diagnostic.yml'

permissions:
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ github.token }}
  FROZEN_RUN: '30424465440'
  FROZEN_HEAD: 'be42608b75f77af13c36620da7e7fa03c563afde'
  FROZEN_ARTIFACT: 'stage3-s3g1j-v15-single-source-input'
  FROZEN_DIGEST: 'sha256:272f52239adc2fc5d4343ec091495dffcd39324b425784cdf5a7491f63a2e6fd'
  ACCEPTED_RUN: '30510347556'
  ACCEPTED_HEAD: 'e98d26b962a58cecc5c6416214e3c798c5e8a49e'
  ACCEPTED_ARTIFACT: 'stage3-s3g1j-v17-11-column-evidence-acceptance'
  ACCEPTED_DIGEST: 'sha256:b1143faaf2c1a91fd64e21ef35c05e787200d957f888613fa2f2a2fc23c43ad9'
  PYTHONPATH: scripts

jobs:
  lock-inputs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lock exact frozen versions and accepted V17.11 residual state
        shell: bash
        run: |
          set -euo pipefail
          lock_run_artifact() {
            run="$1"; expected_head="$2"; artifact="$3"; expected_digest="$4"
            conclusion=$(gh run view "$run" -R "$GITHUB_REPOSITORY" --json conclusion --jq '.conclusion')
            head=$(gh run view "$run" -R "$GITHUB_REPOSITORY" --json headSha --jq '.headSha')
            test "$conclusion" = success
            test "$head" = "$expected_head"
            actual=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/artifacts" --jq ".artifacts[] | select(.name==\"$artifact\") | .digest")
            test "$actual" = "$expected_digest"
          }
          lock_run_artifact "$FROZEN_RUN" "$FROZEN_HEAD" "$FROZEN_ARTIFACT" "$FROZEN_DIGEST"
          lock_run_artifact "$ACCEPTED_RUN" "$ACCEPTED_HEAD" "$ACCEPTED_ARTIFACT" "$ACCEPTED_DIGEST"

  diagnose:
    needs: lock-inputs
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 7, 9]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
      - name: Install exact verified diagnostic dependencies
        run: python -m pip install --disable-pip-version-check --constraint requirements/constraints-verified.txt requests PyMuPDF
      - name: Restore exact accepted residual inputs
        shell: bash
        run: |
          set -euo pipefail
          rm -rf prepared accepted build/s3g1j-v17-11-remaining
          gh run download "$FROZEN_RUN" -R "$GITHUB_REPOSITORY" -n "$FROZEN_ARTIFACT" -D prepared
          gh run download "$ACCEPTED_RUN" -R "$GITHUB_REPOSITORY" -n "$ACCEPTED_ARTIFACT" -D accepted
          test -f prepared/single_source_residual_versions.csv.gz
          test -f accepted/v17_11_column_evidence_acceptance.json
      - name: Diagnose current parser evidence without changing policy
        shell: bash
        run: |
          set +e
          out="build/s3g1j-v17-11-remaining/shard${{ matrix.shard }}.json"
          mkdir -p "$(dirname "$out")"
          python scripts/diagnose_stage3_s3g1j_v17_11_remaining.py \
            --versions prepared/single_source_residual_versions.csv.gz \
            --acceptance accepted/v17_11_column_evidence_acceptance.json \
            --shard ${{ matrix.shard }} --shards 64 --out "$out" \
            > "${out%.json}.stdout.log" 2> "${out%.json}.stderr.log"
          code=$?
          echo "DIAGNOSTIC_EXIT=$code" >> "$GITHUB_ENV"
          cat "$out" || true
          tail -100 "${out%.json}.stderr.log" || true
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage3-s3g1j-v17-11-exact-82-structure-${{ matrix.shard }}
          path: build/s3g1j-v17-11-remaining
          retention-days: 90
          compression-level: 0
      - name: Preserve diagnostic execution failure
        if: env.DIAGNOSTIC_EXIT != '0'
        run: exit 1

  summarize:
    needs: diagnose
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: stage3-s3g1j-v17-11-exact-82-structure-*
          path: candidate
          merge-multiple: true
      - name: Restore accepted V17.11 source-SHA evidence
        shell: bash
        run: |
          set -euo pipefail
          rm -rf accepted
          gh run download "$ACCEPTED_RUN" -R "$GITHUB_REPOSITORY" -n "$ACCEPTED_ARTIFACT" -D accepted
          test -f accepted/v17_11_column_evidence_acceptance.json
      - name: Enforce exact 82, immutable source PDFs, and aggregate structure clusters
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import glob,json,os
          from collections import Counter,defaultdict
          paths=sorted(glob.glob('candidate/shard*.json'))
          reports=[json.load(open(p,encoding='utf-8')) for p in paths]
          reports.sort(key=lambda x:x['shard'])
          assert [r['shard'] for r in reports]==[0,1,7,9], [r.get('shard') for r in reports]
          assert all(r.get('pass') is True for r in reports), [r.get('diagnostic_failures') for r in reports]
          assert sum(r['input_residual_count'] for r in reports)==82
          assert sum(r['diagnosed_count'] for r in reports)==82
          rows=[x for r in reports for x in r['diagnostics']]
          assert len(rows)==82
          assert len({x['announcement_id'] for x in rows})==82

          accepted=json.load(open('accepted/v17_11_column_evidence_acceptance.json',encoding='utf-8'))
          assert accepted.get('pass') is True
          assert accepted.get('v17_11_remaining_count')==82
          expected={str(x['announcement_id']):x for x in accepted['remaining']}
          actual={str(x['announcement_id']):x for x in rows}
          assert set(actual)==set(expected)
          sha_mismatches=[]
          unexpected_recoveries=[]
          for aid,row in actual.items():
              if row['source_sha256']!=expected[aid]['sha256']:
                  sha_mismatches.append({'announcement_id':aid,'expected':expected[aid]['sha256'],'actual':row['source_sha256']})
              if row.get('current_balance_sheet_block') is not None or row.get('funnel_category')=='UNEXPECTED_RECOVERY':
                  unexpected_recoveries.append(aid)
          assert not sha_mismatches, sha_mismatches
          assert not unexpected_recoveries, unexpected_recoveries

          funnel=Counter(x['funnel_category'] for x in rows)
          structural=Counter(tag for x in rows for tag in x['structural_tags'])
          by_family=defaultdict(Counter)
          by_year=defaultdict(Counter)
          examples=defaultdict(list)
          for x in rows:
              by_family[x['report_family']][x['funnel_category']]+=1
              by_year[x['economic_date'][:4]][x['funnel_category']]+=1
              for tag in x['structural_tags']:
                  if len(examples[tag])<10:
                      examples[tag].append({
                          'announcement_id':x['announcement_id'],
                          'source_code':x['source_code'],
                          'report_family':x['report_family'],
                          'economic_date':x['economic_date'],
                          'funnel_category':x['funnel_category'],
                      })
          report={
              'gate':'S3G1J_V17_11_EXACT_82_STRUCTURE_DIAGNOSTIC',
              'pass':True,
              'diagnostic_only':True,
              'no_parser_change':True,
              'no_ocr':True,
              'source_pdf_sha_matches_accepted_count':82,
              'input_residual_count':82,
              'diagnosed_count':82,
              'unexpected_recovery_count':0,
              'funnel_category_counts':dict(funnel),
              'structural_tag_counts':dict(structural),
              'family_funnel_counts':{k:dict(v) for k,v in sorted(by_family.items())},
              'year_funnel_counts':{k:dict(v) for k,v in sorted(by_year.items())},
              'structural_examples':dict(examples),
              'per_shard':[{k:r[k] for k in ('shard','input_residual_count','diagnosed_count','funnel_category_counts','structural_tag_counts')} for r in reports],
              'accounting_tolerance_changed':False,
              'source_policy_changed':False,
              'stage4_alpha_locked':True,
              'errors':[],
          }
          os.makedirs('summary',exist_ok=True)
          json.dump(report,open('summary/s3g1j_v17_11_exact_82_structure_diagnostic.json','w',encoding='utf-8'),ensure_ascii=False,indent=2)
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage3-s3g1j-v17-11-exact-82-structure-diagnostic
          path: summary
          retention-days: 90
          compression-level: 0
