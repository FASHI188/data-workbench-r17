name: Stage3 S3G1J Coordinate Fallback V14 Acceptance

on:
  pull_request:
    branches: [stage3-s3g1j-identity-arbitration-v13]
    paths:
      - '.github/workflows/stage3-s3g1j-coordinate-fallback-v14-acceptance.yml'
      - 'scripts/stage3_financial_coordinate_fallback_v14.py'
      - 'scripts/stage3_financial_pdf_parser_v9.py'
      - 'scripts/extract_stage3_financial_pdf_values_v9.py'
      - 'scripts/probe_stage3_s3g1j_v14_recovery_48.py'
      - 'tests/test_stage3_financial_coordinate_fallback_v14_integration.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  FILING_LEDGER_RUN: '30265340486'
  PYTHONPATH: scripts

jobs:
  validate-v14:
    runs-on: ubuntu-latest
    timeout-minutes: 210
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests pymupdf

      - name: Preserve V11 grammar regressions
        run: python -m unittest tests.test_stage3_financial_pdf_parser_v11 -v
      - name: Preserve V13 identity regressions
        run: python -m unittest tests.test_stage3_financial_pdf_parser_v13 -v
      - name: Preserve exact five-PDF V13 regression
        run: python scripts/probe_stage3_s3g1j_parser_identity_v13.py
      - name: Run V14 official-PDF 4-positive 4-negative gate
        run: python -m unittest tests.test_stage3_financial_coordinate_fallback_v14_integration -v

      - name: Restore frozen successful S3G1E filing ledger
        run: |
          rm -rf filing-ledger versions data/stage3_source_selection_v14
          gh run download "$FILING_LEDGER_RUN" -R "$GITHUB_REPOSITORY" \
            -n stage3-s3g1e-periodic-filing-ledger-final -D filing-ledger
          test -f filing-ledger/stage3_periodic_filing_ledger.csv.gz
      - name: Rebuild V12.1 full-statement authority ledger
        run: |
          mkdir -p versions
          python scripts/select_stage3_financial_report_versions_v3_1.py \
            --ledger filing-ledger/stage3_periodic_filing_ledger.csv.gz \
            --out versions
          test -f versions/stage3_financial_report_versions_v3.csv.gz
      - name: Measure V14 on the exact same 48 V10.1 failures
        run: |
          mkdir -p data/stage3_source_selection_v14
          python scripts/probe_stage3_s3g1j_v14_recovery_48.py \
            --ledger filing-ledger/stage3_periodic_filing_ledger.csv.gz \
            --versions versions/stage3_financial_report_versions_v3.csv.gz \
            --samples config/stage3_s3g1j_v10_diagnostic_samples.json \
            --out data/stage3_source_selection_v14/combined_recovery_48.json
      - name: Enforce V14 incremental recovery and PIT invariants
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/stage3_source_selection_v14/combined_recovery_48.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          assert d['diagnostic_pass'] is True, d.get('diagnostic_errors')
          assert d['sample_count'] == 48, d['sample_count']
          assert d['recovered_count'] >= 27, d['recovered_count']
          assert d['outcome_counts'].get('NO_FULL_AUTHORITY_SAME_MOMENT', 0) == 5, d['outcome_counts']
          assert not d.get('diagnostic_errors'), d.get('diagnostic_errors')
          print('V14_48_GATE_PASS', d['recovered_count'], d['outcome_counts'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage3-s3g1j-coordinate-fallback-v14-acceptance
          path: data/stage3_source_selection_v14/
          retention-days: 90
          compression-level: 0
