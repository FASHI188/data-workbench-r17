name: Stage4 Alpha V1 OOS Label Completion Authorization V1

on:
  pull_request:
    branches:
      - agent/stage3-clean-integration
    paths:
      - '.github/workflows/stage4-alpha-v1-oos-label-completion-authorization.yml'
      - 'governance/accepted_project_state.json'
      - 'governance/project_module_index.json'
      - 'governance/stage4_alpha_v1_oos_label_completion_authorization_v1.json'
      - 'governance/stage4_alpha_v1_oos_label_completion_authorization_audit_v1.json'
      - 'scripts/audit_stage4_alpha_v1_oos_label_completion_authorization_v1.py'

permissions:
  contents: read

jobs:
  static-arming-governance:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0


      - name: Detect V1.2 armed successor
        id: armed_v12
        shell: bash
        run: |
          if test -f governance/stage4_alpha_v1_oos_label_completion_authorization_v1_2.json; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify V1.2 armed successor
        if: steps.armed_v12.outputs.present == 'true'
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('governance/stage4_alpha_v1_oos_label_completion_authorization_v1_2.json').read_text())
          s=json.loads(Path('governance/accepted_project_state.json').read_text())
          assert a['fingerprint']=='0a7c2e5ed7777bc84ad4db22b91c5e84da5dc819a186d743d19bb603b158f10a'
          assert a['status']=='AUTHORIZED_SINGLE_USE_OOS_LABEL_COMPLETION_V1'
          assert a['fingerprint_basis']['authorization_armed'] is True
          assert a['fingerprint_basis']['armed_runs_remaining']==1
          assert s['permissions']['oos_execution_pr_creation_allowed'] is False
          assert s['permissions']['oos_label_access_allowed'] is False
          assert s['permissions']['oos_label_bearing_execution_runs_remaining']==1
          PY
      - name: Detect consumed-incomplete successor
        id: consumed
        shell: bash
        run: |
          if test -f governance/stage4_alpha_v1_oos_label_completion_consumed_incomplete_evidence.json; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify consumed-incomplete handoff
        if: steps.consumed.outputs.present == 'true' && steps.armed_v12.outputs.present != 'true'
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          ev=json.loads(Path('governance/stage4_alpha_v1_oos_label_completion_consumed_incomplete_evidence.json').read_text())
          auth=json.loads(Path('governance/stage4_alpha_v1_oos_label_completion_authorization_v1.json').read_text())
          state=json.loads(Path('governance/accepted_project_state.json').read_text())
          b=ev['fingerprint_basis']
          assert ev['status']=='CONSUMED_INCOMPLETE_EXECUTION_NO_PROMOTION'
          assert b['authorization_fingerprint']==auth['fingerprint']=='b6413b67ace2601bb03f2d45e7656ab3776ee3b9e90ecfe3ed32b92626eba16b'
          assert b['authorization_consumed'] is True and b['authorization_reusable'] is False
          assert b['authorization_runs_remaining_after_event']==0
          assert state['schema_version']==14
          assert state['permissions']['oos_label_bearing_execution_runs_remaining']==0
          assert state['permissions']['oos_label_access_allowed'] is False
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
      - name: Audit single-use arming
        if: steps.consumed.outputs.present != 'true'
        run: python scripts/audit_stage4_alpha_v1_oos_label_completion_authorization_v1.py
      - name: Prove no OOS execution surface in arming PR
        shell: bash
        run: |
          set -euo pipefail
          test ! -e build/oos
          test ! -e build/out
          ! grep -n -E 'download-artifact|curl|wget|gh[[:space:]]+api|run_stage4_alpha_v1_oos_label_completion.py[[:space:]]+--authorization' .github/workflows/stage4-alpha-v1-oos-label-completion-authorization.yml | grep -v 'grep -n -E'
      - name: Prove PR scope is exact arming governance set
        if: steps.consumed.outputs.present != 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only "$BASE_SHA" HEAD | sort > /tmp/changed.txt
          cat > /tmp/expected.txt <<'EOF'
          .github/workflows/stage4-alpha-v1-oos-label-completion-authorization-reservation.yml
          .github/workflows/stage4-alpha-v1-oos-label-completion-authorization.yml
          governance/accepted_project_state.json
          governance/project_module_index.json
          governance/stage4_alpha_v1_oos_label_completion_authorization_audit_v1.json
          governance/stage4_alpha_v1_oos_label_completion_authorization_v1.json
          scripts/audit_stage4_alpha_v1_oos_label_completion_authorization_v1.py
          EOF
          sort -o /tmp/expected.txt /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/changed.txt
      - name: Prove execution carrier and consumed history are untouched
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          forbidden="$(git diff --name-only "$BASE_SHA" HEAD -- \
            .github/workflows/stage4-alpha-v1-oos-label-completion-execution.yml \
            governance/stage4_alpha_v1_oos_label_completion_execution_contract_v1.json \
            scripts/run_stage4_alpha_v1_oos_label_completion_execution_carrier_v1.py \
            scripts/run_stage4_alpha_v1_oos_label_completion.py \
            scripts/stage4_alpha_v1_label_materialization.py \
            scripts/stage4_alpha_v1_alpha_evaluation.py \
            governance/stage4_alpha_v1_oos_validation_consumed_incomplete_evidence.json \
            governance/stage4_alpha_v1_oos_validation_authorization.json \
            data/stage2_final data/stage3_final models)"
          test -z "$forbidden"
