name: Stage2 G5 Official Corporate Action Ledger

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/build_g5_official_actions.py'
      - 'scripts/merge_g5_official_actions.py'
      - '.github/workflows/stage2-g5-official-actions.yml'
      - 'config/g5_official_trigger.json'

permissions:
  contents: read

jobs:
  sse:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests
      - name: Build SSE official actions
        run: python scripts/build_g5_official_actions.py sse --out build/g5-official
      - uses: actions/upload-artifact@v4
        with:
          name: g5-official-sse
          path: build/g5-official
          retention-days: 30
          compression-level: 0
  szse:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: [0,1,2,3]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests akshare py-mini-racer
      - name: Build SZSE official actions shard
        run: python scripts/build_g5_official_actions.py szse-shard --shard ${{ matrix.shard }} --shards 4 --out build/g5-official
      - uses: actions/upload-artifact@v4
        with:
          name: g5-official-szse-${{ matrix.shard }}
          path: build/g5-official
          retention-days: 30
          compression-level: 0
  merge:
    needs: [sse, szse]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: g5-official-*
          path: build/g5-official
          merge-multiple: true
      - run: python scripts/merge_g5_official_actions.py --root build/g5-official --out data/corporate_actions_official
      - uses: actions/upload-artifact@v4
        with:
          name: stage2-g5-official-action-ledger
          path: |
            build/g5-official
            data/corporate_actions_official
          retention-days: 90
          compression-level: 0
