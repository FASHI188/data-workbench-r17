name: Stage4 Alpha V2 Executability D1 Prereg Acceptance
on:
  pull_request:
    branches: [agent/stage3-clean-integration]
    paths:
      - '.github/workflows/stage4-alpha-v2-executability-d1-prereg-acceptance.yml'
      - '.github/workflows/stage4-alpha-v1-oos-label-completion-result-v1-2.yml'
      - 'governance/stage4_alpha_v2_executability_d1_preregistration_acceptance.json'
      - 'governance/accepted_project_state.json'
      - 'governance/project_module_index.json'
      - 'scripts/audit_stage4_alpha_v2_executability_d1_preregistration_acceptance.py'
permissions:
  contents: read
jobs:
  static-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Detect D0 implementation acceptance successor
        id: d0_successor
        shell: bash
        run: |
          if test -f governance/stage4_alpha_v2_executability_d0_implementation_acceptance.json; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify D0 successor preserves D1 boundaries
        if: steps.d0_successor.outputs.present == 'true'
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d0=json.loads(Path('governance/stage4_alpha_v2_executability_d0_implementation_acceptance.json').read_text())
          d1=json.loads(Path('governance/stage4_alpha_v2_executability_d1_preregistration_acceptance.json').read_text())
          s=json.loads(Path('governance/accepted_project_state.json').read_text())
          m=json.loads(Path('governance/project_module_index.json').read_text())
          assert d0['fingerprint']=='9282c6e34235e93a07b8c4ee35d84dee99ae4748c2d112dd1a3690374c92402f'
          assert d1['fingerprint']=='6cf8b17249cff6889de8c6bff5952f5293987ed16cfc203e1cf8f55924b48dd5'
          p=s['permissions']
          assert p['model_fit_allowed'] is False
          assert p['model_fit_scope']=='NONE'
          assert p['oos_label_access_allowed'] is False
          assert p['oos_label_bearing_execution_runs_remaining']==0
          assert p['lockbox_label_access_allowed'] is False
          assert p['live_signal_allowed'] is False
          assert p['main_merge_allowed'] is False
          assert p['authoritative_model_output_allowed'] is False
          mm=next(x for x in m['modules'] if x['id']=='STAGE4_ALPHA_V2_EXECUTABILITY_D1')
          assert mm['status']=='PREREG_ACCEPTED_BLOCKED_PENDING_D0_DIAGNOSTIC'
          assert mm['preregistration_fingerprint']=='a469999d0bcee95bcc140ebf72727e36efc449ca048d693063ecc9bfb8e87c8d'
          assert mm['acceptance_fingerprint']=='6cf8b17249cff6889de8c6bff5952f5293987ed16cfc203e1cf8f55924b48dd5'
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
      - name: Audit D1 prereg acceptance
        if: steps.d0_successor.outputs.present != 'true'
        run: python scripts/audit_stage4_alpha_v2_executability_d1_preregistration_acceptance.py
      - name: Prove governance-only
        shell: bash
        run: |
          set -euo pipefail
          ! grep -n -E 'download-artifact|curl|wget|gh[[:space:]]+api|read_parquet\(|\.fit\(|\.predict\('             .github/workflows/stage4-alpha-v2-executability-d1-prereg-acceptance.yml             scripts/audit_stage4_alpha_v2_executability_d1_preregistration_acceptance.py | grep -v 'grep -n -E'
      - name: Prove exact acceptance scope
        if: steps.d0_successor.outputs.present != 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only "$BASE_SHA" HEAD | sort > /tmp/changed.txt
          cat > /tmp/expected.txt <<'EOF'
          .github/workflows/stage4-alpha-v1-oos-label-completion-result-v1-2.yml
          .github/workflows/stage4-alpha-v2-executability-d1-prereg-acceptance.yml
          governance/accepted_project_state.json
          governance/project_module_index.json
          governance/stage4_alpha_v2_executability_d1_preregistration_acceptance.json
          scripts/audit_stage4_alpha_v2_executability_d1_preregistration_acceptance.py
          EOF
          sort -o /tmp/expected.txt /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/changed.txt
