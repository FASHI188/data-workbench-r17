name: Stage4 Alpha V2 D0 Dispatch Bridge (integration-only)

on:
  pull_request:
    branches:
      - agent/stage3-clean-integration
    paths:
      - '.github/workflows/stage2-baostock-all-stock-probe.yml'
      - 'governance/stage4_alpha_v2_d0_dispatch_bridge_contract.json'
      - 'scripts/audit_stage4_alpha_v2_d0_dispatch_bridge.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: stage4-alpha-v2-d0-dispatch-bridge-v1
  cancel-in-progress: false

jobs:
  static-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
      - name: Audit branch-local dispatch bridge
        run: python scripts/audit_stage4_alpha_v2_d0_dispatch_bridge.py
      - name: Prove bridge PR is non-consuming
        shell: bash
        run: |
          set -euo pipefail
          test ! -e build/d0-real
          python - <<'PY'
          from pathlib import Path
          w=Path('.github/workflows/stage2-baostock-all-stock-probe.yml').read_text()
          assert "static-review:\n    if: github.event_name == 'pull_request'" in w
          assert "d0-bridge:\n    if: github.event_name == 'workflow_dispatch'" in w
          PY
      - name: Prove exact bridge review scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only "$BASE_SHA" HEAD | sort > /tmp/changed
          printf '%s\n' \
            .github/workflows/stage2-baostock-all-stock-probe.yml \
            governance/stage4_alpha_v2_d0_dispatch_bridge_contract.json \
            scripts/audit_stage4_alpha_v2_d0_dispatch_bridge.py | sort > /tmp/expected
          diff -u /tmp/expected /tmp/changed

  d0-bridge:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BRIDGE_REF: 'agent/stage4-alpha-v2-d0-dispatch-bridge-v1'
      WORKFLOW_PATH: '.github/workflows/stage2-baostock-all-stock-probe.yml'
      LABEL_AID: '9216418323'
      LABEL_ZIP_SHA: 'c4c8c475d79e964265dceec66da1673f9327469edc33531d6a21df8b61627e88'
      LABEL_FILE_SHA: '092061da5666215dcc1f4fa75ec0b1cdbcc43969560755e7cdae6de55e64d673'
      RUNNER_BLOB: '5141cb5282519d42397e1ca28396044fd5757193'
    steps:
      - name: Checkout exact bridge branch
        uses: actions/checkout@v4
        with:
          ref: agent/stage4-alpha-v2-d0-dispatch-bridge-v1
          persist-credentials: false
          fetch-depth: 0
      - name: Preflight bridge identity and final superseding authorization
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$BRIDGE_REF"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD:scripts/run_stage4_alpha_v2_executability_d0.py)" = "$RUNNER_BLOB"
          python - <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path
          def canon(x): return hashlib.sha256(json.dumps(x,sort_keys=True,separators=(',',':'),ensure_ascii=False).encode()).hexdigest()
          c=json.loads(Path('governance/stage4_alpha_v2_d0_dispatch_bridge_contract.json').read_text())
          assert c['fingerprint']==canon(c['fingerprint_basis'])
          blob=subprocess.check_output(['git','rev-parse','HEAD:.github/workflows/stage2-baostock-all-stock-probe.yml'],text=True).strip()
          assert blob==c['fingerprint_basis']['bridge_workflow_blob_sha']
          assert c['fingerprint_basis']['bridge_ref']=='agent/stage4-alpha-v2-d0-dispatch-bridge-v1'
          PY
          git fetch --no-tags origin agent/stage3-clean-integration
          git show origin/agent/stage3-clean-integration:governance/stage4_alpha_v2_executability_d0_execution_authorization_v1_1.json > /tmp/auth.json
          python - <<'PY'
          import json,os
          from pathlib import Path
          c=json.loads(Path('governance/stage4_alpha_v2_d0_dispatch_bridge_contract.json').read_text())
          a=json.load(open('/tmp/auth.json'))
          b=a['fingerprint_basis']
          assert a['status']=='AUTHORIZED_SINGLE_USE_D0_DIAGNOSTIC_V1_1_DISPATCH_BRIDGE'
          assert b['supersedes_authorization_fingerprint']=='119b5fe4016c001e0fdaf4fa68b40cbf4ece92c2e37de5c4ee3d5d57ddfee27b'
          assert b['bridge_contract_fingerprint']==c['fingerprint']
          assert b['bridge_ref']==os.environ['BRIDGE_REF']
          assert b['bridge_workflow_path']==os.environ['WORKFLOW_PATH']
          assert b['authorized_bridge_head']==os.environ['GITHUB_SHA']
          assert b['single_use']['armed_runs_remaining']==1
          assert b['permissions']['return_value_read_allowed'] is False
          assert b['permissions']['model_fit_allowed'] is False
          assert b['permissions']['prediction_allowed'] is False
          assert b['permissions']['oos_access_allowed'] is False
          assert b['permissions']['final_lockbox_access_allowed'] is False
          PY
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?event=workflow_dispatch&per_page=100"
          curl --fail --silent --show-error -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' "$api" > /tmp/runs.json
          python - <<'PY'
          import json,os
          x=json.load(open('/tmp/runs.json'))
          cur=int(os.environ['GITHUB_RUN_ID'])
          matched=[r for r in x['workflow_runs'] if r.get('head_branch')==os.environ['BRIDGE_REF'] and r.get('head_sha')==os.environ['GITHUB_SHA'] and r.get('event')=='workflow_dispatch']
          ids=[int(r['id']) for r in matched]
          assert ids.count(cur)==1, (cur,ids)
          assert len(ids)==1, ids
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
      - run: python -m pip install --disable-pip-version-check duckdb==1.3.2
      - name: Download and verify development labels; consume V1.1 authorization
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/d0-real/input build/d0-real/out
          curl --fail --location --silent --show-error \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${LABEL_AID}/zip" \
            -o build/d0-real/labels.zip
          echo "$LABEL_ZIP_SHA  build/d0-real/labels.zip" | sha256sum -c -
          unzip -q build/d0-real/labels.zip development_labels.parquet -d build/d0-real/input
          echo "$LABEL_FILE_SHA  build/d0-real/input/development_labels.parquet" | sha256sum -c -
          python - <<'PY'
          import json,datetime,os
          x={
            'status':'CONSUMED',
            'authorization_version':'V1.1_DISPATCH_BRIDGE',
            'consumption_event':'FIRST_SUCCESSFUL_DOWNLOAD_AND_DIGEST_VERIFICATION_OF_DEVELOPMENT_LABELS_ARTIFACT_FOR_D0',
            'run_id':int(os.environ['GITHUB_RUN_ID']),
            'bridge_ref':os.environ['BRIDGE_REF'],
            'bridge_head':os.environ['GITHUB_SHA'],
            'consumed_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),
            'artifact_id':int(os.environ['LABEL_AID']),
            'artifact_digest':'sha256:'+os.environ['LABEL_ZIP_SHA'],
            'labels_sha256':os.environ['LABEL_FILE_SHA'],
            'reusable':False
          }
          open('build/d0-real/out/d0_authorization_consumption.json','w').write(json.dumps(x,indent=2)+'\n')
          PY
      - name: Execute D0 structural diagnostic only
        run: |
          python scripts/run_stage4_alpha_v2_executability_d0.py \
            --labels build/d0-real/input/development_labels.parquet \
            --prereg governance/stage4_alpha_v2_executability_d0_preregistration.json \
            --out build/d0-real/out
      - name: Fail closed on forbidden output vocabulary
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R -E 'stock_total_return_5d|benchmark_return_5d|excess_return_5d|stock_total_return_20d|benchmark_return_20d|excess_return_20d' build/d0-real/out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage4-alpha-v2-executability-d0-result-v1-1-bridge
          path: build/d0-real/out
          compression-level: 0
          retention-days: 90
