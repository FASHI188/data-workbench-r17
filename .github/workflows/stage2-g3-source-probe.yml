name: Stage2 G3 OHLCV Source Probe

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/probe_ohlcv_sources.py'
      - 'scripts/probe_szse_ohlcv_depth.py'
      - 'config/g3_probe_trigger.json'
      - '.github/workflows/stage2-g3-source-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests openpyxl
      - name: Probe exchange-owned historical OHLCV sources
        shell: bash
        run: |
          mkdir -p data/ohlcv_probe
          python scripts/probe_ohlcv_sources.py > data/ohlcv_probe/stdout.log 2> data/ohlcv_probe/stderr.log
      - name: Deep-probe SZSE history/snapshot continuity
        shell: bash
        run: python scripts/probe_szse_ohlcv_depth.py > data/ohlcv_probe/szse_depth_stdout.log 2> data/ohlcv_probe/szse_depth_stderr.log
      - uses: actions/upload-artifact@v4
        with:
          name: stage2-g3-ohlcv-source-probe
          path: data/ohlcv_probe
          retention-days: 7
