name: Stage3 S3G1J V17.28 Full Acceptance Prep

on:
  pull_request:
    paths:
      - 'scripts/compare_stage3_s3g1j_v17_28_full_final.py'
      - 'tests/test_stage3_v17_28_full_final_comparator.py'
      - 'governance/stage3_s3g1j_runtime_manifest.json'
      - 'governance/stage3_workflow_activation_manifest.json'
      - '.github/workflows/stage3-s3g1j-v17-28-full-acceptance-prep.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: scripts

jobs:
  comparator-prep:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
      - name: Lock runtime and pending full-basis authority
        run: |
          python - <<'PY'
          import json
          runtime=json.load(open('governance/stage3_s3g1j_runtime_manifest.json',encoding='utf-8'))
          activation=json.load(open('governance/stage3_workflow_activation_manifest.json',encoding='utf-8'))
          assert runtime['current_production_authority']['generation']=='V17.28'
          assert runtime['formal_runtime']['runtime_generation']=='V17.28'
          assert runtime['formal_runtime']['shard_gate']=='S3G1J_FINANCIAL_PDF_EXTRACTION_SHARD_V17_28'
          assert runtime['full_basis_last_completed_final']['generation']=='V17.27'
          assert runtime['full_basis_last_completed_final']['run']==30806818977
          assert runtime['next_full_basis_required']['generation']=='V17.28'
          assert runtime['next_full_basis_required']['status']=='REQUIRED_NOT_STARTED'
          assert activation['accepted_production_runtime']['generation']=='V17.28'
          assert activation['accepted_production_runtime']['full_basis_execution_pending'] is True
          assert runtime['project_status']['stage3']=='NOT_READY'
          assert runtime['project_status']['stage4']=='LOCKED'
          assert runtime['project_status']['alpha_training']=='NOT_ALLOWED'
          assert runtime['project_status']['live_signals']=='NOT_ALLOWED'
          print('V17_28_FULL_ACCEPTANCE_PREP_AUTHORITY_PASS')
          PY
      - name: Compile comparator
        run: python -m py_compile scripts/compare_stage3_s3g1j_v17_28_full_final.py
      - name: Run comparator strictness tests
        run: python -m unittest tests.test_stage3_v17_28_full_final_comparator -v
      - name: Preserve execution and acceptance separation
        run: |
          python - <<'PY'
          from pathlib import Path
          text=Path('scripts/compare_stage3_s3g1j_v17_28_full_final.py').read_text(encoding='utf-8')
          assert 'final_data_verdict' in text and 'FAIL_CLOSED' in text
          assert '1207621057' in text and '1209825769' in text
          assert '1051793' in text and '1051799' in text
          assert '1373' in text and '1371' in text
          assert '1290' in text and '1288' in text
          assert 'stage4_alpha_locked' in text
          print('V17_28_FULL_ACCEPTANCE_PREP_BOUNDARY_PASS')
          PY
