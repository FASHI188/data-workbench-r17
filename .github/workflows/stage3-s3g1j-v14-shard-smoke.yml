name: Stage3 S3G1J V14 Representative Shard Smoke

on:
  pull_request:
    branches: [stage3-s3g1j-coordinate-table-v14]
    paths:
      - '.github/workflows/stage3-s3g1j-v14-shard-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  V14_ACCEPTANCE_RUN: '30423298099'
  V13_SMOKE_RUN: '30382695045'
  PYTHONPATH: scripts

jobs:
  lock:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Require V14 production acceptance PASS
        run: test "$(gh run view "$V14_ACCEPTANCE_RUN" -R "$GITHUB_REPOSITORY" --json conclusion --jq .conclusion)" = success

  smoke:
    needs: lock
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 7, 9]
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests pymupdf
      - name: Restore exact V12.1 version ledger used by V13 representative smoke
        run: |
          rm -rf versions
          gh run download "$V13_SMOKE_RUN" -R "$GITHUB_REPOSITORY" \
            -n stage3-s3g1j-v13-smoke-versions -D versions
          test -f versions/stage3_financial_report_versions_v3.csv.gz
      - name: Re-run representative shard with V14.1 extractor
        shell: bash
        run: |
          set +e
          out="build/stage3-financial-values-v14-smoke/shard${{ matrix.shard }}"
          mkdir -p "$out"
          python scripts/extract_stage3_financial_pdf_values_v9.py \
            --versions versions/stage3_financial_report_versions_v3.csv.gz \
            --shard ${{ matrix.shard }} --shards 64 --out "$out" \
            > "$out/stdout.log" 2> "$out/stderr.log"
          code=$?
          echo "SMOKE_EXIT=$code" >> "$GITHUB_ENV"
          cat "$out"/financial_extract_shard*.manifest.json || true
          tail -100 "$out/stderr.log" || true
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage3-s3g1j-v14-smoke-${{ matrix.shard }}
          path: build/stage3-financial-values-v14-smoke/shard${{ matrix.shard }}
          retention-days: 90
          compression-level: 0
      - name: Preserve fail-closed smoke status
        if: env.SMOKE_EXIT != '0'
        run: exit 1

  summarize:
    needs: smoke
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: stage3-s3g1j-v14-smoke-*
          path: smoke-artifacts
          merge-multiple: false
      - name: Compare V14 errors with frozen V13 shard baselines
        run: |
          python - <<'PY'
          import json, glob, os
          baseline={0:51,1:37,7:40,9:28}
          rows=[]
          for p in glob.glob('smoke-artifacts/**/financial_extract_shard*.manifest.json', recursive=True):
              d=json.load(open(p,encoding='utf-8'))
              s=int(d['shard'])
              e=int(d['error_count'])
              rows.append({
                  'shard':s,
                  'v13_error_count':baseline[s],
                  'v14_error_count':e,
                  'delta':e-baseline[s],
                  'reduction':baseline[s]-e,
                  'tie_resolution_counts':d.get('tie_resolution_counts') or {},
              })
          rows.sort(key=lambda x:x['shard'])
          if [r['shard'] for r in rows] != [0,1,7,9]:
              raise SystemExit(f'missing manifests: {rows}')
          report={
              'gate':'S3G1J_V14_REPRESENTATIVE_SHARD_SMOKE',
              'shards':[0,1,7,9],
              'v13_total_errors':sum(r['v13_error_count'] for r in rows),
              'v14_total_errors':sum(r['v14_error_count'] for r in rows),
              'total_reduction':sum(r['reduction'] for r in rows),
              'all_shards_non_regressing':all(r['v14_error_count'] <= r['v13_error_count'] for r in rows),
              'at_least_one_incremental_recovery':sum(r['reduction'] for r in rows) > 0,
              'rows':rows,
          }
          os.makedirs('summary',exist_ok=True)
          json.dump(report,open('summary/v14_shard_smoke_summary.json','w',encoding='utf-8'),ensure_ascii=False,indent=2)
          print(json.dumps(report,ensure_ascii=False,indent=2))
          assert report['all_shards_non_regressing'], report
          assert report['at_least_one_incremental_recovery'], report
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage3-s3g1j-v14-shard-smoke-summary
          path: summary/v14_shard_smoke_summary.json
          retention-days: 90
          compression-level: 0
