name: Stage3 Clean S3G1G V12.1 Deterministic Refreeze

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/stage3_deterministic_gzip.py'
      - 'scripts/select_stage3_financial_report_versions_v3.py'
      - 'scripts/select_stage3_financial_report_versions_v3_1.py'
      - 'scripts/select_stage3_financial_report_versions_v3_1_deterministic.py'
      - '.github/workflows/stage3-clean-s3g1g-deterministic-refreeze.yml'

permissions:
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ github.token }}
  REFERENCE_RUN: '30382694721'
  REFERENCE_HEAD: 'aa70f769d937978718f47be747ad763fe09f2818'
  REFERENCE_ARTIFACT: 'stage3-s3g1j-identity-arbitration-v13'
  REFERENCE_ARTIFACT_DIGEST: 'sha256:d5a1d819bf8e8a6b748480208a7ec4657de73380fdef7a6fd69a33d859159844'
  REFERENCE_PLAIN_SHA: '14629abffc77e4c8a37fada0fa14ddae598fe8d0ef02d075ed19abc1e3651066'
  FILING_LEDGER_RUN: '30265340486'
  FILING_LEDGER_HEAD: '97325fd9e91dde8ea3e2bee47c5c44dff4a8153c'
  FILING_LEDGER_ARTIFACT: 'stage3-s3g1e-periodic-filing-ledger-final'
  FILING_LEDGER_ARTIFACT_DIGEST: 'sha256:350105d16011b8863f27fc4bc319635e580ffafde847ba86e751159dd652e0a0'
  FILING_LEDGER_PLAIN_SHA: '373450168129c39225804d21816cc725e532988d505f80f208b76c576082a350'
  PYTHONPATH: scripts

jobs:
  refreeze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
      - name: Lock accepted V12.1 output and exact S3G1E input artifacts
        shell: bash
        run: |
          set -euo pipefail
          lock_artifact() {
            run="$1"; head_expected="$2"; artifact="$3"; digest_expected="$4"
            conclusion=$(gh run view "$run" -R "$GITHUB_REPOSITORY" --json conclusion --jq '.conclusion')
            head=$(gh run view "$run" -R "$GITHUB_REPOSITORY" --json headSha --jq '.headSha')
            test "$conclusion" = success
            test "$head" = "$head_expected"
            actual=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/artifacts" --jq ".artifacts[] | select(.name==\"$artifact\") | .digest")
            test "$actual" = "$digest_expected"
          }
          lock_artifact "$REFERENCE_RUN" "$REFERENCE_HEAD" "$REFERENCE_ARTIFACT" "$REFERENCE_ARTIFACT_DIGEST"
          lock_artifact "$FILING_LEDGER_RUN" "$FILING_LEDGER_HEAD" "$FILING_LEDGER_ARTIFACT" "$FILING_LEDGER_ARTIFACT_DIGEST"
      - name: Restore exact accepted input and V12.1 output
        shell: bash
        run: |
          set -euo pipefail
          rm -rf reference filing-ledger out-a out-b
          gh run download "$REFERENCE_RUN" -R "$GITHUB_REPOSITORY" -n "$REFERENCE_ARTIFACT" -D reference
          gh run download "$FILING_LEDGER_RUN" -R "$GITHUB_REPOSITORY" -n "$FILING_LEDGER_ARTIFACT" -D filing-ledger
          test -f filing-ledger/stage3_periodic_filing_ledger.csv.gz
      - name: Locate and validate accepted full-selection basis
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' > /tmp/s3g1g.env
          import gzip,glob,hashlib,json,os
          ledger='filing-ledger/stage3_periodic_filing_ledger.csv.gz'
          refs=glob.glob('reference/**/v3/stage3_financial_report_versions_v3.csv.gz',recursive=True)
          audits=glob.glob('reference/**/v3/stage3_financial_report_versions_v3_audit.json',recursive=True)
          diffs=glob.glob('reference/**/source_selection_diff.json',recursive=True)
          assert len(refs)==1, refs
          assert len(audits)==1, audits
          assert len(diffs)==1, diffs
          with gzip.open(ledger,'rb') as f: ledger_plain=f.read()
          assert hashlib.sha256(ledger_plain).hexdigest()==os.environ['FILING_LEDGER_PLAIN_SHA']
          with gzip.open(refs[0],'rb') as f: plain=f.read()
          plain_sha=hashlib.sha256(plain).hexdigest()
          assert plain_sha==os.environ['REFERENCE_PLAIN_SHA'], plain_sha
          a=json.load(open(audits[0],encoding='utf-8'))
          assert a.get('pass') is True and a.get('errors')==[], a
          expected={
            'ledger_rows':230540,
            'canonical_revision_moments':121354,
            'canonical_period_groups':118229,
            'explicit_full_rows':19629,
            'explicit_full_synonym_rescues':122,
            'partial_body_only_publication_moments':424,
            'ignored_summary_documents':67472,
            'ignored_cancelled_documents':3123,
            'ignored_foreign_h_share_or_foreign_issuer_documents':788,
            'ignored_notice_documents':51,
            'same_day_tied_top_moments':629,
            'old_full_period_groups_not_in_v3':181,
            'v3_period_groups_not_in_old_full_flag':100,
          }
          for key,value in expected.items():
              assert a.get(key)==value,(key,a.get(key),value)
          d=json.load(open(diffs[0],encoding='utf-8'))
          assert d.get('pass') is True and d.get('errors')==[], d
          assert d.get('baseline_revision_moments')==121491,d
          assert d.get('v3_revision_moments')==121354,d
          assert d.get('common_moments')==121251,d
          assert d.get('changed_canonical_same_moment')==3617,d
          assert d.get('added_full_authority_moments')==103,d
          assert d.get('removed_partial_only_moments')==240,d
          assert d.get('forbidden_selected_count')==0,d
          print('export INPUT='+ledger)
          print('export REFERENCE='+refs[0])
          PY
          cat /tmp/s3g1g.env
      - name: Deterministically select V12.1 versions twice
        shell: bash
        run: |
          set -euo pipefail
          source /tmp/s3g1g.env
          python scripts/select_stage3_financial_report_versions_v3_1_deterministic.py --ledger "$INPUT" --out out-a
          python scripts/select_stage3_financial_report_versions_v3_1_deterministic.py --ledger "$INPUT" --out out-b
      - name: Require byte identity and unchanged V12.1 semantic output
        shell: bash
        run: |
          set -euo pipefail
          source /tmp/s3g1g.env
          python - <<'PY'
          import gzip,hashlib,json,os
          from pathlib import Path
          a=Path('out-a/stage3_financial_report_versions_v3.csv.gz')
          b=Path('out-b/stage3_financial_report_versions_v3.csv.gz')
          ref=Path(os.environ['REFERENCE'])
          assert a.read_bytes()==b.read_bytes(), 'deterministic V12.1 gzip bytes differ'
          new_sha=hashlib.sha256(a.read_bytes()).hexdigest()
          with gzip.open(a,'rb') as f:new_plain=f.read()
          with gzip.open(ref,'rb') as f:ref_plain=f.read()
          assert new_plain==ref_plain, 'V12.1 selected-version content changed'
          assert hashlib.sha256(new_plain).hexdigest()==os.environ['REFERENCE_PLAIN_SHA']
          for p in ('out-a/stage3_financial_report_versions_v3_audit.json','out-b/stage3_financial_report_versions_v3_audit.json'):
              x=json.load(open(p,encoding='utf-8'))
              assert x.get('pass') is True and x.get('errors')==[], x
              assert x.get('ledger_rows')==230540,x
              assert x.get('canonical_revision_moments')==121354,x
              assert x.get('canonical_period_groups')==118229,x
              assert x.get('explicit_full_rows')==19629,x
              assert x.get('explicit_full_synonym_rescues')==122,x
              assert x.get('same_day_tied_top_moments')==629,x
              assert x.get('old_full_period_groups_not_in_v3')==181,x
              assert x.get('v3_period_groups_not_in_old_full_flag')==100,x
          report={
            'gate':'S3G1G_V12_1_DETERMINISTIC_REFREEZE',
            'pass':True,
            'reference_run':30382694721,
            'filing_ledger_run':30265340486,
            'canonical_revision_moments':121354,
            'canonical_period_groups':118229,
            'explicit_full_rows':19629,
            'explicit_full_synonym_rescues':122,
            'same_day_tied_top_moments':629,
            'decompressed_content_identical_to_accepted_v12_1':True,
            'plain_ledger_sha256':os.environ['REFERENCE_PLAIN_SHA'],
            'deterministic_gzip_sha256':new_sha,
            'deterministic_replay_count':2,
            'errors':[],
          }
          Path('out-a/s3g1g_v12_1_deterministic_refreeze.json').write_text(json.dumps(report,indent=2),encoding='utf-8')
          print(json.dumps(report,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage3-s3g1g-v12-1-deterministic-refreeze
          path: |
            out-a
            out-b
          retention-days: 90
          compression-level: 0
