name: Stage3 S3G1J PDF Issuer Gate V9

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  REPORT_VERSIONS_RUN: '30270405448'
  V8_REGRESSION_RUN: '30351881473'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONPATH: scripts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests pymupdf

      - name: Require locked V8 regression PASS
        run: test "$(gh run view "$V8_REGRESSION_RUN" -R "$GITHUB_REPOSITORY" --json conclusion --jq .conclusion)" = success

      - name: V9 issuer-gate unit regressions
        run: python -m unittest tests.test_stage3_financial_pdf_issuer_gate_v9 -v

      - name: Restore canonical version ledger
        run: |
          rm -rf versions
          gh run download "$REPORT_VERSIONS_RUN" -R "$GITHUB_REPOSITORY" -n stage3-s3g1g-financial-report-versions -D versions
          test -f versions/stage3_financial_report_versions.csv.gz

      - name: Run issuer-sensitive shard 7 with V9
        shell: bash
        run: |
          set +e
          out="build/stage3-financial-values-v9/shard7"
          mkdir -p "$out"
          python scripts/extract_stage3_financial_pdf_values_v6.py \
            --versions versions/stage3_financial_report_versions.csv.gz \
            --shard 7 --shards 64 --out "$out" \
            > "$out/stdout.log" 2> "$out/stderr.log"
          code=$?
          echo "SHARD7_EXIT=$code" >> "$GITHUB_ENV"
          cat "$out"/financial_extract_shard*.manifest.json || true
          tail -120 "$out/stderr.log" || true
          exit 0

      - uses: actions/upload-artifact@v4
        with:
          name: stage3-s3g1j-pdf-issuer-gate-v9
          path: build/stage3-financial-values-v9/shard7
          retention-days: 90
          compression-level: 0

      - name: Preserve fail-closed V9 shard status
        if: env.SHARD7_EXIT != '0'
        run: exit 1
