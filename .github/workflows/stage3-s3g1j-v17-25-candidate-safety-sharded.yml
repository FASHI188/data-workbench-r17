name: Stage3 S3G1J V17.25 Candidate Safety Sharded

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/stage3_financial_statement_blocks_v17_25.py'
      - 'scripts/stage3_financial_pdf_parser_v16.py'
      - 'scripts/accept_stage3_s3g1j_v17_25_candidate_safety.py'
      - 'scripts/run_stage3_s3g1j_v17_25_candidate_safety_shard.py'
      - 'scripts/finalize_stage3_s3g1j_v17_25_candidate_safety_shards.py'
      - 'tests/test_stage3_v17_25_generic_group_witness.py'
      - '.github/workflows/stage3-s3g1j-v17-25-candidate-safety-sharded.yml'

permissions:
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ github.token }}
  P0_RUN: '30687837626'
  P0_HEAD: 'ef083b267625a4942c6f4e736d2c8178aa4a594d'
  P0_ARTIFACT: 'stage3-s3g1j-p0-current-v17-24-diagnostic-v1'
  P0_DIGEST: 'sha256:b4e310fbb2b41d33d2c2c545589a6af53487dbfd1492dbb971d860fdcb4a14f0'
  P0_REPORT_SHA256: 'a3121a6a16261ed622a6b88fcc2db77fe791c317c133dddd2e45be8a523b943d'
  V17_24_RUN: '30685830808'
  V17_24_HEAD: '92de74e7898be36239dc163e3811c9ae3f732e60'
  V17_24_ARTIFACT: 'stage3-s3g1j-v17-24-production-acceptance-compat'
  V17_24_DIGEST: 'sha256:4865dd03537c70208d2a4358cf8b54ab65408510fce838017a4bf77bee30a98d'
  PYTHONPATH: scripts

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
      - name: Install exact verified candidate dependencies
        run: python -m pip install --disable-pip-version-check --constraint requirements/constraints-verified.txt requests PyMuPDF
      - name: Lock accepted evidence runs and artifacts
        shell: bash
        run: |
          set -euo pipefail
          gh_api_retry() {
            endpoint="$1"
            for attempt in 1 2 3 4 5 6; do
              if output=$(gh api "$endpoint" 2>gh-api-error.log); then
                printf '%s' "$output"
                return 0
              fi
              cat gh-api-error.log >&2 || true
              sleep $((attempt * 15))
            done
            return 1
          }
          lock_run_artifact() {
            run="$1"; expected_head="$2"; artifact="$3"; expected_digest="$4"
            run_json=$(gh_api_retry "repos/$GITHUB_REPOSITORY/actions/runs/$run")
            test "$(jq -r '.conclusion' <<<"$run_json")" = success
            test "$(jq -r '.head_sha' <<<"$run_json")" = "$expected_head"
            artifact_json=$(gh_api_retry "repos/$GITHUB_REPOSITORY/actions/runs/$run/artifacts")
            actual=$(jq -r --arg artifact "$artifact" '.artifacts[] | select(.name==$artifact) | .digest' <<<"$artifact_json")
            test -n "$actual"
            test "$actual" = "$expected_digest"
          }
          lock_run_artifact "$P0_RUN" "$P0_HEAD" "$P0_ARTIFACT" "$P0_DIGEST"
          lock_run_artifact "$V17_24_RUN" "$V17_24_HEAD" "$V17_24_ARTIFACT" "$V17_24_DIGEST"
      - name: Download locked input artifacts once
        shell: bash
        run: |
          set -euo pipefail
          download_retry() {
            run="$1"; artifact="$2"; destination="$3"
            for attempt in 1 2 3 4 5 6; do
              rm -rf "$destination"
              if gh run download "$run" -R "$GITHUB_REPOSITORY" -n "$artifact" -D "$destination"; then
                return 0
              fi
              sleep $((attempt * 15))
            done
            return 1
          }
          mkdir -p inputs
          download_retry "$P0_RUN" "$P0_ARTIFACT" inputs/p0
          download_retry "$V17_24_RUN" "$V17_24_ARTIFACT" inputs/v17-24
          test -f inputs/p0/report.json
          test -f inputs/v17-24/candidate/shard0.json
          test -f inputs/v17-24/candidate/shard1.json
          test -f inputs/v17-24/candidate/shard7.json
          test -f inputs/v17-24/candidate/shard9.json
          test "$(sha256sum inputs/p0/report.json | cut -d' ' -f1)" = "$P0_REPORT_SHA256"
      - name: Run candidate contracts and compile shard tools
        run: |
          python -m unittest tests.test_stage3_v17_25_generic_group_witness -v
          python -m py_compile \
            scripts/run_stage3_s3g1j_v17_25_candidate_safety_shard.py \
            scripts/finalize_stage3_s3g1j_v17_25_candidate_safety_shards.py
          python - <<'PY'
          import stage3_financial_pdf_parser_v15 as accepted
          import stage3_financial_pdf_parser_v16 as candidate
          import stage3_financial_statement_blocks_v17_25 as witness
          assert accepted.METHOD=='V17_24_EXACT_CORRUPTED_GROUP_EQUITY_ALIAS_FINAL_FALLBACK'
          assert candidate.METHOD=='V17_25_GENERIC_BALANCE_SHEET_EXPLICIT_GROUP_WITNESS_CANDIDATE'
          assert witness.GROUP_WITNESS_ALIAS=='归属于母公司所有者权益合计'
          assert witness.TOTAL_EQUITY_ALIAS=='所有者权益合计'
          print('S3G1J_V17_25_SHARDED_PREPARE_PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v17-25-candidate-safety-inputs
          path: inputs
          retention-days: 1
          compression-level: 0

  p0-shards:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
      - run: python -m pip install --disable-pip-version-check --constraint requirements/constraints-verified.txt requests PyMuPDF
      - uses: actions/download-artifact@v4
        with:
          name: v17-25-candidate-safety-inputs
          path: inputs
      - name: Replay P0 shard ${{ matrix.shard }}/2
        run: |
          python scripts/run_stage3_s3g1j_v17_25_candidate_safety_shard.py \
            --p0-report inputs/p0/report.json \
            --v17-24-root inputs/v17-24 \
            --scope p0 \
            --shard-index ${{ matrix.shard }} \
            --shard-count 2 \
            --out build/p0-${{ matrix.shard }}/report.json
      - uses: actions/upload-artifact@v4
        with:
          name: p0-${{ matrix.shard }}
          path: build/p0-${{ matrix.shard }}
          retention-days: 90
          compression-level: 0

  exact82-shards:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
      - run: python -m pip install --disable-pip-version-check --constraint requirements/constraints-verified.txt requests PyMuPDF
      - uses: actions/download-artifact@v4
        with:
          name: v17-25-candidate-safety-inputs
          path: inputs
      - name: Replay exact82 shard ${{ matrix.shard }}/8
        run: |
          python scripts/run_stage3_s3g1j_v17_25_candidate_safety_shard.py \
            --p0-report inputs/p0/report.json \
            --v17-24-root inputs/v17-24 \
            --scope exact82 \
            --shard-index ${{ matrix.shard }} \
            --shard-count 8 \
            --out build/exact82-${{ matrix.shard }}/report.json
      - uses: actions/upload-artifact@v4
        with:
          name: exact82-${{ matrix.shard }}
          path: build/exact82-${{ matrix.shard }}
          retention-days: 90
          compression-level: 0

  finalize:
    needs: [p0-shards, exact82-shards]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
      - uses: actions/download-artifact@v4
        with:
          pattern: p0-*
          path: partials
      - uses: actions/download-artifact@v4
        with:
          pattern: exact82-*
          path: partials
      - name: Finalize deterministic candidate safety evidence
        run: |
          python scripts/finalize_stage3_s3g1j_v17_25_candidate_safety_shards.py \
            --root partials \
            --out build/s3g1j-v17-25-candidate-safety-sharded/report.json
      - name: Enforce final safety boundaries
        run: |
          python - <<'PY'
          import json
          x=json.load(open('build/s3g1j-v17-25-candidate-safety-sharded/report.json',encoding='utf-8'))
          assert x['pass'] is True and x['errors']==[]
          assert x['processed_p0_count']==22
          assert x['processed_exact82_count']==82
          assert x['source_sha_match_count']==104
          assert x['promoted_group_witness_announcement_ids']==x['expected_group_witness_announcement_ids']
          assert set(x['candidate_recovered_announcement_ids']).issubset(set(x['expected_group_witness_announcement_ids']))
          assert x['required_negative_announcement_ids']==['1202799494','1209806910','1219834247']
          assert x['missing_equity_population_count']==11
          assert x['exact82_recovery_announcement_ids']==['1212731093','1219311356','1221568845','1225153907']
          assert x['production_runtime_changed'] is False
          assert x['accounting_tolerance']=='0.005'
          assert x['source_policy_changed'] is False
          assert x['e_equals_a_minus_l_inference'] is False
          assert x['stage3_status']=='NOT_READY'
          print(json.dumps({
              'promoted_group_witness_announcement_ids':x['promoted_group_witness_announcement_ids'],
              'candidate_recovered_count':x['candidate_recovered_count'],
              'candidate_recovered_announcement_ids':x['candidate_recovered_announcement_ids'],
              'candidate_remaining_p0_fail_closed_count':x['candidate_remaining_p0_fail_closed_count'],
          },ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stage3-s3g1j-v17-25-generic-group-witness-candidate-safety-sharded
          path: build/s3g1j-v17-25-candidate-safety-sharded
          retention-days: 90
          compression-level: 0
