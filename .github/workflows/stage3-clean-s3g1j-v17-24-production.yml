name: Stage3 Clean S3G1J V17.24 Production Acceptance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/stage3_financial_spatial_alias_v17_24.py'
      - 'scripts/stage3_financial_pdf_parser_v14.py'
      - 'scripts/stage3_financial_pdf_parser_v15.py'
      - 'scripts/extract_stage3_financial_pdf_values_v14.py'
      - 'scripts/accept_stage3_s3g1j_v17_24_production.py'
      - 'tests/test_stage3_v17_24_corrupted_equity.py'
      - 'tests/test_stage3_v17_24_production_parser.py'
      - '.github/workflows/stage3-clean-s3g1j-v17-24-production.yml'

permissions:
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ github.token }}
  FROZEN_RUN: '30424465440'
  FROZEN_HEAD: 'be42608b75f77af13c36620da7e7fa03c563afde'
  FROZEN_ARTIFACT: 'stage3-s3g1j-v15-single-source-input'
  FROZEN_DIGEST: 'sha256:272f52239adc2fc5d4343ec091495dffcd39324b425784cdf5a7491f63a2e6fd'
  V17_21_RUN: '30645504197'
  V17_21_HEAD: 'ae967fda2c53796e9b886b54f1ab7b7ea69f6623'
  V17_21_ARTIFACT: 'stage3-s3g1j-v17-21-combined-production-exact-82-acceptance'
  V17_21_DIGEST: 'sha256:3779e0a7a6f6697ade3a58d6463a2200bf06b83855b4800a5750ebed5ca312f5'
  V17_24_CANDIDATE_RUN: '30650516337'
  V17_24_CANDIDATE_HEAD: 'f73c2ebd89cb4be816e626b181cec5198e01a12e'
  V17_24_CANDIDATE_ARTIFACT: 'stage3-s3g1j-v17-24-exact-79-candidate-safety'
  V17_24_CANDIDATE_DIGEST: 'sha256:1982c801013ac43398612d6b558abc41c9143c58f670c28523da580ec0b3368a'
  PYTHONPATH: scripts

jobs:
  lock-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
      - name: Install exact verified production dependencies
        run: python -m pip install --disable-pip-version-check --constraint requirements/constraints-verified.txt requests PyMuPDF
      - name: Lock frozen, V17.21 production and V17.24 candidate evidence
        shell: bash
        run: |
          set -euo pipefail
          gh_api_retry() {
            endpoint="$1"
            for attempt in 1 2 3 4 5 6; do
              if output=$(gh api "$endpoint" 2>gh-api-error.log); then
                printf '%s' "$output"
                return 0
              fi
              cat gh-api-error.log >&2 || true
              sleep $((attempt * 15))
            done
            return 1
          }
          lock_run_artifact() {
            run="$1"; expected_head="$2"; artifact="$3"; expected_digest="$4"
            run_json=$(gh_api_retry "repos/$GITHUB_REPOSITORY/actions/runs/$run")
            test "$(jq -r '.conclusion' <<<"$run_json")" = success
            test "$(jq -r '.head_sha' <<<"$run_json")" = "$expected_head"
            artifact_json=$(gh_api_retry "repos/$GITHUB_REPOSITORY/actions/runs/$run/artifacts")
            actual=$(jq -r --arg artifact "$artifact" '.artifacts[] | select(.name==$artifact) | .digest' <<<"$artifact_json")
            test -n "$actual"
            test "$actual" = "$expected_digest"
          }
          lock_run_artifact "$FROZEN_RUN" "$FROZEN_HEAD" "$FROZEN_ARTIFACT" "$FROZEN_DIGEST"
          lock_run_artifact "$V17_21_RUN" "$V17_21_HEAD" "$V17_21_ARTIFACT" "$V17_21_DIGEST"
          lock_run_artifact "$V17_24_CANDIDATE_RUN" "$V17_24_CANDIDATE_HEAD" "$V17_24_CANDIDATE_ARTIFACT" "$V17_24_CANDIDATE_DIGEST"
          python - <<'PY'
          import json
          x=json.load(open('governance/stage3_s3g1j_runtime_manifest.json',encoding='utf-8'))
          assert x['schema_version']==4
          assert x['v17_21_promotion']['remaining_fail_closed_count']==79
          assert x['production_final_status']=='NOT_FINAL'
          assert x['hard_invariants']['stage4_alpha_locked'] is True
          PY
      - name: Run candidate and production contracts
        run: |
          python -m unittest tests.test_stage3_v17_24_corrupted_equity -v
          python -m unittest tests.test_stage3_v17_24_production_parser -v
      - name: Import production parser and formal extractor
        run: |
          python - <<'PY'
          import extract_stage3_financial_pdf_values_v14 as extractor
          import stage3_financial_pdf_parser_v15 as parser
          assert parser.METHOD=='V17_24_EXACT_CORRUPTED_GROUP_EQUITY_ALIAS_FINAL_FALLBACK'
          assert extractor.METHOD=='CNINFO_ORIGINAL_PDF_PYMUPDF_V14_V17_24_EXACT_CORRUPTED_GROUP_EQUITY_ALIAS_FINAL_FALLBACK'
          assert extractor.METHODOLOGY_VERSION=='V3.3.4-V17.24'
          assert extractor.SHARD_GATE=='S3G1J_FINANCIAL_PDF_EXTRACTION_SHARD_V17_24'
          assert callable(parser.parse_pdf_bytes)
          assert callable(extractor._rewrite_v17_24_shard_manifest)
          print('S3G1J_V17_24_PRODUCTION_IMPORT_PASS')
          PY

  replay:
    needs: lock-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 7, 9]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
      - name: Install exact verified production dependencies
        run: python -m pip install --disable-pip-version-check --constraint requirements/constraints-verified.txt requests PyMuPDF
      - name: Restore exact frozen versions and V17.21 production basis
        shell: bash
        run: |
          set -euo pipefail
          download_artifact_retry() {
            run="$1"; artifact="$2"; destination="$3"
            for attempt in 1 2 3 4 5 6; do
              rm -rf "$destination"
              if gh run download "$run" -R "$GITHUB_REPOSITORY" -n "$artifact" -D "$destination" 2>gh-download-error.log; then
                return 0
              fi
              cat gh-download-error.log >&2 || true
              sleep $((attempt * 15))
            done
            return 1
          }
          rm -rf prepared promoted build/v17-24-production
          download_artifact_retry "$FROZEN_RUN" "$FROZEN_ARTIFACT" prepared
          download_artifact_retry "$V17_21_RUN" "$V17_21_ARTIFACT" promoted
          test -f prepared/single_source_residual_versions.csv.gz
          test -f promoted/candidate/shard0.json
          test -f promoted/candidate/shard1.json
          test -f promoted/candidate/shard7.json
          test -f promoted/candidate/shard9.json
      - name: Run V17.24 production parser once for exact79 and exact82
        shell: bash
        run: |
          set +e
          out="build/v17-24-production/shard${{ matrix.shard }}.json"
          mkdir -p "$(dirname "$out")"
          python scripts/accept_stage3_s3g1j_v17_24_production.py \
            --versions prepared/single_source_residual_versions.csv.gz \
            --v17-21-root promoted \
            --shard ${{ matrix.shard }} --shards 64 --out "$out" \
            > "${out%.json}.stdout.log" 2> "${out%.json}.stderr.log"
          code=$?
          echo "REPLAY_EXIT=$code" >> "$GITHUB_ENV"
          cat "${out%.json}.stdout.log" || true
          tail -100 "${out%.json}.stderr.log" || true
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage3-s3g1j-v17-24-production-${{ matrix.shard }}
          path: build/v17-24-production
          retention-days: 90
          compression-level: 0
      - name: Preserve production acceptance failure
        if: env.REPLAY_EXIT != '0'
        run: exit 1

  summarize:
    needs: replay
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: stage3-s3g1j-v17-24-production-*
          path: candidate
          merge-multiple: true
      - name: Require exact79 and combined exact82 production verdicts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import glob,json,os
          paths=sorted(glob.glob('candidate/shard*.json'))
          reports=[json.load(open(path,encoding='utf-8')) for path in paths]
          reports.sort(key=lambda row:row['shard'])
          assert [row['shard'] for row in reports]==[0,1,7,9]
          assert all(row.get('pass') is True for row in reports), [row.get('execution_failures') for row in reports]
          assert sum(row['input_count_exact82'] for row in reports)==82
          assert sum(row['input_count_exact79'] for row in reports)==79
          assert sum(row['processed_count'] for row in reports)==82
          assert sum(row['source_sha_match_count'] for row in reports)==82
          rows=[item for report in reports for item in report['results']]
          assert len(rows)==82
          assert len({row['announcement_id'] for row in rows})==82
          recovered82=sorted(row['announcement_id'] for row in rows if row['production_balance_sheet_recovered'])
          assert recovered82==['1212731093','1219311356','1221568845','1225153907'], recovered82
          residual79=[row for row in rows if row['was_v17_21_residual']]
          assert len(residual79)==79
          recovered79=sorted(row['announcement_id'] for row in residual79 if row['production_balance_sheet_recovered'])
          assert recovered79==['1221568845'], recovered79
          target=next(row for row in rows if row['announcement_id']=='1221568845')
          block=target['balance_sheet_block']
          assert block['arbitration']=='V17_24_GROUP_PERIOD_FROZEN_DATE_A_EQUALS_L_PLUS_E_EXACT_CORRUPTED_EQUITY_ALIAS'
          assert block['candidate_only'] is False
          assert block['production_runtime_generation']=='V17.24'
          assert block['corrupted_equity_alias']=='所有者权益（或d股东权益）合计'
          assert block['corrupted_equity_amount_column_count']==2
          assert block['column_role_gate_pass'] is True
          assert str(block['identity_residual_cny']) in {'0','0.0','0.00'}
          nonrecovered=[row for row in rows if not row['production_balance_sheet_recovered']]
          assert len(nonrecovered)==78
          assert all(row['validation_errors'] for row in nonrecovered)
          exact79={
              'gate':'S3G1J_V17_24_PRODUCTION_EXACT_79_ACCEPTANCE',
              'pass':True,
              'production_parser_changed':True,
              'input_count':79,
              'source_sha_match_count':79,
              'production_recovered_count':1,
              'production_recovered_announcement_ids':recovered79,
              'remaining_fail_closed_count':78,
              'accounting_tolerance':'0.005',
              'global_row_tolerance_changed':False,
              'fuzzy_alias_matching_enabled':False,
              'e_equals_a_minus_l_inference':False,
              'stage4_alpha_locked':True,
              'errors':[],
          }
          exact82={
              'gate':'S3G1J_V17_24_COMBINED_PRODUCTION_EXACT_82_ACCEPTANCE',
              'pass':True,
              'production_parser_changed':True,
              'input_count':82,
              'source_sha_match_count':82,
              'production_recovered_count':4,
              'production_recovered_announcement_ids':recovered82,
              'remaining_fail_closed_count':78,
              'target_values':{
                  'TOTAL_ASSETS':'3642768851.01',
                  'TOTAL_LIABILITIES':'2382626915.88',
                  'TOTAL_EQUITY':'1260141935.13',
              },
              'corrupted_equity_alias':'所有者权益（或d股东权益）合计',
              'accounting_tolerance':'0.005',
              'global_row_tolerance_changed':False,
              'fuzzy_alias_matching_enabled':False,
              'e_equals_a_minus_l_inference':False,
              'source_policy_changed':False,
              'stage4_alpha_locked':True,
              'target_result':target,
              'per_shard':[
                  {key:row[key] for key in (
                      'shard','input_count_exact82','input_count_exact79',
                      'source_sha_match_count','exact82_recovered_announcement_ids',
                      'exact79_recovered_announcement_ids'
                  )}
                  for row in reports
              ],
              'errors':[],
          }
          os.makedirs('summary',exist_ok=True)
          json.dump(exact79,open('summary/s3g1j_v17_24_production_exact_79_acceptance.json','w',encoding='utf-8'),ensure_ascii=False,indent=2)
          json.dump(exact82,open('summary/s3g1j_v17_24_combined_production_exact_82_acceptance.json','w',encoding='utf-8'),ensure_ascii=False,indent=2)
          print(json.dumps({'exact79':exact79,'exact82':exact82},ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage3-s3g1j-v17-24-production-acceptance
          path: |
            summary
            candidate
          retention-days: 90
          compression-level: 0
