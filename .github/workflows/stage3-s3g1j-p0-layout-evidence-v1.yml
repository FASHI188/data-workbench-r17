name: Stage3 S3G1J P0 Layout Evidence V1

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/diagnose_stage3_s3g1j_p0_layout_evidence.py'
      - 'tests/test_stage3_s3g1j_p0_layout_evidence.py'
      - '.github/workflows/stage3-s3g1j-p0-layout-evidence-v1.yml'

permissions:
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ github.token }}
  SOURCE_RUN: '30687837626'
  SOURCE_HEAD: 'ef083b267625a4942c6f4e736d2c8178aa4a594d'
  SOURCE_ARTIFACT: 'stage3-s3g1j-p0-current-v17-24-diagnostic-v1'
  SOURCE_ARTIFACT_DIGEST: 'sha256:b4e310fbb2b41d33d2c2c545589a6af53487dbfd1492dbb971d860fdcb4a14f0'
  SOURCE_REPORT_SHA256: 'a3121a6a16261ed622a6b88fcc2db77fe791c317c133dddd2e45be8a523b943d'
  V17_24_RUN: '30685830808'
  V17_24_HEAD: '92de74e7898be36239dc163e3811c9ae3f732e60'
  V17_24_ARTIFACT: 'stage3-s3g1j-v17-24-production-acceptance-compat'
  V17_24_DIGEST: 'sha256:4865dd03537c70208d2a4358cf8b54ab65408510fce838017a4bf77bee30a98d'
  PYTHONPATH: scripts

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
      - name: Install exact verified diagnostic dependencies
        run: python -m pip install --disable-pip-version-check --constraint requirements/constraints-verified.txt requests PyMuPDF
      - name: Lock accepted P0 diagnostic and current runtime authority
        shell: bash
        run: |
          set -euo pipefail
          lock_run_artifact() {
            run="$1"; expected_head="$2"; artifact="$3"; expected_digest="$4"
            run_json=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run")
            test "$(jq -r '.conclusion' <<<"$run_json")" = success
            test "$(jq -r '.head_sha' <<<"$run_json")" = "$expected_head"
            artifact_json=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/artifacts")
            actual=$(jq -r --arg artifact "$artifact" '.artifacts[] | select(.name==$artifact) | .digest' <<<"$artifact_json")
            test -n "$actual"
            test "$actual" = "$expected_digest"
          }
          lock_run_artifact "$SOURCE_RUN" "$SOURCE_HEAD" "$SOURCE_ARTIFACT" "$SOURCE_ARTIFACT_DIGEST"
          lock_run_artifact "$V17_24_RUN" "$V17_24_HEAD" "$V17_24_ARTIFACT" "$V17_24_DIGEST"
      - name: Download accepted P0 diagnostic artifact
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            rm -rf source
            if gh run download "$SOURCE_RUN" -R "$GITHUB_REPOSITORY" -n "$SOURCE_ARTIFACT" -D source; then
              break
            fi
            test "$attempt" -lt 6
            sleep $((attempt * 15))
          done
          test -f source/report.json
      - name: Run layout evidence contracts
        run: python -m unittest tests.test_stage3_s3g1j_p0_layout_evidence -v
      - name: Extract source-locked title and equity-role evidence
        run: |
          python scripts/diagnose_stage3_s3g1j_p0_layout_evidence.py \
            --source-report source/report.json \
            --source-report-sha256 "$SOURCE_REPORT_SHA256" \
            --out build/s3g1j-p0-layout-evidence-v1/report.json
      - name: Enforce evidence accounting and safety boundaries
        run: |
          python - <<'PY'
          import json
          path='build/s3g1j-p0-layout-evidence-v1/report.json'
          x=json.load(open(path,encoding='utf-8'))
          assert x['gate']=='S3G1J_P0_LAYOUT_EVIDENCE_V1'
          assert x['pass'] is True and x['errors']==[]
          assert x['target_count']==22
          assert x['processed_count']==22
          assert x['source_sha_match_count']==22
          assert x['signature_counts']=={
              'MISSING_CANDIDATES_TOTAL_ASSETS_TOTAL_LIABILITIES_TOTAL_EQUITY':11,
              'MISSING_CANDIDATES_TOTAL_EQUITY':11,
          }
          assert len(x['results'])==22
          assert not x['execution_failures']
          assert x['parser_changed'] is False
          assert x['source_policy_changed'] is False
          assert x['accounting_tolerance_changed'] is False
          assert x['production_data_changed'] is False
          assert x['stage3_status']=='NOT_READY'
          assert x['stage4_alpha_locked'] is True
          print(json.dumps({
              'title_normalized_counts_by_signature':x['title_normalized_counts_by_signature'],
              'title_role_counts_by_signature':x['title_role_counts_by_signature'],
              'equity_row_normalized_counts_by_signature':x['equity_row_normalized_counts_by_signature'],
              'equity_bound_role_counts_by_signature':x['equity_bound_role_counts_by_signature'],
          },ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stage3-s3g1j-p0-layout-evidence-v1
          path: build/s3g1j-p0-layout-evidence-v1
          retention-days: 90
          compression-level: 0
