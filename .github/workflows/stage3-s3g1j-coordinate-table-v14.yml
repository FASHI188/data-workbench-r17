name: Stage3 S3G1J Coordinate Table Diagnostic V14

on:
  pull_request:
    branches: [stage3-s3g1j-identity-arbitration-v13]
    paths:
      - '.github/workflows/stage3-s3g1j-coordinate-table-v14.yml'
      - 'scripts/probe_stage3_s3g1j_coordinate_rows_v14.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      PYTHONPATH: scripts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests pymupdf
      - name: Run coordinate-row identity diagnostic on exact 20 V13 residuals
        run: python scripts/probe_stage3_s3g1j_coordinate_rows_v14.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage3-s3g1j-coordinate-table-v14
          path: data/stage3_source_probe_v14/s3g1j_coordinate_rows_v14.json
          retention-days: 90
          compression-level: 0
