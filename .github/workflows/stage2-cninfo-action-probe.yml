name: Stage2 CNINFO Structured Action Probe

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/probe_cninfo_structured_actions.py'
      - '.github/workflows/stage2-cninfo-action-probe.yml'
      - 'config/cninfo_action_probe_trigger.json'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check akshare pandas
      - run: python scripts/probe_cninfo_structured_actions.py
      - uses: actions/upload-artifact@v4
        with:
          name: stage2-cninfo-structured-action-probe
          path: data/cninfo_action_probe
          retention-days: 7
