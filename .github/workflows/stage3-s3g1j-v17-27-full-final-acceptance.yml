name: Stage3 S3G1J V17.27 Full Final Acceptance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/compare_stage3_s3g1j_v17_27_full_final.py'
      - 'scripts/compare_stage3_s3g1j_v17_27_full_final_v2.py'
      - 'tests/test_stage3_v17_27_full_final_comparator.py'
      - 'tests/test_stage3_v17_27_full_final_comparator_v2.py'
      - '.github/workflows/stage3-s3g1j-v17-27-full-final-acceptance.yml'

permissions:
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ github.token }}
  PYTHONPATH: scripts
  SOURCE_RUN: '30783179489'
  SOURCE_HEAD: 'e5e2076ac724787430a207130de0c48c49b75a40'
  SHARD_PREFIX: 'stage3-s3g1j-v17-27-full-final-shard-'
  INPUT_RUN: '30649251360'
  INPUT_HEAD: '6b274dbd32734ab0af6a75a6d595925278dd8973'
  INPUT_ARTIFACT: 'stage3-s3g1j-v17-21-full-final-input'
  INPUT_DIGEST: 'sha256:54a7e78b0defe34748abb18695aa758dcee65ddd978b6707d83ef5dd89f0ab10'
  PREVIOUS_RUN: '30733013665'
  PREVIOUS_HEAD: 'ed81a8f167c7b158167a8bdafa1799b7047666af'
  PREVIOUS_ARTIFACT: 'stage3-s3g1j-v17-26-full-final'
  PREVIOUS_DIGEST: 'sha256:7f2e707e9192af527ff0444b48caf6bebfbfa1ef7559ec2810b6f47b1790567b'
  CANDIDATE_RUN: '30747664549'
  CANDIDATE_HEAD: 'ae9e80d90e227772cca88cc3b7ebadd2c6cfb7ca'
  CANDIDATE_ARTIFACT: 'stage3-s3g1j-v17-27-normal-equity-candidate-safety'
  CANDIDATE_DIGEST: 'sha256:d279df39e62f4f0f4fd655267788473dd34945113f677635563ce38f3af88513'
  DIAGNOSTIC_RUN: '30806196591'
  DIAGNOSTIC_HEAD: '2a2475c90a9e7af97bc14dea484f2602a1b5b460'
  DIAGNOSTIC_ARTIFACT: 'stage3-s3g1j-v17-27-finalizer-diagnostic'
  DIAGNOSTIC_DIGEST: 'sha256:6f2a0b1464f36606dda3ae6c9cf624ed958c9e250dc73148a2c3a6d4dd03b6b4'
  SHARD_GATE: 'S3G1J_FINANCIAL_PDF_EXTRACTION_SHARD_V17_27'
  PARSER_METHOD: 'CNINFO_ORIGINAL_PDF_PYMUPDF_V17_V17_27_EXACT_SOURCE_NORMAL_EQUITY_PRODUCTION'
  METHODOLOGY: 'V3.3.7-V17.27'
  RUNTIME_GENERATION: 'V17.27'

jobs:
  accept-full-final:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
      - run: python -m pip install --disable-pip-version-check --constraint requirements/constraints-verified.txt requests PyMuPDF
      - name: Lock source shards and all authority artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/locks
          api_retry() {
            local endpoint="$1"
            for attempt in 1 2 3 4 5 6; do
              if output=$(gh api "$endpoint" 2>api-error.log); then
                printf '%s' "$output"
                return 0
              fi
              cat api-error.log >&2 || true
              sleep $((attempt * 15))
            done
            return 1
          }
          artifact_lock() {
            local run="$1" artifact="$2" expected_digest="$3" expected_head="$4"
            local payload count digest head
            payload=$(api_retry "repos/$GITHUB_REPOSITORY/actions/runs/$run/artifacts?per_page=100")
            count=$(jq -r --arg name "$artifact" '[.artifacts[] | select(.name==$name)] | length' <<<"$payload")
            test "$count" = 1
            digest=$(jq -r --arg name "$artifact" '.artifacts[] | select(.name==$name) | .digest' <<<"$payload")
            head=$(jq -r --arg name "$artifact" '.artifacts[] | select(.name==$name) | .workflow_run.head_sha' <<<"$payload")
            test "$digest" = "$expected_digest"
            test "$head" = "$expected_head"
          }
          success_run_lock() {
            local run="$1" expected_head="$2"
            local payload
            payload=$(api_retry "repos/$GITHUB_REPOSITORY/actions/runs/$run")
            test "$(jq -r '.conclusion' <<<"$payload")" = success
            test "$(jq -r '.head_sha' <<<"$payload")" = "$expected_head"
          }
          source=$(api_retry "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN")
          test "$(jq -r '.conclusion' <<<"$source")" = failure
          test "$(jq -r '.head_sha' <<<"$source")" = "$SOURCE_HEAD"
          payload=$(api_retry "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN/artifacts?per_page=100")
          jq --arg prefix "$SHARD_PREFIX" --arg head "$SOURCE_HEAD" \
            '[.artifacts[] | select(.name|startswith($prefix)) | {
              name, id, digest, size_in_bytes,
              head_sha:.workflow_run.head_sha,
              shard:(.name|sub($prefix;"")|tonumber)
            }] | sort_by(.shard)' <<<"$payload" > build/locks/source_shard_artifacts.json
          python - <<'PY'
          import json
          rows=json.load(open('build/locks/source_shard_artifacts.json',encoding='utf-8'))
          assert len(rows)==64, len(rows)
          assert [row['shard'] for row in rows]==list(range(64))
          assert all(row['head_sha']=='e5e2076ac724787430a207130de0c48c49b75a40' for row in rows)
          assert all(str(row['digest']).startswith('sha256:') for row in rows)
          assert all(int(row['size_in_bytes'])>0 for row in rows)
          print('V17_27_ACCEPTANCE_64_SHARD_ARTIFACT_LOCK_PASS')
          PY
          artifact_lock "$INPUT_RUN" "$INPUT_ARTIFACT" "$INPUT_DIGEST" "$INPUT_HEAD"
          success_run_lock "$PREVIOUS_RUN" "$PREVIOUS_HEAD"
          artifact_lock "$PREVIOUS_RUN" "$PREVIOUS_ARTIFACT" "$PREVIOUS_DIGEST" "$PREVIOUS_HEAD"
          success_run_lock "$CANDIDATE_RUN" "$CANDIDATE_HEAD"
          artifact_lock "$CANDIDATE_RUN" "$CANDIDATE_ARTIFACT" "$CANDIDATE_DIGEST" "$CANDIDATE_HEAD"
          success_run_lock "$DIAGNOSTIC_RUN" "$DIAGNOSTIC_HEAD"
          artifact_lock "$DIAGNOSTIC_RUN" "$DIAGNOSTIC_ARTIFACT" "$DIAGNOSTIC_DIGEST" "$DIAGNOSTIC_HEAD"
      - name: Run corrected comparison contracts
        run: |
          python -m unittest \
            tests.test_stage3_v17_27_full_final_comparator \
            tests.test_stage3_v17_27_full_final_comparator_v2 \
            tests.test_stage3_v17_27_runtime_promotion \
            -v
          python -m py_compile \
            scripts/compare_stage3_s3g1j_v17_27_full_final.py \
            scripts/compare_stage3_s3g1j_v17_27_full_final_v2.py
      - uses: actions/download-artifact@v4
        with:
          pattern: stage3-s3g1j-v17-27-full-final-shard-*
          path: partials
          repository: FASHI188/data-workbench-r17
          run-id: 30783179489
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: stage3-s3g1j-v17-21-full-final-input
          path: prepared
          repository: FASHI188/data-workbench-r17
          run-id: 30649251360
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: stage3-s3g1j-v17-26-full-final
          path: previous
          repository: FASHI188/data-workbench-r17
          run-id: 30733013665
          github-token: ${{ github.token }}
      - name: Finalize the frozen 64-shard V17.27 basis
        shell: bash
        run: |
          set +e
          mkdir -p build/final
          python scripts/finalize_stage3_financial_pdf_values.py \
            --root partials \
            --versions prepared/stage3_financial_report_versions.csv.gz \
            --stage2-manifest prepared/stage2_manifest.json \
            --out build/final \
            --expected-shard-gate "$SHARD_GATE" \
            --expected-parser-method "$PARSER_METHOD" \
            --expected-methodology-version "$METHODOLOGY" \
            > build/final/finalizer.stdout.log 2> build/final/finalizer.stderr.log
          code=$?
          echo "FINALIZER_EXIT=$code" >> "$GITHUB_ENV"
          test "$code" = 2
          exit 0
      - name: Require exact fail-closed V17.27 full-basis output
        shell: bash
        run: |
          set -euo pipefail
          test -f build/final/stage3_financial_raw_values.csv.gz
          test -f build/final/stage3_financial_documents.csv.gz
          test -f build/final/stage3_financial_raw_audit.json
          python - <<'PY'
          import glob,json,os
          manifests=glob.glob('partials/**/financial_extract_shard*.manifest.json',recursive=True)
          assert len(manifests)==64, len(manifests)
          rows=[json.load(open(p,encoding='utf-8')) for p in manifests]
          assert sorted(row['shard'] for row in rows)==list(range(64))
          assert all(row['shards']==64 for row in rows)
          assert all(row['gate']==os.environ['SHARD_GATE'] for row in rows)
          assert all(row['runtime_generation']==os.environ['RUNTIME_GENERATION'] for row in rows)
          assert all(row['parser_method']==os.environ['PARSER_METHOD'] for row in rows)
          assert all(row['methodology_version']==os.environ['METHODOLOGY'] for row in rows)
          x=json.load(open('build/final/stage3_financial_raw_audit.json',encoding='utf-8'))
          assert x['shard_gate']==os.environ['SHARD_GATE']
          assert x['runtime_generation']==os.environ['RUNTIME_GENERATION']
          assert x['parser_method']==os.environ['PARSER_METHOD']
          assert x['methodology_version']==os.environ['METHODOLOGY']
          assert x['canonical_version_count']==121354
          assert x['document_count']==121354
          assert x['numeric_observation_count']==1051793
          assert x['document_error_count']==1373
          assert x['unresolved_tie_count']==1290
          assert x['authority']=='CNINFO_ORIGINAL_FILING_PDF_BYTES_WITH_SHA256'
          assert x['historical_current_f10_used_as_truth'] is False
          assert x['stage4_alpha_locked'] is True
          assert x['pass'] is False
          print('V17_27_ACCEPTANCE_EXACT_FULL_BASIS_PASS')
          PY
      - name: Enforce corrected V17.27 document and numeric non-regression
        shell: bash
        run: |
          set -euo pipefail
          previous_docs=$(find previous -name stage3_financial_documents.csv.gz -print -quit)
          previous_values=$(find previous -name stage3_financial_raw_values.csv.gz -print -quit)
          previous_audit=$(find previous -name stage3_financial_raw_audit.json -print -quit)
          python scripts/compare_stage3_s3g1j_v17_27_full_final_v2.py \
            --previous-documents "$previous_docs" \
            --current-documents build/final/stage3_financial_documents.csv.gz \
            --previous-values "$previous_values" \
            --current-values build/final/stage3_financial_raw_values.csv.gz \
            --previous-audit "$previous_audit" \
            --current-audit build/final/stage3_financial_raw_audit.json \
            --out build/final/stage3_s3g1j_v17_27_full_basis_non_regression_v2.json
      - name: Record execution and output identities
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          audit=json.load(open('build/final/stage3_financial_raw_audit.json',encoding='utf-8'))
          compare=json.load(open('build/final/stage3_s3g1j_v17_27_full_basis_non_regression_v2.json',encoding='utf-8'))
          assert compare['pass'] is True and compare['errors']==[]
          assert compare['actual_changed_announcement_ids']==compare['expected_changed_announcement_ids']
          assert compare['non_target_document_exact_equal'] is True
          assert compare['existing_numeric_exact_equal'] is True
          assert compare['target_numeric_rows']==15
          assert compare['previous_unresolved_tie_count']==1295
          assert compare['current_unresolved_tie_count']==1290
          assert compare['recovered_unresolved_tie_count']==5
          execution={
            'gate':'S3G1J_V17_27_FULL_64_SHARD_ACCEPTANCE',
            'source_shard_run':30783179489,
            'source_shard_head':'e5e2076ac724787430a207130de0c48c49b75a40',
            'source_shard_count':64,
            'execution_pass':True,
            'document_non_regression_pass':True,
            'numeric_non_regression_pass':True,
            'final_data_gate_pass':False,
            'final_data_verdict':'FAIL_CLOSED',
            'canonical_version_count':audit['canonical_version_count'],
            'document_count':audit['document_count'],
            'numeric_observation_count':audit['numeric_observation_count'],
            'document_error_count':audit['document_error_count'],
            'unresolved_tie_count':audit['unresolved_tie_count'],
            'changed_announcement_ids':compare['actual_changed_announcement_ids'],
            'unexpected_document_regression_count':compare['unexpected_document_regression_count'],
            'existing_numeric_semantic_sha256':compare['current_existing_numeric_semantic_sha256'],
            'top_level_conflict_concept_order_normalized':True,
            'nested_conflict_evidence_order_preserved':True,
            'stage3_status':'NOT_READY',
            'stage4_alpha_locked':True,
            'committed_production_data_changed':False,
            'trained_model_changed':False,
            'main_changed':False,
          }
          Path('build/final/stage3_s3g1j_v17_27_execution.json').write_text(
              json.dumps(execution,ensure_ascii=False,indent=2)+'\n',encoding='utf-8'
          )
          hashes={}
          for path in sorted(Path('build/final').iterdir()):
              if path.is_file():
                  hashes[path.name]=hashlib.sha256(path.read_bytes()).hexdigest()
          Path('build/final/stage3_s3g1j_v17_27_output_sha256.json').write_text(
              json.dumps(hashes,ensure_ascii=False,indent=2)+'\n',encoding='utf-8'
          )
          print(json.dumps(execution,ensure_ascii=False,indent=2))
          PY
          cp build/locks/source_shard_artifacts.json build/final/
      - uses: actions/upload-artifact@v4
        with:
          name: stage3-s3g1j-v17-27-full-final
          path: build/final
          retention-days: 90
          compression-level: 0
