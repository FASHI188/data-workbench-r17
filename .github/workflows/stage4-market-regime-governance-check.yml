name: Stage4 Market Regime V1 - Governance Regression

on:
  workflow_dispatch:
  push:
    branches: [agent/stage4-market-regime-v1]
    paths:
      - '.github/workflows/stage4-market-regime-governance-check.yml'
      - 'governance/extension_module_registry.json'
      - 'governance/market_regime_v1_module_manifest.json'
      - 'governance/stage4_market_regime_v1_tested_promotion.json'
      - 'tests/test_extension_foundation.py'
      - 'tests/test_stage4_market_regime_v1.py'
      - 'extensions/contracts.py'

permissions:
  contents: read

jobs:
  governance-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
      - run: python -m pip install --disable-pip-version-check pytest
      - run: pytest -q tests/test_extension_foundation.py tests/test_stage4_market_regime_v1.py
      - name: Verify TESTED remains disabled/non-authoritative
        run: |
          python - <<'PY'
          import json
          r=json.load(open('governance/extension_module_registry.json',encoding='utf-8'))
          m=json.load(open('governance/market_regime_v1_module_manifest.json',encoding='utf-8'))
          p=json.load(open('governance/stage4_market_regime_v1_tested_promotion.json',encoding='utf-8'))
          assert m['lifecycle']=='TESTED'
          assert m['enabled'] is False and m['training_allowed'] is False and m['live_allowed'] is False
          assert p['permissions']['stage4_feature_use_allowed'] is False
          assert p['permissions']['authoritative'] is False
          assert r['accepted_baseline_anchor']['stage4_unlocked'] is False
          assert r['accepted_baseline_anchor']['alpha_training_allowed'] is False
          assert r['accepted_baseline_anchor']['live_signal_allowed'] is False
          PY
