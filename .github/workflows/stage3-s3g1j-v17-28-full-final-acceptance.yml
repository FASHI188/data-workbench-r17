name: Stage3 S3G1J V17.28 Full Final Acceptance

on:
  pull_request:
    paths:
      - 'scripts/compare_stage3_s3g1j_v17_28_full_final.py'
      - 'tests/test_stage3_v17_28_full_final_comparator.py'
      - '.github/workflows/stage3-s3g1j-v17-28-full-final-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read

env:
  GH_TOKEN: ${{ github.token }}
  PYTHONPATH: scripts
  SOURCE_RUN: '30981127011'
  SOURCE_HEAD: '7dd3e14ccdd9574ce7f4a8f716026ececf254541'
  SHARD_PREFIX: 'stage3-s3g1j-v17-28-full-final-shard-'
  INPUT_RUN: '30649251360'
  INPUT_HEAD: '6b274dbd32734ab0af6a75a6d595925278dd8973'
  INPUT_ARTIFACT_ID: '8800699971'
  INPUT_ARTIFACT: 'stage3-s3g1j-v17-21-full-final-input'
  INPUT_DIGEST: 'sha256:54a7e78b0defe34748abb18695aa758dcee65ddd978b6707d83ef5dd89f0ab10'
  PREVIOUS_RUN: '30806818977'
  PREVIOUS_HEAD: 'fa77d30a2ccdd3664beab01fd7ff7b5d16761726'
  PREVIOUS_ARTIFACT_ID: '8854139999'
  PREVIOUS_ARTIFACT: 'stage3-s3g1j-v17-27-full-final'
  PREVIOUS_DIGEST: 'sha256:410e257d7a3ada353926970f806abc3e970e5638f55c1dec7b47c71c57777721'
  CANDIDATE_RUN: '30827493788'
  CANDIDATE_HEAD: '08ddddca5effac0f416b68ac2f4c07cdec99dfb2'
  CANDIDATE_ARTIFACT_ID: '8861519922'
  CANDIDATE_ARTIFACT: 'stage3-s3g1j-v17-28-split-equity-candidate-safety'
  CANDIDATE_DIGEST: 'sha256:8a87dfed63160374fc04c88c3d02a93eedac6ae239ae559b64aaad93c71d22c1'
  WRAPPER_RUN: '30978715158'
  WRAPPER_HEAD: '6969c58ee60314e3e897e55b132266612c602777'
  WRAPPER_ARTIFACT_ID: '8919289427'
  WRAPPER_ARTIFACT: 'stage3-s3g1j-v17-28-runtime-wrapper'
  WRAPPER_DIGEST: 'sha256:f8639b4a2eac2d09b16586365b7932d255457ce66aad2484547bb517d0d185a6'
  SHARD_GATE: 'S3G1J_FINANCIAL_PDF_EXTRACTION_SHARD_V17_28'
  PARSER_METHOD: 'CNINFO_ORIGINAL_PDF_PYMUPDF_V18_V17_28_EXACT_SOURCE_SPLIT_GROUP_EQUITY_PRODUCTION'
  METHODOLOGY: 'V3.3.8-V17.28'
  RUNTIME_GENERATION: 'V17.28'

jobs:
  accept-full-final:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
      - name: Install verified runtime
        run: python -m pip install --disable-pip-version-check --constraint requirements/constraints-verified.txt requests PyMuPDF
      - name: Wait for and lock exact source run
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/locks
          api_retry() {
            local endpoint="$1"
            for attempt in 1 2 3 4 5 6; do
              if output=$(gh api "$endpoint" 2>api-error.log); then
                printf '%s' "$output"
                return 0
              fi
              cat api-error.log >&2 || true
              sleep $((attempt * 15))
            done
            return 1
          }
          completed=false
          for attempt in $(seq 1 180); do
            source=$(api_retry "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN")
            test "$(jq -r '.head_sha' <<<"$source")" = "$SOURCE_HEAD"
            status=$(jq -r '.status' <<<"$source")
            conclusion=$(jq -r '.conclusion // ""' <<<"$source")
            echo "source attempt=$attempt status=$status conclusion=$conclusion"
            if [ "$status" = completed ]; then
              test "$conclusion" = success
              completed=true
              break
            fi
            sleep 60
          done
          test "$completed" = true
          payload=$(api_retry "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN/artifacts?per_page=100")
          jq --arg prefix "$SHARD_PREFIX" --arg head "$SOURCE_HEAD" \
            '[.artifacts[] | select(.name|startswith($prefix)) | {
              name, id, digest, size_in_bytes, expired,
              head_sha:.workflow_run.head_sha,
              shard:(.name|sub($prefix;"")|tonumber)
            }] | sort_by(.shard)' <<<"$payload" > build/locks/source_shard_artifacts.json
          python - <<'PY'
          import json,os
          rows=json.load(open('build/locks/source_shard_artifacts.json',encoding='utf-8'))
          assert len(rows)==64, len(rows)
          assert [row['shard'] for row in rows]==list(range(64))
          assert all(row['head_sha']==os.environ['SOURCE_HEAD'] for row in rows)
          assert all(str(row['digest']).startswith('sha256:') for row in rows)
          assert all(int(row['id'])>0 and int(row['size_in_bytes'])>0 for row in rows)
          assert all(row['expired'] is False for row in rows)
          print('V17_28_ACCEPTANCE_64_SHARD_ARTIFACT_LOCK_PASS')
          PY
      - name: Lock frozen input and accepted authority artifacts
        shell: bash
        run: |
          set -euo pipefail
          api_retry() {
            local endpoint="$1"
            for attempt in 1 2 3 4 5 6; do
              if output=$(gh api "$endpoint" 2>api-error.log); then
                printf '%s' "$output"
                return 0
              fi
              cat api-error.log >&2 || true
              sleep $((attempt * 15))
            done
            return 1
          }
          lock_artifact() {
            local run="$1" head="$2" artifact_id="$3" artifact_name="$4" digest="$5" expected_conclusion="$6"
            local run_payload artifact_payload
            run_payload=$(api_retry "repos/$GITHUB_REPOSITORY/actions/runs/$run")
            test "$(jq -r '.status' <<<"$run_payload")" = completed
            test "$(jq -r '.head_sha' <<<"$run_payload")" = "$head"
            test "$(jq -r '.conclusion' <<<"$run_payload")" = "$expected_conclusion"
            artifact_payload=$(api_retry "repos/$GITHUB_REPOSITORY/actions/runs/$run/artifacts?per_page=100")
            test "$(jq -r --arg name "$artifact_name" '[.artifacts[] | select(.name==$name)] | length' <<<"$artifact_payload")" = 1
            test "$(jq -r --arg name "$artifact_name" '.artifacts[] | select(.name==$name) | .id' <<<"$artifact_payload")" = "$artifact_id"
            test "$(jq -r --arg name "$artifact_name" '.artifacts[] | select(.name==$name) | .digest' <<<"$artifact_payload")" = "$digest"
            test "$(jq -r --arg name "$artifact_name" '.artifacts[] | select(.name==$name) | .workflow_run.head_sha' <<<"$artifact_payload")" = "$head"
            test "$(jq -r --arg name "$artifact_name" '.artifacts[] | select(.name==$name) | .expired' <<<"$artifact_payload")" = false
          }
          lock_artifact "$INPUT_RUN" "$INPUT_HEAD" "$INPUT_ARTIFACT_ID" "$INPUT_ARTIFACT" "$INPUT_DIGEST" failure
          lock_artifact "$PREVIOUS_RUN" "$PREVIOUS_HEAD" "$PREVIOUS_ARTIFACT_ID" "$PREVIOUS_ARTIFACT" "$PREVIOUS_DIGEST" success
          lock_artifact "$CANDIDATE_RUN" "$CANDIDATE_HEAD" "$CANDIDATE_ARTIFACT_ID" "$CANDIDATE_ARTIFACT" "$CANDIDATE_DIGEST" success
          lock_artifact "$WRAPPER_RUN" "$WRAPPER_HEAD" "$WRAPPER_ARTIFACT_ID" "$WRAPPER_ARTIFACT" "$WRAPPER_DIGEST" success
      - name: Run comparator and runtime contracts
        run: |
          python -m unittest \
            tests.test_stage3_v17_28_full_final_comparator \
            tests.test_stage3_v17_28_runtime_promotion \
            tests.test_stage3_v17_28_runtime_wrapper \
            -v
          python -m py_compile scripts/compare_stage3_s3g1j_v17_28_full_final.py
      - uses: actions/download-artifact@v4
        with:
          pattern: stage3-s3g1j-v17-28-full-final-shard-*
          path: partials
          repository: FASHI188/data-workbench-r17
          run-id: 30981127011
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: stage3-s3g1j-v17-21-full-final-input
          path: prepared
          repository: FASHI188/data-workbench-r17
          run-id: 30649251360
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: stage3-s3g1j-v17-27-full-final
          path: previous
          repository: FASHI188/data-workbench-r17
          run-id: 30806818977
          github-token: ${{ github.token }}
      - name: Finalize frozen V17.28 shards
        shell: bash
        run: |
          set +e
          mkdir -p build/final
          python scripts/finalize_stage3_financial_pdf_values.py \
            --root partials \
            --versions prepared/stage3_financial_report_versions.csv.gz \
            --stage2-manifest prepared/stage2_manifest.json \
            --out build/final \
            --expected-shard-gate "$SHARD_GATE" \
            --expected-parser-method "$PARSER_METHOD" \
            --expected-methodology-version "$METHODOLOGY" \
            > build/final/finalizer.stdout.log 2> build/final/finalizer.stderr.log
          code=$?
          echo "FINALIZER_EXIT=$code" >> "$GITHUB_ENV"
          test "$code" = 2
          exit 0
      - name: Require exact fail-closed V17.28 output
        shell: bash
        run: |
          set -euo pipefail
          test "$FINALIZER_EXIT" = 2
          python - <<'PY'
          import glob,json,os
          manifests=glob.glob('partials/**/financial_extract_shard*.manifest.json',recursive=True)
          assert len(manifests)==64, len(manifests)
          rows=[json.load(open(p,encoding='utf-8')) for p in manifests]
          assert sorted(row['shard'] for row in rows)==list(range(64))
          assert all(row['shards']==64 for row in rows)
          assert all(row['gate']==os.environ['SHARD_GATE'] for row in rows)
          assert all(row['runtime_generation']==os.environ['RUNTIME_GENERATION'] for row in rows)
          assert all(row['parser_method']==os.environ['PARSER_METHOD'] for row in rows)
          assert all(row['methodology_version']==os.environ['METHODOLOGY'] for row in rows)
          audit=json.load(open('build/final/stage3_financial_raw_audit.json',encoding='utf-8'))
          expected={
            'shard_gate':os.environ['SHARD_GATE'],
            'runtime_generation':os.environ['RUNTIME_GENERATION'],
            'parser_method':os.environ['PARSER_METHOD'],
            'methodology_version':os.environ['METHODOLOGY'],
            'canonical_version_count':121354,
            'document_count':121354,
            'numeric_observation_count':1051799,
            'document_error_count':1371,
            'unresolved_tie_count':1288,
            'authority':'CNINFO_ORIGINAL_FILING_PDF_BYTES_WITH_SHA256',
            'historical_current_f10_used_as_truth':False,
            'stage4_alpha_locked':True,
            'pass':False,
          }
          for field,wanted in expected.items():
            assert audit[field]==wanted,(field,audit.get(field),wanted)
          print('V17_28_ACCEPTANCE_EXACT_FULL_BASIS_PASS')
          PY
      - name: Enforce V17.28 full-basis non-regression
        shell: bash
        run: |
          set -euo pipefail
          previous_docs=$(find previous -name stage3_financial_documents.csv.gz -print -quit)
          previous_values=$(find previous -name stage3_financial_raw_values.csv.gz -print -quit)
          previous_audit=$(find previous -name stage3_financial_raw_audit.json -print -quit)
          test -n "$previous_docs" && test -n "$previous_values" && test -n "$previous_audit"
          python scripts/compare_stage3_s3g1j_v17_28_full_final.py \
            --previous-documents "$previous_docs" \
            --current-documents build/final/stage3_financial_documents.csv.gz \
            --previous-values "$previous_values" \
            --current-values build/final/stage3_financial_raw_values.csv.gz \
            --previous-audit "$previous_audit" \
            --current-audit build/final/stage3_financial_raw_audit.json \
            --out build/final/stage3_s3g1j_v17_28_full_basis_non_regression.json
      - name: Record execution and output identities
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          audit=json.load(open('build/final/stage3_financial_raw_audit.json',encoding='utf-8'))
          compare=json.load(open('build/final/stage3_s3g1j_v17_28_full_basis_non_regression.json',encoding='utf-8'))
          assert compare['pass'] is True and compare['errors']==[]
          assert compare['changed_announcement_ids']==['1207621057','1209825769']
          assert compare['non_target_document_equal_count']==121352
          assert compare['existing_numeric_semantic_sha256_previous']==compare['existing_numeric_semantic_sha256_current']
          execution={
            'gate':'S3G1J_V17_28_FULL_64_SHARD_ACCEPTANCE',
            'source_shard_run':30981127011,
            'source_shard_head':'7dd3e14ccdd9574ce7f4a8f716026ececf254541',
            'source_shard_count':64,
            'execution_pass':True,
            'document_non_regression_pass':True,
            'numeric_non_regression_pass':True,
            'final_data_gate_pass':False,
            'final_data_verdict':'FAIL_CLOSED',
            'canonical_version_count':audit['canonical_version_count'],
            'document_count':audit['document_count'],
            'numeric_observation_count':audit['numeric_observation_count'],
            'document_error_count':audit['document_error_count'],
            'unresolved_tie_count':audit['unresolved_tie_count'],
            'changed_announcement_ids':compare['changed_announcement_ids'],
            'non_target_document_equal_count':compare['non_target_document_equal_count'],
            'existing_numeric_semantic_sha256':compare['existing_numeric_semantic_sha256_current'],
            'top_level_conflict_concept_order_normalized':True,
            'nested_conflict_evidence_order_preserved':True,
            'stage3_status':'NOT_READY',
            'stage4_alpha_locked':True,
            'committed_production_data_changed':False,
            'trained_model_changed':False,
            'main_changed':False,
          }
          Path('build/final/stage3_s3g1j_v17_28_execution.json').write_text(
              json.dumps(execution,ensure_ascii=False,indent=2)+'\n',encoding='utf-8'
          )
          hashes={}
          for path in sorted(Path('build/final').iterdir()):
              if path.is_file():
                  hashes[path.name]=hashlib.sha256(path.read_bytes()).hexdigest()
          Path('build/final/stage3_s3g1j_v17_28_output_sha256.json').write_text(
              json.dumps(hashes,ensure_ascii=False,indent=2)+'\n',encoding='utf-8'
          )
          print(json.dumps(execution,ensure_ascii=False,indent=2))
          PY
          cp build/locks/source_shard_artifacts.json build/final/
      - uses: actions/upload-artifact@v4
        with:
          name: stage3-s3g1j-v17-28-full-final
          path: build/final
          retention-days: 90
          compression-level: 0
