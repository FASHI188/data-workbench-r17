name: Stage3 S3G1J V17.29 Candidate Acceptance Evidence Contract

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'governance/stage3_s3g1j_v17_29_candidate_acceptance.json'
      - 'tests/test_stage3_s3g1j_v17_29_candidate_acceptance_evidence.py'
      - '.github/workflows/stage3-s3g1j-v17-29-candidate-evidence-contract.yml'

permissions:
  contents: read
  actions: read
  pull-requests: read

env:
  GH_TOKEN: ${{ github.token }}
  CANDIDATE_PR: '105'
  CANDIDATE_HEAD: '51bd3ccc0013c2c9a6a55bbb54a1d82dcbd2974e'
  ACCEPTED_RUN: '31310230656'
  ACCEPTED_ARTIFACT_ID: '9037206225'
  ACCEPTED_ARTIFACT: 'stage3-s3g1j-v17-29-seven-exact-source-candidate-safety-v2'
  ACCEPTED_DIGEST: 'sha256:fc8ff09522b67df8e8209f7e5d88a0d768ef68987201dbb8087df2b6424bb99c'

jobs:
  candidate-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
      - name: Lock candidate PR identity and accepted artifact
        shell: bash
        run: |
          set -euo pipefail
          pr=$(gh pr view "$CANDIDATE_PR" -R "$GITHUB_REPOSITORY" --json headRefOid,state,isDraft,mergedAt)
          test "$(jq -r '.headRefOid' <<<"$pr")" = "$CANDIDATE_HEAD"
          # Candidate execution must never have merged. It may be OPEN/Draft
          # during registration or CLOSED after the evidence PR lands.
          test "$(jq -r '.mergedAt // ""' <<<"$pr")" = ""
          state=$(jq -r '.state' <<<"$pr")
          if [ "$state" = OPEN ]; then
            test "$(jq -r '.isDraft' <<<"$pr")" = true
          else
            test "$state" = CLOSED
          fi
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ACCEPTED_RUN")
          test "$(jq -r '.status' <<<"$run")" = completed
          test "$(jq -r '.conclusion' <<<"$run")" = success
          test "$(jq -r '.head_sha' <<<"$run")" = "$CANDIDATE_HEAD"
          artifacts=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ACCEPTED_RUN/artifacts?per_page=100")
          test "$(jq -r --arg name "$ACCEPTED_ARTIFACT" '[.artifacts[] | select(.name==$name)] | length' <<<"$artifacts")" = 1
          test "$(jq -r --arg name "$ACCEPTED_ARTIFACT" '.artifacts[] | select(.name==$name) | .id' <<<"$artifacts")" = "$ACCEPTED_ARTIFACT_ID"
          test "$(jq -r --arg name "$ACCEPTED_ARTIFACT" '.artifacts[] | select(.name==$name) | .digest' <<<"$artifacts")" = "$ACCEPTED_DIGEST"
          test "$(jq -r --arg name "$ACCEPTED_ARTIFACT" '.artifacts[] | select(.name==$name) | .workflow_run.head_sha' <<<"$artifacts")" = "$CANDIDATE_HEAD"
          test "$(jq -r --arg name "$ACCEPTED_ARTIFACT" '.artifacts[] | select(.name==$name) | .expired' <<<"$artifacts")" = false
      - uses: actions/download-artifact@v4
        with:
          name: stage3-s3g1j-v17-29-seven-exact-source-candidate-safety-v2
          path: accepted
          repository: FASHI188/data-workbench-r17
          run-id: 31310230656
          github-token: ${{ github.token }}
      - name: Verify downloaded candidate full-basis evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv,gzip,hashlib,json
          from collections import Counter
          from pathlib import Path
          root=Path('accepted')
          paths={p.name:p for p in root.rglob('*') if p.is_file()}
          expected={
            'stage3_financial_documents_v17_29_candidate.csv.gz':'343ef55dc8bcf0eb53e8eda2d77f58ddfc48c5c6d13011d02a12d00bd836179e',
            'stage3_financial_values_v17_29_candidate.csv.gz':'31479f232fa2708b411730aa0e0513892a0e42359f0a0e80f4325af3f8b9de2a',
            'stage3_s3g1j_v17_29_candidate_safety.json':'f0eaf3a6529eeba4b6347e2f046fb66ca497a118aa6faaa84b4b7e989307c059',
            'output_sha256.json':'6ed1124a4be6864dbf29eba7d4ed90687aab7a06b585696ac086e3a5fb2c8416',
            'output_sha256.txt':'060be2a0e79ce0dce134c0879a47ab36679a91649f0332f75da06dd51a2fdd55',
          }
          for name,digest in expected.items():
              assert name in paths,name
              assert hashlib.sha256(paths[name].read_bytes()).hexdigest()==digest,name
          report=json.loads(paths['stage3_s3g1j_v17_29_candidate_safety.json'].read_text(encoding='utf-8'))
          ids=['1215186538','1219426855','1219792633','1219840508','1219879687','1220087244','1221006100']
          assert report['target_announcement_ids']==ids
          assert report['source_document_rows']==121354 and report['candidate_document_rows']==121354
          assert report['source_numeric_rows']==1051799 and report['candidate_numeric_rows']==1051820
          assert report['source_document_errors']==1371 and report['candidate_document_errors']==1364
          assert report['source_unresolved_ties']==1288 and report['candidate_unresolved_ties']==1281
          assert report['source_unresolved_tie_taxonomy']=={'TIE_SOURCE_INCOMPLETE':1274,'TIE_VALUE_CONFLICT':14}
          assert report['candidate_unresolved_tie_taxonomy']=={'TIE_SOURCE_INCOMPLETE':1267,'TIE_VALUE_CONFLICT':14}
          assert report['non_target_document_rows']==121347 and report['non_target_document_exact_equal'] is True
          assert report['existing_numeric_rows']==1051799 and report['existing_numeric_exact_equal'] is True
          assert report['source_existing_numeric_semantic_sha256']==report['candidate_existing_numeric_semantic_sha256']=='8518e838921b92448952479855770893eea6227a891b83817929c3d8eb990322'
          assert report['changed_document_ids']==ids
          assert report['target_numeric_distribution']=={aid:3 for aid in ids}
          assert all(t['split_equity_pattern']=='SPLIT_LABEL_1_BEFORE_1_AFTER_AMOUNT' for t in report['target_reports'])
          assert all(all(row['identity_residual_cny']=='0.00' for row in t['identity']['columns']) for t in report['target_reports'])
          assert report['accounting_tolerance']=='0.005'
          assert report['candidate_promotion_authorized'] is False
          assert report['formal_runtime_changed'] is False and report['production_data_changed'] is False and report['main_changed'] is False
          assert report['final_data_verdict']=='FAIL_CLOSED' and report['stage3_status']=='NOT_READY' and report['stage4_alpha_live_locked'] is True
          with gzip.open(paths['stage3_financial_values_v17_29_candidate.csv.gz'],'rt',encoding='utf-8',newline='') as f:
              values=list(csv.DictReader(f))
          tail=values[-21:]
          assert Counter(row['announcement_id'] for row in tail)==Counter({aid:3 for aid in ids})
          assert Counter(row['concept'] for row in tail)==Counter({'TOTAL_ASSETS':7,'TOTAL_LIABILITIES':7,'TOTAL_EQUITY':7})
          assert all(row['extraction_method']=='V17_29_EXACT_SOURCE_SPLIT_GROUP_EQUITY_CANDIDATE_V2' for row in tail)
          print('S3G1J_V17_29_CANDIDATE_DOWNLOADED_EVIDENCE_PASS')
          PY
      - name: Verify committed immutable evidence
        run: python -m unittest tests.test_stage3_s3g1j_v17_29_candidate_acceptance_evidence -v
      - name: Assert candidate execution code did not enter integration evidence branch
        shell: bash
        run: |
          set -euo pipefail
          test ! -e scripts/stage3_financial_pdf_parser_v21_candidate.py
          test ! -e scripts/stage3_financial_pdf_parser_v21_candidate_v2.py
          test ! -e scripts/build_stage3_s3g1j_v17_29_candidate_full.py
          test ! -e scripts/build_stage3_s3g1j_v17_29_candidate_full_v2.py
          test ! -e tests/test_stage3_s3g1j_v17_29_exact_source_candidate_v2.py
          test ! -e .github/workflows/stage3-s3g1j-v17-29-candidate-safety-v2.yml
      - name: Assert project and runtime remain fail-closed
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          project=json.load(open('data/project_status.json',encoding='utf-8'))
          lock=json.load(open('config/stage3_final_lock.json',encoding='utf-8'))
          evidence=json.load(open('governance/stage3_s3g1j_v17_29_candidate_acceptance.json',encoding='utf-8'))
          assert project['stage3']['status']=='NOT_READY'
          assert project['stage3']['s3g1j']['formal_runtime_generation']=='V17.28'
          assert project['stage3']['s3g1j']['data_verdict']=='FAIL_CLOSED'
          assert project['stage3']['s3g1j']['final_gate_pass'] is False
          assert project['stage4_unlocked'] is False
          assert project['alpha_training_allowed'] is False
          assert project['live_signal_allowed'] is False
          assert lock['status']=='NOT_READY'
          assert 'S3G1J_FINANCIAL_RAW_VALUES' in lock['remaining_unlocked_gates']
          a=evidence['authorization_boundary']
          assert a['candidate_implementation_machine_accepted'] is True
          assert a['candidate_runtime_promotion_authorized'] is False
          assert a['formal_runtime_changed'] is False
          assert a['runtime_authority_changed'] is False
          assert a['production_data_changed'] is False
          assert a['stage4_alpha_live_locked'] is True
          assert a['merge_to_main_authorized'] is False
          print('S3G1J_V17_29_CANDIDATE_GOVERNANCE_BOUNDARY_PASS')
          PY
