name: Stage3 S3G1J V17.29 Cross Page Two Target Safety

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/audit_stage3_s3g1j_cross_page_two_target_safety.py'
      - 'scripts/run_stage3_s3g1j_cross_page_two_target_safety_r2.py'
      - 'tests/test_stage3_v17_29_cross_page_two_target_safety.py'
      - '.github/workflows/stage3-s3g1j-v17-29-cross-page-two-target-safety.yml'

permissions:
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ github.token }}
  PYTHONPATH: scripts
  SOURCE_RUN: '31389854868'
  SOURCE_HEAD: '22fa37064eeb8a49ad5292dd2be48bd7b674c673'
  SOURCE_ARTIFACT_ID: '9063271903'
  SOURCE_ARTIFACT: 'stage3-s3g1j-v17-29-full-final'
  SOURCE_DIGEST: 'sha256:71a4daa6c8372f3d64080b5fa5b787914292d889da7051de699eb6610189c726'

jobs:
  safety:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
      - name: Install verified read-only runtime
        run: python -m pip install --disable-pip-version-check -c requirements/constraints-verified.txt requests pymupdf
      - name: Verify accepted diagnostic evidence and project locks
        run: |
          python - <<'PY'
          import json
          e=json.load(open('governance/stage3_s3g1j_v17_29_six_source_diagnostic.json',encoding='utf-8'))
          r=json.load(open('governance/stage3_s3g1j_runtime_manifest.json',encoding='utf-8'))
          p=json.load(open('data/project_status.json',encoding='utf-8'))
          assert e['diagnostic_pr']['number']==117
          assert e['diagnostic_pr']['closed_without_merge'] is True
          assert e['accepted_run']['run_id']==31450849437
          assert e['classification_result']['cross_page_exact_source_candidate_experiment_eligible_count']==2
          assert [x['announcement_id'] for x in e['cross_page_exact_source_candidates']]==['1223347318','1223407043']
          assert e['classification_result']['candidate_parser_implementation_authorized'] is False
          assert e['classification_result']['candidate_parser_promotion_authorized'] is False
          assert r['formal_runtime']['runtime_generation']=='V17.29'
          assert r['full_basis_last_completed_final']['run']==31389854868
          assert r['full_basis_last_completed_final']['verdict']=='FAIL_CLOSED'
          assert p['stage3']['status']=='NOT_READY'
          assert p['stage4_unlocked'] is False
          assert p['alpha_training_allowed'] is False
          assert p['live_signal_allowed'] is False
          print('CROSS_PAGE_TWO_TARGET_EVIDENCE_BOUNDARY_PASS')
          PY
      - name: Lock exact accepted V17.29 full-basis artifact
        shell: bash
        run: |
          set -euo pipefail
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN")
          test "$(jq -r '.status' <<<"$run")" = completed
          test "$(jq -r '.conclusion' <<<"$run")" = success
          test "$(jq -r '.head_sha' <<<"$run")" = "$SOURCE_HEAD"
          artifact=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$SOURCE_ARTIFACT_ID")
          test "$(jq -r '.name' <<<"$artifact")" = "$SOURCE_ARTIFACT"
          test "$(jq -r '.digest' <<<"$artifact")" = "$SOURCE_DIGEST"
          test "$(jq -r '.expired' <<<"$artifact")" = false
          test "$(jq -r '.workflow_run.id' <<<"$artifact")" = "$SOURCE_RUN"
          test "$(jq -r '.workflow_run.head_sha' <<<"$artifact")" = "$SOURCE_HEAD"
      - name: Run pure fail-closed candidate safety contracts
        run: |
          python -m py_compile scripts/audit_stage3_s3g1j_cross_page_two_target_safety.py
          python -m py_compile scripts/run_stage3_s3g1j_cross_page_two_target_safety_r2.py
          python -m unittest tests.test_stage3_v17_29_cross_page_two_target_safety -v
      - uses: actions/download-artifact@v4
        with:
          name: stage3-s3g1j-v17-29-full-final
          path: source
          repository: FASHI188/data-workbench-r17
          run-id: 31389854868
          github-token: ${{ github.token }}
      - name: Run full-population routing and exact two-PDF candidate safety diagnostic
        shell: bash
        run: |
          set -euo pipefail
          documents=$(find source -name stage3_financial_documents.csv.gz -print -quit)
          test -n "$documents"
          python scripts/run_stage3_s3g1j_cross_page_two_target_safety_r2.py \
            --documents "$documents" \
            --evidence governance/stage3_s3g1j_v17_29_six_source_diagnostic.json \
            --out build/safety/stage3_s3g1j_v17_29_cross_page_two_target_safety.json
      - name: Verify exact bounded routing, recoveries and no promotion authority
        run: |
          python - <<'PY'
          import json
          r=json.load(open('build/safety/stage3_s3g1j_v17_29_cross_page_two_target_safety.json',encoding='utf-8'))
          assert r['gate']=='S3G1J_V17_29_TWO_TARGET_CROSS_PAGE_CANDIDATE_SAFETY_V1'
          routing=r['routing']
          assert routing['input_document_rows']==121354
          assert routing['candidate_route_count']==2
          assert routing['formal_v17_29_delegate_count']==121352
          assert routing['candidate_route_announcement_ids']==['1223347318','1223407043']
          assert routing['residual_source_identity_origin']=='SINGLE_CANDIDATE_EVIDENCE_JSON'
          assert all(x['candidate_tier2_found']==3 for x in routing['candidate_rows'])
          assert all('NO_VALIDATED_BALANCE_SHEET_BLOCK' in x['candidate_validation_errors'] for x in routing['candidate_rows'])
          assert len(r['recoveries'])==2
          for row in r['recoveries']:
              formal=row['formal_v17_29_snapshot']
              candidate=row['candidate_recovery']
              assert formal['tier2_found']==3
              assert 'NO_VALIDATED_BALANCE_SHEET_BLOCK' in formal['validation_errors']
              assert candidate['candidate_only'] is True
              assert candidate['formal_parser_changed'] is False
              assert candidate['runtime_authority_changed'] is False
              assert candidate['production_data_changed'] is False
              assert candidate['candidate_parser_promotion_authorized'] is False
              assert candidate['ocr_used'] is False
              assert candidate['fuzzy_alias_matching_used'] is False
              assert candidate['equity_inferred_as_assets_minus_liabilities'] is False
              assert candidate['accounting_tolerance_relaxed'] is False
              assert set(candidate['observations'])=={'TOTAL_ASSETS','TOTAL_LIABILITIES','TOTAL_EQUITY'}
              assert all(candidate['observations'][c]['status']=='FOUND' for c in candidate['observations'])
              assert all(x['identity_residual_cny']=='0.00' for x in candidate['dual_column_identity']['columns'])
              pattern=candidate['cross_page_pattern']
              assert pattern['equity_amount_page']+1==pattern['suffix_page']
              assert pattern['equity_label_prefix']+pattern['next_page_exact_suffix']=='所有者权益（或股东权益）合计'
          assert all(all(x[k] for k in ('wrong_sha_delegates','wrong_bytes_delegates','wrong_date_delegates')) for x in r['mutation_delegation_checks'])
          assert r['candidate_experiment_pass'] is True
          assert r['candidate_parser_implementation_authorized'] is False
          assert r['candidate_parser_promotion_authorized'] is False
          assert r['formal_parser_changed'] is False
          assert r['runtime_authority_changed'] is False
          assert r['production_data_changed'] is False
          assert r['stage3_status']=='NOT_READY'
          assert r['stage4_alpha_live_locked'] is True
          assert r['main_changed'] is False
          assert r['errors']==[]
          print('CROSS_PAGE_TWO_TARGET_CANDIDATE_SAFETY_PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stage3-s3g1j-v17-29-cross-page-two-target-safety-v1
          path: build/safety/stage3_s3g1j_v17_29_cross_page_two_target_safety.json
          retention-days: 90
          compression-level: 0
