# stage2 identity-repair workflow v2
name: Stage2 G3 Code Identity Repair

# Expensive year rebuilds run only on an explicit trigger commit or manual dispatch.
on:
  workflow_dispatch:
  push:
    branches: [agent/stage2-security-identity-final]
    paths:
      - 'config/g3_identity_repair_trigger.json'

permissions:
  contents: read
  actions: read

jobs:
  repair-szse:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        year: [2015, 2016, 2017, 2018, 2019]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      G2_SOURCE_RUN: '30241666738'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests openpyxl
      - name: Download corrected G2 lifecycle evidence
        run: |
          gh run download "$G2_SOURCE_RUN" -R "$GITHUB_REPOSITORY" -n stage2-g2-historical-evidence -D g2
          cp g2/security_intervals.csv data/security_lifecycle/security_intervals.csv
      - name: Rebuild official SZSE year under corrected code-time identity
        run: python scripts/run_g3_rate_limited.py szse-year --year ${{ matrix.year }} --out build/g3/szse
      - uses: actions/upload-artifact@v4
        with:
          name: g3-identity-szse-${{ matrix.year }}
          path: build/g3/szse
          retention-days: 30
          compression-level: 0

  audit:
    needs: repair-szse
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
      G2_SOURCE_RUN: '30241666738'
      G3_SOURCE_RUN: '30212684512'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests openpyxl
      - name: Download corrected G2 lifecycle evidence
        run: |
          gh run download "$G2_SOURCE_RUN" -R "$GITHUB_REPOSITORY" -n stage2-g2-historical-evidence -D g2
          cp g2/security_intervals.csv data/security_lifecycle/security_intervals.csv
      - name: Download frozen G3 official OHLCV
        run: gh run download "$G3_SOURCE_RUN" -R "$GITHUB_REPOSITORY" -n stage2-g3-official-ohlcv -D frozen-g3
      - uses: actions/download-artifact@v4
        with:
          pattern: g3-identity-szse-*
          path: repaired-years
          merge-multiple: true
      - name: Replace affected SZSE years only
        shell: bash
        run: |
          test -d frozen-g3/build/g3/szse
          for y in 2015 2016 2017 2018 2019; do
            csv=$(find repaired-years -name "szse_${y}.csv.gz" -print -quit)
            meta=$(find repaired-years -name "szse_${y}_sources.json" -print -quit)
            test -n "$csv" && test -n "$meta"
            cp "$csv" "frozen-g3/build/g3/szse/szse_${y}.csv.gz"
            cp "$meta" "frozen-g3/build/g3/szse/szse_${y}_sources.json"
          done
      - name: Full G3 audit with preserved diagnostics
        shell: bash
        run: |
          set +e
          mkdir -p data/ohlcv
          python scripts/audit_g3_ohlcv.py --root frozen-g3/build/g3 --out data/ohlcv > data/ohlcv/g3_audit_stdout.log 2> data/ohlcv/g3_audit_stderr.log
          code=$?
          echo "G3_AUDIT_EXIT=$code" >> "$GITHUB_ENV"
          cat data/ohlcv/g3_audit.json || true
          cat data/ohlcv/g3_audit_stderr.log || true
          exit 0
      - name: Code-time identity hard audit with preserved diagnostics
        shell: bash
        run: |
          set +e
          python scripts/audit_g3_code_identity.py --root frozen-g3/build/g3 --out data/ohlcv > data/ohlcv/g3_identity_stdout.log 2> data/ohlcv/g3_identity_stderr.log
          code=$?
          echo "G3_IDENTITY_EXIT=$code" >> "$GITHUB_ENV"
          cat data/ohlcv/g3_code_identity_audit.json || true
          cat data/ohlcv/g3_identity_stderr.log || true
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: stage2-g3-identity-repaired-ohlcv
          path: |
            frozen-g3/build/g3
            data/ohlcv
          retention-days: 90
          compression-level: 0
      - name: Preserve G3 fail-closed status
        if: env.G3_AUDIT_EXIT != '0' || env.G3_IDENTITY_EXIT != '0'
        run: exit 1
