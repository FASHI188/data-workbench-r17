name: Stage3 Clean S3G1J V17.21 Exact-80 Candidate Safety

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/stage3_financial_spatial_alias_v17_21.py'
      - 'scripts/probe_stage3_s3g1j_v17_21_exact80.py'
      - '.github/workflows/stage3-clean-s3g1j-v17-21-exact-80.yml'

permissions:
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ github.token }}
  FROZEN_RUN: '30424465440'
  FROZEN_HEAD: 'be42608b75f77af13c36620da7e7fa03c563afde'
  FROZEN_ARTIFACT: 'stage3-s3g1j-v15-single-source-input'
  FROZEN_DIGEST: 'sha256:272f52239adc2fc5d4343ec091495dffcd39324b425784cdf5a7491f63a2e6fd'
  V17_18_RUN: '30593361140'
  V17_18_HEAD: '923fe39ea7f1b1a839f4182d717b567cc2bef9dc'
  V17_18_ARTIFACT: 'stage3-s3g1j-v17-18-exact-80-residual-diagnostic'
  V17_18_DIGEST: 'sha256:3713c252f8045c3e8a13133b18ab71c16336f22be636c518503f20b859d75957'
  V17_20_RUN: '30594795380'
  V17_20_HEAD: '6a28ab3b9be7667d85cf22d59e8f96b1a63d947b'
  V17_20_ARTIFACT: 'stage3-s3g1j-v17-20-exact-one-asset-total-geometry'
  V17_20_DIGEST: 'sha256:dfcb18734b1910c2a5fb69405d90e7f8a51cd3fdb3ff00d402a115aed0e53c9e'
  PYTHONPATH: scripts

jobs:
  lock-inputs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Lock exact residual and geometry evidence
        shell: bash
        run: |
          set -euo pipefail
          gh_api_retry() {
            endpoint="$1"
            for attempt in 1 2 3 4 5 6; do
              if output=$(gh api "$endpoint" 2>gh-api-error.log); then
                printf '%s' "$output"
                return 0
              fi
              cat gh-api-error.log >&2 || true
              sleep $((attempt * 15))
            done
            echo "GitHub API retry budget exhausted for $endpoint" >&2
            return 1
          }
          lock_run_artifact() {
            run="$1"; expected_head="$2"; artifact="$3"; expected_digest="$4"
            run_json=$(gh_api_retry "repos/$GITHUB_REPOSITORY/actions/runs/$run")
            conclusion=$(jq -r '.conclusion' <<<"$run_json")
            head=$(jq -r '.head_sha' <<<"$run_json")
            test "$conclusion" = success
            test "$head" = "$expected_head"
            artifact_json=$(gh_api_retry "repos/$GITHUB_REPOSITORY/actions/runs/$run/artifacts")
            actual=$(jq -r --arg artifact "$artifact" '.artifacts[] | select(.name==$artifact) | .digest' <<<"$artifact_json")
            test -n "$actual"
            test "$actual" = "$expected_digest"
          }
          lock_run_artifact "$FROZEN_RUN" "$FROZEN_HEAD" "$FROZEN_ARTIFACT" "$FROZEN_DIGEST"
          lock_run_artifact "$V17_18_RUN" "$V17_18_HEAD" "$V17_18_ARTIFACT" "$V17_18_DIGEST"
          lock_run_artifact "$V17_20_RUN" "$V17_20_HEAD" "$V17_20_ARTIFACT" "$V17_20_DIGEST"

  replay:
    needs: lock-inputs
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 7, 9]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
      - name: Install exact verified runtime dependencies
        run: python -m pip install --disable-pip-version-check --constraint requirements/constraints-verified.txt requests PyMuPDF
      - name: Restore exact current residual inputs
        shell: bash
        run: |
          set -euo pipefail
          download_artifact_retry() {
            run="$1"; artifact="$2"; destination="$3"
            for attempt in 1 2 3 4 5 6; do
              rm -rf "$destination"
              if gh run download "$run" -R "$GITHUB_REPOSITORY" -n "$artifact" -D "$destination" 2>gh-download-error.log; then
                return 0
              fi
              cat gh-download-error.log >&2 || true
              sleep $((attempt * 15))
            done
            echo "GitHub artifact download retry budget exhausted for run=$run artifact=$artifact" >&2
            return 1
          }
          rm -rf prepared v1718 v1720 build/s3g1j-v17-21
          download_artifact_retry "$FROZEN_RUN" "$FROZEN_ARTIFACT" prepared
          download_artifact_retry "$V17_18_RUN" "$V17_18_ARTIFACT" v1718
          download_artifact_retry "$V17_20_RUN" "$V17_20_ARTIFACT" v1720
          test -f prepared/single_source_residual_versions.csv.gz
          test -f v1718/candidate/shard0.json
          test -f v1718/candidate/shard1.json
          test -f v1718/candidate/shard7.json
          test -f v1718/candidate/shard9.json
          test -f v1720/v17_20_exact_one_asset_total_geometry.json
          python - <<'PY'
          import json
          x=json.load(open('v1720/v17_20_exact_one_asset_total_geometry.json',encoding='utf-8'))
          assert x['pass'] is True
          assert x['announcement_id']=='1219311356'
          assert x['exact_asset_total_row']['row_text']=='资产总计'
          assert x['same_row_amount_count']==0
          rows=x['neighbor_amount_rows']
          exact=[r for r in rows if r['offset']==-1]
          assert len(exact)==1
          assert exact[0]['text']=='73,523,417,381.93 64,723,678,252.66'
          assert exact[0]['y_delta']=='-5.87994384765625'
          PY
      - name: Run V17.21 candidate over exact current 80
        shell: bash
        run: |
          set +e
          out="build/s3g1j-v17-21/shard${{ matrix.shard }}.json"
          mkdir -p "$(dirname "$out")"
          python scripts/probe_stage3_s3g1j_v17_21_exact80.py \
            --versions prepared/single_source_residual_versions.csv.gz \
            --v17-18-candidate-root v1718/candidate \
            --shard ${{ matrix.shard }} --shards 64 --out "$out" \
            > "${out%.json}.stdout.log" 2> "${out%.json}.stderr.log"
          code=$?
          echo "REPLAY_EXIT=$code" >> "$GITHUB_ENV"
          cat "${out%.json}.stdout.log" || true
          tail -100 "${out%.json}.stderr.log" || true
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage3-s3g1j-v17-21-exact80-${{ matrix.shard }}
          path: build/s3g1j-v17-21
          retention-days: 90
          compression-level: 0
      - name: Preserve candidate safety failure
        if: env.REPLAY_EXIT != '0'
        run: exit 1

  summarize:
    needs: replay
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: stage3-s3g1j-v17-21-exact80-*
          path: candidate
          merge-multiple: true
      - name: Require exact-one candidate recovery and 79 fail-closed residuals
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import glob,json,os
          paths=sorted(glob.glob('candidate/shard*.json'))
          reports=[json.load(open(path,encoding='utf-8')) for path in paths]
          reports.sort(key=lambda row:row['shard'])
          assert [row['shard'] for row in reports]==[0,1,7,9]
          assert all(row.get('pass') is True for row in reports), [row.get('execution_failures') for row in reports]
          assert sum(row['input_count'] for row in reports)==80
          assert sum(row['processed_count'] for row in reports)==80
          assert sum(row['source_sha_match_count'] for row in reports)==80
          rows=[item for report in reports for item in report['results']]
          assert len(rows)==80
          recovered=sorted(row['announcement_id'] for row in rows if row['candidate_recovered'])
          assert recovered==['1219311356'], recovered
          target=next(row for row in rows if row['announcement_id']=='1219311356')
          diagnostic=target['diagnostic']
          selected=diagnostic['selected']
          assert selected['TOTAL_ASSETS']['alias']=='资产总计'
          assert selected['TOTAL_ASSETS']['reverse_adjacent_asset_total'] is True
          assert selected['TOTAL_ASSETS']['reverse_bridge_y_delta']=='5.87994384765625'
          assert len(selected['TOTAL_ASSETS']['bridge_amount_columns'])==2
          assert selected['TOTAL_ASSETS']['raw_value']=='73523417381.93'
          assert selected['TOTAL_LIABILITIES']['raw_value']=='35828459679.63'
          assert selected['TOTAL_EQUITY']['raw_value']=='37694957702.30'
          assert str(diagnostic['identity']['identity_residual_cny']) in {'0','0.0','0.00'}
          assert diagnostic['column_role_gate']['pass'] is True
          report={
              'gate':'S3G1J_V17_21_EXACT_80_CANDIDATE_SAFETY',
              'pass':True,
              'candidate_only':True,
              'production_parser_changed':False,
              'input_count':80,
              'source_sha_match_count':80,
              'candidate_recovered_count':1,
              'candidate_recovered_announcement_ids':recovered,
              'remaining_fail_closed_count':79,
              'accounting_tolerance':'0.005',
              'accounting_tolerance_changed':False,
              'global_row_tolerance_changed':False,
              'reverse_asset_y_window':'5.50 <= delta <= 6.25',
              'reverse_asset_amount_column_count':2,
              'e_equals_a_minus_l_inference':False,
              'source_policy_changed':False,
              'stage4_alpha_locked':True,
              'per_shard':[
                  {key:row[key] for key in ('shard','input_count','processed_count','source_sha_match_count','candidate_recovered_announcement_ids')}
                  for row in reports
              ],
              'target_result':target,
              'errors':[],
          }
          os.makedirs('summary',exist_ok=True)
          json.dump(report,open('summary/s3g1j_v17_21_exact_80_candidate_safety.json','w',encoding='utf-8'),ensure_ascii=False,indent=2)
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage3-s3g1j-v17-21-exact-80-candidate-safety
          path: |
            summary
            candidate
          retention-days: 90
          compression-level: 0
