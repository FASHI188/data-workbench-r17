name: Stage4 Alpha V1 OOS Label Completion Repair Acceptance V1.1

on:
  pull_request:
    branches:
      - agent/stage3-clean-integration
    paths:
      - '.github/workflows/stage4-alpha-v1-oos-label-completion-repair-acceptance-v1-1.yml'
      - 'governance/accepted_project_state.json'
      - 'governance/stage4_alpha_v1_oos_label_completion_implementation_repair_acceptance_v1_1.json'
      - 'scripts/audit_stage4_alpha_v1_oos_label_completion_implementation_repair_acceptance_v1_1.py'

permissions:
  contents: read

jobs:
  static-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Detect V1.2 terminal result
        id: result_v12
        shell: bash
        run: |
          if test -f governance/stage4_alpha_v1_oos_label_completion_result_v1_2.json; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify V1.2 terminal result successor
        if: steps.result_v12.outputs.present == 'true'
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          e=json.loads(Path('governance/stage4_alpha_v1_oos_label_completion_result_v1_2.json').read_text())
          s=json.loads(Path('governance/accepted_project_state.json').read_text())
          b=e['fingerprint_basis']
          assert e['fingerprint']=='12ab8b1386bf6d3dfe59ab5d0e354736bfc90846f1aeb1e9f6983ab0d2c37d4b'
          assert e['status']=='ALPHA_FAIL_RUNTIME_VETO_INCOMPLETE_NO_PROMOTION_AUTHORIZATION_CONSUMED'
          assert b['authorization']['consumed'] is True and b['authorization']['reusable'] is False
          assert b['alpha']['evaluated'] is True and b['alpha']['status']=='FAIL'
          assert b['runtime_veto']['evaluated'] is False
          assert b['disposition']['combined_promotion_status']=='NO_PROMOTION_ALPHA_FAIL_FAIL_CLOSED'
          assert s['permissions']['oos_label_access_allowed'] is False
          assert s['permissions']['oos_label_bearing_execution_runs_remaining']==0
          PY


      - name: Detect V1.2 armed successor
        id: armed_v12
        shell: bash
        run: |
          if test -f governance/stage4_alpha_v1_oos_label_completion_authorization_v1_2.json; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify V1.2 armed successor
        if: steps.armed_v12.outputs.present == 'true' && steps.result_v12.outputs.present != 'true'
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('governance/stage4_alpha_v1_oos_label_completion_authorization_v1_2.json').read_text())
          s=json.loads(Path('governance/accepted_project_state.json').read_text())
          assert a['fingerprint']=='0a7c2e5ed7777bc84ad4db22b91c5e84da5dc819a186d743d19bb603b158f10a'
          assert a['status']=='AUTHORIZED_SINGLE_USE_OOS_LABEL_COMPLETION_V1'
          assert a['fingerprint_basis']['authorization_armed'] is True
          assert a['fingerprint_basis']['armed_runs_remaining']==1
          assert s['permissions']['oos_execution_pr_creation_allowed'] is False
          assert s['permissions']['oos_label_access_allowed'] is False
          assert s['permissions']['oos_label_bearing_execution_runs_remaining']==1
          PY
      - name: Detect V1.2 reservation successor
        id: reservation
        shell: bash
        run: |
          if test -f governance/stage4_alpha_v1_oos_label_completion_authorization_reservation_v1_2.json; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify V1.2 reservation handoff
        if: steps.reservation.outputs.present == 'true' && steps.armed_v12.outputs.present != 'true'
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('governance/stage4_alpha_v1_oos_label_completion_authorization_reservation_v1_2.json').read_text())
          a=json.loads(Path('governance/stage4_alpha_v1_oos_label_completion_implementation_repair_acceptance_v1_1.json').read_text())
          s=json.loads(Path('governance/accepted_project_state.json').read_text())
          assert r['fingerprint']=='f038c7857da733207be7cb9c3df76bd0e189054b6763b3d3c70aca017afda889'
          assert r['fingerprint_basis']['repair_implementation_acceptance_fingerprint']==a['fingerprint']=='1b6e05dd16911f9234c1ed4ee19918d30c37943dbb4be6b6490adb24b099849b'
          assert r['fingerprint_basis']['authorization_armed'] is False
          assert r['fingerprint_basis']['armed_runs_remaining']==0
          assert s['permissions']['oos_execution_pr_creation_allowed'] is True
          assert s['permissions']['oos_label_access_allowed'] is False
          assert s['permissions']['oos_label_bearing_execution_runs_remaining']==0
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
      - name: Audit repair acceptance
        if: steps.reservation.outputs.present != 'true'
        run: python scripts/audit_stage4_alpha_v1_oos_label_completion_implementation_repair_acceptance_v1_1.py
      - name: Prove acceptance PR is governance-only
        shell: bash
        run: |
          set -euo pipefail
          test ! -e build/oos
          test ! -e build/model
          ! grep -n -E 'download-artifact|curl|wget|gh[[:space:]]+api|read_parquet\(' .github/workflows/stage4-alpha-v1-oos-label-completion-repair-acceptance-v1-1.yml | grep -v 'grep -n -E'
      - name: Prove exact acceptance scope
        if: steps.reservation.outputs.present != 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only "$BASE_SHA" HEAD | sort > /tmp/changed.txt
          cat > /tmp/expected.txt <<'EOF'
          .github/workflows/stage4-alpha-v1-oos-label-completion-repair-acceptance-v1-1.yml
          governance/accepted_project_state.json
          governance/stage4_alpha_v1_oos_label_completion_implementation_repair_acceptance_v1_1.json
          scripts/audit_stage4_alpha_v1_oos_label_completion_implementation_repair_acceptance_v1_1.py
          EOF
          sort -o /tmp/expected.txt /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/changed.txt
