name: Repository Safety Audit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'scripts/audit_repository_safety.py'
      - '.env*'
      - '**/*.pem'
      - '**/*.p12'
      - '**/*.pfx'
      - '**/*.key'
      - 'README.md'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
      - name: Scan workflows and public repository exposure
        id: safety
        shell: bash
        run: |
          set +e
          python scripts/audit_repository_safety.py \
            --out build/repository-safety/repository_safety_audit.json \
            > build_repository_safety_stdout.log \
            2> build_repository_safety_stderr.log
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          cat build_repository_safety_stdout.log || true
          cat build_repository_safety_stderr.log || true
          exit 0
      - name: Upload redacted safety evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repository-safety-audit
          path: |
            build/repository-safety/repository_safety_audit.json
            build_repository_safety_stdout.log
            build_repository_safety_stderr.log
          retention-days: 90
      - name: Preserve fail-closed repository safety status
        if: steps.safety.outputs.exit_code != '0'
        run: exit 1
