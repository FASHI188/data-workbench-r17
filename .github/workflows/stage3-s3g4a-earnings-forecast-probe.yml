name: Stage3 S3G4A Earnings Forecast Parser Probe

on:
  workflow_dispatch:
  pull_request:
    branches: [stage3-point-in-time-features]
    paths:
      - 'scripts/stage3_earnings_forecast_parser.py'
      - 'scripts/probe_stage3_earnings_forecast_parser.py'
      - '.github/workflows/stage3-s3g4a-earnings-forecast-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests pymupdf
      - name: Verify official earnings forecast range extraction
        shell: bash
        run: |
          set +e
          mkdir -p data/stage3_source_probe
          python scripts/probe_stage3_earnings_forecast_parser.py \
            > data/stage3_source_probe/forecast_stdout.log \
            2> data/stage3_source_probe/forecast_stderr.log
          code=$?
          echo "S3G4A_EXIT=$code" >> "$GITHUB_ENV"
          cat data/stage3_source_probe/earnings_forecast_parser_probe.json || true
          cat data/stage3_source_probe/forecast_stderr.log || true
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: stage3-s3g4a-earnings-forecast-parser-probe
          path: data/stage3_source_probe
          retention-days: 90
      - name: Preserve fail-closed forecast-parser status
        if: env.S3G4A_EXIT != '0'
        run: exit 1
