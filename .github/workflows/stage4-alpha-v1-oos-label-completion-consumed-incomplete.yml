name: Stage4 Alpha V1 OOS Label Completion Consumed-Incomplete Acceptance

on:
  pull_request:
    branches:
      - agent/stage3-clean-integration
    paths:
      - '.github/workflows/stage4-alpha-v1-oos-label-completion-consumed-incomplete.yml'
      - '.github/workflows/stage4-alpha-v1-oos-label-completion-authorization.yml'
      - 'governance/accepted_project_state.json'
      - 'governance/project_module_index.json'
      - 'governance/stage4_alpha_v1_oos_label_completion_consumed_incomplete_evidence.json'
      - 'scripts/audit_stage4_alpha_v1_oos_label_completion_consumed_incomplete.py'

permissions:
  contents: read

jobs:
  governance-closure:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Detect accepted V1.4 preregistration successor
        id: v14
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('governance/stage4_alpha_v1_oos_label_completion_preregistration_v1_4_supersession.json')
          s=json.loads(Path('governance/accepted_project_state.json').read_text())
          accepted = p.is_file() and s.get('accepted_progress',{}).get('oos_label_completion_prereg_v1_4') == 'MERGED_ACCEPTED_PR171_FP_E6F6FAC8_NO_NEW_AUTHORITY'
          print('accepted=' + ('true' if accepted else 'false'))
          with open(Path(__import__('os').environ['GITHUB_OUTPUT']),'a',encoding='utf-8') as out:
              out.write('accepted=' + ('true' if accepted else 'false') + '\n')
          if accepted:
              d=json.loads(p.read_text())
              assert d['fingerprint']=='e6f6fac81f6f1b3394b84a93bb5f41c67782b2e7dae9f6e37f7aa8eb11e29394'
              assert d['status']=='FROZEN_SUPERSEDING_PREREGISTRATION_V1_4_NO_OOS_ACCESS_NO_NEW_AUTHORITY'
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
      - name: Audit consumed-incomplete evidence and closed state
        run: python scripts/audit_stage4_alpha_v1_oos_label_completion_consumed_incomplete.py
      - name: Prove no OOS execution in governance closure
        shell: bash
        run: |
          set -euo pipefail
          test ! -e build/oos
          test ! -e build/out
          ! grep -n -E 'download-artifact|curl|wget|gh[[:space:]]+api|workflow_dispatch|run_stage4_alpha_v1_oos_label_completion.py[[:space:]]+--authorization' .github/workflows/stage4-alpha-v1-oos-label-completion-consumed-incomplete.yml | grep -v 'grep -n -E'
      - name: Prove exact PR scope
        if: steps.v14.outputs.accepted != 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only "$BASE_SHA" HEAD | sort > /tmp/changed.txt
          cat > /tmp/expected.txt <<'EOF'
          .github/workflows/stage4-alpha-v1-oos-label-completion-authorization.yml
          .github/workflows/stage4-alpha-v1-oos-label-completion-consumed-incomplete.yml
          governance/accepted_project_state.json
          governance/project_module_index.json
          governance/stage4_alpha_v1_oos_label_completion_consumed_incomplete_evidence.json
          scripts/audit_stage4_alpha_v1_oos_label_completion_consumed_incomplete.py
          EOF
          sort -o /tmp/expected.txt /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/changed.txt
      - name: Prove frozen execution and implementation remain untouched
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          forbidden="$(git diff --name-only "$BASE_SHA" HEAD -- \
            .github/workflows/stage4-alpha-v1-oos-label-completion-execution.yml \
            governance/stage4_alpha_v1_oos_label_completion_execution_contract_v1.json \
            governance/stage4_alpha_v1_oos_label_completion_authorization_v1.json \
            scripts/run_stage4_alpha_v1_oos_label_completion_execution_carrier_v1.py \
            scripts/run_stage4_alpha_v1_oos_label_completion.py \
            scripts/stage4_alpha_v1_label_materialization.py \
            scripts/stage4_alpha_v1_alpha_evaluation.py \
            governance/stage4_alpha_v1_oos_validation_consumed_incomplete_evidence.json \
            data/stage2_final data/stage3_final models)"
          test -z "$forbidden"
