name: Stage3 S3G1J Identity Arbitration V13

on:
  pull_request:
    branches: [stage3-s3g1j-source-selection-v12]
    paths:
      - '.github/workflows/stage3-s3g1j-identity-arbitration-v13.yml'
      - 'scripts/stage3_financial_pdf_parser_v8.py'
      - 'scripts/extract_stage3_financial_pdf_values_v8.py'
      - 'scripts/probe_stage3_s3g1j_parser_identity_v13.py'
      - 'scripts/probe_stage3_s3g1j_v13_selected_sources.py'
      - 'scripts/probe_stage3_s3g1j_v13_recovery_48.py'
      - 'tests/test_stage3_financial_pdf_parser_v13.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  validate-v13:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      FILING_LEDGER_RUN: '30265340486'
      PYTHONPATH: scripts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests pymupdf

      - name: Re-run V11 grammar regressions
        run: python -m unittest tests.test_stage3_financial_pdf_parser_v11 -v
      - name: Run V13 identity-arbitration unit regressions
        run: python -m unittest tests.test_stage3_financial_pdf_parser_v13 -v
      - name: Run exact five-PDF V13 regression
        run: python scripts/probe_stage3_s3g1j_parser_identity_v13.py

      - name: Restore frozen successful S3G1E filing ledger
        run: |
          rm -rf filing-ledger
          gh run download "$FILING_LEDGER_RUN" -R "$GITHUB_REPOSITORY" \
            -n stage3-s3g1e-periodic-filing-ledger-final -D filing-ledger
          test -f filing-ledger/stage3_periodic_filing_ledger.csv.gz
      - name: Rebuild frozen baseline S3G1G selector
        run: |
          mkdir -p data/stage3_source_selection_v13/baseline
          python scripts/select_stage3_financial_report_versions.py \
            --ledger filing-ledger/stage3_periodic_filing_ledger.csv.gz \
            --out data/stage3_source_selection_v13/baseline
      - name: Run V12.1 full-statement-aware selector
        run: |
          mkdir -p data/stage3_source_selection_v13/v3
          python scripts/select_stage3_financial_report_versions_v3_1.py \
            --ledger filing-ledger/stage3_periodic_filing_ledger.csv.gz \
            --out data/stage3_source_selection_v13/v3
      - name: Compare source selection with frozen baseline
        run: |
          python scripts/compare_stage3_financial_report_versions_v3.py \
            --baseline data/stage3_source_selection_v13/baseline/stage3_financial_report_versions.csv.gz \
            --v3 data/stage3_source_selection_v13/v3/stage3_financial_report_versions_v3.csv.gz \
            --v3-audit data/stage3_source_selection_v13/v3/stage3_financial_report_versions_v3_audit.json \
            --out data/stage3_source_selection_v13/source_selection_diff.json
      - name: Preserve partial-body PIT publication moments
        run: |
          python scripts/build_stage3_partial_body_ledger_v12.py \
            --ledger filing-ledger/stage3_periodic_filing_ledger.csv.gz \
            --full-versions data/stage3_source_selection_v13/v3/stage3_financial_report_versions_v3.csv.gz \
            --out-dir data/stage3_source_selection_v13/partial_body
      - name: Probe five corrected source selections through V13
        run: |
          python scripts/probe_stage3_s3g1j_v13_selected_sources.py \
            --versions data/stage3_source_selection_v13/v3/stage3_financial_report_versions_v3.csv.gz \
            --out data/stage3_source_selection_v13/selected_source_pdf_probe.json
      - name: Measure V12.1 plus V13 recovery on the same 48 failures
        run: |
          python scripts/probe_stage3_s3g1j_v13_recovery_48.py \
            --ledger filing-ledger/stage3_periodic_filing_ledger.csv.gz \
            --versions data/stage3_source_selection_v13/v3/stage3_financial_report_versions_v3.csv.gz \
            --samples config/stage3_s3g1j_v10_diagnostic_samples.json \
            --out data/stage3_source_selection_v13/combined_recovery_48.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage3-s3g1j-identity-arbitration-v13
          path: |
            data/stage3_source_selection_v13/
            data/stage3_source_probe_v11/
          retention-days: 90
          compression-level: 0
