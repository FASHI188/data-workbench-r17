name: Stage3 Authority Map Audit
# Runtime authority and completed full-basis authority are verified separately.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'governance/stage3_authority_map.json'
      - 'governance/stage3_s3g1j_runtime_manifest.json'
      - 'governance/stage3_s3g1j_v17_28_full_final.json'
      - 'governance/stage3_s3g1j_v17_29_runtime_promotion.json'
      - 'config/stage3_final_lock.json'
      - 'data/project_status.json'
      - 'scripts/audit_stage3_authority_map.py'
      - '.github/workflows/stage3-authority-map-audit.yml'

permissions:
  contents: read
  actions: read
  pull-requests: read

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Record integration tree identity
        run: echo "INTEGRATION_TREE_SHA=$(git rev-parse HEAD^{tree})"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
      - name: Validate static authority state
        run: python scripts/audit_stage3_authority_map.py
      - name: Verify authoritative and retained PR heads
        shell: bash
        run: |
          set -euo pipefail
          verify_pr() {
            pr="$1"; expected="$2"
            actual=$(gh pr view "$pr" -R "$GITHUB_REPOSITORY" --json headRefOid --jq '.headRefOid')
            test "$actual" = "$expected"
          }
          verify_pr 109 04a014f852bff57aef57542553864fcd3f1df13d
          verify_pr 94 6969c58ee60314e3e897e55b132266612c602777
          verify_pr 96 7dd3e14ccdd9574ce7f4a8f716026ececf254541
          verify_pr 97 611d402c3b61a35644a27fd33d3955b9976dec7c
          verify_pr 40 1ac525aa0b56cd39b233e5c2da9e44d3707c55cb
          verify_pr 35 40dcab6df468bbf2d47dd48ac77ea150190c279b
      - name: Verify accepted V17.29 runtime-wrapper evidence
        shell: bash
        run: |
          set -euo pipefail
          pr=$(gh pr view 109 -R "$GITHUB_REPOSITORY" --json state,mergedAt)
          test "$(jq -r '.state' <<<"$pr")" = CLOSED
          test "$(jq -r '.mergedAt // ""' <<<"$pr")" = ""
          run=31312709490
          expected_head=04a014f852bff57aef57542553864fcd3f1df13d
          artifact=stage3-s3g1j-v17-29-runtime-wrapper
          expected_digest=sha256:4f9940513c2d0ef5250b8874b32f68655badfe4a695a2fe2c3da0a54d2a01670
          payload=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run")
          test "$(jq -r '.status' <<<"$payload")" = completed
          test "$(jq -r '.conclusion' <<<"$payload")" = success
          test "$(jq -r '.head_sha' <<<"$payload")" = "$expected_head"
          artifacts=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/artifacts?per_page=100")
          test "$(jq -r --arg name "$artifact" '[.artifacts[]|select(.name==$name)]|length' <<<"$artifacts")" = 1
          test "$(jq -r --arg name "$artifact" '.artifacts[]|select(.name==$name)|.id' <<<"$artifacts")" = 9037869497
          test "$(jq -r --arg name "$artifact" '.artifacts[]|select(.name==$name)|.digest' <<<"$artifacts")" = "$expected_digest"
          test "$(jq -r --arg name "$artifact" '.artifacts[]|select(.name==$name)|.expired' <<<"$artifacts")" = false
      - name: Verify retained V17.28 completed full-basis evidence
        shell: bash
        run: |
          set -euo pipefail
          run=30997260730
          expected_head=611d402c3b61a35644a27fd33d3955b9976dec7c
          artifact=stage3-s3g1j-v17-28-full-final
          expected_digest=sha256:82375169faada969ceafd4356ab0a2707aa14592d5db090c5d3910863d571c8b
          payload=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run")
          test "$(jq -r '.conclusion' <<<"$payload")" = success
          test "$(jq -r '.head_sha' <<<"$payload")" = "$expected_head"
          artifacts=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/artifacts?per_page=100")
          test "$(jq -r --arg name "$artifact" '[.artifacts[] | select(.name==$name)] | length' <<<"$artifacts")" = 1
          test "$(jq -r --arg name "$artifact" '.artifacts[] | select(.name==$name) | .id' <<<"$artifacts")" = 8927455692
          test "$(jq -r --arg name "$artifact" '.artifacts[] | select(.name==$name) | .digest' <<<"$artifacts")" = "$expected_digest"
          test "$(jq -r --arg name "$artifact" '.artifacts[] | select(.name==$name) | .workflow_run.head_sha' <<<"$artifacts")" = "$expected_head"
          test "$(jq -r --arg name "$artifact" '.artifacts[] | select(.name==$name) | .expired' <<<"$artifacts")" = false
      - name: Verify retained upstream evidence runs
        shell: bash
        run: |
          set -euo pipefail
          verify_run() {
            run="$1"; artifact="$2"; digest="$3"
            conclusion=$(gh run view "$run" -R "$GITHUB_REPOSITORY" --json conclusion --jq '.conclusion')
            test "$conclusion" = success
            actual=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/artifacts" --jq ".artifacts[] | select(.name==\"$artifact\") | .digest")
            test "$actual" = "$digest"
          }
          verify_run 30806818977 stage3-s3g1j-v17-27-full-final sha256:410e257d7a3ada353926970f806abc3e970e5638f55c1dec7b47c71c57777721
          verify_run 30331243641 stage3-s3g3b-industry-classification-ledger sha256:f1da814c71fa698f3f10ce5dc7019bb86770f9d4e15ed7d7823a93a085adc872
          verify_run 30326328965 stage3-s3g1i-financial-pdf-population-probe sha256:3883eb629aaa0325cd1db6d3a1eefc96929c9673711bb3c004217ac6254324b9
          verify_run 30326328969 stage3-s3g3a-capco-industry-history-probe sha256:a635409dbab2fdc61852432acfcb294f97b4468831f23a9fa01320abf39ba9af
          verify_run 30326328970 stage3-s3g4a-earnings-forecast-parser-probe sha256:5384aed1c81782571486d32053b343218bb06a0aa45f1540faa4e619dd7d9ad4
          verify_run 30326328975 stage3-s3gu-trading-universe-policy sha256:1942c9e7baa0823772201cc1f6652e660d8b4b60dd8b0559d94dcefe7da4c9fa
      - name: Verify deterministic S3G2 semantic evidence
        shell: bash
        run: |
          set -euo pipefail
          run=30522392946
          expected_head=a71334cfb1221fd22329211b1272cab51128c4af
          expected_ledger=0eb139572865628283f86c981990e59e076d5ef2a978a5967aace90d553e30dd
          conclusion=$(gh run view "$run" -R "$GITHUB_REPOSITORY" --json conclusion --jq '.conclusion')
          headsha=$(gh run view "$run" -R "$GITHUB_REPOSITORY" --json headSha --jq '.headSha')
          test "$conclusion" = success
          test "$headsha" = "$expected_head"
          count=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/artifacts" --jq '[.artifacts[] | select(.name=="stage3-s3g2-announcement-ledger-final")] | length')
          test "$count" -ge 2
          gh run view "$run" -R "$GITHUB_REPOSITORY" --log > /tmp/s3g2-run.log
          grep -Fq "\"ledger_sha256\": \"$expected_ledger\"" /tmp/s3g2-run.log
          grep -Fq '"gzip_header_mtime": 0' /tmp/s3g2-run.log
          grep -Fq '"errors": []' /tmp/s3g2-run.log
      - name: Assert V17.29 runtime does not masquerade as completed full basis
        run: |
          python - <<'PY'
          import json
          lock=json.load(open('config/stage3_final_lock.json',encoding='utf-8'))
          authority=json.load(open('governance/stage3_authority_map.json',encoding='utf-8'))
          project=json.load(open('data/project_status.json',encoding='utf-8'))
          runtime=json.load(open('governance/stage3_s3g1j_runtime_manifest.json',encoding='utf-8'))
          g1j=lock['required_gates']['S3G1J_FINANCIAL_RAW_VALUES']
          assert g1j['formal_runtime_generation']=='V17.29'
          assert g1j['runtime_wrapper_run_id']==31312709490
          assert g1j['last_completed_full_basis_generation']=='V17.28'
          assert g1j['run_id']==30997260730
          assert g1j['artifact_id']==8927455692
          assert g1j['execution_pass'] is True
          assert g1j['document_non_regression_pass'] is True
          assert g1j['numeric_non_regression_pass'] is True
          assert g1j['data_verdict']=='FAIL_CLOSED'
          assert g1j['final_gate_pass'] is False
          assert g1j['document_error_count']==1371
          assert g1j['unresolved_tie_count']==1288
          assert g1j['next_full_basis_generation']=='V17.29'
          assert g1j['next_full_basis_status']=='REQUIRED_NOT_STARTED'
          assert g1j['expected_next_numeric_observation_count']==1051820
          assert g1j['expected_next_document_error_count']==1364
          assert g1j['expected_next_unresolved_tie_count']==1281
          assert g1j['expected_values_are_not_production_acceptance'] is True
          assert runtime['current_production_authority']['generation']=='V17.29'
          assert runtime['current_production_authority']['full_basis_evidence_manifest'] is None
          assert runtime['full_basis_last_completed_final']['generation']=='V17.28'
          assert runtime['next_full_basis_required']['status']=='REQUIRED_NOT_STARTED'
          assert lock['required_gates']['S3G4_EARNINGS_SURPRISE']['run_id'] is None
          assert set(lock['remaining_unlocked_gates'])=={'S3G1J_FINANCIAL_RAW_VALUES','S3G4_EARNINGS_SURPRISE'}
          assert authority['authoritative_components']['S3G1J_FINANCIAL_RAW_VALUES']['final_gate'] is False
          assert project['stage3']['s3g1j']['final_gate_pass'] is False
          assert lock['status']=='NOT_READY'
          assert project['stage4_unlocked'] is False
          assert project['alpha_training_allowed'] is False
          assert project['live_signal_allowed'] is False
          print('STAGE3_LOCKED_WITH_V17_29_RUNTIME_V17_28_LAST_BASIS_FAIL_CLOSED')
          PY
