name: Stage3 Authority Map Audit
# Runtime authority and last completed full-basis authority are intentionally verified separately.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'governance/stage3_authority_map.json'
      - 'governance/stage3_s3g1j_runtime_manifest.json'
      - 'governance/stage3_workflow_activation_manifest.json'
      - 'governance/stage3_s3g1j_v17_30_runtime_promotion.json'
      - 'governance/stage3_s3g1j_v17_30_runtime_wrapper_acceptance.json'
      - 'governance/stage3_s3g1j_v17_29_full_final.json'
      - 'governance/stage3_s3g1j_v17_28_full_final.json'
      - 'config/stage3_final_lock.json'
      - 'data/project_status.json'
      - 'scripts/audit_stage3_authority_map.py'
      - '.github/workflows/stage3-authority-map-audit.yml'

permissions:
  contents: read
  actions: read
  pull-requests: read

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
      - name: Validate static split authority state
        run: python scripts/audit_stage3_authority_map.py
      - name: Verify accepted V17.30 wrapper PR and artifact
        shell: bash
        run: |
          set -euo pipefail
          pr=$(gh api "repos/$GITHUB_REPOSITORY/pulls/123")
          test "$(jq -r '.state' <<<"$pr")" = closed
          test "$(jq -r '.merged' <<<"$pr")" = false
          test "$(jq -r '.head.sha' <<<"$pr")" = d26d7f543c20d717ed8c8a421e28838feecd7a03
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/31458469699")
          test "$(jq -r '.status' <<<"$run")" = completed
          test "$(jq -r '.conclusion' <<<"$run")" = success
          test "$(jq -r '.head_sha' <<<"$run")" = d26d7f543c20d717ed8c8a421e28838feecd7a03
          artifact=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/9088925988")
          test "$(jq -r '.name' <<<"$artifact")" = stage3-s3g1j-v17-30-inactive-runtime-wrapper
          test "$(jq -r '.digest' <<<"$artifact")" = sha256:232b2e4a6c64b271193853d4e8fd32c0fdfd367344ecec720902fe8f090333dc
          test "$(jq -r '.expired' <<<"$artifact")" = false
      - name: Verify V17.30 wrapper evidence registration PR
        shell: bash
        run: |
          set -euo pipefail
          pr=$(gh api "repos/$GITHUB_REPOSITORY/pulls/124")
          test "$(jq -r '.merged' <<<"$pr")" = true
          test "$(jq -r '.head.sha' <<<"$pr")" = e01b4e1673f5a95497b8159c1f3203345bc58e2d
          test "$(jq -r '.merge_commit_sha' <<<"$pr")" = d8c27bc9de5802572366de6b38256a47628a637e
      - name: Verify V17.29 remains last completed full-basis evidence
        shell: bash
        run: |
          set -euo pipefail
          acceptance=$(gh api "repos/$GITHUB_REPOSITORY/pulls/112")
          test "$(jq -r '.merged' <<<"$acceptance")" = true
          test "$(jq -r '.head.sha' <<<"$acceptance")" = 22fa37064eeb8a49ad5292dd2be48bd7b674c673
          source=$(gh api "repos/$GITHUB_REPOSITORY/pulls/113")
          test "$(jq -r '.state' <<<"$source")" = closed
          test "$(jq -r '.merged' <<<"$source")" = false
          test "$(jq -r '.head.sha' <<<"$source")" = 2b48694391e2a6cdbd6972b68844c1253b3c55d9
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/31389854868")
          test "$(jq -r '.status' <<<"$run")" = completed
          test "$(jq -r '.conclusion' <<<"$run")" = success
          test "$(jq -r '.head_sha' <<<"$run")" = 22fa37064eeb8a49ad5292dd2be48bd7b674c673
          artifact=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/9063271903")
          test "$(jq -r '.name' <<<"$artifact")" = stage3-s3g1j-v17-29-full-final
          test "$(jq -r '.digest' <<<"$artifact")" = sha256:71a4daa6c8372f3d64080b5fa5b787914292d889da7051de699eb6610189c726
          test "$(jq -r '.expired' <<<"$artifact")" = false
      - name: Verify retained V17.28 V17.27 upstream evidence
        shell: bash
        run: |
          set -euo pipefail
          verify_artifact() {
            run="$1"; id="$2"; name="$3"; digest="$4"
            payload=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run")
            test "$(jq -r '.conclusion' <<<"$payload")" = success
            artifact=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id")
            test "$(jq -r '.name' <<<"$artifact")" = "$name"
            test "$(jq -r '.digest' <<<"$artifact")" = "$digest"
            test "$(jq -r '.expired' <<<"$artifact")" = false
          }
          verify_artifact 30997260730 8927455692 stage3-s3g1j-v17-28-full-final sha256:82375169faada969ceafd4356ab0a2707aa14592d5db090c5d3910863d571c8b
          verify_artifact 30806818977 8854139999 stage3-s3g1j-v17-27-full-final sha256:410e257d7a3ada353926970f806abc3e970e5638f55c1dec7b47c71c57777721
      - name: Assert Stage3 remains locked
        run: |
          python - <<'PY'
          import json
          lock=json.load(open('config/stage3_final_lock.json',encoding='utf-8'))
          project=json.load(open('data/project_status.json',encoding='utf-8'))
          runtime=json.load(open('governance/stage3_s3g1j_runtime_manifest.json',encoding='utf-8'))
          assert runtime['formal_runtime']['runtime_generation']=='V17.30'
          assert runtime['full_basis_last_completed_final']['generation']=='V17.29'
          assert runtime['next_full_basis_required']['generation']=='V17.30'
          assert runtime['next_full_basis_required']['status']=='REQUIRED_NOT_STARTED'
          assert runtime['next_full_basis_required']['expected_values_are_not_production_acceptance'] is True
          assert lock['status']=='NOT_READY'
          assert set(lock['remaining_unlocked_gates'])=={'S3G1J_FINANCIAL_RAW_VALUES','S3G4_EARNINGS_SURPRISE'}
          assert project['stage3']['status']=='NOT_READY'
          assert project['stage4_unlocked'] is False
          assert project['alpha_training_allowed'] is False
          assert project['live_signal_allowed'] is False
          print('STAGE3_LOCKED_WITH_V17_30_RUNTIME_AND_V17_29_LAST_COMPLETED_BASIS')
          PY
