name: Stage3 Clean S3G1J V17.15 Adjacent Bridge Experiment

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/stage3_financial_spatial_alias_v17_15.py'
      - 'scripts/probe_stage3_s3g1j_v17_15_adjacent_bridge.py'
      - 'tests/test_stage3_v17_15_adjacent_bridge.py'
      - '.github/workflows/stage3-clean-s3g1j-v17-15-adjacent-bridge.yml'

permissions:
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ github.token }}
  FROZEN_RUN: '30424465440'
  FROZEN_HEAD: 'be42608b75f77af13c36620da7e7fa03c563afde'
  FROZEN_ARTIFACT: 'stage3-s3g1j-v15-single-source-input'
  FROZEN_DIGEST: 'sha256:272f52239adc2fc5d4343ec091495dffcd39324b425784cdf5a7491f63a2e6fd'
  FUNNEL_RUN: '30510970624'
  FUNNEL_HEAD: '9cb89a57e0e31a6e64957b7aa2cb1eb167120d59'
  FUNNEL_ARTIFACT: 'stage3-s3g1j-v17-12-residual-funnel-summary'
  FUNNEL_DIGEST: 'sha256:e4b7e81ade313c9629bdb40d750506142f6fff64e50d416ddae2fbae401018a8'
  PYTHONPATH: scripts

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
      - name: Install exact verified experimental dependencies
        run: python -m pip install --disable-pip-version-check --constraint requirements/constraints-verified.txt requests PyMuPDF pytest
      - name: Run narrow bridge unit and inherited column contracts
        run: |
          python -m unittest \
            tests.test_stage3_v17_15_adjacent_bridge \
            tests.test_stage3_v17_column_evidence \
            tests.test_stage3_v17_explicit_dual_evidence \
            tests.test_stage3_v16_contextual_parser \
            -v
      - name: Assert invariant constants remain narrow
        run: |
          python - <<'PY'
          from decimal import Decimal
          import stage3_financial_spatial_alias_v17_15 as x
          import stage3_financial_spatial_alias_v16 as old
          assert x.BRIDGE_MIN_Y_DELTA == Decimal('2.8')
          assert x.BRIDGE_MAX_Y_DELTA == Decimal('3.25')
          assert old.IDENTITY_TOLERANCE == Decimal('0.005')
          print('V17_15_NARROW_INVARIANTS_PASS')
          PY

  lock-inputs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lock exact frozen versions and accepted V17.12 funnel
        shell: bash
        run: |
          set -euo pipefail
          lock_run_artifact() {
            run="$1"; expected_head="$2"; artifact="$3"; expected_digest="$4"
            test "$(gh run view "$run" -R "$GITHUB_REPOSITORY" --json conclusion --jq '.conclusion')" = success
            test "$(gh run view "$run" -R "$GITHUB_REPOSITORY" --json headSha --jq '.headSha')" = "$expected_head"
            actual=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/artifacts" --jq ".artifacts[] | select(.name==\"$artifact\") | .digest")
            test "$actual" = "$expected_digest"
          }
          lock_run_artifact "$FROZEN_RUN" "$FROZEN_HEAD" "$FROZEN_ARTIFACT" "$FROZEN_DIGEST"
          lock_run_artifact "$FUNNEL_RUN" "$FUNNEL_HEAD" "$FUNNEL_ARTIFACT" "$FUNNEL_DIGEST"

  experiment:
    needs: [contract, lock-inputs]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        announcement_id: ['1212731093', '1217717273', '1225153907', '1219411922']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
      - name: Install exact verified experimental dependencies
        run: python -m pip install --disable-pip-version-check --constraint requirements/constraints-verified.txt requests PyMuPDF
      - name: Restore exact frozen inputs
        shell: bash
        run: |
          set -euo pipefail
          rm -rf prepared accepted build/s3g1j-v17-15
          gh run download "$FROZEN_RUN" -R "$GITHUB_REPOSITORY" -n "$FROZEN_ARTIFACT" -D prepared
          gh run download "$FUNNEL_RUN" -R "$GITHUB_REPOSITORY" -n "$FUNNEL_ARTIFACT" -D accepted
          test -f prepared/single_source_residual_versions.csv.gz
          test -f accepted/v17_12_residual_funnel.json
      - name: Compare V17.11 baseline to strict adjacent-row candidate
        shell: bash
        run: |
          set +e
          out="build/s3g1j-v17-15/${{ matrix.announcement_id }}.json"
          mkdir -p "$(dirname "$out")"
          python scripts/probe_stage3_s3g1j_v17_15_adjacent_bridge.py \
            --versions prepared/single_source_residual_versions.csv.gz \
            --summary accepted/v17_12_residual_funnel.json \
            --announcement-id '${{ matrix.announcement_id }}' --out "$out" \
            > "${out%.json}.stdout.log" 2> "${out%.json}.stderr.log"
          code=$?
          echo "EXPERIMENT_EXIT=$code" >> "$GITHUB_ENV"
          cat "${out%.json}.stdout.log" || true
          tail -100 "${out%.json}.stderr.log" || true
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage3-s3g1j-v17-15-experiment-${{ matrix.announcement_id }}
          path: build/s3g1j-v17-15
          retention-days: 90
          compression-level: 0
      - name: Preserve experiment execution failure
        if: env.EXPERIMENT_EXIT != '0'
        run: exit 1

  summarize:
    needs: experiment
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: stage3-s3g1j-v17-15-experiment-*
          path: candidate
          merge-multiple: true
      - name: Aggregate exact-four A/B evidence without promoting production
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import glob,json,os
          expected={'1212731093','1217717273','1225153907','1219411922'}
          rows=[json.load(open(p,encoding='utf-8')) for p in sorted(glob.glob('candidate/*.json'))]
          assert {str(x['announcement_id']) for x in rows}==expected
          assert all(x.get('pass') is True for x in rows),[(x.get('announcement_id'),x.get('errors')) for x in rows]
          assert all(x.get('baseline_recovered') is False for x in rows)
          assert all(x.get('experimental_only') is True and x.get('production_parser_changed') is False for x in rows)
          recovered=sorted(str(x['announcement_id']) for x in rows if x.get('candidate_recovered'))
          rejected=sorted(str(x['announcement_id']) for x in rows if not x.get('candidate_recovered'))
          for x in rows:
              if x.get('candidate_recovered'):
                  assert (x.get('candidate_column_role_gate') or {}).get('pass') is True,x
                  assert x.get('candidate_identity') is not None,x
                  assert x.get('bridge_selected_concepts'),x
          report={
            'gate':'S3G1J_V17_15_EXACT_FOUR_ADJACENT_BRIDGE_EXPERIMENT',
            'pass':True,
            'experimental_only':True,
            'production_parser_changed':False,
            'input_count':4,
            'recovered_count':len(recovered),
            'recovered_announcement_ids':recovered,
            'remaining_count':len(rejected),
            'remaining_announcement_ids':rejected,
            'accounting_tolerance':'0.005',
            'global_row_tolerance_changed':False,
            'bridge_y_window':'2.8 < delta <= 3.25',
            'stage4_alpha_locked':True,
            'errors':[],
          }
          os.makedirs('summary',exist_ok=True)
          json.dump(report,open('summary/s3g1j_v17_15_exact_four_experiment.json','w',encoding='utf-8'),ensure_ascii=False,indent=2)
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage3-s3g1j-v17-15-exact-four-experiment
          path: |
            summary
            candidate
          retention-days: 90
          compression-level: 0
