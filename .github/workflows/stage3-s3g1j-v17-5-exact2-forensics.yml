name: Stage3 S3G1J V17.5 Exact2 Forensics

on:
  pull_request:
    branches: [stage3-s3g1j-spatial-alias-columns-v16]
    paths:
      - '.github/workflows/stage3-s3g1j-v17-5-exact2-forensics.yml'
      - 'scripts/probe_stage3_s3g1j_v17_5_exact2_forensics.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ github.token }}
  FROZEN_127_RUN: '30424465440'
  V17_4_RUN: '30508192238'
  PYTHONPATH: scripts

jobs:
  forensics:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests pymupdf
      - name: Require accepted V17.4 zero-recovery A/B and restore exact inputs
        run: |
          test "$(gh run view "$V17_4_RUN" -R "$GITHUB_REPOSITORY" --json conclusion --jq .conclusion)" = success
          rm -rf prepared v17_4 build/v17-5-exact2
          gh run download "$FROZEN_127_RUN" -R "$GITHUB_REPOSITORY" \
            -n stage3-s3g1j-v15-single-source-input -D prepared
          gh run download "$V17_4_RUN" -R "$GITHUB_REPOSITORY" \
            -n stage3-s3g1j-v17-4-generic-dual-role-ab -D v17_4
          test -f prepared/single_source_residual_versions.csv.gz
          test -f v17_4/generic_dual_role_ab.json
          python - <<'PY'
          import json
          d=json.load(open('v17_4/generic_dual_role_ab.json',encoding='utf-8'))
          assert d['diagnostic_pass']
          assert d['promoted_document_count']==2
          assert d['recovered_count']==0
          assert d['recovered_ids']==[]
          assert d['policy']['stage4_alpha_locked'] is True
          print('V17_5_LOCK_PASS',d['promoted_document_count'],d['recovered_count'])
          PY
      - name: Inspect exact liability rows and statement-unit evidence
        run: |
          mkdir -p build/v17-5-exact2
          python scripts/probe_stage3_s3g1j_v17_5_exact2_forensics.py \
            --versions prepared/single_source_residual_versions.csv.gz \
            --v17-4 v17_4/generic_dual_role_ab.json \
            --out build/v17-5-exact2/exact2_forensics.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage3-s3g1j-v17-5-exact2-forensics
          path: build/v17-5-exact2/exact2_forensics.json
          retention-days: 90
          compression-level: 0
