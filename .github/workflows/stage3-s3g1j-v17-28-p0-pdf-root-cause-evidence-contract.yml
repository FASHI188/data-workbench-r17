name: Stage3 S3G1J V17.28 P0 PDF Root Cause Evidence Contract

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'governance/stage3_s3g1j_v17_28_p0_pdf_root_cause.json'
      - 'tests/test_stage3_v17_28_p0_pdf_root_cause_evidence.py'
      - '.github/workflows/stage3-s3g1j-v17-28-p0-pdf-root-cause-evidence-contract.yml'

permissions:
  contents: read
  actions: read
  pull-requests: read

env:
  GH_TOKEN: ${{ github.token }}
  DIAGNOSTIC_PR: '101'
  DIAGNOSTIC_HEAD: 'c1e1a99533498c9e4eba7ae95323cc80586474c4'
  ACCEPTED_RUN: '31111116235'
  ACCEPTED_ARTIFACT_ID: '8971708686'
  ACCEPTED_ARTIFACT: 'stage3-s3g1j-v17-28-p0-pdf-root-cause-v1'
  ACCEPTED_DIGEST: 'sha256:c743dc725e15037eb761244e5e0e88d37075a1cf5eab366e5d64c9d7ac0627b8'

jobs:
  root-cause-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
      - name: Lock unmerged diagnostic PR and accepted artifact
        shell: bash
        run: |
          set -euo pipefail
          pr=$(gh pr view "$DIAGNOSTIC_PR" -R "$GITHUB_REPOSITORY" --json headRefOid,state,isDraft,mergedAt)
          test "$(jq -r '.headRefOid' <<<"$pr")" = "$DIAGNOSTIC_HEAD"
          test "$(jq -r '.state' <<<"$pr")" = OPEN
          test "$(jq -r '.isDraft' <<<"$pr")" = true
          test "$(jq -r '.mergedAt // ""' <<<"$pr")" = ""
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ACCEPTED_RUN")
          test "$(jq -r '.status' <<<"$run")" = completed
          test "$(jq -r '.conclusion' <<<"$run")" = success
          test "$(jq -r '.head_sha' <<<"$run")" = "$DIAGNOSTIC_HEAD"
          artifacts=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ACCEPTED_RUN/artifacts?per_page=100")
          test "$(jq -r --arg name "$ACCEPTED_ARTIFACT" '[.artifacts[] | select(.name==$name)] | length' <<<"$artifacts")" = 1
          test "$(jq -r --arg name "$ACCEPTED_ARTIFACT" '.artifacts[] | select(.name==$name) | .id' <<<"$artifacts")" = "$ACCEPTED_ARTIFACT_ID"
          test "$(jq -r --arg name "$ACCEPTED_ARTIFACT" '.artifacts[] | select(.name==$name) | .digest' <<<"$artifacts")" = "$ACCEPTED_DIGEST"
          test "$(jq -r --arg name "$ACCEPTED_ARTIFACT" '.artifacts[] | select(.name==$name) | .workflow_run.head_sha' <<<"$artifacts")" = "$DIAGNOSTIC_HEAD"
          test "$(jq -r --arg name "$ACCEPTED_ARTIFACT" '.artifacts[] | select(.name==$name) | .expired' <<<"$artifacts")" = false
      - uses: actions/download-artifact@v4
        with:
          name: stage3-s3g1j-v17-28-p0-pdf-root-cause-v1
          path: accepted
          repository: FASHI188/data-workbench-r17
          run-id: 31111116235
          github-token: ${{ github.token }}
      - name: Verify downloaded ledger, target manifest and exact result
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv,gzip,hashlib,json
          from collections import Counter
          from pathlib import Path
          root=Path('accepted')
          paths={p.name:p for p in root.rglob('*') if p.is_file()}
          expected={
            'stage3_s3g1j_v17_28_p0_pdf_root_cause.csv.gz':'e3ba4e23b81dcb24d24def114cd6a70289c2f7df654b1d81238638675ec1a92c',
            'stage3_s3g1j_v17_28_p0_pdf_root_cause_summary.json':'2caaadaa1dec8faea6fb0b4c36cc5a0dd539b1738b1e788e1ec40a71ba8a476e',
            'stage3_s3g1j_v17_28_safe_exact_source_targets.json':'c3ed36d0bd79c0dacfbc3e5375612619c7cc429a09eb3c4b10fcde77886c8a34',
          }
          for name,digest in expected.items():
              assert name in paths,name
              assert hashlib.sha256(paths[name].read_bytes()).hexdigest()==digest,name
          with gzip.open(paths['stage3_s3g1j_v17_28_p0_pdf_root_cause.csv.gz'],'rt',encoding='utf-8',newline='') as handle:
              rows=list(csv.DictReader(handle))
          summary=json.loads(paths['stage3_s3g1j_v17_28_p0_pdf_root_cause_summary.json'].read_text(encoding='utf-8'))
          safe=json.loads(paths['stage3_s3g1j_v17_28_safe_exact_source_targets.json'].read_text(encoding='utf-8'))
          safe_ids=['1215186538','1219426855','1219792633','1219840508','1219879687','1220087244','1221006100']
          diagnostic_ids=['1202799494','1204077386','1205543437','1209806910','1223347318','1223407043']
          assert len(rows)==14
          assert Counter(row['classification'] for row in rows)=={
              'SAFE_EXACT_SOURCE_CANDIDATE':7,
              'DIAGNOSTIC_ONLY':6,
              'DO_NOT_PROMOTE':1,
          }
          assert [row['announcement_id'] for row in rows if row['classification']=='SAFE_EXACT_SOURCE_CANDIDATE']==safe_ids
          assert [row['announcement_id'] for row in rows if row['classification']=='DIAGNOSTIC_ONLY']==diagnostic_ids
          assert [row['announcement_id'] for row in rows if row['classification']=='DO_NOT_PROMOTE']==['1219834247']
          assert all(row['source_identity_locked']=='True' for row in rows)
          assert all(row['current_identity_residual']=='0.00' and row['prior_identity_residual']=='0.00' for row in rows if row['classification']=='SAFE_EXACT_SOURCE_CANDIDATE')
          assert all(row['candidate_authorized']=='False' for row in rows)
          assert summary['classification_counts']=={
              'SAFE_EXACT_SOURCE_CANDIDATE':7,
              'DIAGNOSTIC_ONLY':6,
              'DO_NOT_PROMOTE':1,
          }
          assert summary['safe_current_identity_zero_residual_count']==7
          assert summary['safe_prior_identity_zero_residual_count']==7
          assert summary['pdf_binaries_redownloaded'] is False
          assert summary['ocr_used'] is False
          assert summary['equity_inferred_from_assets_minus_liabilities'] is False
          assert summary['candidate_parser_authorized'] is False
          assert summary['pass'] is True and summary['errors']==[]
          assert safe['announcement_ids']==safe_ids
          assert len(safe['source_sha256_by_announcement_id'])==7
          assert safe['candidate_parser_authorized'] is False
          print('S3G1J_V17_28_P0_PDF_ROOT_CAUSE_DOWNLOADED_EVIDENCE_PASS')
          PY
      - name: Verify committed evidence and immutable root causes
        run: python -m unittest tests.test_stage3_v17_28_p0_pdf_root_cause_evidence -v
      - name: Assert project remains fail-closed
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          project=json.load(open('data/project_status.json',encoding='utf-8'))
          lock=json.load(open('config/stage3_final_lock.json',encoding='utf-8'))
          evidence=json.load(open('governance/stage3_s3g1j_v17_28_p0_pdf_root_cause.json',encoding='utf-8'))
          assert project['stage3']['status']=='NOT_READY'
          assert project['stage3']['s3g1j']['data_verdict']=='FAIL_CLOSED'
          assert project['stage3']['s3g1j']['final_gate_pass'] is False
          assert project['stage4_unlocked'] is False
          assert project['alpha_training_allowed'] is False
          assert project['live_signal_allowed'] is False
          assert lock['status']=='NOT_READY'
          assert 'S3G1J_FINANCIAL_RAW_VALUES' in lock['remaining_unlocked_gates']
          assert evidence['hard_boundaries']['candidate_parser_authorized'] is False
          assert evidence['hard_boundaries']['formal_parser_changed'] is False
          assert evidence['hard_boundaries']['runtime_authority_changed'] is False
          assert evidence['hard_boundaries']['production_data_changed'] is False
          assert evidence['hard_boundaries']['merge_to_main_authorized'] is False
          print('S3G1J_V17_28_P0_PDF_ROOT_CAUSE_GOVERNANCE_BOUNDARY_PASS')
          PY
