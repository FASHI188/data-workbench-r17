name: Extension Foundation Contract

on:
  pull_request:
    branches:
      - agent/stage3-clean-integration
    paths:
      - 'extensions/**'
      - 'governance/extension_module_registry.json'
      - 'schemas/external_data_envelope_v1.schema.json'
      - 'schemas/extension_module_manifest_v1.schema.json'
      - 'docs/EXTENSION_FOUNDATION_CONTRACT_V1.md'
      - 'tests/test_extension_foundation.py'
      - '.github/workflows/extension-foundation-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'

      - name: Install contract test dependency
        run: python -m pip install pytest==9.1.1

      - name: Run extension foundation contract tests
        run: python -m pytest -q tests/test_extension_foundation.py

      - name: Prove accepted Stage3 and current lock files are untouched
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          changed="$(git diff --name-only "$BASE_SHA" HEAD -- \
            data/stage3_final \
            data/project_status.json \
            governance/stage3_authority_map.json \
            config/stage3_final_lock.json)"
          if [ -n "$changed" ]; then
            echo "Extension-foundation PR modified frozen/current authority paths:" >&2
            echo "$changed" >&2
            exit 1
          fi

      - name: Prove no concrete extension module is registered or activated
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          registry = json.loads(Path('governance/extension_module_registry.json').read_text())
          assert registry['modules'] == []
          assert registry['default_enabled'] is False
          assert registry['policies']['training_default_allowed'] is False
          assert registry['policies']['live_default_allowed'] is False
          print('extension foundation only: no concrete module registered or activated')
          PY
