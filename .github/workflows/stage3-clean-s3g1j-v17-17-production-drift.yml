name: Stage3 Clean S3G1J V17.17 Exact-Two Production Drift

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/diagnose_stage3_s3g1j_v17_17_production_drift.py'
      - '.github/workflows/stage3-clean-s3g1j-v17-17-production-drift.yml'

permissions:
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ github.token }}
  FROZEN_RUN: '30424465440'
  FROZEN_HEAD: 'be42608b75f77af13c36620da7e7fa03c563afde'
  FROZEN_ARTIFACT: 'stage3-s3g1j-v15-single-source-input'
  FROZEN_DIGEST: 'sha256:272f52239adc2fc5d4343ec091495dffcd39324b425784cdf5a7491f63a2e6fd'
  ACCEPTED_RUN: '30510347556'
  ACCEPTED_HEAD: 'e98d26b962a58cecc5c6416214e3c798c5e8a49e'
  ACCEPTED_ARTIFACT: 'stage3-s3g1j-v17-11-column-evidence-acceptance'
  ACCEPTED_DIGEST: 'sha256:b1143faaf2c1a91fd64e21ef35c05e787200d957f888613fa2f2a2fc23c43ad9'
  PYTHONPATH: scripts

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        announcement_id: ['1207399857', '1223364547']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
      - name: Install exact verified runtime dependencies
        run: python -m pip install --disable-pip-version-check --constraint requirements/constraints-verified.txt requests PyMuPDF
      - name: Lock and restore exact inputs
        shell: bash
        run: |
          set -euo pipefail
          lock_run_artifact() {
            run="$1"; expected_head="$2"; artifact="$3"; expected_digest="$4"
            test "$(gh run view "$run" -R "$GITHUB_REPOSITORY" --json conclusion --jq '.conclusion')" = success
            test "$(gh run view "$run" -R "$GITHUB_REPOSITORY" --json headSha --jq '.headSha')" = "$expected_head"
            actual=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/artifacts" --jq ".artifacts[] | select(.name==\"$artifact\") | .digest")
            test "$actual" = "$expected_digest"
          }
          lock_run_artifact "$FROZEN_RUN" "$FROZEN_HEAD" "$FROZEN_ARTIFACT" "$FROZEN_DIGEST"
          lock_run_artifact "$ACCEPTED_RUN" "$ACCEPTED_HEAD" "$ACCEPTED_ARTIFACT" "$ACCEPTED_DIGEST"
          rm -rf prepared accepted build/s3g1j-v17-17-drift
          gh run download "$FROZEN_RUN" -R "$GITHUB_REPOSITORY" -n "$FROZEN_ARTIFACT" -D prepared
          gh run download "$ACCEPTED_RUN" -R "$GITHUB_REPOSITORY" -n "$ACCEPTED_ARTIFACT" -D accepted
          test -f prepared/single_source_residual_versions.csv.gz
          test -f accepted/v17_11_column_evidence_acceptance.json
      - name: Compare V17.15 and V17.17 production paths
        shell: bash
        run: |
          set +e
          out="build/s3g1j-v17-17-drift/${{ matrix.announcement_id }}.json"
          mkdir -p "$(dirname "$out")"
          python scripts/diagnose_stage3_s3g1j_v17_17_production_drift.py \
            --versions prepared/single_source_residual_versions.csv.gz \
            --acceptance accepted/v17_11_column_evidence_acceptance.json \
            --announcement-id '${{ matrix.announcement_id }}' \
            --out "$out" > "${out%.json}.stdout.log" 2> "${out%.json}.stderr.log"
          code=$?
          echo "DIAGNOSTIC_EXIT=$code" >> "$GITHUB_ENV"
          cat "${out%.json}.stdout.log" || true
          tail -100 "${out%.json}.stderr.log" || true
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage3-s3g1j-v17-17-production-drift-${{ matrix.announcement_id }}
          path: build/s3g1j-v17-17-drift
          retention-days: 90
          compression-level: 0
      - name: Preserve diagnostic execution failure
        if: env.DIAGNOSTIC_EXIT != '0'
        run: exit 1

  summarize:
    needs: diagnose
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: stage3-s3g1j-v17-17-production-drift-*
          path: candidate
          merge-multiple: true
      - name: Aggregate exact-two production drift evidence
        run: |
          python - <<'PY'
          import glob,json,os
          expected={'1207399857','1223364547'}
          rows=[json.load(open(path,encoding='utf-8')) for path in sorted(glob.glob('candidate/*.json'))]
          assert {str(row['announcement_id']) for row in rows}==expected
          assert all(row.get('pass') is True for row in rows)
          report={
            'gate':'S3G1J_V17_17_EXACT_TWO_PRODUCTION_DRIFT_DIAGNOSTIC',
            'pass':True,
            'diagnostic_only':True,
            'input_count':2,
            'documents':[{k:row.get(k) for k in ('announcement_id','source_code','economic_date','source_sha256','production_found_changed','production_block_changed')} for row in rows],
            'stage4_alpha_locked':True,
            'errors':[],
          }
          os.makedirs('summary',exist_ok=True)
          json.dump(report,open('summary/s3g1j_v17_17_exact_two_production_drift.json','w',encoding='utf-8'),ensure_ascii=False,indent=2)
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stage3-s3g1j-v17-17-exact-two-production-drift
          path: |
            summary
            candidate
          retention-days: 90
          compression-level: 0
