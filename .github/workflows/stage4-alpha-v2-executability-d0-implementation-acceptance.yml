name: Stage4 Alpha V2 Executability D0 Implementation Acceptance
on:
  pull_request:
    branches:
      - agent/stage3-clean-integration
    paths:
      - '.github/workflows/stage4-alpha-v2-executability-d0-implementation-acceptance.yml'
      - 'governance/stage4_alpha_v2_executability_d0_implementation_acceptance.json'
      - 'governance/accepted_project_state.json'
      - 'governance/project_module_index.json'
      - 'scripts/audit_stage4_alpha_v2_executability_d0_implementation_acceptance.py'
permissions:
  contents: read
jobs:
  static-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Detect D0 V1.1 bridge authorization successor
        id: d0_auth_v11
        shell: bash
        run: |
          if test -f governance/stage4_alpha_v2_executability_d0_execution_authorization_v1_1.json; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify D0 V1.1 bridge authorization successor
        if: steps.d0_auth_v11.outputs.present == 'true'
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('governance/stage4_alpha_v2_executability_d0_execution_authorization_v1_1.json').read_text())
          s=json.loads(Path('governance/accepted_project_state.json').read_text())
          m=json.loads(Path('governance/project_module_index.json').read_text())
          assert a['fingerprint']=='050b5f3d2b292e1da4c38cf60ba6b39fcbe1973ada7f3f77c055fc02f02ac920'
          p=s['permissions']
          assert p['development_label_diagnostic_access_allowed'] is False
          assert p['development_label_diagnostic_runs_remaining']==1
          mm=next(x for x in m['modules'] if x['id']=='STAGE4_ALPHA_V2_EXECUTABILITY_D0')
          assert mm['status']=='AUTHORIZATION_V1_1_BRIDGE_ARMED_SINGLE_USE_EXECUTION_NOT_STARTED'
          assert mm['authorization_fingerprint']=='050b5f3d2b292e1da4c38cf60ba6b39fcbe1973ada7f3f77c055fc02f02ac920'
          PY
      - name: Detect D0 authorization successor
        id: d0_auth
        shell: bash
        run: |
          if test -f governance/stage4_alpha_v2_executability_d0_execution_authorization.json; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify D0 authorization successor
        if: steps.d0_auth.outputs.present == 'true' && steps.d0_auth_v11.outputs.present != 'true'
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('governance/stage4_alpha_v2_executability_d0_execution_authorization.json').read_text())
          s=json.loads(Path('governance/accepted_project_state.json').read_text())
          m=json.loads(Path('governance/project_module_index.json').read_text())
          assert a['fingerprint']=='119b5fe4016c001e0fdaf4fa68b40cbf4ece92c2e37de5c4ee3d5d57ddfee27b'
          assert a['fingerprint_basis']['single_use']['armed_runs_remaining']==1
          p=s['permissions']
          assert p['development_label_diagnostic_access_allowed'] is False
          assert p['development_label_diagnostic_runs_remaining']==1
          assert p['model_fit_allowed'] is False and p['oos_label_access_allowed'] is False and p['lockbox_label_access_allowed'] is False
          mm=next(x for x in m['modules'] if x['id']=='STAGE4_ALPHA_V2_EXECUTABILITY_D0')
          assert mm['status']=='AUTHORIZATION_ARMED_SINGLE_USE_EXECUTION_NOT_STARTED'
          assert mm['authorization_fingerprint']=='119b5fe4016c001e0fdaf4fa68b40cbf4ece92c2e37de5c4ee3d5d57ddfee27b'
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
      - name: Audit D0 implementation acceptance
        if: steps.d0_auth.outputs.present != 'true' && steps.d0_auth_v11.outputs.present != 'true'
        run: python scripts/audit_stage4_alpha_v2_executability_d0_implementation_acceptance.py
      - name: Prove governance-only
        shell: bash
        run: |
          set -euo pipefail
          ! grep -n -E 'download-artifact|curl|wget|gh[[:space:]]+api|read_parquet\(|\.fit\(|\.predict\('             .github/workflows/stage4-alpha-v2-executability-d0-implementation-acceptance.yml             scripts/audit_stage4_alpha_v2_executability_d0_implementation_acceptance.py | grep -v 'grep -n -E'
      - name: Prove exact acceptance scope
        if: steps.d0_auth.outputs.present != 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only "$BASE_SHA" HEAD | sort > /tmp/changed
          printf '%s\n'             .github/workflows/stage4-alpha-v2-executability-d0-implementation-acceptance.yml             .github/workflows/stage4-alpha-v2-executability-d1-prereg-acceptance.yml             governance/accepted_project_state.json             governance/project_module_index.json             governance/stage4_alpha_v2_executability_d0_implementation_acceptance.json             scripts/audit_stage4_alpha_v2_executability_d0_implementation_acceptance.py | sort > /tmp/expected
          diff -u /tmp/expected /tmp/changed
