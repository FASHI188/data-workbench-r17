name: Stage4 Alpha V1 OOS Label Completion Authorization Reservation V1

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-governance-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'

      - name: Audit authorization reservation
        run: python scripts/audit_stage4_alpha_v1_oos_label_completion_authorization_reservation_v1.py

      - name: Prove no OOS execution surface in this workflow
        shell: bash
        run: |
          set -euo pipefail
          ! grep -n -E 'download-artifact|curl|wget|gh[[:space:]]+api|urllib|requests' .github/workflows/stage4-alpha-v1-oos-label-completion-authorization-reservation.yml | grep -v 'grep -n -E'
          ! grep -n -E 'run_stage4_alpha_v1_oos_label_completion.py[[:space:]]+--authorization|workflow_dispatch.*oos|artifact_id.*10142949262|artifact_id.*10142948546' .github/workflows/stage4-alpha-v1-oos-label-completion-authorization-reservation.yml | grep -v 'grep -n -E'

      - name: Prove PR scope is exact governance reservation set
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only "$BASE_SHA" HEAD | sort > /tmp/changed.txt
          cat > /tmp/expected.txt <<'EOF'
          .github/workflows/stage4-alpha-v1-oos-label-completion-authorization-reservation.yml
          governance/accepted_project_state.json
          governance/project_module_index.json
          governance/stage4_alpha_v1_oos_label_completion_authorization_reservation_audit_v1.json
          governance/stage4_alpha_v1_oos_label_completion_authorization_reservation_v1.json
          scripts/audit_stage4_alpha_v1_oos_label_completion_authorization_reservation_v1.py
          EOF
          sort -o /tmp/expected.txt /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/changed.txt

      - name: Prove consumed evidence and implementation are untouched
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          forbidden="$(git diff --name-only "$BASE_SHA" HEAD -- \
            governance/stage4_alpha_v1_oos_validation_authorization.json \
            governance/stage4_alpha_v1_oos_validation_consumed_incomplete_evidence.json \
            governance/stage4_alpha_v1_oos_label_completion_preregistration_v1_3_supersession.json \
            governance/stage4_alpha_v1_oos_label_completion_implementation_contract_v1.json \
            governance/stage4_alpha_v1_oos_label_completion_implementation_acceptance.json \
            scripts/run_stage4_alpha_v1_oos_label_completion.py \
            scripts/stage4_alpha_v1_label_materialization.py \
            scripts/stage4_alpha_v1_alpha_evaluation.py \
            scripts/run_stage4_alpha_v1_runtime_veto_v1_1.py \
            data/stage2_final \
            data/stage3_final \
            config/stage3_final_lock.json \
            models)"
          if [ -n "$forbidden" ]; then
            echo 'Reservation PR modified frozen authority/evidence/implementation/data paths:' >&2
            echo "$forbidden" >&2
            exit 1
          fi
