name: Stage3 S3G1J V17.6 Combined Exact17 AB

on:
  pull_request:
    branches: [stage3-s3g1j-spatial-alias-columns-v16]
    paths:
      - '.github/workflows/stage3-s3g1j-v17-6-combined-exact17-ab.yml'
      - 'scripts/probe_stage3_s3g1j_v17_6_combined_exact17_ab.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ github.token }}
  FROZEN_127_RUN: '30424465440'
  V17_FUNNEL_RUN: '30506652840'
  V17_4_RUN: '30508192238'
  PYTHONPATH: scripts

jobs:
  ab:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests pymupdf
      - name: Require accepted exact evidence and restore frozen artifacts
        run: |
          test "$(gh run view "$V17_FUNNEL_RUN" -R "$GITHUB_REPOSITORY" --json conclusion --jq .conclusion)" = success
          test "$(gh run view "$V17_4_RUN" -R "$GITHUB_REPOSITORY" --json conclusion --jq .conclusion)" = success
          rm -rf prepared v17 v17_4 build/v17-6-combined
          gh run download "$FROZEN_127_RUN" -R "$GITHUB_REPOSITORY" \
            -n stage3-s3g1j-v15-single-source-input -D prepared
          gh run download "$V17_FUNNEL_RUN" -R "$GITHUB_REPOSITORY" \
            -n stage3-s3g1j-v17-residual-funnel-summary -D v17
          gh run download "$V17_4_RUN" -R "$GITHUB_REPOSITORY" \
            -n stage3-s3g1j-v17-4-generic-dual-role-ab -D v17_4
          test -f prepared/single_source_residual_versions.csv.gz
          test -f v17/v17_residual_funnel.json
          test -f v17_4/generic_dual_role_ab.json
      - name: Run combined diagnostic-only A/B on exact 17 residual PDFs
        run: |
          mkdir -p build/v17-6-combined
          python scripts/probe_stage3_s3g1j_v17_6_combined_exact17_ab.py \
            --versions prepared/single_source_residual_versions.csv.gz \
            --v17-summary v17/v17_residual_funnel.json \
            --v17-4 v17_4/generic_dual_role_ab.json \
            --out build/v17-6-combined/combined_exact17_ab.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage3-s3g1j-v17-6-combined-exact17-ab
          path: build/v17-6-combined/combined_exact17_ab.json
          retention-days: 90
          compression-level: 0
