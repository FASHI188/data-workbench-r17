name: Stage3 S3G1J V13 Representative Shard Smoke

on:
  pull_request:
    branches: [stage3-s3g1j-source-selection-v12]
    paths:
      - '.github/workflows/stage3-s3g1j-v13-shard-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  V13_ACCEPTANCE_RUN: '30382008869'
  FILING_LEDGER_RUN: '30265340486'

jobs:
  lock:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Require completed V13 acceptance PASS
        run: test "$(gh run view "$V13_ACCEPTANCE_RUN" -R "$GITHUB_REPOSITORY" --json conclusion --jq .conclusion)" = success

  prepare-versions:
    needs: lock
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONPATH: scripts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore frozen successful S3G1E ledger
        run: |
          rm -rf filing-ledger versions
          gh run download "$FILING_LEDGER_RUN" -R "$GITHUB_REPOSITORY" \
            -n stage3-s3g1e-periodic-filing-ledger-final -D filing-ledger
          test -f filing-ledger/stage3_periodic_filing_ledger.csv.gz
      - name: Build V12.1 full-statement authority ledger
        run: |
          mkdir -p versions
          python scripts/select_stage3_financial_report_versions_v3_1.py \
            --ledger filing-ledger/stage3_periodic_filing_ledger.csv.gz \
            --out versions
          test -f versions/stage3_financial_report_versions_v3.csv.gz
          test -f versions/stage3_financial_report_versions_v3_audit.json
      - uses: actions/upload-artifact@v4
        with:
          name: stage3-s3g1j-v13-smoke-versions
          path: versions/
          retention-days: 90
          compression-level: 0

  smoke:
    needs: prepare-versions
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 7, 9]
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONPATH: scripts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests pymupdf
      - uses: actions/download-artifact@v4
        with:
          name: stage3-s3g1j-v13-smoke-versions
          path: versions
      - name: Re-run representative shard with V12.1 source selection plus V13 parser
        shell: bash
        run: |
          set +e
          out="build/stage3-financial-values-v13-smoke/shard${{ matrix.shard }}"
          mkdir -p "$out"
          python scripts/extract_stage3_financial_pdf_values_v8.py \
            --versions versions/stage3_financial_report_versions_v3.csv.gz \
            --shard ${{ matrix.shard }} --shards 64 --out "$out" \
            > "$out/stdout.log" 2> "$out/stderr.log"
          code=$?
          echo "SMOKE_EXIT=$code" >> "$GITHUB_ENV"
          cat "$out"/financial_extract_shard*.manifest.json || true
          tail -100 "$out/stderr.log" || true
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage3-s3g1j-v13-smoke-${{ matrix.shard }}
          path: build/stage3-financial-values-v13-smoke/shard${{ matrix.shard }}
          retention-days: 90
          compression-level: 0
      - name: Preserve fail-closed smoke status
        if: env.SMOKE_EXIT != '0'
        run: exit 1
