name: Stage3 Clean S3G1J V17.17 Exact-81 Safety Replay

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/stage3_financial_spatial_alias_v17_17.py'
      - 'scripts/probe_stage3_s3g1j_v17_17_exact_81.py'
      - '.github/workflows/stage3-clean-s3g1j-v17-17-exact-81.yml'

permissions:
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ github.token }}
  FROZEN_RUN: '30424465440'
  FROZEN_HEAD: 'be42608b75f77af13c36620da7e7fa03c563afde'
  FROZEN_ARTIFACT: 'stage3-s3g1j-v15-single-source-input'
  FROZEN_DIGEST: 'sha256:272f52239adc2fc5d4343ec091495dffcd39324b425784cdf5a7491f63a2e6fd'
  V17_11_RUN: '30510347556'
  V17_11_HEAD: 'e98d26b962a58cecc5c6416214e3c798c5e8a49e'
  V17_11_ARTIFACT: 'stage3-s3g1j-v17-11-column-evidence-acceptance'
  V17_11_DIGEST: 'sha256:b1143faaf2c1a91fd64e21ef35c05e787200d957f888613fa2f2a2fc23c43ad9'
  V17_15_RUN: '30535567713'
  V17_15_HEAD: '55ce359de27f32343f272b4d53d167f08ee38ea1'
  V17_15_ARTIFACT: 'stage3-s3g1j-v17-15-exact-82-safety-replay'
  V17_15_DIGEST: 'sha256:6bb7fe3530c1f56486092a99476e7a72669b40f172334281920ca244e785ba98'
  PYTHONPATH: scripts

jobs:
  lock-inputs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lock exact frozen inputs and accepted V17.15 residual state
        shell: bash
        run: |
          set -euo pipefail
          lock_run_artifact() {
            run="$1"; expected_head="$2"; artifact="$3"; expected_digest="$4"
            test "$(gh run view "$run" -R "$GITHUB_REPOSITORY" --json conclusion --jq '.conclusion')" = success
            test "$(gh run view "$run" -R "$GITHUB_REPOSITORY" --json headSha --jq '.headSha')" = "$expected_head"
            actual=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/artifacts" --jq ".artifacts[] | select(.name==\"$artifact\") | .digest")
            test "$actual" = "$expected_digest"
          }
          lock_run_artifact "$FROZEN_RUN" "$FROZEN_HEAD" "$FROZEN_ARTIFACT" "$FROZEN_DIGEST"
          lock_run_artifact "$V17_11_RUN" "$V17_11_HEAD" "$V17_11_ARTIFACT" "$V17_11_DIGEST"
          lock_run_artifact "$V17_15_RUN" "$V17_15_HEAD" "$V17_15_ARTIFACT" "$V17_15_DIGEST"

  replay:
    needs: lock-inputs
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 7, 9]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
      - name: Install exact verified replay dependencies
        run: python -m pip install --disable-pip-version-check --constraint requirements/constraints-verified.txt requests PyMuPDF
      - name: Restore exact accepted residual inputs
        shell: bash
        run: |
          set -euo pipefail
          rm -rf prepared accepted11 accepted15 build/s3g1j-v17-17-exact81
          gh run download "$FROZEN_RUN" -R "$GITHUB_REPOSITORY" -n "$FROZEN_ARTIFACT" -D prepared
          gh run download "$V17_11_RUN" -R "$GITHUB_REPOSITORY" -n "$V17_11_ARTIFACT" -D accepted11
          gh run download "$V17_15_RUN" -R "$GITHUB_REPOSITORY" -n "$V17_15_ARTIFACT" -D accepted15
          test -f prepared/single_source_residual_versions.csv.gz
          test -f accepted11/v17_11_column_evidence_acceptance.json
          test -f accepted15/summary/s3g1j_v17_15_exact_82_safety_replay.json
      - name: Replay V17.15 baseline and V17.17 candidate over exact 81 residuals
        shell: bash
        run: |
          set +e
          out="build/s3g1j-v17-17-exact81/shard${{ matrix.shard }}.json"
          mkdir -p "$(dirname "$out")"
          python scripts/probe_stage3_s3g1j_v17_17_exact_81.py \
            --versions prepared/single_source_residual_versions.csv.gz \
            --v17-11-acceptance accepted11/v17_11_column_evidence_acceptance.json \
            --v17-15-summary accepted15/summary/s3g1j_v17_15_exact_82_safety_replay.json \
            --shard ${{ matrix.shard }} --shards 64 --out "$out" \
            > "${out%.json}.stdout.log" 2> "${out%.json}.stderr.log"
          code=$?
          echo "REPLAY_EXIT=$code" >> "$GITHUB_ENV"
          cat "${out%.json}.stdout.log" || true
          tail -100 "${out%.json}.stderr.log" || true
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage3-s3g1j-v17-17-exact81-${{ matrix.shard }}
          path: build/s3g1j-v17-17-exact81
          retention-days: 90
          compression-level: 0
      - name: Preserve replay execution failure
        if: env.REPLAY_EXIT != '0'
        run: exit 1

  summarize:
    needs: replay
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: stage3-s3g1j-v17-17-exact81-*
          path: candidate
          merge-multiple: true
      - name: Require exact one intended recovery and no source drift
        shell: bash
        run: |
          set +e
          python - <<'PY'
          import glob,json,os,sys
          expected_recovery={'1212731093'}
          paths=sorted(glob.glob('candidate/shard*.json'))
          reports=[json.load(open(path,encoding='utf-8')) for path in paths]
          errors=[]
          if [row.get('shard') for row in reports] != [0,1,7,9]:
              errors.append({'code':'SHARD_SET_MISMATCH','actual':[row.get('shard') for row in reports]})
          if not all(row.get('pass') is True for row in reports):
              errors.append({'code':'SHARD_REPLAY_FAILED','details':[row.get('errors') for row in reports]})
          rows=[item for report in reports for item in report.get('results') or []]
          ids={str(row['announcement_id']) for row in rows}
          recovered={str(row['announcement_id']) for row in rows if row.get('candidate_recovered')}
          if len(rows)!=81 or len(ids)!=81:
              errors.append({'code':'EXACT_81_ACCOUNTING_FAILED','rows':len(rows),'unique_ids':len(ids)})
          if recovered != expected_recovery:
              errors.append({
                  'code':'RECOVERY_SET_MISMATCH',
                  'expected':sorted(expected_recovery),
                  'actual':sorted(recovered),
                  'unexpected':sorted(recovered-expected_recovery),
                  'missing':sorted(expected_recovery-recovered),
              })
          recovered_rows=[row for row in rows if row.get('candidate_recovered')]
          for row in recovered_rows:
              if row.get('baseline_recovered') is not False:
                  errors.append({'code':'BASELINE_NOT_FAIL_CLOSED','announcement_id':row['announcement_id']})
              if not (row.get('candidate_column_role_gate') or {}).get('pass'):
                  errors.append({'code':'COLUMN_GATE_FAILED','announcement_id':row['announcement_id']})
              if row.get('candidate_identity') is None:
                  errors.append({'code':'IDENTITY_MISSING','announcement_id':row['announcement_id']})
              if row.get('strict_selected_concepts') != ['TOTAL_EQUITY']:
                  errors.append({'code':'STRICT_SELECTION_MISMATCH','announcement_id':row['announcement_id']})
          report={
              'gate':'S3G1J_V17_17_EXACT_81_SAFETY_REPLAY',
              'pass':not errors,
              'experimental_only':True,
              'production_parser_changed':False,
              'input_count':81,
              'source_sha_match_count':len(rows),
              'baseline_recovered_count':0,
              'candidate_recovered_count':len(recovered),
              'candidate_recovered_announcement_ids':sorted(recovered),
              'remaining_count':81-len(recovered),
              'remaining_announcement_ids':sorted(ids-recovered),
              'accounting_tolerance':'0.005',
              'global_row_tolerance_changed':False,
              'strict_equity_label':'股东权益总计',
              'e_equals_a_minus_l_inference':False,
              'stage4_alpha_locked':True,
              'per_shard':[{k:row.get(k) for k in ('shard','input_count','processed_count','recovered_count','recovered_announcement_ids')} for row in reports],
              'errors':errors,
          }
          os.makedirs('summary',exist_ok=True)
          json.dump(report,open('summary/s3g1j_v17_17_exact_81_safety_replay.json','w',encoding='utf-8'),ensure_ascii=False,indent=2)
          print(json.dumps(report,ensure_ascii=False,indent=2))
          sys.exit(0 if report['pass'] else 2)
          PY
          code=$?
          echo "SUMMARY_EXIT=$code" >> "$GITHUB_ENV"
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage3-s3g1j-v17-17-exact-81-safety-replay
          path: |
            summary
            candidate
          retention-days: 90
          compression-level: 0
      - name: Preserve fail-closed exact-81 verdict
        if: env.SUMMARY_EXIT != '0'
        run: exit 1
