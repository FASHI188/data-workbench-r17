name: Stage3 S3G1J Page Mode Diagnostic V14.2

on:
  pull_request:
    branches: [stage3-s3g1j-identity-arbitration-v13]
    paths:
      - '.github/workflows/stage3-s3g1j-page-mode-v14-2.yml'
      - 'scripts/probe_stage3_s3g1j_page_modes_v14_2.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose-page-modes:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      PYTHONPATH: scripts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests pymupdf
      - name: Classify exact raw-V14 nonrecoveries without OCR
        run: python scripts/probe_stage3_s3g1j_page_modes_v14_2.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage3-s3g1j-page-mode-v14-2
          path: data/stage3_source_probe_v14/s3g1j_page_modes_v14_2.json
          retention-days: 90
          compression-level: 0
