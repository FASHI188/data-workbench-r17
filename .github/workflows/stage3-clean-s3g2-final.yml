name: Stage3 Clean S3G2 Final Announcement Ledger

# Full-data final replay is an explicit maintenance gate. Lightweight Stage3 core
# contracts run on every relevant PR change; this workflow is re-run manually only
# when S3G2 production logic or its frozen upstream evidence is intentionally changed.
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ github.token }}
  ORIGINAL_RUN: '30326328987'
  ORIGINAL_HEAD: 'ea4c3cbe15d8545593332539657f634a45117074'
  TRANSITION_REPAIR_RUN: '30329920876'
  TRANSITION_HEAD: 'b1b558b54dce6a9f8e8858b15e4a55ce5ba45c0c'
  INSTRUMENT_REPAIR_RUN: '30340337606'
  INSTRUMENT_HEAD: '1ac525aa0b56cd39b233e5c2da9e44d3707c55cb'
  G2_RUN: '30262550161'
  G2_ARTIFACT_DIGEST: 'sha256:652193c9ce18ad9e4cc93b8050910a1fb8b91c849bfdd990e9ee5f860ac147dd'
  G2_INTERVAL_SHA: '2edf62f2d773b198ba1f02e996a741736e1b91830261723faeaa370a4f020ea7'
  G3_RUN: '30263014914'
  G3_ARTIFACT_DIGEST: 'sha256:bf977d4f379d421bd198865b90df90caef7ba6cfb5d6d1af96e5487300c1a2f8'
  PYTHONPATH: scripts

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
      - name: Lock exact upstream runs and artifact identities
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, subprocess
          repo=os.environ['GITHUB_REPOSITORY']
          def gh_json(*args):
              return json.loads(subprocess.check_output(['gh',*args],text=True))
          def run_info(run):
              return gh_json('run','view',str(run),'-R',repo,'--json','conclusion,headSha')
          original=run_info(os.environ['ORIGINAL_RUN'])
          assert original['conclusion']=='failure', original
          assert original['headSha']==os.environ['ORIGINAL_HEAD'], original
          transition=run_info(os.environ['TRANSITION_REPAIR_RUN'])
          assert transition['conclusion']=='success' and transition['headSha']==os.environ['TRANSITION_HEAD'], transition
          instrument=run_info(os.environ['INSTRUMENT_REPAIR_RUN'])
          assert instrument['conclusion']=='success' and instrument['headSha']==os.environ['INSTRUMENT_HEAD'], instrument
          runs={
              'original': int(os.environ['ORIGINAL_RUN']),
              'transition': int(os.environ['TRANSITION_REPAIR_RUN']),
              'instrument': int(os.environ['INSTRUMENT_REPAIR_RUN']),
              'g2': int(os.environ['G2_RUN']),
              'g3': int(os.environ['G3_RUN']),
          }
          names={
              'original':[f'stage3-s3g2-announcement-{i}' for i in [2,3,4,5,6,7,8,9,10,12,13,14]],
              'transition':[f'stage3-s3g2-transition-repair-{i}' for i in [0,1,15]],
              'instrument':['stage3-s3g2-announcement-instrument-repair-11'],
              'g2':['stage2-g2-historical-evidence'],
              'g3':['stage2-g3-sse-601313-repaired-ohlcv'],
          }
          resolved={}
          for key,run in runs.items():
              raw=subprocess.check_output(['gh','api',f'repos/{repo}/actions/runs/{run}/artifacts'],text=True)
              artifacts=json.loads(raw)['artifacts']
              by={a['name']:a for a in artifacts}
              resolved[key]={}
              for name in names[key]:
                  assert name in by and not by[name].get('expired'), (key,name)
                  digest=str(by[name].get('digest') or '')
                  assert digest.startswith('sha256:'), (key,name,digest)
                  resolved[key][name]=digest
          assert resolved['transition']['stage3-s3g2-transition-repair-0']=='sha256:37592f9a935c753a6cacf41553223ff2bb6c5858543ee89bd7e1f133da9551e6'
          assert resolved['transition']['stage3-s3g2-transition-repair-1']=='sha256:400e964db927ae232f565b23b7599f9f77f68310e62ad808b9ae03834753c181'
          assert resolved['transition']['stage3-s3g2-transition-repair-15']=='sha256:d605147fb52f1769ce9eba9c584dc9387291f8274788ef420de6971605449e37'
          assert resolved['instrument']['stage3-s3g2-announcement-instrument-repair-11']=='sha256:1022d91d8abd62b259be74f602f0ea783fc9eedb54ce2dad6f68a86b57c8ee5f'
          assert resolved['g2']['stage2-g2-historical-evidence']==os.environ['G2_ARTIFACT_DIGEST']
          assert resolved['g3']['stage2-g3-sse-601313-repaired-ohlcv']==os.environ['G3_ARTIFACT_DIGEST']
          os.makedirs('build/s3g2-final',exist_ok=True)
          json.dump({'runs':runs,'artifact_digests':resolved},open('build/s3g2-final/input_lock.json','w'),indent=2)
          print(json.dumps({'runs':runs,'locked_artifacts':sum(len(x) for x in resolved.values())},indent=2))
          PY
      - name: Restore exact 12 unaffected original shards
        shell: bash
        run: |
          set -euo pipefail
          rm -rf original transition instrument assembled g2 g3 data/stage3_announcements
          mkdir -p original transition instrument assembled build/s3g2-final
          for i in 2 3 4 5 6 7 8 9 10 12 13 14; do
            gh run download "$ORIGINAL_RUN" -R "$GITHUB_REPOSITORY" -n "stage3-s3g2-announcement-$i" -D "original/$i"
          done
      - name: Restore latest transition and instrument repairs
        shell: bash
        run: |
          set -euo pipefail
          for i in 0 1 15; do
            gh run download "$TRANSITION_REPAIR_RUN" -R "$GITHUB_REPOSITORY" -n "stage3-s3g2-transition-repair-$i" -D "transition/$i"
          done
          gh run download "$INSTRUMENT_REPAIR_RUN" -R "$GITHUB_REPOSITORY" -n stage3-s3g2-announcement-instrument-repair-11 -D instrument/11
      - name: Assemble exactly 16 immutable shard inputs
        id: assembly
        shell: bash
        run: |
          set +e
          python scripts/assemble_stage3_announcement_repair.py \
            --original-root original \
            --transition-repair-root transition \
            --instrument-repair-root instrument \
            --out assembled \
            > build/s3g2-final/assembly_stdout.log 2> build/s3g2-final/assembly_stderr.log
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          cp assembled/stage3_announcement_repair_assembly_audit.json build/s3g2-final/ 2>/dev/null || true
          cat build/s3g2-final/stage3_announcement_repair_assembly_audit.json || true
          cat build/s3g2-final/assembly_stderr.log || true
          exit 0
      - name: Restore exact Stage2 G2/G3 dependencies
        shell: bash
        run: |
          set -euo pipefail
          gh run download "$G2_RUN" -R "$GITHUB_REPOSITORY" -n stage2-g2-historical-evidence -D g2
          echo "$G2_INTERVAL_SHA  g2/security_intervals.csv" | sha256sum -c -
          gh run download "$G3_RUN" -R "$GITHUB_REPOSITORY" -n stage2-g3-sse-601313-repaired-ohlcv -D g3
      - name: Finalize announcement PIT ledger and preserve diagnostics
        id: final
        shell: bash
        run: |
          set +e
          mkdir -p data/stage3_announcements
          if [ "${{ steps.assembly.outputs.exit_code }}" != "0" ]; then
            echo "assembly failed" > data/stage3_announcements/stderr.log
            code=2
          else
            python scripts/finalize_stage3_announcement_ledger.py \
              --root assembled \
              --g2-intervals g2/security_intervals.csv \
              --g3-root g3 \
              --out data/stage3_announcements \
              > data/stage3_announcements/stdout.log \
              2> data/stage3_announcements/stderr.log
            code=$?
          fi
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          cat data/stage3_announcements/stage3_announcement_ledger_audit.json || true
          cat data/stage3_announcements/stderr.log || true
          exit 0
      - name: Upload S3G2 final evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage3-s3g2-announcement-ledger-final
          path: |
            build/s3g2-final
            data/stage3_announcements
          retention-days: 90
          compression-level: 0
      - name: Preserve final fail-closed status
        if: steps.assembly.outputs.exit_code != '0' || steps.final.outputs.exit_code != '0'
        run: exit 1
