name: Stage3 S3G1J V15 Residual Shape

on:
  pull_request:
    branches: [stage3-s3g1j-identity-arbitration-v13]
    paths:
      - '.github/workflows/stage3-s3g1j-v15-residual-shape.yml'
      - 'scripts/probe_stage3_s3g1j_v15_residual_shape.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ github.token }}
  V13_SMOKE_RUN: '30382695045'

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Restore exact V12.1 version ledger
        run: |
          rm -rf versions data/stage3_source_probe_v15
          gh run download "$V13_SMOKE_RUN" -R "$GITHUB_REPOSITORY" \
            -n stage3-s3g1j-v13-smoke-versions -D versions
          test -f versions/stage3_financial_report_versions_v3.csv.gz
      - name: Download completed V13 representative smoke logs
        run: gh run view "$V13_SMOKE_RUN" -R "$GITHUB_REPOSITORY" --log > v13-smoke.log
      - name: Classify errors as single canonical vs true same-moment tie
        run: |
          python scripts/probe_stage3_s3g1j_v15_residual_shape.py \
            --versions versions/stage3_financial_report_versions_v3.csv.gz \
            --run-log v13-smoke.log \
            --out data/stage3_source_probe_v15/residual_shape_0179.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage3-s3g1j-v15-residual-shape
          path: data/stage3_source_probe_v15/residual_shape_0179.json
          retention-days: 90
          compression-level: 0
