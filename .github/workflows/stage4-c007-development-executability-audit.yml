name: Stage4 C007 Development Executability Audit

on:
  pull_request:
    branches:
      - agent/stage3-clean-integration
    paths:
      - .github/workflows/stage4-c007-development-executability-audit.yml
      - scripts/audit_stage4_c007_development_executability.py
      - governance/stage4_c007_development_executability_audit_contract.json

permissions:
  contents: read
  actions: read

jobs:
  development-only-audit:
    if: github.head_ref == 'agent/stage4-c007-development-executability-audit'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned audit runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install duckdb==1.3.2 pyarrow==25.0.0 numpy==2.5.1

      - name: Download frozen C007 OOF only
        uses: actions/download-artifact@v4
        with:
          name: stage4-alpha-v1-cv-oof-C007
          path: inputs/c007-oof
          github-token: ${{ github.token }}
          repository: FASHI188/data-workbench-r17
          run-id: '31898964450'

      - name: Download frozen Stage2 G3 OHLCV
        uses: actions/download-artifact@v4
        with:
          name: stage2-g3-sse-601313-repaired-ohlcv
          path: inputs/g3
          github-token: ${{ github.token }}
          repository: FASHI188/data-workbench-r17
          run-id: '30263014914'

      - name: Download frozen Stage2 G4 state
        uses: actions/download-artifact@v4
        with:
          name: stage2-g4-sse-601313-repaired-state
          path: inputs/g4
          github-token: ${{ github.token }}
          repository: FASHI188/data-workbench-r17
          run-id: '30263162968'

      - name: Static permission guard
        run: |
          test "$(grep -RniE 'read.*2023|read.*2024|oos_predictions|oos_labels|model\.predict|\.fit\(' scripts/audit_stage4_c007_development_executability.py governance/stage4_c007_development_executability_audit_contract.json | wc -l)" -eq 0
          grep -q 'oos_prediction_forbidden.*true' governance/stage4_c007_development_executability_audit_contract.json
          grep -q 'oos_label_access_forbidden.*true' governance/stage4_c007_development_executability_audit_contract.json
          grep -q 'model_load_forbidden.*true' governance/stage4_c007_development_executability_audit_contract.json

      - name: Run exact development-only C007 executability audit
        run: |
          python scripts/audit_stage4_c007_development_executability.py \
            --contract governance/stage4_c007_development_executability_audit_contract.json \
            --oof-root inputs/c007-oof \
            --g3-root inputs/g3 \
            --g4-root inputs/g4 \
            --out build/stage4-c007-development-executability-audit

      - name: Upload immutable audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: stage4-c007-development-executability-audit
          path: build/stage4-c007-development-executability-audit
          if-no-files-found: error
          retention-days: 90
