name: Stage4 C007 Development Executability Audit

on:
  pull_request:
    branches:
      - agent/stage3-clean-integration
    paths:
      - .github/workflows/stage4-c007-development-executability-audit.yml
      - scripts/audit_stage4_c007_development_executability.py
      - governance/stage4_c007_development_executability_audit_contract.json

permissions:
  contents: read
  actions: read

jobs:
  development-only-audit:
    if: github.head_ref == 'agent/stage4-c007-development-executability-audit'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'

      - name: Install pinned audit runtime
        run: |
          python -m pip install --disable-pip-version-check duckdb==1.3.2

      - name: Static physical-input permission guard
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/audit_stage4_c007_development_executability.py
          ! grep -nE 'read_csv|csv\.gz|8651700277|8651786270|30263014914|30263162968|oos_predictions|oos_labels|model\.predict|predict_proba|\.fit\(|fit_predict\(|partial_fit\(' \
            scripts/audit_stage4_c007_development_executability.py
          grep -q 'physical_development_input_required.*true' governance/stage4_c007_development_executability_audit_contract.json
          grep -q 'broad_stage2_inputs_forbidden.*true' governance/stage4_c007_development_executability_audit_contract.json
          grep -q 'oos_prediction_forbidden.*true' governance/stage4_c007_development_executability_audit_contract.json
          grep -q 'oos_label_access_forbidden.*true' governance/stage4_c007_development_executability_audit_contract.json
          grep -q 'model_load_forbidden.*true' governance/stage4_c007_development_executability_audit_contract.json
          grep -q 'final_lockbox_access_forbidden.*true' governance/stage4_c007_development_executability_audit_contract.json
          python - <<'PY'
          import hashlib,json
          p='governance/stage4_c007_development_executability_audit_contract.json'
          c=json.load(open(p,encoding='utf-8'))
          fp=hashlib.sha256(json.dumps(c['fingerprint_basis'],sort_keys=True,separators=(',',':'),ensure_ascii=False).encode()).hexdigest()
          assert fp==c['fingerprint']=='510aab7d557fe998a88d46426ca8384dc075362fe1340bb0a3db5b0a05e09652'
          assert c['status']=='DEVELOPMENT_ONLY_READ_ONLY_AUDIT_PHYSICAL_INPUT_RERUN'
          physical=c['fingerprint_basis']['inputs']['development_physical_boundary']
          assert physical['artifact_id']==9686675036
          assert physical['artifact_digest']=='sha256:feac72bb126504b27063ca86e8ce386376e813fa422c8552dd809135194fe6c5'
          print(json.dumps({'contract_fingerprint':fp,'physical_artifact_id':physical['artifact_id'],'broad_stage2_input_authority':False}))
          PY

      - name: Download exact sealed development physical-boundary artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p inputs/physical-boundary
          curl --fail --location --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9686675036/zip" \
            -o inputs/physical-boundary.zip
          actual="$(sha256sum inputs/physical-boundary.zip | awk '{print $1}')"
          test "$actual" = "feac72bb126504b27063ca86e8ce386376e813fa422c8552dd809135194fe6c5"
          unzip -q inputs/physical-boundary.zip -d inputs/physical-boundary

      - name: Run exact development-only C007 executability audit from physical package
        run: |
          python scripts/audit_stage4_c007_development_executability.py \
            --contract governance/stage4_c007_development_executability_audit_contract.json \
            --package-root inputs/physical-boundary \
            --out build/stage4-c007-development-executability-audit

      - name: Upload immutable rerun audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: stage4-c007-development-executability-audit
          path: build/stage4-c007-development-executability-audit
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
