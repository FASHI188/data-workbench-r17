name: Stage3 S3G1H Original Filing PDF Parser Probe

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [reopened, synchronize]
    paths:
      - 'scripts/stage3_financial_pdf_parser.py'
      - 'scripts/probe_stage3_financial_pdf_parser.py'
      - '.github/workflows/stage3-s3g1h-financial-pdf-parser-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests pymupdf
      - name: Probe revision-level original filing PDF extraction
        shell: bash
        run: |
          set +e
          mkdir -p data/stage3_source_probe
          python scripts/probe_stage3_financial_pdf_parser.py \
            > data/stage3_source_probe/pdf_parser_stdout.log \
            2> data/stage3_source_probe/pdf_parser_stderr.log
          code=$?
          echo "S3G1H_EXIT=$code" >> "$GITHUB_ENV"
          cat data/stage3_source_probe/financial_pdf_parser_probe.json || true
          cat data/stage3_source_probe/pdf_parser_stderr.log || true
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: stage3-s3g1h-financial-pdf-parser-probe
          path: data/stage3_source_probe
          retention-days: 90
      - name: Preserve fail-closed PDF parser status
        if: env.S3G1H_EXIT != '0'
        run: exit 1
