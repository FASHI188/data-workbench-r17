name: Stage3 S3G1J V17.28 Pending Authority Contract

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'governance/stage3_s3g1j_v17_28_runtime_wrapper_pending.json'
      - 'tests/test_stage3_v17_28_runtime_wrapper_pending_manifest.py'
      - '.github/workflows/stage3-s3g1j-v17-28-pending-authority-contract.yml'

permissions:
  contents: read

env:
  PYTHONPATH: scripts

jobs:
  pending-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
      - name: Verify implementation remains inactive
        run: |
          python -m unittest tests.test_stage3_v17_28_runtime_wrapper_pending_manifest -v
          python - <<'PY'
          from pathlib import Path
          active=Path('governance/stage3_s3g1j_runtime_manifest.json').read_text(encoding='utf-8')
          activation=Path('governance/stage3_workflow_activation_manifest.json').read_text(encoding='utf-8')
          assert '"generation": "V17.27"' in active
          assert '"runtime_generation": "V17.27"' in active
          assert '"generation": "V17.27"' in activation
          assert 'V17_28_EXACT_SOURCE_SPLIT_GROUP_EQUITY_PRODUCTION' not in active
          assert 'stage3-s3g1j-v17-28-runtime-wrapper.yml' not in activation
          print('S3G1J_V17_28_PENDING_AUTHORITY_PASS')
          PY
