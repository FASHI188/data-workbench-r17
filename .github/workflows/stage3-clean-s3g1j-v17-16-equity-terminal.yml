name: Stage3 Clean S3G1J V17.16 Exact-Three Equity Terminal Diagnostic

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/diagnose_stage3_s3g1j_v17_16_equity_terminal.py'
      - '.github/workflows/stage3-clean-s3g1j-v17-16-equity-terminal.yml'

permissions:
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ github.token }}
  FROZEN_RUN: '30424465440'
  FROZEN_HEAD: 'be42608b75f77af13c36620da7e7fa03c563afde'
  FROZEN_ARTIFACT: 'stage3-s3g1j-v15-single-source-input'
  FROZEN_DIGEST: 'sha256:272f52239adc2fc5d4343ec091495dffcd39324b425784cdf5a7491f63a2e6fd'
  V17_11_RUN: '30510347556'
  V17_11_HEAD: 'e98d26b962a58cecc5c6416214e3c798c5e8a49e'
  V17_11_ARTIFACT: 'stage3-s3g1j-v17-11-column-evidence-acceptance'
  V17_11_DIGEST: 'sha256:b1143faaf2c1a91fd64e21ef35c05e787200d957f888613fa2f2a2fc23c43ad9'
  V17_15_RUN: '30535567713'
  V17_15_HEAD: '55ce359de27f32343f272b4d53d167f08ee38ea1'
  V17_15_ARTIFACT: 'stage3-s3g1j-v17-15-exact-82-safety-replay'
  V17_15_DIGEST: 'sha256:6bb7fe3530c1f56486092a99476e7a72669b40f172334281920ca244e785ba98'
  PYTHONPATH: scripts

jobs:
  lock-inputs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lock exact frozen inputs and accepted residual states
        shell: bash
        run: |
          set -euo pipefail
          lock_run_artifact() {
            run="$1"; expected_head="$2"; artifact="$3"; expected_digest="$4"
            test "$(gh run view "$run" -R "$GITHUB_REPOSITORY" --json conclusion --jq '.conclusion')" = success
            test "$(gh run view "$run" -R "$GITHUB_REPOSITORY" --json headSha --jq '.headSha')" = "$expected_head"
            actual=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/artifacts" --jq ".artifacts[] | select(.name==\"$artifact\") | .digest")
            test "$actual" = "$expected_digest"
          }
          lock_run_artifact "$FROZEN_RUN" "$FROZEN_HEAD" "$FROZEN_ARTIFACT" "$FROZEN_DIGEST"
          lock_run_artifact "$V17_11_RUN" "$V17_11_HEAD" "$V17_11_ARTIFACT" "$V17_11_DIGEST"
          lock_run_artifact "$V17_15_RUN" "$V17_15_HEAD" "$V17_15_ARTIFACT" "$V17_15_DIGEST"

  diagnose:
    needs: lock-inputs
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        announcement_id: ['1212731093', '1217717273', '1219411922']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
      - name: Install exact verified diagnostic dependencies
        run: python -m pip install --disable-pip-version-check --constraint requirements/constraints-verified.txt requests PyMuPDF
      - name: Restore exact accepted evidence
        shell: bash
        run: |
          set -euo pipefail
          rm -rf prepared accepted11 accepted15 build/s3g1j-v17-16
          gh run download "$FROZEN_RUN" -R "$GITHUB_REPOSITORY" -n "$FROZEN_ARTIFACT" -D prepared
          gh run download "$V17_11_RUN" -R "$GITHUB_REPOSITORY" -n "$V17_11_ARTIFACT" -D accepted11
          gh run download "$V17_15_RUN" -R "$GITHUB_REPOSITORY" -n "$V17_15_ARTIFACT" -D accepted15
          test -f prepared/single_source_residual_versions.csv.gz
          test -f accepted11/v17_11_column_evidence_acceptance.json
          test -f accepted15/summary/s3g1j_v17_15_exact_82_safety_replay.json
      - name: Diagnose exact-three equity terminal structure without accepting values
        shell: bash
        run: |
          set +e
          out="build/s3g1j-v17-16/${{ matrix.announcement_id }}.json"
          mkdir -p "$(dirname "$out")"
          python scripts/diagnose_stage3_s3g1j_v17_16_equity_terminal.py \
            --versions prepared/single_source_residual_versions.csv.gz \
            --accepted-v17-11 accepted11/v17_11_column_evidence_acceptance.json \
            --v17-15-summary accepted15/summary/s3g1j_v17_15_exact_82_safety_replay.json \
            --announcement-id '${{ matrix.announcement_id }}' --out "$out" \
            > "${out%.json}.stdout.log" 2> "${out%.json}.stderr.log"
          code=$?
          echo "DIAGNOSTIC_EXIT=$code" >> "$GITHUB_ENV"
          cat "${out%.json}.stdout.log" || true
          tail -100 "${out%.json}.stderr.log" || true
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage3-s3g1j-v17-16-equity-${{ matrix.announcement_id }}
          path: build/s3g1j-v17-16
          retention-days: 90
          compression-level: 0
      - name: Preserve diagnostic execution failure
        if: env.DIAGNOSTIC_EXIT != '0'
        run: exit 1

  summarize:
    needs: diagnose
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: stage3-s3g1j-v17-16-equity-*
          path: candidate
          merge-multiple: true
      - name: Aggregate exact-three equity-terminal evidence
        shell: bash
        run: |
          set +e
          python - <<'PY'
          import glob,json,os,sys
          expected={'1212731093','1217717273','1219411922'}
          paths=sorted(glob.glob('candidate/*.json'))
          rows=[json.load(open(path,encoding='utf-8')) for path in paths]
          actual={str(row.get('announcement_id')) for row in rows}
          errors=[]
          if actual!=expected:
              errors.append({'code':'EXACT_THREE_SET_MISMATCH','expected':sorted(expected),'actual':sorted(actual)})
          if not all(row.get('pass') is True for row in rows):
              errors.append({'code':'DIAGNOSTIC_FAILED','details':[(row.get('announcement_id'),row.get('errors')) for row in rows]})
          if not all(row.get('diagnostic_only') is True and row.get('no_value_acceptance') is True for row in rows):
              errors.append({'code':'POLICY_FLAG_MISMATCH'})
          report={
              'gate':'S3G1J_V17_16_EXACT_THREE_EQUITY_TERMINAL_DIAGNOSTIC',
              'pass':not errors,
              'diagnostic_only':True,
              'no_parser_change':True,
              'no_value_acceptance':True,
              'no_e_equals_a_minus_l_inference':True,
              'input_count':3,
              'classifications':{str(row['announcement_id']):row.get('classification') for row in rows},
              'documents':[{k:row.get(k) for k in ('announcement_id','source_code','economic_date','source_sha256','formal_window','classification','counts')} for row in rows],
              'accounting_tolerance_changed':False,
              'source_policy_changed':False,
              'stage4_alpha_locked':True,
              'errors':errors,
          }
          os.makedirs('summary',exist_ok=True)
          json.dump(report,open('summary/s3g1j_v17_16_exact_three_equity_terminal.json','w',encoding='utf-8'),ensure_ascii=False,indent=2)
          print(json.dumps(report,ensure_ascii=False,indent=2))
          sys.exit(0 if report['pass'] else 2)
          PY
          code=$?
          echo "SUMMARY_EXIT=$code" >> "$GITHUB_ENV"
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage3-s3g1j-v17-16-exact-three-equity-terminal
          path: |
            summary
            candidate
          retention-days: 90
          compression-level: 0
      - name: Preserve fail-closed diagnostic verdict
        if: env.SUMMARY_EXIT != '0'
        run: exit 1
