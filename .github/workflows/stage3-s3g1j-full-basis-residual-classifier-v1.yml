name: Stage3 S3G1J Full-Basis Residual Classifier V1

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/classify_stage3_s3g1j_full_basis_residuals.py'
      - 'tests/test_stage3_s3g1j_full_basis_residual_classifier.py'
      - '.github/workflows/stage3-s3g1j-full-basis-residual-classifier-v1.yml'

permissions:
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ github.token }}
  SOURCE_RUN: '30649251360'
  SOURCE_HEAD: '6b274dbd32734ab0af6a75a6d595925278dd8973'
  SOURCE_ARTIFACT: 'stage3-s3g1j-v17-21-full-final'
  SOURCE_ARTIFACT_DIGEST: 'sha256:7faff72949a6e0a98f49088bce99bc2df37c7cbcb0259b39d1b2655fc02f6086'
  SOURCE_DOCUMENTS_GZIP_SHA256: 'de31e148abd19f866b863135d0361ab2728e97577a8e584b7572fdbcbcaa06d8'
  PYTHONPATH: scripts

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
      - name: Lock expected fail-closed full-basis evidence
        shell: bash
        run: |
          set -euo pipefail
          run_json=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN")
          test "$(jq -r '.conclusion' <<<"$run_json")" = failure
          test "$(jq -r '.head_sha' <<<"$run_json")" = "$SOURCE_HEAD"
          artifact_json=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN/artifacts")
          actual=$(jq -r --arg name "$SOURCE_ARTIFACT" '.artifacts[] | select(.name==$name) | .digest' <<<"$artifact_json")
          test "$actual" = "$SOURCE_ARTIFACT_DIGEST"
      - name: Download locked full-basis artifact
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            rm -rf source
            if gh run download "$SOURCE_RUN" -R "$GITHUB_REPOSITORY" -n "$SOURCE_ARTIFACT" -D source; then
              break
            fi
            test "$attempt" -lt 6
            sleep $((attempt * 15))
          done
          test -f source/build/stage3-financial-raw-final/stage3_financial_documents.csv.gz
      - name: Run classifier contracts
        run: python -m unittest tests.test_stage3_s3g1j_full_basis_residual_classifier -v
      - name: Build deterministic residual classification
        run: |
          python scripts/classify_stage3_s3g1j_full_basis_residuals.py \
            --documents source/build/stage3-financial-raw-final/stage3_financial_documents.csv.gz \
            --expected-gzip-sha256 "$SOURCE_DOCUMENTS_GZIP_SHA256" \
            --out-root build/s3g1j-full-basis-residual-classifier-v1
      - name: Enforce full-basis classification identity
        run: |
          python - <<'PY'
          import json
          path='build/s3g1j-full-basis-residual-classifier-v1/s3g1j_full_basis_residual_classification_summary.json'
          x=json.load(open(path,encoding='utf-8'))
          assert x['pass'] is True and x['errors']==[]
          assert x['input_document_rows']==121354
          assert x['pass_document_rows']==119974
          assert x['residual_document_rows']==1380
          assert x['p0_safe_near_complete_count']==23
          assert x['p1_identity_conflict_tier2_3_count']==71
          assert x['class_counts']['SINGLE_CANONICAL_NO_VALIDATED_BLOCK_TIER2_3']==23
          assert x['class_counts']['SINGLE_CANONICAL_IDENTITY_MISMATCH_TIER2_3']==71
          assert x['class_counts']['MULTI_CANDIDATE_VALUE_CONFLICT']==14
          assert x['class_counts']['CANONICAL_PDF_ISSUER_MISMATCH']==83
          assert x['classification_ledger_sha256']=='c7625542e4aada5cc90b0316f5ab71beb4534e752628dbc611749da704f08558'
          assert x['classification_ledger_gzip_sha256']=='11ef25f4bc3b08b20b55ac7cfa47d2e9495f4383415b66191f61217ca3cee49e'
          assert x['p0_ledger_sha256']=='73a9f191d1e0613033a40dc4624fcb73568891cea4c219591272e92dce2d1d30'
          assert x['p0_ledger_gzip_sha256']=='6b66c8a43df0359d1cbf2fd6e7e8188f3c841bbe59657b6b8773b6f2a9919142'
          assert x['production_data_changed'] is False
          assert x['parser_changed'] is False
          assert x['stage3_status']=='NOT_READY'
          assert x['stage4_alpha_locked'] is True
          print('S3G1J_FULL_BASIS_RESIDUAL_CLASSIFIER_V1_PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stage3-s3g1j-full-basis-residual-classification-v1
          path: build/s3g1j-full-basis-residual-classifier-v1
          retention-days: 90
          compression-level: 0
