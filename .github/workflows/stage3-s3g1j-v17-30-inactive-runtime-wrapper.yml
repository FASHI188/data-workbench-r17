name: Stage3 S3G1J V17.30 Inactive Runtime Wrapper

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/stage3_financial_pdf_parser_v22_promotion_safety.py'
      - 'scripts/stage3_financial_pdf_parser_v22.py'
      - 'scripts/extract_stage3_financial_pdf_values_v20.py'
      - 'tests/test_stage3_v17_30_runtime_wrapper.py'
      - 'tests/test_stage3_v17_30_runtime_wrapper_pending_manifest.py'
      - 'governance/stage3_s3g1j_v17_30_runtime_wrapper_pending.json'
      - '.github/workflows/stage3-s3g1j-v17-30-inactive-runtime-wrapper.yml'

permissions:
  contents: read
  actions: read
  pull-requests: read

env:
  GH_TOKEN: ${{ github.token }}
  PYTHONPATH: scripts
  FORMAL_V17_29_PARSER_BLOB: '37ab001356c479808e3fa5f67f2270649e3130ba'
  FORMAL_V17_29_EXTRACTOR_BLOB: '7be4f17357e92144c3f54ddd4951ec57a0878049'
  PROMOTION_PR: '121'
  PROMOTION_HEAD: '2cd84a81b3d4f291aae2ae2cb5b6daf8629ad030'
  PROMOTION_RUN: '31452374012'
  PROMOTION_ARTIFACT_ID: '9086776910'
  PROMOTION_ARTIFACT: 'stage3-s3g1j-v17-29-cross-page-production-promotion-safety-v1'
  PROMOTION_DIGEST: 'sha256:d3bb089c7e0524a39b62016f6b6b41539aec99894b874c2940678bee24edebc4'
  PROMOTION_REPORT_SHA256: '854d79ff1a826b13579ef5014d666994f7b5520f5a0c35dfc7f3d93f5eb41a16'
  GOVERNANCE_PR: '122'
  GOVERNANCE_HEAD: '638d9daf1b59ccbaa7e9254d7d2af72f2953a092'
  GOVERNANCE_MERGE: '62c6da875650d1aa3a06dcc13751599033248e6d'

jobs:
  runtime-wrapper:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
      - name: Install verified runtime
        run: python -m pip install --disable-pip-version-check -c requirements/constraints-verified.txt requests pymupdf
      - name: Lock formal V17.29 files and registered promotion-safety governance
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object scripts/stage3_financial_pdf_parser_v21.py)" = "$FORMAL_V17_29_PARSER_BLOB"
          test "$(git hash-object scripts/extract_stage3_financial_pdf_values_v19.py)" = "$FORMAL_V17_29_EXTRACTOR_BLOB"
          gov=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$GOVERNANCE_PR")
          test "$(jq -r '.head.sha' <<<"$gov")" = "$GOVERNANCE_HEAD"
          test "$(jq -r '.merged' <<<"$gov")" = true
          test "$(jq -r '.merge_commit_sha' <<<"$gov")" = "$GOVERNANCE_MERGE"
          python - <<'PY'
          import json
          e=json.load(open('governance/stage3_s3g1j_v17_29_cross_page_production_promotion_safety.json',encoding='utf-8'))
          assert e['schema_version']==1
          assert e['status']=='MACHINE_ACCEPTED_PRODUCTION_PROMOTION_SAFETY_ONLY_NO_RUNTIME_PROMOTION'
          assert e['diagnostic_pr']['number']==121
          assert e['diagnostic_pr']['head_sha']=='2cd84a81b3d4f291aae2ae2cb5b6daf8629ad030'
          assert e['diagnostic_pr']['closed_without_merge'] is True
          assert e['accepted_run']['run_id']==31452374012
          assert e['accepted_run']['artifact_id']==9086776910
          assert e['accepted_run']['artifact_digest']=='sha256:d3bb089c7e0524a39b62016f6b6b41539aec99894b874c2940678bee24edebc4'
          assert e['output_identities']['report_sha256']=='854d79ff1a826b13579ef5014d666994f7b5520f5a0c35dfc7f3d93f5eb41a16'
          assert e['authorization']['production_promotion_safety_pass'] is True
          assert e['authorization']['runtime_wrapper_candidate_experiment_eligible'] is True
          assert e['authorization']['formal_runtime_generation_remains']=='V17.29'
          assert e['authorization']['proposed_next_generation_label']=='V17.30_NOT_AUTHORIZED'
          assert e['authorization']['runtime_promotion_authorized'] is False
          assert e['authorization']['fresh_full_basis_execution_authorized'] is False
          print('V17_30_PROMOTION_GOVERNANCE_LOCK_PASS')
          PY
      - name: Lock closed-unmerged promotion execution and exact artifact
        shell: bash
        run: |
          set -euo pipefail
          pr=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PROMOTION_PR")
          test "$(jq -r '.head.sha' <<<"$pr")" = "$PROMOTION_HEAD"
          test "$(jq -r '.state' <<<"$pr")" = closed
          test "$(jq -r '.merged' <<<"$pr")" = false
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PROMOTION_RUN")
          test "$(jq -r '.status' <<<"$run")" = completed
          test "$(jq -r '.conclusion' <<<"$run")" = success
          test "$(jq -r '.head_sha' <<<"$run")" = "$PROMOTION_HEAD"
          artifact=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$PROMOTION_ARTIFACT_ID")
          test "$(jq -r '.name' <<<"$artifact")" = "$PROMOTION_ARTIFACT"
          test "$(jq -r '.digest' <<<"$artifact")" = "$PROMOTION_DIGEST"
          test "$(jq -r '.expired' <<<"$artifact")" = false
          test "$(jq -r '.workflow_run.id' <<<"$artifact")" = "$PROMOTION_RUN"
          test "$(jq -r '.workflow_run.head_sha' <<<"$artifact")" = "$PROMOTION_HEAD"
      - uses: actions/download-artifact@v4
        with:
          name: stage3-s3g1j-v17-29-cross-page-production-promotion-safety-v1
          path: accepted-promotion
          repository: FASHI188/data-workbench-r17
          run-id: 31452374012
          github-token: ${{ github.token }}
      - name: Verify accepted promotion report and shadow values
        shell: bash
        run: |
          set -euo pipefail
          report=accepted-promotion/stage3_s3g1j_v17_29_cross_page_production_promotion_safety.json
          values=accepted-promotion/stage3_financial_values_v17_29_cross_page_promotion_safety.csv.gz
          test "$(sha256sum "$report" | awk '{print $1}')" = "$PROMOTION_REPORT_SHA256"
          test "$(sha256sum "$values" | awk '{print $1}')" = 5a4e9e4c901419886f4eb932653314ccebacdb261ec39f516a11bfd81be1904d
          echo "PROMOTION_REPORT=$report" >> "$GITHUB_ENV"
          echo "PROMOTION_VALUES=$values" >> "$GITHUB_ENV"
          python - <<'PY'
          import json
          r=json.load(open('accepted-promotion/stage3_s3g1j_v17_29_cross_page_production_promotion_safety.json',encoding='utf-8'))
          assert r['pass'] is True and r['errors']==[]
          assert r['target_announcement_ids']==['1223347318','1223407043']
          assert r['promotion_document_rows']==121354
          assert r['promotion_numeric_rows']==1051826
          assert r['promotion_document_errors']==1362
          assert r['promotion_unresolved_ties']==1279
          assert r['non_target_document_exact_equal'] is True
          assert r['existing_numeric_exact_equal'] is True
          assert r['runtime_promotion_authorized'] is False
          assert r['full_basis_execution_authorized'] is False
          print('V17_30_PROMOTION_REPORT_LOCK_PASS')
          PY
      - name: Run inactive wrapper and pending-authority contracts
        run: |
          python -m unittest \
            tests.test_stage3_v17_30_runtime_wrapper \
            tests.test_stage3_v17_30_runtime_wrapper_pending_manifest \
            -v
          python -m py_compile \
            scripts/stage3_financial_pdf_parser_v22_promotion_safety.py \
            scripts/stage3_financial_pdf_parser_v22.py \
            scripts/extract_stage3_financial_pdf_values_v20.py
      - name: Verify two real sources and one real formal V17.29 non-target
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/v17_30_runtime_wrapper
          python - <<'PY'
          import csv,gzip,hashlib,json,os
          from pathlib import Path
          import requests
          import stage3_financial_pdf_parser_v21 as formal
          import stage3_financial_pdf_parser_v22 as parser

          accepted=json.load(open(os.environ['PROMOTION_REPORT'],encoding='utf-8'))
          report_by_id={x['announcement_id']:x for x in accepted['target_reports']}
          gold={}
          with gzip.open(os.environ['PROMOTION_VALUES'],'rt',encoding='utf-8',newline='') as f:
              for row in csv.DictReader(f):
                  if row['announcement_id'] in {'1223347318','1223407043'}:
                      gold.setdefault(row['announcement_id'],{})[row['concept']]={
                          'value':row['normalized_cny_value'],
                          'page':int(row['page']),
                          'alias':row['matched_alias'],
                      }
          assert set(gold)=={'1223347318','1223407043'}
          assert all(set(v)=={'TOTAL_ASSETS','TOTAL_LIABILITIES','TOTAL_EQUITY'} for v in gold.values())

          session=requests.Session()
          session.headers.update({'User-Agent':'data-workbench-r17-v17-30-inactive-wrapper/1.0','Accept':'application/pdf,*/*;q=0.8'})
          results=[]
          for digest,target in sorted(parser.TARGETS.items(),key=lambda kv:kv[1]['announcement_id']):
              aid=target['announcement_id']
              response=session.get(target['source_url'],timeout=(30,180))
              response.raise_for_status()
              raw=response.content
              assert raw.startswith(b'%PDF')
              assert hashlib.sha256(raw).hexdigest()==digest
              assert len(raw)==int(target['source_bytes'])
              out=parser.parse_pdf_bytes(raw,target['economic_date'])
              assert out['parser_version']==parser.METHOD
              assert out['validation_errors']==[]
              found={c:x for c,x in out['observations'].items() if isinstance(x,dict) and x.get('status')=='FOUND'}
              assert set(found)==set(parser.ALLOWED_CONCEPTS)
              for concept in parser.ALLOWED_CONCEPTS:
                  assert found[concept]['normalized_cny_value']==gold[aid][concept]['value']
                  assert int(found[concept]['page'])==gold[aid][concept]['page']
                  assert found[concept]['matched_alias']==gold[aid][concept]['alias']
              block=out['balance_sheet_block']
              shadow=report_by_id[aid]
              assert block['inactive_runtime_wrapper'] is True
              assert block['runtime_promotion_authorized'] is False
              assert block['v17_30_authority_activated'] is False
              assert block['formal_runtime_generation_before_activation']=='V17.29'
              assert block['formal_runtime_generation']=='V17.30'
              assert block['production_runtime_generation']=='V17.30'
              assert block['promotion_safety_run']==31452374012
              assert block['promotion_safety_artifact_id']==9086776910
              assert block['promotion_safety_artifact_digest']==os.environ['PROMOTION_DIGEST']
              assert block['selected_pages']==shadow['selected_pages']
              assert block['cross_page_equity']==shadow['cross_page']
              assert block['dual_column_identity']==shadow['identity']
              assert all(x['identity_residual_cny']=='0.00' for x in block['dual_column_identity']['columns'])
              results.append({
                  'announcement_id':aid,
                  'source_sha256':digest,
                  'source_bytes':len(raw),
                  'economic_date':target['economic_date'],
                  'selected_pages':block['selected_pages'],
                  'values':{c:found[c]['normalized_cny_value'] for c in parser.ALLOWED_CONCEPTS},
                  'cross_page_equity':block['cross_page_equity'],
                  'dual_column_identity':block['dual_column_identity'],
              })

          old_digest,old_target=min(formal.TARGETS.items(),key=lambda kv:int(kv[1]['source_bytes']))
          response=session.get(old_target['source_url'],timeout=(30,180))
          response.raise_for_status()
          raw=response.content
          assert hashlib.sha256(raw).hexdigest()==old_digest
          assert len(raw)==int(old_target['source_bytes'])
          formal_out=formal.parse_pdf_bytes(raw,old_target['economic_date'])
          wrapped_out=parser.parse_pdf_bytes(raw,old_target['economic_date'])
          assert wrapped_out==formal_out
          assert wrapped_out['parser_version']==formal.METHOD

          runtime=json.load(open('governance/stage3_s3g1j_runtime_manifest.json',encoding='utf-8'))
          project=json.load(open('data/project_status.json',encoding='utf-8'))
          assert runtime['current_production_authority']['generation']=='V17.29'
          assert runtime['formal_runtime']['runtime_generation']=='V17.29'
          assert runtime['formal_runtime']['parser_git_blob']=='37ab001356c479808e3fa5f67f2270649e3130ba'
          assert runtime['formal_runtime']['extractor_git_blob']=='7be4f17357e92144c3f54ddd4951ec57a0878049'
          full=runtime['full_basis_last_completed_final']
          assert full['generation']=='V17.29'
          assert full['run']==31389854868
          assert full['artifact_id']==9063271903
          assert full['numeric_observations']==1051820
          assert full['document_error_count']==1364
          assert full['unresolved_tie_count']==1281
          assert full['verdict']=='FAIL_CLOSED'
          assert project['stage3']['status']=='NOT_READY'
          assert project['stage4_unlocked'] is False
          assert project['alpha_training_allowed'] is False
          assert project['live_signal_allowed'] is False

          report={
              'gate':'S3G1J_V17_30_INACTIVE_RUNTIME_WRAPPER_V1',
              'implementation_head':os.environ['GITHUB_SHA'],
              'promotion_safety_pr':121,
              'promotion_safety_head':os.environ['PROMOTION_HEAD'],
              'promotion_safety_run':31452374012,
              'promotion_safety_artifact_id':9086776910,
              'promotion_safety_artifact_digest':os.environ['PROMOTION_DIGEST'],
              'target_count':2,
              'targets':results,
              'real_source_runtime_wrapper_pass':True,
              'real_formal_v17_29_non_target_delegation_pass':True,
              'synthetic_wrong_identity_delegation_contract_pass':True,
              'formal_runtime_authority_before_activation':'V17.29',
              'v17_30_authority_activated':False,
              'fresh_full_basis_execution_started':False,
              'shadow_expected_full_basis_numeric_rows':1051826,
              'shadow_expected_full_basis_document_errors':1362,
              'shadow_expected_full_basis_unresolved_ties':1279,
              'shadow_expected_values_are_not_production_acceptance':True,
              'production_data_changed':False,
              'trained_model_changed':False,
              'live_configuration_changed':False,
              'stage3_status':'NOT_READY',
              'stage4_alpha_live_locked':True,
              'main_changed':False,
              'pass':True,
              'errors':[],
          }
          out=Path('build/v17_30_runtime_wrapper/stage3_s3g1j_v17_30_runtime_wrapper.json')
          out.write_text(json.dumps(report,ensure_ascii=False,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY
      - name: Assert formal project authority remains V17.29 and locked
        run: |
          python - <<'PY'
          import json
          pending=json.load(open('governance/stage3_s3g1j_v17_30_runtime_wrapper_pending.json',encoding='utf-8'))
          runtime=json.load(open('governance/stage3_s3g1j_runtime_manifest.json',encoding='utf-8'))
          project=json.load(open('data/project_status.json',encoding='utf-8'))
          lock=json.load(open('config/stage3_final_lock.json',encoding='utf-8'))
          assert pending['hard_boundaries']['v17_30_authority_activated'] is False
          assert pending['hard_boundaries']['runtime_authority_changed'] is False
          assert pending['hard_boundaries']['fresh_full_basis_execution_started'] is False
          assert runtime['formal_runtime']['runtime_generation']=='V17.29'
          assert runtime['full_basis_last_completed_final']['run']==31389854868
          assert runtime['full_basis_last_completed_final']['numeric_observations']==1051820
          assert runtime['full_basis_last_completed_final']['document_error_count']==1364
          assert runtime['full_basis_last_completed_final']['unresolved_tie_count']==1281
          assert runtime['full_basis_last_completed_final']['verdict']=='FAIL_CLOSED'
          assert project['stage3']['status']=='NOT_READY'
          assert project['stage4_unlocked'] is False
          assert project['alpha_training_allowed'] is False
          assert project['live_signal_allowed'] is False
          assert lock['status']=='NOT_READY'
          print('V17_30_WRAPPER_FORMAL_AUTHORITY_STILL_V17_29_PASS')
          PY
      - name: Record wrapper artifact identity
        run: sha256sum build/v17_30_runtime_wrapper/* | sort | tee build/v17_30_runtime_wrapper/output_sha256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage3-s3g1j-v17-30-inactive-runtime-wrapper
          path: build/v17_30_runtime_wrapper
          retention-days: 90
          compression-level: 6
