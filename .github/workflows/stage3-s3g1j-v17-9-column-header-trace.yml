name: Stage3 S3G1J V17.9 Column Header Trace

on:
  pull_request:
    branches: [stage3-s3g1j-v17-explicit-dual-evidence]
    paths:
      - '.github/workflows/stage3-s3g1j-v17-9-column-header-trace.yml'
      - 'scripts/probe_stage3_s3g1j_v17_9_column_header_trace.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ github.token }}
  FROZEN_127_RUN: '30424465440'
  V17_8_RUN: '30509386975'
  PYTHONPATH: scripts

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests pymupdf
      - name: Require accepted V17.8 exact-88 diagnostic and restore frozen evidence
        run: |
          test "$(gh run view "$V17_8_RUN" -R "$GITHUB_REPOSITORY" --json conclusion --jq .conclusion)" = success
          rm -rf prepared v17_8 build/v17-9-column-header
          gh run download "$FROZEN_127_RUN" -R "$GITHUB_REPOSITORY" \
            -n stage3-s3g1j-v15-single-source-input -D prepared
          gh run download "$V17_8_RUN" -R "$GITHUB_REPOSITORY" \
            -n stage3-s3g1j-v17-8-residual-funnel-summary -D v17_8
          test -f prepared/single_source_residual_versions.csv.gz
          test -f v17_8/v17_8_residual_funnel.json
          python - <<'PY'
          import json
          s=json.load(open('v17_8/v17_8_residual_funnel.json',encoding='utf-8'))
          assert s['pass']
          assert s['accepted_v17_7_recovery_count']==25
          assert s['input_residual_count']==88
          assert s['category_counts']['COLUMN_ROLE_GATE']==6
          assert s['stage4_alpha_locked'] is True
          print('V17_9_LOCK_PASS',s['accepted_v17_7_recovery_count'],s['input_residual_count'],s['category_counts']['COLUMN_ROLE_GATE'])
          PY
      - name: Trace exact six frozen-date column-header failures
        run: |
          mkdir -p build/v17-9-column-header
          python scripts/probe_stage3_s3g1j_v17_9_column_header_trace.py \
            --versions prepared/single_source_residual_versions.csv.gz \
            --v17-8-summary v17_8/v17_8_residual_funnel.json \
            --out build/v17-9-column-header/column_header_trace.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage3-s3g1j-v17-9-column-header-trace
          path: build/v17-9-column-header/column_header_trace.json
          retention-days: 90
          compression-level: 0
