name: Stage2 G4 G5 Source Probe

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/probe_g4_g5_sources.py'
      - '.github/workflows/stage2-g4-g5-probe.yml'
      - 'config/g4_g5_probe_trigger.json'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests baostock pandas
      - name: Probe G4/G5 sources
        run: python scripts/probe_g4_g5_sources.py
      - uses: actions/upload-artifact@v4
        with:
          name: stage2-g4-g5-source-probe
          path: data/g4_g5_probe
          retention-days: 7
