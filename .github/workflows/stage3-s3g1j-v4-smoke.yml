name: Stage3 S3G1J V4 Representative Shard Smoke

on:
  workflow_dispatch:
  pull_request:
    branches: [stage3-s3g1j-final-v3]
    paths:
      - '.github/workflows/stage3-s3g1j-v4-smoke.yml'

permissions:
  contents: read
  actions: read

env:
  REPORT_VERSIONS_RUN: '30270405448'
  V4_REGRESSION_RUN: '30338738800'

jobs:
  lock:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Require V4 regression PASS
        run: test "$(gh run view "$V4_REGRESSION_RUN" -R "$GITHUB_REPOSITORY" --json conclusion --jq .conclusion)" = success

  smoke:
    needs: lock
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0,1,7,9]
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONPATH: scripts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests pymupdf
      - name: Restore canonical version ledger
        run: |
          rm -rf versions
          gh run download "$REPORT_VERSIONS_RUN" -R "$GITHUB_REPOSITORY" -n stage3-s3g1g-financial-report-versions -D versions
          test -f versions/stage3_financial_report_versions.csv.gz
      - name: Re-run representative formerly failing shard with V4 parser
        shell: bash
        run: |
          set +e
          out="build/stage3-financial-values-v4-smoke/shard${{ matrix.shard }}"
          mkdir -p "$out"
          python scripts/extract_stage3_financial_pdf_values_v2.py \
            --versions versions/stage3_financial_report_versions.csv.gz \
            --shard ${{ matrix.shard }} --shards 64 --out "$out" \
            > "$out/stdout.log" 2> "$out/stderr.log"
          code=$?
          echo "SMOKE_EXIT=$code" >> "$GITHUB_ENV"
          cat "$out"/financial_extract_shard*.manifest.json || true
          tail -100 "$out/stderr.log" || true
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: stage3-s3g1j-v4-smoke-${{ matrix.shard }}
          path: build/stage3-financial-values-v4-smoke/shard${{ matrix.shard }}
          retention-days: 90
          compression-level: 0
      - name: Preserve fail-closed smoke status
        if: env.SMOKE_EXIT != '0'
        run: exit 1
