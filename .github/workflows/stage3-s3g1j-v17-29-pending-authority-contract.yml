name: Stage3 S3G1J V17.29 Pending Authority Contract

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'governance/stage3_s3g1j_v17_29_runtime_wrapper_pending.json'
      - 'tests/test_stage3_v17_29_runtime_wrapper_pending_manifest.py'
      - 'scripts/stage3_financial_pdf_parser_v21_promotion_safety.py'
      - 'scripts/stage3_financial_pdf_parser_v21.py'
      - 'scripts/extract_stage3_financial_pdf_values_v19.py'
      - '.github/workflows/stage3-s3g1j-v17-29-pending-authority-contract.yml'

permissions:
  contents: read

env:
  PYTHONPATH: scripts
  INTEGRATION_BASE: '5b416a6cfa017593d585b51eff6db1d88296dc4f'

jobs:
  pending-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
      - name: Assert execution PR does not mutate authority or start full basis
        shell: bash
        run: |
          set -euo pipefail
          changed=$(git diff --name-only "$INTEGRATION_BASE"...HEAD)
          printf '%s\n' "$changed"
          for forbidden in \
            governance/stage3_s3g1j_runtime_manifest.json \
            governance/stage3_workflow_activation_manifest.json \
            governance/stage3_authority_map.json \
            data/project_status.json \
            config/stage3_final_lock.json \
            scripts/stage3_financial_pdf_parser_v20.py \
            scripts/extract_stage3_financial_pdf_values_v18.py; do
            if grep -Fxq "$forbidden" <<<"$changed"; then
              echo "forbidden authority/runtime mutation in inactive wrapper PR: $forbidden" >&2
              exit 1
            fi
          done
          if grep -E 'stage3-s3g1j-v17-29.*(full|shard)' <<<"$changed"; then
            echo 'fresh V17.29 full-basis/shard execution file appeared before runtime activation' >&2
            exit 1
          fi
      - name: Verify pending manifest and current V17.28 authority
        run: python -m unittest tests.test_stage3_v17_29_runtime_wrapper_pending_manifest -v
      - name: Verify inactive wrapper constants only
        run: |
          python - <<'PY'
          import extract_stage3_financial_pdf_values_v19 as extractor
          import stage3_financial_pdf_parser_v21 as parser
          assert parser.METHOD=='V17_29_EXACT_SOURCE_SPLIT_GROUP_EQUITY_PRODUCTION'
          assert parser.METHODOLOGY_VERSION=='V3.3.13-V17.29'
          assert parser.PROMOTION_SAFETY_RUN==31311296836
          assert parser.PROMOTION_SAFETY_ARTIFACT_ID==9037500964
          assert extractor.RUNTIME_GENERATION=='V17.29'
          assert extractor.METHOD=='CNINFO_ORIGINAL_PDF_PYMUPDF_V19_V17_29_EXACT_SOURCE_SPLIT_GROUP_EQUITY_PRODUCTION'
          assert extractor.METHODOLOGY_VERSION=='V3.3.13-V17.29'
          assert extractor.SHARD_GATE=='S3G1J_FINANCIAL_PDF_EXTRACTION_SHARD_V17_29'
          print('V17_29_PENDING_AUTHORITY_CONTRACT_PASS')
          PY
