name: Stage3 S3G1J Balance-Block Regression V4

on:
  workflow_dispatch:
  pull_request:
    branches: [stage3-s3g1j-final-v3]
    paths:
      - 'scripts/stage3_financial_pdf_parser_v2.py'
      - 'scripts/probe_stage3_balance_block_regression_v4.py'
      - 'tests/test_stage3_financial_balance_block_v4.py'
      - '.github/workflows/stage3-s3g1j-balance-block-regression-v4.yml'

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONPATH: scripts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests pymupdf
      - name: Synthetic numeric-column regressions
        run: python -m unittest tests.test_stage3_financial_balance_block_v4 -v
      - name: Re-run locked official PDF exact-value regression
        shell: bash
        run: |
          set +e
          mkdir -p data/stage3_source_probe_v4
          python scripts/probe_stage3_financial_pdf_parser_v2.py \
            > data/stage3_source_probe_v4/locked_stdout.log \
            2> data/stage3_source_probe_v4/locked_stderr.log
          code=$?
          echo "LOCKED_EXIT=$code" >> "$GITHUB_ENV"
          cp data/stage3_source_probe_v2/financial_pdf_parser_v2_probe.json data/stage3_source_probe_v4/locked_official_probe.json || true
          cat data/stage3_source_probe_v4/locked_official_probe.json || true
          cat data/stage3_source_probe_v4/locked_stderr.log || true
          exit 0
      - name: Re-run first twelve formerly failing old-format balance sheets
        shell: bash
        run: |
          set +e
          python scripts/probe_stage3_balance_block_regression_v4.py \
            > data/stage3_source_probe_v4/balance_stdout.log \
            2> data/stage3_source_probe_v4/balance_stderr.log
          code=$?
          echo "BALANCE_EXIT=$code" >> "$GITHUB_ENV"
          cat data/stage3_source_probe_v4/balance_block_regression_v4.json || true
          cat data/stage3_source_probe_v4/balance_stderr.log || true
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: stage3-s3g1j-balance-block-regression-v4
          path: data/stage3_source_probe_v4
          retention-days: 90
      - name: Preserve fail-closed regression status
        if: env.LOCKED_EXIT != '0' || env.BALANCE_EXIT != '0'
        run: exit 1
