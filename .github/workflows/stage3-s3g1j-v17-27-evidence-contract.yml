name: Stage3 S3G1J V17.27 Evidence Contract

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'governance/stage3_s3g1j_runtime_manifest.json'
      - 'governance/stage3_s3g1j_v17_27_candidate_safety.json'
      - 'governance/stage3_s3g1j_v17_27_full_final.json'
      - 'governance/stage3_workflow_activation_manifest.json'
      - 'scripts/stage3_financial_pdf_parser_v19.py'
      - 'scripts/stage3_financial_pdf_parser_v19_candidate.py'
      - 'scripts/stage3_financial_spatial_alias_v17_27_candidate.py'
      - 'scripts/extract_stage3_financial_pdf_values_v17.py'
      - 'scripts/build_stage3_s3g1j_v17_27_candidate_full.py'
      - 'tests/test_stage3_s3g1j_v17_27_normal_equity_candidate.py'
      - 'tests/test_stage3_v17_27_runtime_promotion.py'
      - 'tests/test_stage3_v17_27_full_final_evidence.py'
      - '.github/workflows/stage3-s3g1j-v17-27-evidence-contract.yml'
      - '.github/workflows/stage3-s3g1j-v17-27-full-final-acceptance.yml'

permissions:
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ github.token }}
  PYTHONPATH: scripts
  CANDIDATE_RUN: '30747664549'
  CANDIDATE_HEAD: 'ae9e80d90e227772cca88cc3b7ebadd2c6cfb7ca'
  CANDIDATE_ARTIFACT_ID: '8833408494'
  CANDIDATE_ARTIFACT: 'stage3-s3g1j-v17-27-normal-equity-candidate-safety'
  CANDIDATE_DIGEST: 'sha256:d279df39e62f4f0f4fd655267788473dd34945113f677635563ce38f3af88513'
  FULL_FINAL_RUN: '30806818977'
  FULL_FINAL_HEAD: 'fa77d30a2ccdd3664beab01fd7ff7b5d16761726'
  FULL_FINAL_ARTIFACT_ID: '8854139999'
  FULL_FINAL_ARTIFACT: 'stage3-s3g1j-v17-27-full-final'
  FULL_FINAL_DIGEST: 'sha256:410e257d7a3ada353926970f806abc3e970e5638f55c1dec7b47c71c57777721'

jobs:
  evidence-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
      - name: Install verified evidence runtime
        run: python -m pip install --disable-pip-version-check -c requirements/constraints-verified.txt requests pymupdf
      - name: Lock accepted V17.27 candidate and full-final artifacts
        shell: bash
        run: |
          set -euo pipefail
          lock_artifact() {
            local run="$1" head="$2" artifact_id="$3" artifact_name="$4" digest="$5"
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" > "/tmp/run-$run.json"
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/artifacts?per_page=100" > "/tmp/artifacts-$run.json"
            RUN_ID="$run" HEAD_SHA="$head" ARTIFACT_ID="$artifact_id" ARTIFACT_NAME="$artifact_name" DIGEST="$digest" python - <<'PY'
          import json, os
          run_id=os.environ['RUN_ID']
          run=json.load(open(f'/tmp/run-{run_id}.json',encoding='utf-8'))
          assert run['head_sha']==os.environ['HEAD_SHA'],run['head_sha']
          assert run['conclusion']=='success',run['conclusion']
          artifacts=json.load(open(f'/tmp/artifacts-{run_id}.json',encoding='utf-8'))['artifacts']
          matches=[row for row in artifacts if row['name']==os.environ['ARTIFACT_NAME']]
          assert len(matches)==1,len(matches)
          artifact=matches[0]
          assert str(artifact['id'])==os.environ['ARTIFACT_ID'],artifact['id']
          assert artifact['digest']==os.environ['DIGEST'],artifact['digest']
          assert artifact['workflow_run']['head_sha']==os.environ['HEAD_SHA']
          assert not artifact['expired']
          print(f"S3G1J_V17_27_ARTIFACT_LOCK_PASS run={run_id}")
          PY
          }
          lock_artifact "$CANDIDATE_RUN" "$CANDIDATE_HEAD" "$CANDIDATE_ARTIFACT_ID" "$CANDIDATE_ARTIFACT" "$CANDIDATE_DIGEST"
          lock_artifact "$FULL_FINAL_RUN" "$FULL_FINAL_HEAD" "$FULL_FINAL_ARTIFACT_ID" "$FULL_FINAL_ARTIFACT" "$FULL_FINAL_DIGEST"
      - name: Verify registered V17.27 candidate and full-final evidence
        run: |
          python -m unittest \
            tests.test_stage3_s3g1j_v17_27_normal_equity_candidate \
            tests.test_stage3_v17_27_runtime_promotion \
            tests.test_stage3_v17_27_full_final_evidence \
            -v
      - name: Retain completed V17.26 historical authority
        run: |
          python -m unittest \
            tests.test_stage3_v17_26_full_final_evidence \
            tests.test_stage3_v17_26_runtime_promotion \
            -v
      - name: Import formal V17.27 full-basis production closure
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import build_stage3_s3g1j_v17_27_candidate_full as builder
          import extract_stage3_financial_pdf_values_v17 as extractor
          import stage3_financial_pdf_parser_v19 as parser

          candidate=json.load(open('governance/stage3_s3g1j_v17_27_candidate_safety.json',encoding='utf-8'))
          full=json.load(open('governance/stage3_s3g1j_v17_27_full_final.json',encoding='utf-8'))
          runtime=json.load(open('governance/stage3_s3g1j_runtime_manifest.json',encoding='utf-8'))
          activation=json.load(open('governance/stage3_workflow_activation_manifest.json',encoding='utf-8'))

          assert candidate['accepted_run']['run']==30747664549
          assert candidate['accepted_run']['artifact_id']==8833408494
          assert candidate['accepted_run']['artifact_digest']==parser.CANDIDATE_ARTIFACT_DIGEST
          assert candidate['result']['target_document_count']==5
          assert candidate['result']['target_numeric_rows']==15

          assert full['accepted_run']['run_id']==30806818977
          assert full['accepted_run']['artifact_id']==8854139999
          assert full['accepted_run']['artifact_digest']=='sha256:410e257d7a3ada353926970f806abc3e970e5638f55c1dec7b47c71c57777721'
          assert full['full_basis_result']['document_count']==121354
          assert full['full_basis_result']['numeric_observation_count']==1051793
          assert full['full_basis_result']['document_error_count']==1373
          assert full['full_basis_result']['unresolved_tie_count']==1290
          assert full['full_basis_result']['target_numeric_rows']==15
          assert full['full_basis_result']['unexpected_document_regression_count']==0
          assert full['full_basis_result']['final_data_verdict']=='FAIL_CLOSED'

          assert runtime['schema_version']==9
          assert runtime['current_production_authority']['generation']=='V17.27'
          assert runtime['current_production_authority']['status']=='FULL_BASIS_EXECUTION_ACCEPTED_FAIL_CLOSED'
          assert runtime['formal_runtime']['parser_method']==parser.METHOD
          assert runtime['formal_runtime']['extractor_method']==extractor.METHOD
          assert runtime['full_basis_last_completed_final']['generation']=='V17.27'
          assert runtime['full_basis_last_completed_final']['run']==30806818977
          assert runtime['next_full_basis_required']['status']=='COMPLETED_AND_ACCEPTED'
          assert runtime['production_final_status']=='FULL_BASIS_EXECUTION_ACCEPTED_FAIL_CLOSED'

          assert activation['schema_version']==11
          accepted=activation['accepted_production_runtime']
          assert accepted['generation']=='V17.27'
          assert accepted['full_basis_execution_pending'] is False
          assert accepted['last_completed_full_basis_generation']=='V17.27'
          assert accepted['last_completed_full_basis_run']==30806818977
          assert accepted['execution_verdict']=='PASS'
          assert accepted['data_verdict']=='FAIL_CLOSED'

          assert set(parser.TARGETS)==set(builder.parser_candidate.TARGETS)
          assert callable(parser.parse_pdf_bytes)
          assert callable(extractor.parse_pdf_bytes)
          candidate_one_shot=Path('.github/workflows/stage3-s3g1j-v17-27-normal-equity-candidate-safety.yml')
          full_one_shot=Path('.github/workflows/stage3-s3g1j-v17-27-full-final-acceptance.yml')
          assert not candidate_one_shot.exists()
          assert not full_one_shot.exists()
          print('S3G1J_V17_27_FULL_BASIS_EVIDENCE_IMPORT_PASS')
          PY
      - name: Compile V17.27 production and retained candidate utilities
        run: |
          python -m py_compile \
            scripts/stage3_financial_pdf_parser_v19.py \
            scripts/stage3_financial_pdf_parser_v19_candidate.py \
            scripts/stage3_financial_spatial_alias_v17_27_candidate.py \
            scripts/extract_stage3_financial_pdf_values_v17.py \
            scripts/build_stage3_s3g1j_v17_27_candidate_full.py \
            tests/test_stage3_v17_27_full_final_evidence.py
