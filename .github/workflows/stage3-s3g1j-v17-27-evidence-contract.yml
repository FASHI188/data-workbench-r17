name: Stage3 S3G1J V17.27 Evidence Contract

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'governance/stage3_s3g1j_runtime_manifest.json'
      - 'governance/stage3_s3g1j_v17_27_candidate_safety.json'
      - 'governance/stage3_s3g1j_v17_27_full_final.json'
      - 'governance/stage3_s3g1j_v17_28_full_final.json'
      - 'governance/stage3_s3g1j_v17_29_full_final.json'
      - 'governance/stage3_workflow_activation_manifest.json'
      - 'tests/test_stage3_v17_27_runtime_promotion.py'
      - 'tests/test_stage3_v17_27_full_final_evidence.py'
      - '.github/workflows/stage3-s3g1j-v17-27-evidence-contract.yml'

permissions:
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ github.token }}
  PYTHONPATH: scripts
  CANDIDATE_RUN: '30747664549'
  CANDIDATE_HEAD: 'ae9e80d90e227772cca88cc3b7ebadd2c6cfb7ca'
  CANDIDATE_ARTIFACT_ID: '8833408494'
  CANDIDATE_ARTIFACT: 'stage3-s3g1j-v17-27-normal-equity-candidate-safety'
  CANDIDATE_DIGEST: 'sha256:d279df39e62f4f0f4fd655267788473dd34945113f677635563ce38f3af88513'
  FULL_FINAL_RUN: '30806818977'
  FULL_FINAL_HEAD: 'fa77d30a2ccdd3664beab01fd7ff7b5d16761726'
  FULL_FINAL_ARTIFACT_ID: '8854139999'
  FULL_FINAL_ARTIFACT: 'stage3-s3g1j-v17-27-full-final'
  FULL_FINAL_DIGEST: 'sha256:410e257d7a3ada353926970f806abc3e970e5638f55c1dec7b47c71c57777721'

jobs:
  evidence-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
      - name: Install verified evidence runtime
        run: python -m pip install --disable-pip-version-check -c requirements/constraints-verified.txt requests pymupdf
      - name: Lock immutable V17.27 candidate and full-final artifacts
        shell: bash
        run: |
          set -euo pipefail
          lock_artifact() {
            local run="$1" head="$2" artifact_id="$3" artifact_name="$4" digest="$5"
            run_payload=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run")
            test "$(jq -r '.head_sha' <<<"$run_payload")" = "$head"
            test "$(jq -r '.conclusion' <<<"$run_payload")" = success
            artifacts=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/artifacts?per_page=100")
            test "$(jq -r --arg name "$artifact_name" '[.artifacts[] | select(.name==$name)] | length' <<<"$artifacts")" = 1
            test "$(jq -r --arg name "$artifact_name" '.artifacts[] | select(.name==$name) | .id' <<<"$artifacts")" = "$artifact_id"
            test "$(jq -r --arg name "$artifact_name" '.artifacts[] | select(.name==$name) | .digest' <<<"$artifacts")" = "$digest"
            test "$(jq -r --arg name "$artifact_name" '.artifacts[] | select(.name==$name) | .workflow_run.head_sha' <<<"$artifacts")" = "$head"
            test "$(jq -r --arg name "$artifact_name" '.artifacts[] | select(.name==$name) | .expired' <<<"$artifacts")" = false
          }
          lock_artifact "$CANDIDATE_RUN" "$CANDIDATE_HEAD" "$CANDIDATE_ARTIFACT_ID" "$CANDIDATE_ARTIFACT" "$CANDIDATE_DIGEST"
          lock_artifact "$FULL_FINAL_RUN" "$FULL_FINAL_HEAD" "$FULL_FINAL_ARTIFACT_ID" "$FULL_FINAL_ARTIFACT" "$FULL_FINAL_DIGEST"
      - name: Verify immutable V17.27 evidence and production parser
        run: |
          python -m unittest \
            tests.test_stage3_s3g1j_v17_27_normal_equity_candidate \
            tests.test_stage3_v17_27_runtime_promotion \
            tests.test_stage3_v17_27_full_final_evidence \
            -v
          python -m py_compile \
            scripts/stage3_financial_pdf_parser_v19.py \
            scripts/stage3_financial_pdf_parser_v19_candidate.py \
            scripts/stage3_financial_spatial_alias_v17_27_candidate.py \
            scripts/extract_stage3_financial_pdf_values_v17.py
      - name: Verify historical V17.27 authority under current V17.30 runtime
        run: |
          python - <<'PY'
          import json
          runtime=json.load(open('governance/stage3_s3g1j_runtime_manifest.json',encoding='utf-8'))
          activation=json.load(open('governance/stage3_workflow_activation_manifest.json',encoding='utf-8'))
          old=json.load(open('governance/stage3_s3g1j_v17_27_full_final.json',encoding='utf-8'))
          prev28=json.load(open('governance/stage3_s3g1j_v17_28_full_final.json',encoding='utf-8'))
          current29=json.load(open('governance/stage3_s3g1j_v17_29_full_final.json',encoding='utf-8'))
          assert old['accepted_run']['run_id']==30806818977
          assert old['full_basis_result']['numeric_observation_count']==1051793
          assert old['full_basis_result']['document_error_count']==1373
          assert old['full_basis_result']['unresolved_tie_count']==1290
          assert old['full_basis_result']['final_data_verdict']=='FAIL_CLOSED'
          assert runtime['schema_version']>=14
          assert runtime['formal_runtime']['runtime_generation']=='V17.30'
          assert runtime['full_basis_last_completed_final']['generation']=='V17.29'
          assert runtime['full_basis_last_completed_final']['run']==31389854868
          assert runtime['previous_last_completed_full_basis_final']['generation']=='V17.28'
          assert runtime['previous_last_completed_full_basis_final']['run']==30997260730
          assert runtime['previous_full_basis_final']['generation']=='V17.27'
          assert runtime['previous_full_basis_final']['run']==30806818977
          assert runtime['previous_full_basis_final']['retained'] is True
          nxt=runtime['next_full_basis_required']
          assert nxt['generation']=='V17.30'
          assert nxt['status']=='REQUIRED_NOT_STARTED'
          assert nxt['expected_values_are_not_production_acceptance'] is True
          assert activation['schema_version']>=16
          current=activation['accepted_production_runtime']
          assert current['generation']=='V17.30'
          assert current['full_basis_execution_pending'] is True
          assert current['last_completed_full_basis_generation']=='V17.29'
          assert current['last_completed_full_basis_run']==31389854868
          assert current['data_verdict']=='FAIL_CLOSED'
          retained=activation['accepted_v17_27_full_basis_evidence']
          assert retained['historical_full_basis_authority_retained'] is True
          assert retained['last_completed_full_basis_authority'] is False
          assert prev28['accepted_run']['run_id']==30997260730
          assert prev28['hard_boundaries']['stage3_status']=='NOT_READY'
          assert current29['accepted_run']['run_id']==31389854868
          assert current29['full_basis_result']['final_data_verdict']=='FAIL_CLOSED'
          print('S3G1J_V17_27_RETAINED_EVIDENCE_UNDER_V17_30_PASS')
          PY
