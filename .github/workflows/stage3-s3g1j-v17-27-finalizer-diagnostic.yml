name: Stage3 S3G1J V17.27 Finalizer Diagnostic

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/stage3-s3g1j-v17-27-finalizer-diagnostic.yml'

permissions:
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ github.token }}
  PYTHONPATH: scripts
  SOURCE_RUN: '30783179489'
  SOURCE_HEAD: 'e5e2076ac724787430a207130de0c48c49b75a40'
  SHARD_PREFIX: 'stage3-s3g1j-v17-27-full-final-shard-'
  SHARD_GATE: 'S3G1J_FINANCIAL_PDF_EXTRACTION_SHARD_V17_27'
  PARSER_METHOD: 'CNINFO_ORIGINAL_PDF_PYMUPDF_V17_V17_27_EXACT_SOURCE_NORMAL_EQUITY_PRODUCTION'
  METHODOLOGY: 'V3.3.7-V17.27'
  RUNTIME_GENERATION: 'V17.27'

jobs:
  diagnose-finalizer:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
      - run: python -m pip install --disable-pip-version-check --constraint requirements/constraints-verified.txt requests PyMuPDF
      - name: Lock failed source run and complete 64-shard artifact set
        shell: bash
        run: |
          set -euo pipefail
          run_payload=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN")
          test "$(jq -r '.head_sha' <<<"$run_payload")" = "$SOURCE_HEAD"
          test "$(jq -r '.conclusion' <<<"$run_payload")" = failure
          payload=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN/artifacts?per_page=100")
          count=$(jq -r --arg prefix "$SHARD_PREFIX" '[.artifacts[] | select(.name|startswith($prefix))] | length' <<<"$payload")
          test "$count" = 64
          bad_heads=$(jq -r --arg prefix "$SHARD_PREFIX" --arg head "$SOURCE_HEAD" '[.artifacts[] | select(.name|startswith($prefix)) | select(.workflow_run.head_sha != $head)] | length' <<<"$payload")
          test "$bad_heads" = 0
          ids=$(jq -r --arg prefix "$SHARD_PREFIX" '[.artifacts[] | select(.name|startswith($prefix)) | .name | sub($prefix;"") | tonumber] | sort | @json' <<<"$payload")
          test "$ids" = "$(python - <<'PY'
          import json
          print(json.dumps(list(range(64)),separators=(',',':')))
          PY
          )"
          echo "V17_27_FINALIZER_DIAGNOSTIC_SHARD_LOCK_PASS"
      - uses: actions/download-artifact@v4
        with:
          pattern: stage3-s3g1j-v17-27-full-final-shard-*
          path: partials
          repository: FASHI188/data-workbench-r17
          run-id: 30783179489
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: stage3-s3g1j-v17-21-full-final-input
          path: prepared
          repository: FASHI188/data-workbench-r17
          run-id: 30649251360
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: stage3-s3g1j-v17-26-full-final
          path: previous
          repository: FASHI188/data-workbench-r17
          run-id: 30733013665
          github-token: ${{ github.token }}
      - name: Execute finalizer and capture all evidence without masking failure
        shell: bash
        run: |
          set +e
          mkdir -p build/final build/diagnostic
          find partials -type f | sort > build/diagnostic/partial_files.txt
          python - <<'PY' > build/diagnostic/shard_inventory.json
          import glob,json
          paths=glob.glob('partials/**/financial_extract_shard*.manifest.json',recursive=True)
          rows=[]
          for path in paths:
              x=json.load(open(path,encoding='utf-8'))
              rows.append({
                  'path':path,
                  'shard':x.get('shard'),
                  'shards':x.get('shards'),
                  'gate':x.get('gate'),
                  'runtime_generation':x.get('runtime_generation'),
                  'parser_method':x.get('parser_method'),
                  'methodology_version':x.get('methodology_version'),
                  'document_rows':x.get('document_rows'),
                  'numeric_rows':x.get('numeric_rows'),
                  'error_count':x.get('error_count'),
                  'pass':x.get('pass'),
              })
          rows.sort(key=lambda x:(x['shard'] if isinstance(x['shard'],int) else 999,x['path']))
          print(json.dumps({'manifest_count':len(rows),'rows':rows},ensure_ascii=False,indent=2))
          PY
          python scripts/finalize_stage3_financial_pdf_values.py \
            --root partials \
            --versions prepared/stage3_financial_report_versions.csv.gz \
            --stage2-manifest prepared/stage2_manifest.json \
            --out build/final \
            --expected-shard-gate "$SHARD_GATE" \
            --expected-parser-method "$PARSER_METHOD" \
            --expected-methodology-version "$METHODOLOGY" \
            > build/diagnostic/finalizer.stdout.log 2> build/diagnostic/finalizer.stderr.log
          echo $? > build/diagnostic/finalizer.exit
          if test -f build/final/stage3_financial_raw_audit.json; then
            cp build/final/stage3_financial_raw_audit.json build/diagnostic/
          fi
          previous_docs=$(find previous -name stage3_financial_documents.csv.gz -print -quit)
          previous_values=$(find previous -name stage3_financial_raw_values.csv.gz -print -quit)
          previous_audit=$(find previous -name stage3_financial_raw_audit.json -print -quit)
          if test -f build/final/stage3_financial_documents.csv.gz && test -f build/final/stage3_financial_raw_values.csv.gz && test -f build/final/stage3_financial_raw_audit.json; then
            python scripts/compare_stage3_s3g1j_v17_27_full_final.py \
              --previous-documents "$previous_docs" \
              --current-documents build/final/stage3_financial_documents.csv.gz \
              --previous-values "$previous_values" \
              --current-values build/final/stage3_financial_raw_values.csv.gz \
              --previous-audit "$previous_audit" \
              --current-audit build/final/stage3_financial_raw_audit.json \
              --out build/diagnostic/stage3_s3g1j_v17_27_full_basis_non_regression.json \
              > build/diagnostic/comparator.stdout.log 2> build/diagnostic/comparator.stderr.log
            echo $? > build/diagnostic/comparator.exit
          else
            echo 99 > build/diagnostic/comparator.exit
            echo 'finalizer outputs missing' > build/diagnostic/comparator.stderr.log
          fi
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          def read_int(path):
              try:return int(Path(path).read_text().strip())
              except Exception:return None
          summary={
              'gate':'S3G1J_V17_27_FINALIZER_DIAGNOSTIC',
              'source_run':30783179489,
              'source_head':'e5e2076ac724787430a207130de0c48c49b75a40',
              'finalizer_exit':read_int('build/diagnostic/finalizer.exit'),
              'comparator_exit':read_int('build/diagnostic/comparator.exit'),
              'final_outputs':sorted(p.name for p in Path('build/final').glob('*') if p.is_file()),
          }
          for name in ('stage3_financial_raw_audit.json','stage3_s3g1j_v17_27_full_basis_non_regression.json'):
              path=Path('build/diagnostic')/name
              if path.exists():
                  try:summary[name]=json.loads(path.read_text(encoding='utf-8'))
                  except Exception as exc:summary[name]={'read_error':repr(exc)}
          hashes={}
          for root in (Path('build/diagnostic'),Path('build/final')):
              for path in sorted(root.glob('*')):
                  if path.is_file():hashes[str(path)]=hashlib.sha256(path.read_bytes()).hexdigest()
          summary['file_sha256']=hashes
          Path('build/diagnostic/diagnostic_summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(summary,ensure_ascii=False,indent=2))
          PY
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage3-s3g1j-v17-27-finalizer-diagnostic
          path: |
            build/diagnostic
            build/final
          retention-days: 30
          compression-level: 0
