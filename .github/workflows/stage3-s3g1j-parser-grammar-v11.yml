name: Stage3 S3G1J Parser Grammar V11

on:
  pull_request:
    branches: [stage3-s3g1j-failure-diagnostic-v10]
    paths:
      - '.github/workflows/stage3-s3g1j-parser-grammar-v11.yml'
      - 'scripts/stage3_financial_pdf_parser_v6.py'
      - 'scripts/stage3_financial_pdf_parser_v7.py'
      - 'scripts/extract_stage3_financial_pdf_values_v7.py'
      - 'scripts/probe_stage3_s3g1j_parser_grammar_v11.py'
      - 'scripts/probe_stage3_s3g1j_parser_grammar_v11_1.py'
      - 'tests/test_stage3_financial_pdf_parser_v11.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regress:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONPATH: scripts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests pymupdf
      - name: Run V11 grammar unit regressions
        run: python -m unittest tests.test_stage3_financial_pdf_parser_v11 -v
      - name: Run exact official-PDF V11.1 regression
        run: python scripts/probe_stage3_s3g1j_parser_grammar_v11_1.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage3-s3g1j-parser-grammar-v11
          path: data/stage3_source_probe_v11/s3g1j_parser_grammar_v11.json
          retention-days: 90
          compression-level: 0
