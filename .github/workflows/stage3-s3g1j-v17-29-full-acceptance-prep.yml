name: Stage3 S3G1J V17.29 Full Acceptance Prep

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/compare_stage3_s3g1j_v17_29_full_final.py'
      - 'tests/test_stage3_v17_29_full_final_comparator.py'
      - '.github/workflows/stage3-s3g1j-v17-29-full-acceptance-prep.yml'

permissions:
  contents: read
  pull-requests: read

env:
  PYTHONPATH: scripts
  EXECUTION_PR: '111'
  EXECUTION_HEAD: '2b48694391e2a6cdbd6972b68844c1253b3c55d9'

jobs:
  prep:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
      - name: Install verified runtime
        run: python -m pip install --disable-pip-version-check -c requirements/constraints-verified.txt requests pymupdf
      - name: Verify formal V17.29 runtime and pending full-basis boundary
        run: |
          python - <<'PY'
          import json
          runtime=json.load(open('governance/stage3_s3g1j_runtime_manifest.json',encoding='utf-8'))
          activation=json.load(open('governance/stage3_workflow_activation_manifest.json',encoding='utf-8'))
          candidate=json.load(open('governance/stage3_s3g1j_v17_29_candidate_acceptance.json',encoding='utf-8'))
          promotion=json.load(open('governance/stage3_s3g1j_v17_29_production_promotion_safety.json',encoding='utf-8'))
          assert runtime['schema_version']==12
          assert runtime['formal_runtime']['runtime_generation']=='V17.29'
          assert runtime['formal_runtime']['parser_path']=='scripts/stage3_financial_pdf_parser_v21.py'
          assert runtime['formal_runtime']['extractor_path']=='scripts/extract_stage3_financial_pdf_values_v19.py'
          assert runtime['full_basis_last_completed_final']['generation']=='V17.28'
          assert runtime['full_basis_last_completed_final']['run']==30997260730
          assert runtime['full_basis_last_completed_final']['numeric_observations']==1051799
          assert runtime['full_basis_last_completed_final']['document_error_count']==1371
          assert runtime['full_basis_last_completed_final']['unresolved_tie_count']==1288
          assert runtime['next_full_basis_required']['generation']=='V17.29'
          assert runtime['next_full_basis_required']['status']=='REQUIRED_NOT_STARTED'
          assert activation['accepted_production_runtime']['generation']=='V17.29'
          assert activation['accepted_production_runtime']['full_basis_execution_pending'] is True
          expected=set(candidate['targets'])
          assert expected==set(promotion['full_basis_result']['target_announcement_ids'])
          assert candidate['candidate_result']['candidate_numeric_rows']==1051820
          assert candidate['candidate_result']['candidate_document_errors']==1364
          assert candidate['candidate_result']['candidate_unresolved_ties']==1281
          assert promotion['full_basis_result']['promotion_numeric_rows']==1051820
          assert promotion['full_basis_result']['promotion_document_errors']==1364
          assert promotion['full_basis_result']['promotion_unresolved_ties']==1281
          print('V17_29_FULL_ACCEPTANCE_PREP_AUTHORITY_PASS')
          PY
      - name: Verify comparator strictness and frozen target population
        run: |
          python -m unittest tests.test_stage3_v17_29_full_final_comparator -v
          python -m py_compile scripts/compare_stage3_s3g1j_v17_29_full_final.py
          python - <<'PY'
          import json
          import compare_stage3_s3g1j_v17_29_full_final as c
          candidate=json.load(open('governance/stage3_s3g1j_v17_29_candidate_acceptance.json',encoding='utf-8'))
          promotion=json.load(open('governance/stage3_s3g1j_v17_29_production_promotion_safety.json',encoding='utf-8'))
          assert set(c.TARGETS)==set(candidate['targets'])
          assert set(c.TARGETS)==set(promotion['full_basis_result']['target_announcement_ids'])
          assert c.EXPECTED_SHARD_GATE=='S3G1J_FINANCIAL_PDF_EXTRACTION_SHARD_V17_29'
          assert c.EXPECTED_PARSER_VERSION=='V17_29_EXACT_SOURCE_SPLIT_GROUP_EQUITY_PRODUCTION'
          assert c.EXPECTED_METHODOLOGY=='V3.3.13-V17.29'
          print('V17_29_FULL_ACCEPTANCE_PREP_COMPARATOR_PASS')
          PY
