name: Stage3 S3G1J V16 Spatial Alias Diagnostic

on:
  pull_request:
    branches: [stage3-s3g1j-coordinate-table-v14]
    paths:
      - '.github/workflows/stage3-s3g1j-v16-spatial-alias.yml'
      - 'scripts/stage3_financial_spatial_alias_v16.py'
      - 'scripts/stage3_financial_spatial_alias_v16_3.py'
      - 'scripts/stage3_financial_statement_blocks_v16_3.py'
      - 'scripts/stage3_financial_statement_blocks_v16_5.py'
      - 'scripts/probe_stage3_s3g1j_v16_spatial_alias.py'
      - 'tests/test_stage3_statement_blocks_v16_3.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ github.token }}
  V13_SMOKE_RUN: '30382695045'
  V14_ACCEPTANCE_RUN: '30423298099'
  PYTHONPATH: scripts

jobs:
  diagnose-v16-spatial:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests pymupdf
      - name: Require accepted V14.1 base
        run: test "$(gh run view "$V14_ACCEPTANCE_RUN" -R "$GITHUB_REPOSITORY" --json conclusion --jq .conclusion)" = success
      - name: Run V16.6 statement-period regressions
        run: python -m unittest tests.test_stage3_statement_blocks_v16_3 -v
      - name: Restore exact frozen V12.1 version ledger
        run: |
          rm -rf versions data/stage3_source_probe_v16
          gh run download "$V13_SMOKE_RUN" -R "$GITHUB_REPOSITORY" \
            -n stage3-s3g1j-v13-smoke-versions -D versions
          test -f versions/stage3_financial_report_versions_v3.csv.gz
      - name: Probe V16.6 period-gated spatial parsing on 12 representative V14 residuals
        run: |
          python scripts/probe_stage3_s3g1j_v16_spatial_alias.py \
            --versions versions/stage3_financial_report_versions_v3.csv.gz \
            --out data/stage3_source_probe_v16/spatial_alias_representative.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage3-s3g1j-v16-spatial-alias
          path: data/stage3_source_probe_v16/spatial_alias_representative.json
          retention-days: 90
          compression-level: 0
