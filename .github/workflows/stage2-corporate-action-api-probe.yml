name: Stage2 Corporate Action Official API Probe

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/probe_corporate_action_official_apis.py'
      - 'scripts/probe_sse_corporate_action_business_js.py'
      - '.github/workflows/stage2-corporate-action-api-probe.yml'
      - 'config/corp_action_api_probe_trigger.json'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests
      - run: python scripts/probe_corporate_action_official_apis.py
      - run: python scripts/probe_sse_corporate_action_business_js.py
      - uses: actions/upload-artifact@v4
        with:
          name: stage2-corporate-action-official-api-probe
          path: |
            data/corp_action_api_probe
            data/corp_action_business_js
          retention-days: 7
