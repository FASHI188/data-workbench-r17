name: Stage3 S3G1J V17.29 Full Final Acceptance

on:
  pull_request:
    paths:
      - 'scripts/compare_stage3_s3g1j_v17_29_full_final.py'
      - 'tests/test_stage3_v17_29_full_final_comparator.py'
      - '.github/workflows/stage3-s3g1j-v17-29-full-acceptance-prep.yml'
      - '.github/workflows/stage3-s3g1j-v17-29-full-final-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read

env:
  GH_TOKEN: ${{ github.token }}
  PYTHONPATH: scripts
  SOURCE_PR: '113'
  SOURCE_RUN: '31365802099'
  SOURCE_HEAD: '2b48694391e2a6cdbd6972b68844c1253b3c55d9'
  SHARD_PREFIX: 'stage3-s3g1j-v17-29-full-final-shard-'
  INPUT_RUN: '30649251360'
  INPUT_HEAD: '6b274dbd32734ab0af6a75a6d595925278dd8973'
  INPUT_ARTIFACT_ID: '8800699971'
  INPUT_ARTIFACT: 'stage3-s3g1j-v17-21-full-final-input'
  INPUT_DIGEST: 'sha256:54a7e78b0defe34748abb18695aa758dcee65ddd978b6707d83ef5dd89f0ab10'
  PREVIOUS_RUN: '30997260730'
  PREVIOUS_HEAD: '611d402c3b61a35644a27fd33d3955b9976dec7c'
  PREVIOUS_ARTIFACT_ID: '8927455692'
  PREVIOUS_ARTIFACT: 'stage3-s3g1j-v17-28-full-final'
  PREVIOUS_DIGEST: 'sha256:82375169faada969ceafd4356ab0a2707aa14592d5db090c5d3910863d571c8b'
  GOLD_RUN: '31311296836'
  GOLD_HEAD: '4ea4ac01bcca3e580d73fc37378c2658df8f4b28'
  GOLD_ARTIFACT_ID: '9037500964'
  GOLD_ARTIFACT: 'stage3-s3g1j-v17-29-production-promotion-safety'
  GOLD_DIGEST: 'sha256:967727cf95d9cd5d923e4f59f9cbedfe3e17599ceb31a1df06fa607ab75c4d12'
  SHARD_GATE: 'S3G1J_FINANCIAL_PDF_EXTRACTION_SHARD_V17_29'
  PARSER_METHOD: 'CNINFO_ORIGINAL_PDF_PYMUPDF_V19_V17_29_EXACT_SOURCE_SPLIT_GROUP_EQUITY_PRODUCTION'
  METHODOLOGY: 'V3.3.13-V17.29'
  RUNTIME_GENERATION: 'V17.29'

jobs:
  accept-full-final:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
      - name: Install verified runtime
        run: python -m pip install --disable-pip-version-check --constraint requirements/constraints-verified.txt requests PyMuPDF

      - name: Lock completed clean source execution and 64 shard artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/locks
          api_retry() {
            local endpoint="$1"
            for attempt in 1 2 3 4 5 6; do
              if output=$(gh api "$endpoint" 2>api-error.log); then
                printf '%s' "$output"
                return 0
              fi
              cat api-error.log >&2 || true
              sleep $((attempt * 15))
            done
            return 1
          }
          pr=$(api_retry "repos/$GITHUB_REPOSITORY/pulls/$SOURCE_PR")
          test "$(jq -r '.state' <<<"$pr")" = closed
          test "$(jq -r '.merged' <<<"$pr")" = false
          test "$(jq -r '.head.sha' <<<"$pr")" = "$SOURCE_HEAD"
          source=$(api_retry "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN")
          test "$(jq -r '.head_sha' <<<"$source")" = "$SOURCE_HEAD"
          test "$(jq -r '.status' <<<"$source")" = completed
          test "$(jq -r '.conclusion' <<<"$source")" = success
          payload=$(api_retry "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN/artifacts?per_page=100")
          jq --arg prefix "$SHARD_PREFIX" --arg head "$SOURCE_HEAD" \
            '[.artifacts[] | select(.name|startswith($prefix)) | {
              name, id, digest, size_in_bytes, expired,
              head_sha:.workflow_run.head_sha,
              shard:(.name|sub($prefix;"")|tonumber)
            }] | sort_by(.shard)' <<<"$payload" > build/locks/source_shard_artifacts.json
          python - <<'PY'
          import json,os
          rows=json.load(open('build/locks/source_shard_artifacts.json',encoding='utf-8'))
          assert len(rows)==64, len(rows)
          assert [row['shard'] for row in rows]==list(range(64))
          assert len({row['id'] for row in rows})==64
          assert len({row['digest'] for row in rows})==64
          assert all(row['head_sha']==os.environ['SOURCE_HEAD'] for row in rows)
          assert all(str(row['digest']).startswith('sha256:') for row in rows)
          assert all(int(row['id'])>0 and int(row['size_in_bytes'])>0 for row in rows)
          assert all(row['expired'] is False for row in rows)
          print('V17_29_ACCEPTANCE_64_SHARD_ARTIFACT_LOCK_PASS')
          PY

      - name: Lock frozen input, previous accepted basis and promotion gold
        shell: bash
        run: |
          set -euo pipefail
          api_retry() {
            local endpoint="$1"
            for attempt in 1 2 3 4 5 6; do
              if output=$(gh api "$endpoint" 2>api-error.log); then
                printf '%s' "$output"
                return 0
              fi
              cat api-error.log >&2 || true
              sleep $((attempt * 15))
            done
            return 1
          }
          lock_artifact() {
            local run="$1" head="$2" artifact_id="$3" artifact_name="$4" digest="$5" expected_conclusion="$6"
            local run_payload artifact_payload
            run_payload=$(api_retry "repos/$GITHUB_REPOSITORY/actions/runs/$run")
            test "$(jq -r '.status' <<<"$run_payload")" = completed
            test "$(jq -r '.head_sha' <<<"$run_payload")" = "$head"
            test "$(jq -r '.conclusion' <<<"$run_payload")" = "$expected_conclusion"
            artifact_payload=$(api_retry "repos/$GITHUB_REPOSITORY/actions/runs/$run/artifacts?per_page=100")
            test "$(jq -r --arg name "$artifact_name" '[.artifacts[] | select(.name==$name)] | length' <<<"$artifact_payload")" = 1
            test "$(jq -r --arg name "$artifact_name" '.artifacts[] | select(.name==$name) | .id' <<<"$artifact_payload")" = "$artifact_id"
            test "$(jq -r --arg name "$artifact_name" '.artifacts[] | select(.name==$name) | .digest' <<<"$artifact_payload")" = "$digest"
            test "$(jq -r --arg name "$artifact_name" '.artifacts[] | select(.name==$name) | .workflow_run.head_sha' <<<"$artifact_payload")" = "$head"
            test "$(jq -r --arg name "$artifact_name" '.artifacts[] | select(.name==$name) | .expired' <<<"$artifact_payload")" = false
          }
          lock_artifact "$INPUT_RUN" "$INPUT_HEAD" "$INPUT_ARTIFACT_ID" "$INPUT_ARTIFACT" "$INPUT_DIGEST" failure
          lock_artifact "$PREVIOUS_RUN" "$PREVIOUS_HEAD" "$PREVIOUS_ARTIFACT_ID" "$PREVIOUS_ARTIFACT" "$PREVIOUS_DIGEST" success
          lock_artifact "$GOLD_RUN" "$GOLD_HEAD" "$GOLD_ARTIFACT_ID" "$GOLD_ARTIFACT" "$GOLD_DIGEST" success

      - name: Run comparator strictness and authority contracts
        run: |
          python -m unittest tests.test_stage3_v17_29_full_final_comparator -v
          python -m py_compile scripts/compare_stage3_s3g1j_v17_29_full_final.py
          python - <<'PY'
          import json
          runtime=json.load(open('governance/stage3_s3g1j_runtime_manifest.json',encoding='utf-8'))
          project=json.load(open('data/project_status.json',encoding='utf-8'))
          assert runtime['formal_runtime']['runtime_generation']=='V17.29'
          assert runtime['full_basis_last_completed_final']['generation']=='V17.28'
          assert runtime['full_basis_last_completed_final']['run']==30997260730
          assert runtime['next_full_basis_required']['generation']=='V17.29'
          assert runtime['next_full_basis_required']['status']=='REQUIRED_NOT_STARTED'
          assert project['stage3']['status']=='NOT_READY'
          assert project['stage4_unlocked'] is False
          assert project['alpha_training_allowed'] is False
          assert project['live_signal_allowed'] is False
          print('V17_29_ACCEPTANCE_AUTHORITY_BOUNDARY_PASS')
          PY

      - uses: actions/download-artifact@v4
        with:
          pattern: stage3-s3g1j-v17-29-full-final-shard-*
          path: partials
          repository: FASHI188/data-workbench-r17
          run-id: 31365802099
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: stage3-s3g1j-v17-21-full-final-input
          path: prepared
          repository: FASHI188/data-workbench-r17
          run-id: 30649251360
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: stage3-s3g1j-v17-28-full-final
          path: previous
          repository: FASHI188/data-workbench-r17
          run-id: 30997260730
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: stage3-s3g1j-v17-29-production-promotion-safety
          path: gold
          repository: FASHI188/data-workbench-r17
          run-id: 31311296836
          github-token: ${{ github.token }}

      - name: Require all downloaded shard manifests to be pure V17.29
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import glob,json,os
          manifests=glob.glob('partials/**/financial_extract_shard*.manifest.json',recursive=True)
          assert len(manifests)==64, len(manifests)
          rows=[json.load(open(p,encoding='utf-8')) for p in manifests]
          assert sorted(row['shard'] for row in rows)==list(range(64))
          assert all(row['shards']==64 for row in rows)
          assert all(row['gate']==os.environ['SHARD_GATE'] for row in rows)
          assert all(row['runtime_generation']==os.environ['RUNTIME_GENERATION'] for row in rows)
          assert all(row['parser_method']==os.environ['PARSER_METHOD'] for row in rows)
          assert all(row['methodology_version']==os.environ['METHODOLOGY'] for row in rows)
          assert all(row['document_rows']==row['selected_versions'] and row['document_rows']>0 for row in rows)
          assert all(row['source_format']=='PDF' for row in rows)
          assert all(row['original_pdf_authority'] is True for row in rows)
          assert all(row['current_f10_historical_backfill_used'] is False for row in rows)
          assert all(row['stage4_alpha_locked'] is True for row in rows)
          assert all(row['error_count']==len(row['errors']) for row in rows)
          print('V17_29_ACCEPTANCE_64_PURE_MANIFESTS_PASS')
          PY

      - name: Finalize frozen V17.29 shards
        shell: bash
        run: |
          set +e
          mkdir -p build/final
          python scripts/finalize_stage3_financial_pdf_values.py \
            --root partials \
            --versions prepared/stage3_financial_report_versions.csv.gz \
            --stage2-manifest prepared/stage2_manifest.json \
            --out build/final \
            --expected-shard-gate "$SHARD_GATE" \
            --expected-parser-method "$PARSER_METHOD" \
            --expected-methodology-version "$METHODOLOGY" \
            > build/final/finalizer.stdout.log 2> build/final/finalizer.stderr.log
          code=$?
          echo "FINALIZER_EXIT=$code" >> "$GITHUB_ENV"
          test "$code" = 2
          exit 0

      - name: Require exact fail-closed V17.29 full-basis output
        shell: bash
        run: |
          set -euo pipefail
          test "$FINALIZER_EXIT" = 2
          python - <<'PY'
          import json,os
          audit=json.load(open('build/final/stage3_financial_raw_audit.json',encoding='utf-8'))
          expected={
            'shard_gate':os.environ['SHARD_GATE'],
            'runtime_generation':os.environ['RUNTIME_GENERATION'],
            'parser_method':os.environ['PARSER_METHOD'],
            'methodology_version':os.environ['METHODOLOGY'],
            'canonical_version_count':121354,
            'document_count':121354,
            'numeric_observation_count':1051820,
            'document_error_count':1364,
            'unresolved_tie_count':1281,
            'authority':'CNINFO_ORIGINAL_FILING_PDF_BYTES_WITH_SHA256',
            'historical_current_f10_used_as_truth':False,
            'stage4_alpha_locked':True,
            'pass':False,
          }
          for field,wanted in expected.items():
            assert audit[field]==wanted,(field,audit.get(field),wanted)
          print('V17_29_ACCEPTANCE_EXACT_FULL_BASIS_PASS')
          PY

      - name: Enforce V17.29 full-basis non-regression and promotion-gold equality
        shell: bash
        run: |
          set -euo pipefail
          previous_docs=$(find previous -name stage3_financial_documents.csv.gz -print -quit)
          previous_values=$(find previous -name stage3_financial_raw_values.csv.gz -print -quit)
          previous_audit=$(find previous -name stage3_financial_raw_audit.json -print -quit)
          gold_values=$(find gold -name 'stage3_financial_values_v17_29_production_promotion_safety.csv.gz' -print -quit)
          test -n "$previous_docs" && test -n "$previous_values" && test -n "$previous_audit" && test -n "$gold_values"
          python scripts/compare_stage3_s3g1j_v17_29_full_final.py \
            --previous-documents "$previous_docs" \
            --current-documents build/final/stage3_financial_documents.csv.gz \
            --previous-values "$previous_values" \
            --current-values build/final/stage3_financial_raw_values.csv.gz \
            --gold-values "$gold_values" \
            --previous-audit "$previous_audit" \
            --current-audit build/final/stage3_financial_raw_audit.json \
            --out build/final/stage3_s3g1j_v17_29_full_basis_non_regression.json

      - name: Record execution and deterministic output identities
        shell: bash
        run: |
          set -euo pipefail
          cp build/locks/source_shard_artifacts.json build/final/source_shard_artifacts.json
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          audit=json.load(open('build/final/stage3_financial_raw_audit.json',encoding='utf-8'))
          compare=json.load(open('build/final/stage3_s3g1j_v17_29_full_basis_non_regression.json',encoding='utf-8'))
          assert compare['pass'] is True and compare['errors']==[]
          assert compare['changed_announcement_ids']==sorted([
            '1215186538','1219426855','1219792633','1219840508','1219879687','1220087244','1221006100'
          ])
          assert compare['non_target_document_equal_count']==121347
          assert compare['existing_numeric_semantic_sha256_previous']==compare['existing_numeric_semantic_sha256_current']
          assert compare['fresh_numeric_semantic_sha256']==compare['promotion_gold_numeric_semantic_sha256']
          execution={
            'gate':'S3G1J_V17_29_FULL_64_SHARD_ACCEPTANCE',
            'source_shard_pr':113,
            'source_shard_run':31365802099,
            'source_shard_head':'2b48694391e2a6cdbd6972b68844c1253b3c55d9',
            'source_shard_count':64,
            'execution_pass':True,
            'document_non_regression_pass':True,
            'numeric_non_regression_pass':True,
            'promotion_gold_equality_pass':True,
            'final_data_gate_pass':False,
            'final_data_verdict':'FAIL_CLOSED',
            'canonical_version_count':audit['canonical_version_count'],
            'document_count':audit['document_count'],
            'numeric_observation_count':audit['numeric_observation_count'],
            'document_error_count':audit['document_error_count'],
            'unresolved_tie_count':audit['unresolved_tie_count'],
            'changed_announcement_ids':compare['changed_announcement_ids'],
            'non_target_document_equal_count':compare['non_target_document_equal_count'],
            'existing_numeric_semantic_sha256':compare['existing_numeric_semantic_sha256_current'],
            'fresh_numeric_semantic_sha256':compare['fresh_numeric_semantic_sha256'],
            'promotion_gold_numeric_semantic_sha256':compare['promotion_gold_numeric_semantic_sha256'],
            'stage3_status':'NOT_READY',
            'stage4_alpha_locked':True,
            'committed_production_data_changed':False,
            'trained_model_changed':False,
            'main_changed':False,
          }
          Path('build/final/stage3_s3g1j_v17_29_execution.json').write_text(
            json.dumps(execution,ensure_ascii=False,indent=2)+'\n',encoding='utf-8'
          )
          files=[
            'stage3_financial_documents.csv.gz',
            'stage3_financial_raw_values.csv.gz',
            'stage3_financial_raw_audit.json',
            'stage3_s3g1j_v17_29_full_basis_non_regression.json',
            'stage3_s3g1j_v17_29_execution.json',
            'source_shard_artifacts.json',
            'finalizer.stdout.log',
            'finalizer.stderr.log',
          ]
          hashes={}
          for name in files:
            data=Path('build/final',name).read_bytes()
            hashes[name]=hashlib.sha256(data).hexdigest()
          Path('build/final/stage3_s3g1j_v17_29_output_sha256.json').write_text(
            json.dumps(hashes,ensure_ascii=False,indent=2,sort_keys=True)+'\n',encoding='utf-8'
          )
          for name,digest in sorted(hashes.items()): print(digest,name)
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: stage3-s3g1j-v17-29-full-final
          path: build/final
          retention-days: 90
          compression-level: 0
