name: Stage3 S3G1J V15 Conflict Unit Diagnostic

on:
  pull_request:
    branches: [stage3-s3g1j-coordinate-table-v14]
    paths:
      - '.github/workflows/stage3-s3g1j-v15-conflict-units.yml'
      - 'scripts/probe_stage3_s3g1j_v15_conflict_units.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ github.token }}
  V13_SMOKE_RUN: '30382695045'
  V14_ACCEPTANCE_RUN: '30423298099'
  PYTHONPATH: scripts

jobs:
  diagnose-six-conflicts:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests pymupdf
      - name: Require accepted V14.1 parser base
        run: test "$(gh run view "$V14_ACCEPTANCE_RUN" -R "$GITHUB_REPOSITORY" --json conclusion --jq .conclusion)" = success
      - name: Restore exact V12.1 version ledger
        run: |
          rm -rf versions data/stage3_source_probe_v15_conflicts
          gh run download "$V13_SMOKE_RUN" -R "$GITHUB_REPOSITORY" \
            -n stage3-s3g1j-v13-smoke-versions -D versions
          test -f versions/stage3_financial_report_versions_v3.csv.gz
      - name: Capture units and display precision for the six blocked tie pairs
        run: |
          python scripts/probe_stage3_s3g1j_v15_conflict_units.py \
            --versions versions/stage3_financial_report_versions_v3.csv.gz \
            --out data/stage3_source_probe_v15_conflicts/conflict_units.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage3-s3g1j-v15-conflict-units
          path: data/stage3_source_probe_v15_conflicts/conflict_units.json
          retention-days: 90
          compression-level: 0
