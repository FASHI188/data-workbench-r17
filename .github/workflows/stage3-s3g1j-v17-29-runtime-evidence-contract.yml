name: Stage3 S3G1J V17.29 Runtime Evidence Contract

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'governance/stage3_s3g1j_v17_29_runtime_promotion.json'
      - 'governance/stage3_s3g1j_v17_29_full_final.json'
      - 'governance/stage3_s3g1j_v17_30_residual_retention.json'
      - 'governance/stage3_s3g1j_runtime_manifest.json'
      - 'governance/stage3_workflow_activation_manifest.json'
      - 'governance/stage3_authority_map.json'
      - 'governance/stage3_s3g4_final.json'
      - 'data/project_status.json'
      - 'config/stage3_final_lock.json'
      - 'tests/test_stage3_v17_29_runtime_wrapper.py'
      - 'tests/test_stage3_v17_29_runtime_promotion.py'
      - 'scripts/audit_stage3_authority_map.py'
      - '.github/workflows/stage3-s3g1j-v17-29-runtime-evidence-contract.yml'

permissions:
  contents: read
  actions: read
  pull-requests: read

env:
  GH_TOKEN: ${{ github.token }}
  PYTHONPATH: scripts

jobs:
  runtime-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
      - name: Install verified evidence runtime
        run: python -m pip install --disable-pip-version-check -c requirements/constraints-verified.txt requests pymupdf
      - name: Lock immutable V17.29 wrapper execution and artifact
        shell: bash
        run: |
          set -euo pipefail
          pr=$(gh pr view 109 -R "$GITHUB_REPOSITORY" --json headRefOid,state,mergedAt)
          test "$(jq -r '.headRefOid' <<<"$pr")" = 04a014f852bff57aef57542553864fcd3f1df13d
          test "$(jq -r '.state' <<<"$pr")" = CLOSED
          test "$(jq -r '.mergedAt // ""' <<<"$pr")" = ""
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/31312709490")
          test "$(jq -r '.status' <<<"$run")" = completed
          test "$(jq -r '.conclusion' <<<"$run")" = success
          test "$(jq -r '.head_sha' <<<"$run")" = 04a014f852bff57aef57542553864fcd3f1df13d
          a=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/9037869497")
          test "$(jq -r '.name' <<<"$a")" = stage3-s3g1j-v17-29-runtime-wrapper
          test "$(jq -r '.digest' <<<"$a")" = sha256:4f9940513c2d0ef5250b8874b32f68655badfe4a695a2fe2c3da0a54d2a01670
          test "$(jq -r '.expired' <<<"$a")" = false
      - name: Verify immutable V17.29 promotion evidence and code identity
        run: |
          test "$(git hash-object scripts/stage3_financial_pdf_parser_v21.py)" = 37ab001356c479808e3fa5f67f2270649e3130ba
          test "$(git hash-object scripts/extract_stage3_financial_pdf_values_v19.py)" = 7be4f17357e92144c3f54ddd4951ec57a0878049
          python -m unittest tests.test_stage3_v17_29_runtime_wrapper tests.test_stage3_v17_29_runtime_promotion -v
          python scripts/audit_stage3_authority_map.py
      - name: Verify V17.29 is retained history under current S3G4-complete V17.30 authority
        run: |
          python - <<'PY'
          import json
          runtime=json.load(open('governance/stage3_s3g1j_runtime_manifest.json',encoding='utf-8'))
          activation=json.load(open('governance/stage3_workflow_activation_manifest.json',encoding='utf-8'))
          retention=json.load(open('governance/stage3_s3g1j_v17_30_residual_retention.json',encoding='utf-8'))
          project=json.load(open('data/project_status.json',encoding='utf-8'))
          lock=json.load(open('config/stage3_final_lock.json',encoding='utf-8'))
          promotion=json.load(open('governance/stage3_s3g1j_v17_29_runtime_promotion.json',encoding='utf-8'))
          # Immutable historical V17.29 promotion checkpoint.
          assert promotion['next_full_basis']['status']=='REQUIRED_NOT_STARTED'
          assert promotion['next_full_basis']['expected_values_are_not_production_acceptance'] is True
          assert runtime['schema_version']>=15 and runtime['formal_runtime']['runtime_generation']=='V17.30'
          latest=runtime['full_basis_last_completed_final']
          assert latest['generation']=='V17.30' and latest['run']==31518370789
          assert latest['numeric_observations']==1051826 and latest['document_error_count']==1362 and latest['unresolved_tie_count']==1279 and latest['verdict']=='FAIL_CLOSED'
          prev=runtime['previous_last_completed_full_basis_final']
          assert prev['generation']=='V17.29' and prev['run']==31389854868 and prev['artifact_id']==9063271903
          assert runtime['next_full_basis_required']['status']=='NONE_CURRENT_RUNTIME_ACCEPTED'
          current=activation['accepted_production_runtime']
          assert current['generation']=='V17.30' and current['full_basis_execution_pending'] is False
          assert current['last_completed_full_basis_generation']=='V17.30' and current['last_completed_full_basis_run']==31518370789
          retained=activation['accepted_v17_29_full_basis_evidence']
          assert retained['last_completed_full_basis_authority'] is False and retained['historical_full_basis_authority_retained'] is True
          assert retention['accepted_run']['run_id']==31555404674 and retention['retention_result']['raw_errors_removed'] is False
          pg=project['stage3']['s3g1j']
          assert pg['formal_runtime_generation']=='V17.30' and pg['last_completed_full_basis_generation']=='V17.30'
          assert pg['accepted_run_id']==31518370789 and pg['document_error_count']==1362 and pg['unresolved_tie_count']==1279
          assert pg['raw_data_verdict']=='FAIL_CLOSED' and pg['residual_retention_run_id']==31555404674
          assert pg['residual_retention_gate_pass'] is True and pg['final_gate_pass'] is True
          lg=lock['required_gates']['S3G1J_FINANCIAL_RAW_VALUES']
          assert lg['formal_runtime_generation']=='V17.30' and lg['last_completed_full_basis_generation']=='V17.30'
          assert lg['run_id']==31518370789 and lg['raw_data_verdict']=='FAIL_CLOSED'
          assert lg['residual_retention_run_id']==31555404674 and lg['final_gate_pass'] is True
          g4=lock['required_gates']['S3G4_EARNINGS_SURPRISE']
          assert g4['run_id']==31557811596 and g4['artifact_id']==9126607328 and g4['final_gate_pass'] is True
          assert lock['remaining_unlocked_gates']==[]
          assert project['stage3']['status'] in {'NOT_READY','PASS_FROZEN_HISTORICAL'} and project['stage3']['pending_final_gates']==[]
          assert project['stage3']['s3g4']['accepted_run_id']==31557811596 and project['stage3']['s3g4']['final_gate_pass'] is True
          assert project['freshness']['status']=='STALE'
          assert project['stage4_unlocked'] is False and project['alpha_training_allowed'] is False and project['live_signal_allowed'] is False
          print('V17_29_RUNTIME_RETAINED_UNDER_S3G4_COMPLETE_V17_30_AUTHORITY_PASS')
          PY
