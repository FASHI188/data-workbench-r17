name: Stage2 G2 Lifecycle API Probe

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/probe_lifecycle_api_candidates.py'
      - '.github/workflows/stage2-g2-api-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests
      - name: Probe direct exchange APIs
        shell: bash
        run: |
          echo "G2 lifecycle API probe run 1"
          mkdir -p data/lifecycle_api_probe
          python scripts/probe_lifecycle_api_candidates.py > data/lifecycle_api_probe/stdout.log 2> data/lifecycle_api_probe/stderr.log
      - name: Upload probe evidence
        uses: actions/upload-artifact@v4
        with:
          name: stage2-g2-lifecycle-api-probe
          path: data/lifecycle_api_probe
          retention-days: 7
