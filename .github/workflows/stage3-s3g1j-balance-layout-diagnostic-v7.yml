name: Stage3 S3G1J Balance Layout Diagnostic V7

on:
  workflow_dispatch:
  pull_request:
    branches: [stage3-s3g1j-balance-block-repair-v6]
    paths:
      - 'scripts/probe_stage3_balance_text_layout_v7.py'
      - '.github/workflows/stage3-s3g1j-balance-layout-diagnostic-v7.yml'

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONPATH: scripts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests pymupdf
      - name: Preserve V6 parser regressions
        run: |
          python -m unittest \
            tests.test_stage3_financial_balance_block_v4 \
            tests.test_stage3_financial_balance_block_v5 \
            tests.test_stage3_financial_balance_block_v6 -v
      - name: Inspect residual PDF text and coordinate layout
        shell: bash
        run: |
          set +e
          mkdir -p data/stage3_source_probe_v7
          python scripts/probe_stage3_balance_text_layout_v7.py \
            > data/stage3_source_probe_v7/stdout.log \
            2> data/stage3_source_probe_v7/stderr.log
          code=$?
          echo "DIAG_EXIT=$code" >> "$GITHUB_ENV"
          python - <<'PY'
          import json
          p='data/stage3_source_probe_v7/balance_text_layout_diagnostic_v7.json'
          x=json.load(open(p,encoding='utf-8'))
          print({'pass':x['pass'],'errors':x['errors']})
          for r in x['results']:
              print(r['name'], 'pages=', r.get('page_count'), 'starts=', r.get('v6_detected_starts'), 'evidence_pages=', len(r.get('pages_with_balance_evidence') or []), 'error=', r.get('error'))
          PY
          cat data/stage3_source_probe_v7/stderr.log || true
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: stage3-s3g1j-balance-layout-diagnostic-v7
          path: data/stage3_source_probe_v7
          retention-days: 90
      - name: Preserve fail-closed diagnostic status
        if: env.DIAG_EXIT != '0'
        run: exit 1
