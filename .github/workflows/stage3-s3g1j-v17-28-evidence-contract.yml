name: Stage3 S3G1J V17.28 Evidence Contract

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'governance/stage3_s3g1j_v17_28_split_equity_diagnostic.json'
      - 'tests/test_stage3_s3g1j_v17_28_split_equity_evidence.py'
      - '.github/workflows/stage3-s3g1j-v17-28-evidence-contract.yml'

permissions:
  contents: read
  actions: read
  pull-requests: read

env:
  GH_TOKEN: ${{ github.token }}
  DIAGNOSTIC_PR: '90'
  DIAGNOSTIC_HEAD: '5c3bfff81a7518c6427030677bd1d4b288104e1e'
  DIAGNOSTIC_RUN: '30824927082'
  DIAGNOSTIC_ARTIFACT_ID: '8860412443'
  DIAGNOSTIC_ARTIFACT: 'stage3-s3g1j-v17-28-split-equity-diagnostic'
  DIAGNOSTIC_DIGEST: 'sha256:287d37e2d5972e0d8cdfb36fd987a7c7cbf239b32d6fdabd96e26da27064565d'
  REPORT_SHA256: '5b2610f67f3f15113a62c2172eccbbf8df362d75263ac6049cd335aae5bc49d6'

jobs:
  evidence-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
      - name: Lock non-merge evidence PR identity
        shell: bash
        run: |
          set -euo pipefail
          payload=$(gh pr view "$DIAGNOSTIC_PR" -R "$GITHUB_REPOSITORY" --json headRefOid,mergedAt)
          test "$(jq -r '.headRefOid' <<<"$payload")" = "$DIAGNOSTIC_HEAD"
          test "$(jq -r '.mergedAt // ""' <<<"$payload")" = ""
      - name: Lock accepted diagnostic run and artifact
        shell: bash
        run: |
          set -euo pipefail
          run_payload=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$DIAGNOSTIC_RUN")
          test "$(jq -r '.head_sha' <<<"$run_payload")" = "$DIAGNOSTIC_HEAD"
          test "$(jq -r '.conclusion' <<<"$run_payload")" = success
          payload=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$DIAGNOSTIC_RUN/artifacts?per_page=100")
          count=$(jq -r --arg name "$DIAGNOSTIC_ARTIFACT" '[.artifacts[] | select(.name==$name)] | length' <<<"$payload")
          test "$count" = 1
          test "$(jq -r --arg name "$DIAGNOSTIC_ARTIFACT" '.artifacts[] | select(.name==$name) | .id' <<<"$payload")" = "$DIAGNOSTIC_ARTIFACT_ID"
          test "$(jq -r --arg name "$DIAGNOSTIC_ARTIFACT" '.artifacts[] | select(.name==$name) | .digest' <<<"$payload")" = "$DIAGNOSTIC_DIGEST"
          test "$(jq -r --arg name "$DIAGNOSTIC_ARTIFACT" '.artifacts[] | select(.name==$name) | .workflow_run.head_sha' <<<"$payload")" = "$DIAGNOSTIC_HEAD"
      - uses: actions/download-artifact@v4
        with:
          name: stage3-s3g1j-v17-28-split-equity-diagnostic
          path: accepted
          repository: FASHI188/data-workbench-r17
          run-id: 30824927082
          github-token: ${{ github.token }}
      - name: Verify accepted diagnostic report identity and content
        shell: bash
        run: |
          set -euo pipefail
          report=$(find accepted -name stage3_s3g1j_v17_28_split_equity_diagnostic.json -print -quit)
          test -n "$report"
          test "$(sha256sum "$report" | awk '{print $1}')" = "$REPORT_SHA256"
          REPORT="$report" python - <<'PY'
          import json,os
          report=json.load(open(os.environ['REPORT'],encoding='utf-8'))
          assert report['pass'] is True and report['errors']==[]
          assert report['target_announcement_ids']==['1207621057','1209825769']
          assert report['processed_count']==2
          by_id={row['announcement_id']:row for row in report['results']}
          assert set(by_id)=={'1207621057','1209825769'}
          for row in by_id.values():
              assert row['formal_runtime_recovered'] is False
              assert row['existing_spatial_candidate_counts']=={
                  'TOTAL_ASSETS':3,'TOTAL_LIABILITIES':1,'TOTAL_EQUITY':0
              }
              assert row['existing_spatial_recovered'] is False
              assert row['group_event']['role']=='GROUP'
              assert row['header_context']['date_text_object_count']==2
              assert row['header_context']['unit_text_object_count']==1
              assert row['equity_value_is_explicit_pdf_text'] is True
              assert row['equity_value_inferred_as_assets_minus_liabilities'] is False
              assert row['diagnostic_candidate_pass'] is True
              assert row['automatic_recovery_authorized'] is False
              assert all(x['identity_residual_cny']=='0.00' for x in row['identity']['columns'])
          assert report['parser_changed'] is False
          assert report['runtime_authority_changed'] is False
          assert report['production_data_changed'] is False
          assert report['automatic_recovery_authorized'] is False
          assert report['stage3_status']=='NOT_READY'
          assert report['stage4_alpha_live_locked'] is True
          assert report['main_changed'] is False
          print('S3G1J_V17_28_ACCEPTED_DIAGNOSTIC_REPORT_PASS')
          PY
      - name: Verify committed evidence manifest
        run: python -m unittest tests.test_stage3_s3g1j_v17_28_split_equity_evidence -v
