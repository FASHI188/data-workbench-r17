name: Stage3 S3G1J V17.28 Runtime Wrapper Contract

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/stage3_financial_pdf_parser_v20_candidate.py'
      - 'scripts/stage3_financial_pdf_parser_v20.py'
      - 'scripts/extract_stage3_financial_pdf_values_v18.py'
      - 'tests/test_stage3_s3g1j_v17_28_split_equity_candidate.py'
      - 'tests/test_stage3_v17_28_runtime_wrapper.py'
      - '.github/workflows/stage3-s3g1j-v17-28-runtime-wrapper.yml'

permissions:
  contents: read
  actions: read
  pull-requests: read

env:
  GH_TOKEN: ${{ github.token }}
  PYTHONPATH: scripts
  EVIDENCE_PR: '93'
  EVIDENCE_PR_HEAD: '722f1152745d9d980cb4793f780f76984a08d4a1'
  EVIDENCE_MERGE_COMMIT: '9ea0940dcfd1a371af7877143dd173e12fe5a59c'
  CANDIDATE_RUN: '30827493788'
  CANDIDATE_HEAD: '08ddddca5effac0f416b68ac2f4c07cdec99dfb2'
  CANDIDATE_ARTIFACT_ID: '8861519922'
  CANDIDATE_ARTIFACT: 'stage3-s3g1j-v17-28-split-equity-candidate-safety'
  CANDIDATE_DIGEST: 'sha256:8a87dfed63160374fc04c88c3d02a93eedac6ae239ae559b64aaad93c71d22c1'
  REPORT_SHA256: '42fd39956ea3c2dafba98b4d5c1697c15a797099011b4d8ed531cead264e4b21'
  DOCUMENTS_SHA256: '818f08602792dec73c4f6c84e9dd41e8633e7f4d56edecc2e0336e71d898491c'
  VALUES_SHA256: '960926aa46e01182d30d97a552f674002f09303f73f142645374ba1a6116af65'

jobs:
  runtime-wrapper:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
      - name: Install verified runtime
        run: python -m pip install --disable-pip-version-check -c requirements/constraints-verified.txt requests pymupdf
      - name: Lock merged candidate evidence governance
        shell: bash
        run: |
          set -euo pipefail
          payload=$(gh pr view "$EVIDENCE_PR" -R "$GITHUB_REPOSITORY" --json headRefOid,mergedAt,mergeCommit)
          test "$(jq -r '.headRefOid' <<<"$payload")" = "$EVIDENCE_PR_HEAD"
          test -n "$(jq -r '.mergedAt // ""' <<<"$payload")"
          test "$(jq -r '.mergeCommit.oid' <<<"$payload")" = "$EVIDENCE_MERGE_COMMIT"
          python - <<'PY'
          import json
          evidence=json.load(open('governance/stage3_s3g1j_v17_28_candidate_safety.json',encoding='utf-8'))
          assert evidence['schema_version']==2
          assert evidence['status']=='MACHINE_ACCEPTED_CANDIDATE_ONLY'
          assert evidence['accepted_run']['artifact_digest']=='sha256:8a87dfed63160374fc04c88c3d02a93eedac6ae239ae559b64aaad93c71d22c1'
          assert evidence['candidate_identity']['candidate_promotion_authorized'] is False
          assert evidence['hard_boundaries']['runtime_authority_changed'] is False
          print('S3G1J_V17_28_GOVERNANCE_LOCK_PASS')
          PY
      - name: Lock candidate run and artifact
        shell: bash
        run: |
          set -euo pipefail
          run_payload=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN")
          test "$(jq -r '.head_sha' <<<"$run_payload")" = "$CANDIDATE_HEAD"
          test "$(jq -r '.conclusion' <<<"$run_payload")" = success
          payload=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN/artifacts?per_page=100")
          count=$(jq -r --arg name "$CANDIDATE_ARTIFACT" '[.artifacts[] | select(.name==$name)] | length' <<<"$payload")
          test "$count" = 1
          test "$(jq -r --arg name "$CANDIDATE_ARTIFACT" '.artifacts[] | select(.name==$name) | .id' <<<"$payload")" = "$CANDIDATE_ARTIFACT_ID"
          test "$(jq -r --arg name "$CANDIDATE_ARTIFACT" '.artifacts[] | select(.name==$name) | .digest' <<<"$payload")" = "$CANDIDATE_DIGEST"
          test "$(jq -r --arg name "$CANDIDATE_ARTIFACT" '.artifacts[] | select(.name==$name) | .workflow_run.head_sha' <<<"$payload")" = "$CANDIDATE_HEAD"
          test "$(jq -r --arg name "$CANDIDATE_ARTIFACT" '.artifacts[] | select(.name==$name) | .expired' <<<"$payload")" = false
      - uses: actions/download-artifact@v4
        with:
          name: stage3-s3g1j-v17-28-split-equity-candidate-safety
          path: accepted
          repository: FASHI188/data-workbench-r17
          run-id: 30827493788
          github-token: ${{ github.token }}
      - name: Verify accepted candidate files
        shell: bash
        run: |
          set -euo pipefail
          report=$(find accepted -name stage3_s3g1j_v17_28_candidate_safety.json -print -quit)
          documents=$(find accepted -name stage3_financial_documents_v17_28_candidate.csv.gz -print -quit)
          values=$(find accepted -name stage3_financial_values_v17_28_candidate.csv.gz -print -quit)
          test -n "$report" && test -n "$documents" && test -n "$values"
          test "$(sha256sum "$report" | awk '{print $1}')" = "$REPORT_SHA256"
          test "$(sha256sum "$documents" | awk '{print $1}')" = "$DOCUMENTS_SHA256"
          test "$(sha256sum "$values" | awk '{print $1}')" = "$VALUES_SHA256"
          echo "CANDIDATE_DOCUMENTS=$documents" >> "$GITHUB_ENV"
          echo "CANDIDATE_VALUES=$values" >> "$GITHUB_ENV"
      - name: Run candidate and production-wrapper contracts
        run: |
          python -m unittest \
            tests.test_stage3_s3g1j_v17_28_split_equity_candidate \
            tests.test_stage3_v17_28_runtime_wrapper \
            -v
          python -m py_compile \
            scripts/stage3_financial_pdf_parser_v20_candidate.py \
            scripts/stage3_financial_pdf_parser_v20.py \
            scripts/extract_stage3_financial_pdf_values_v18.py
      - name: Verify real source promotion and produce evidence report
        run: |
          mkdir -p build/v17_28_runtime_wrapper
          python - <<'PY'
          import csv,gzip,hashlib,json,os
          from collections import defaultdict
          from pathlib import Path
          import requests
          import stage3_financial_pdf_parser_v20 as parser

          target_ids={'1207621057','1209825769'}
          with gzip.open(os.environ['CANDIDATE_DOCUMENTS'],'rt',encoding='utf-8',newline='') as handle:
              docs={row['announcement_id']:row for row in csv.DictReader(handle) if row['announcement_id'] in target_ids}
          with gzip.open(os.environ['CANDIDATE_VALUES'],'rt',encoding='utf-8',newline='') as handle:
              values=[row for row in csv.DictReader(handle) if row['announcement_id'] in target_ids]
          assert set(docs)==target_ids
          expected=defaultdict(dict)
          for row in values:
              expected[row['announcement_id']][row['concept']]=row['normalized_cny_value']
          assert {aid:len(rows) for aid,rows in expected.items()}=={'1207621057':3,'1209825769':3}

          session=requests.Session()
          session.headers.update({'User-Agent':'data-workbench-r17-v17-28-runtime-wrapper/1.0','Accept':'application/pdf,*/*;q=0.8'})
          results=[]
          for aid in sorted(target_ids):
              row=docs[aid]
              url=row['selected_source_url']
              response=session.get(url,timeout=(30,180))
              response.raise_for_status()
              raw=response.content
              assert raw.startswith(b'%PDF')
              digest=hashlib.sha256(raw).hexdigest()
              assert digest==row['selected_source_sha256']
              assert len(raw)==int(row['selected_source_bytes'])
              parsed=parser.parse_pdf_bytes(raw,row['economic_date'])
              assert parsed['parser_version']==parser.METHOD
              assert parsed['validation_errors']==[]
              found={
                  concept:item['normalized_cny_value']
                  for concept,item in parsed['observations'].items()
                  if isinstance(item,dict) and item.get('status')=='FOUND'
              }
              assert found==expected[aid]
              block=parsed['balance_sheet_block']
              assert block['candidate_only'] is False
              assert block['candidate_safety_promoted'] is True
              assert block['formal_runtime_generation']=='V17.28'
              assert block['production_runtime_generation']=='V17.28'
              assert block['candidate_acceptance_run']==30827493788
              assert block['candidate_acceptance_artifact_digest']==os.environ['CANDIDATE_DIGEST']
              assert block['production_evidence_manifest']=='governance/stage3_s3g1j_v17_28_candidate_safety.json'
              results.append({
                  'announcement_id':aid,
                  'source_url':url,
                  'source_sha256':digest,
                  'source_bytes':len(raw),
                  'economic_date':row['economic_date'],
                  'values':found,
                  'split_equity_pattern':block['split_equity_pattern'],
                  'candidate_only':block['candidate_only'],
                  'formal_runtime_generation':block['formal_runtime_generation'],
              })

          runtime=json.load(open('governance/stage3_s3g1j_runtime_manifest.json',encoding='utf-8'))
          activation=json.load(open('governance/stage3_workflow_activation_manifest.json',encoding='utf-8'))
          assert runtime['current_production_authority']['generation']=='V17.27'
          assert runtime['formal_runtime']['runtime_generation']=='V17.27'
          assert activation['accepted_production_runtime']['generation']=='V17.27'
          report={
              'gate':'S3G1J_V17_28_RUNTIME_WRAPPER_IMPLEMENTATION',
              'implementation_head':os.environ['GITHUB_SHA'],
              'candidate_run':30827493788,
              'candidate_artifact_id':8861519922,
              'candidate_artifact_digest':os.environ['CANDIDATE_DIGEST'],
              'target_count':2,
              'targets':results,
              'real_source_promotion_pass':True,
              'non_target_delegation_contract_pass':True,
              'formal_runtime_authority_before_activation':'V17.27',
              'v17_28_authority_activated':False,
              'fresh_64_shard_execution_started':False,
              'production_data_changed':False,
              'trained_model_changed':False,
              'stage3_status':'NOT_READY',
              'stage4_alpha_live_locked':True,
              'main_changed':False,
              'pass':True,
              'errors':[],
          }
          out=Path('build/v17_28_runtime_wrapper/stage3_s3g1j_v17_28_runtime_wrapper.json')
          out.write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY
      - name: Record output identities
        run: sha256sum build/v17_28_runtime_wrapper/* | sort | tee build/v17_28_runtime_wrapper/output_sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: stage3-s3g1j-v17-28-runtime-wrapper
          path: build/v17_28_runtime_wrapper
          retention-days: 60
          compression-level: 0
