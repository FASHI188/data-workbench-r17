name: Stage3 S3G1J V16.7 Column Role Diagnostic

on:
  pull_request:
    branches: [stage3-s3g1j-coordinate-table-v14]
    paths:
      - '.github/workflows/stage3-s3g1j-v16-7-column-role.yml'
      - 'scripts/probe_stage3_s3g1j_v16_7_column_roles.py'
      - 'scripts/stage3_financial_spatial_alias_v16_3.py'
      - 'scripts/stage3_financial_statement_blocks_v16_5.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ github.token }}
  V13_SMOKE_RUN: '30382695045'
  V16_6_ACCEPTED_RUN: '30430619172'
  PYTHONPATH: scripts

jobs:
  diagnose-column-role-geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests pymupdf
      - name: Require accepted V16.6 diagnostic
        run: test "$(gh run view "$V16_6_ACCEPTED_RUN" -R "$GITHUB_REPOSITORY" --json conclusion --jq .conclusion)" = success
      - name: Restore exact frozen V12.1 version ledger
        run: |
          rm -rf versions data/stage3_source_probe_v16_7
          gh run download "$V13_SMOKE_RUN" -R "$GITHUB_REPOSITORY" \
            -n stage3-s3g1j-v13-smoke-versions -D versions
          test -f versions/stage3_financial_report_versions_v3.csv.gz
      - name: Trace expected-date header x against all 30 selected A/L/E values
        run: |
          python scripts/probe_stage3_s3g1j_v16_7_column_roles.py \
            --versions versions/stage3_financial_report_versions_v3.csv.gz \
            --out data/stage3_source_probe_v16_7/column_role_geometry.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage3-s3g1j-v16-7-column-role
          path: data/stage3_source_probe_v16_7/column_role_geometry.json
          retention-days: 90
          compression-level: 0
