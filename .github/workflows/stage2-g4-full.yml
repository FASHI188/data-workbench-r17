name: Stage2 G4 Full Daily Security State

# Full-market BaoStock rebuilds are an explicit maintenance operation only.
# Audit/reclassification changes must consume the frozen G4 source artifact instead of
# spawning another network crawl of the entire universe.
on:
  workflow_dispatch:

concurrency:
  group: stage2-g4-full-manual
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check baostock pandas
      - name: Build all G4 state in one BaoStock session
        shell: bash
        run: |
          mkdir -p build/g4-single data/security_state
          set +e
          python scripts/build_g4_security_state_single_session.py > build/g4-single/stdout.log 2> build/g4-single/stderr.log
          code=$?
          echo "G4_EXIT=$code" >> "$GITHUB_ENV"
          cat build/g4-single/stdout.log || true
          cat build/g4-single/stderr.log || true
          exit 0
      - name: Audit G4
        if: env.G4_EXIT == '0'
        shell: bash
        run: |
          set +e
          python scripts/audit_g4_security_state.py --root build/g4-single --out data/security_state > data/security_state/audit_stdout.log 2> data/security_state/audit_stderr.log
          code=$?
          echo "G4_AUDIT_EXIT=$code" >> "$GITHUB_ENV"
          cat data/security_state/g4_audit.json || true
          cat data/security_state/audit_stderr.log || true
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: stage2-g4-daily-security-state
          path: |
            build/g4-single
            data/security_state
          compression-level: 0
          retention-days: 90
      - name: Fail closed after evidence preserved
        if: env.G4_EXIT != '0' || env.G4_AUDIT_EXIT != '0'
        run: exit 1
