name: Stage2 G2 Historical Lifecycle

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'config/security_code_transitions.json'
      - 'scripts/fetch_historical_lifecycle.py'
      - 'scripts/build_security_history.py'
      - 'scripts/audit_security_history.py'
      - 'tests/test_fetch_historical_lifecycle.py'
      - 'tests/test_security_code_transitions.py'
      - 'requirements/constraints-verified.txt'
      - '.python-version'
      - '.github/workflows/stage2-g2-historical.yml'
  push:
    branches: [main]
    paths:
      - 'config/security_code_transitions.json'
      - 'scripts/fetch_historical_lifecycle.py'
      - 'scripts/build_security_history.py'
      - 'scripts/audit_security_history.py'
      - 'tests/test_fetch_historical_lifecycle.py'
      - 'tests/test_security_code_transitions.py'
      - 'requirements/constraints-verified.txt'
      - '.python-version'
      - '.github/workflows/stage2-g2-historical.yml'

permissions:
  contents: read

jobs:
  build-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
      - name: Install verified dependencies
        run: python -m pip install --disable-pip-version-check -c requirements/constraints-verified.txt requests openpyxl pytest
      - name: Regression tests
        run: pytest -q
      - name: Fetch official historical lifecycle sources and build event ledger
        run: python scripts/fetch_historical_lifecycle.py
      - name: Build survivorship-free code-time lifecycle intervals
        run: python scripts/build_security_history.py
      - name: Audit G2 with preserved diagnostics
        id: g2-audit
        shell: bash
        run: |
          set +e
          python scripts/audit_security_history.py > data/security_lifecycle/g2_audit.json 2> data/security_lifecycle/g2_audit_stderr.log
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          cat data/security_lifecycle/g2_audit.json || true
          cat data/security_lifecycle/g2_audit_stderr.log || true
          exit 0
      - name: Upload G2 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage2-g2-historical-evidence
          path: data/security_lifecycle
          retention-days: 90
          compression-level: 0
      - name: Preserve G2 fail-closed status
        if: steps.g2-audit.outputs.exit_code != '0'
        run: exit 1
