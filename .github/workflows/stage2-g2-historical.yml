name: Stage2 G2 Historical Lifecycle

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/fetch_historical_lifecycle.py'
      - 'scripts/build_security_history.py'
      - 'scripts/audit_security_history.py'
      - 'tests/test_fetch_historical_lifecycle.py'
      - '.github/workflows/stage2-g2-historical.yml'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/fetch_historical_lifecycle.py'
      - 'scripts/build_security_history.py'
      - 'scripts/audit_security_history.py'
      - 'tests/test_fetch_historical_lifecycle.py'
      - '.github/workflows/stage2-g2-historical.yml'

permissions:
  contents: write

jobs:
  build-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests openpyxl pytest
      - name: Regression tests
        run: pytest -q
      - name: Fetch official historical lifecycle sources and build event ledger
        run: python scripts/fetch_historical_lifecycle.py
      - name: Build survivorship-free lifecycle intervals
        run: python scripts/build_security_history.py
      - name: Audit G2
        shell: bash
        run: |
          python scripts/audit_security_history.py > data/security_lifecycle/g2_audit.json
          cat data/security_lifecycle/g2_audit.json
      - name: Upload G2 evidence
        uses: actions/upload-artifact@v4
        with:
          name: stage2-g2-historical-evidence
          path: data/security_lifecycle
          retention-days: 14
      - name: Commit frozen G2 evidence
        if: github.event_name == 'push'
        shell: bash
        run: |
          git config user.name "stage2-bot"
          git config user.email "stage2-bot@users.noreply.github.com"
          git add data/security_lifecycle
          if git diff --cached --quiet; then
            echo "No G2 evidence change"
            exit 0
          fi
          git commit -m "stage2: freeze G2 historical lifecycle evidence [skip ci]"
          git push
