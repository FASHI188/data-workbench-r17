name: Stage2 G2 Historical Lifecycle

on:
  workflow_dispatch:
  push:
    branches: [stage2-g2-final-validation]
    paths:
      - '.github/workflows/stage2-g2-historical.yml'

permissions:
  actions: read
  contents: write

jobs:
  freeze-validated-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      VALIDATED_RUN_ID: '30211291770'
      VALIDATED_ARTIFACT: 'stage2-g2-historical-evidence'
    steps:
      - uses: actions/checkout@v4
      - name: Download the already validated G2 evidence
        shell: bash
        run: |
          rm -rf data/security_lifecycle
          mkdir -p data/security_lifecycle
          gh run download "$VALIDATED_RUN_ID" -R "$GITHUB_REPOSITORY" -n "$VALIDATED_ARTIFACT" -D data/security_lifecycle
      - name: Re-audit the frozen evidence
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('data/security_lifecycle/g2_audit.json').read_text(encoding='utf-8'))
          assert r == {
              'gate': 'G2',
              'pass': True,
              'current_master_count': 3191,
              'current_open_interval_count': 3191,
              'closed_interval_count': 289,
              'delist_events': 289,
              'total_intervals': 3480,
              'total_events': 3769,
              'errors': []
          }, r
          m=json.loads(Path('data/security_lifecycle/manifest.json').read_text(encoding='utf-8'))
          assert m['counts']['sse_delisted_a_all_history'] == 143, m
          assert m['counts']['szse_delisted_a_all_history'] == 146, m
          assert m['controls']['szse']['class_counts'] == {'MAIN_A': 146, 'MAIN_B': 21}, m
          print('artifact identity checks passed')
          PY
          python scripts/audit_security_history.py
      - name: Commit validated G2 evidence
        shell: bash
        run: |
          git config user.name "stage2-bot"
          git config user.email "stage2-bot@users.noreply.github.com"
          git add data/security_lifecycle
          git commit -m "stage2: freeze validated G2 lifecycle evidence [skip ci]"
          git push
