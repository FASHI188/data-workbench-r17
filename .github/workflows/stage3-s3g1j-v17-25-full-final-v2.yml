name: Stage3 S3G1J V17.25 Finalize Existing 64 Shards V3

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/compare_stage3_s3g1j_v17_25_full_final.py'
      - 'scripts/compare_stage3_s3g1j_v17_25_full_values.py'
      - 'tests/test_stage3_v17_25_full_final_comparator.py'
      - '.github/workflows/stage3-s3g1j-v17-25-full-final-v2.yml'

permissions:
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ github.token }}
  PYTHONPATH: scripts
  SOURCE_RUN: '30692117760'
  SOURCE_HEAD: 'f9329e2f6a83d38dfd86291a4fd7d4bbfbf1b6b1'
  FULL_RUN: '30649251360'
  FULL_HEAD: '6b274dbd32734ab0af6a75a6d595925278dd8973'
  INPUT_ARTIFACT: 'stage3-s3g1j-v17-21-full-final-input'
  INPUT_DIGEST: 'sha256:54a7e78b0defe34748abb18695aa758dcee65ddd978b6707d83ef5dd89f0ab10'
  PREVIOUS_ARTIFACT: 'stage3-s3g1j-v17-21-full-final'
  PREVIOUS_DIGEST: 'sha256:7faff72949a6e0a98f49088bce99bc2df37c7cbcb0259b39d1b2655fc02f6086'
  SHARD_GATE: 'S3G1J_FINANCIAL_PDF_EXTRACTION_SHARD_V17_25'
  PARSER_METHOD: 'CNINFO_ORIGINAL_PDF_PYMUPDF_V15_V17_25_EXACT_SOURCE_GENERIC_GROUP_WITNESS_PRODUCTION'
  METHODOLOGY: 'V3.3.5-V17.25'

jobs:
  lock-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
      - run: python -m pip install --disable-pip-version-check --constraint requirements/constraints-verified.txt requests PyMuPDF
      - name: Lock the completed V17.25 shard evidence
        shell: bash
        run: |
          set -euo pipefail
          run_payload=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN")
          test "$(jq -r '.head_sha' <<<"$run_payload")" = "$SOURCE_HEAD"
          test "$(jq -r '.conclusion' <<<"$run_payload")" = failure
          artifacts=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN/artifacts?per_page=100")
          python - <<'PY'
          import json, os
          payload=json.loads(os.environ['ARTIFACTS_JSON'])
          prefix='stage3-s3g1j-v17-25-full-final-v2-shard-'
          rows=[row for row in payload['artifacts'] if row['name'].startswith(prefix)]
          assert len(rows)==64, len(rows)
          identities=sorted(int(row['name'][len(prefix):]) for row in rows)
          assert identities==list(range(64)), identities
          assert all(row['workflow_run']['head_sha']==os.environ['SOURCE_HEAD'] for row in rows)
          assert all(not row['expired'] for row in rows)
          assert len({row['id'] for row in rows})==64
          print('S3G1J_V17_25_EXISTING_64_SHARD_LOCK_PASS')
          PY
        env:
          ARTIFACTS_JSON: ${{ steps.artifacts.outputs.payload }}
      - name: Lock paginated artifact payload
        id: artifacts
        shell: bash
        run: |
          set -euo pipefail
          payload=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN/artifacts?per_page=100")
          echo "payload<<EOF" >> "$GITHUB_OUTPUT"
          echo "$payload" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
      - name: Run comparator contracts
        run: |
          python -m unittest tests.test_stage3_v17_25_full_final_comparator -v
          python -m py_compile scripts/compare_stage3_s3g1j_v17_25_full_final.py
          python -m py_compile scripts/compare_stage3_s3g1j_v17_25_full_values.py

  finalize:
    needs: lock-evidence
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
      - run: python -m pip install --disable-pip-version-check --constraint requirements/constraints-verified.txt requests PyMuPDF
      - uses: actions/download-artifact@v4
        with:
          pattern: stage3-s3g1j-v17-25-full-final-v2-shard-*
          path: partials
          repository: FASHI188/data-workbench-r17
          run-id: 30692117760
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: stage3-s3g1j-v17-21-full-final-input
          path: prepared
          repository: FASHI188/data-workbench-r17
          run-id: 30649251360
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: stage3-s3g1j-v17-21-full-final
          path: previous
          repository: FASHI188/data-workbench-r17
          run-id: 30649251360
          github-token: ${{ github.token }}
      - name: Finalize the frozen 64 shards
        shell: bash
        run: |
          set +e
          mkdir -p build/final
          python scripts/finalize_stage3_financial_pdf_values.py \
            --root partials \
            --versions prepared/stage3_financial_report_versions.csv.gz \
            --stage2-manifest prepared/stage2_manifest.json \
            --out build/final \
            --expected-shard-gate "$SHARD_GATE" \
            --expected-parser-method "$PARSER_METHOD" \
            --expected-methodology-version "$METHODOLOGY" \
            > build/final/finalizer.stdout.log 2> build/final/finalizer.stderr.log
          code=$?
          echo "FINALIZER_EXIT=$code" >> "$GITHUB_ENV"
          cat build/final/finalizer.stdout.log || true
          tail -200 build/final/finalizer.stderr.log || true
          exit 0
      - name: Require complete deterministic output
        shell: bash
        run: |
          set -euo pipefail
          test "$FINALIZER_EXIT" = 0 || test "$FINALIZER_EXIT" = 2
          test -f build/final/stage3_financial_raw_values.csv.gz
          test -f build/final/stage3_financial_documents.csv.gz
          test -f build/final/stage3_financial_raw_audit.json
          python - <<'PY'
          import glob,json,os
          manifests=glob.glob('partials/**/financial_extract_shard*.manifest.json',recursive=True)
          assert len(manifests)==64, len(manifests)
          assert sorted(json.load(open(p,encoding='utf-8'))['shard'] for p in manifests)==list(range(64))
          x=json.load(open('build/final/stage3_financial_raw_audit.json',encoding='utf-8'))
          assert x['shard_gate']==os.environ['SHARD_GATE']
          assert x['runtime_generation']=='V17.25'
          assert x['parser_method']==os.environ['PARSER_METHOD']
          assert x['methodology_version']==os.environ['METHODOLOGY']
          assert x['canonical_version_count']==121354
          assert x['document_count']==121354
          assert x['numeric_observation_count']==1051790
          assert x['document_error_count']==1378
          assert x['unresolved_tie_count']==1295
          assert x['authority']=='CNINFO_ORIGINAL_FILING_PDF_BYTES_WITH_SHA256'
          assert x['historical_current_f10_used_as_truth'] is False
          assert x['stage4_alpha_locked'] is True
          print(json.dumps({'data_pass':x['pass'],'documents':x['document_count'],'numeric':x['numeric_observation_count'],'document_errors':x['document_error_count'],'unresolved_ties':x['unresolved_tie_count']},ensure_ascii=False,indent=2))
          PY
      - name: Enforce semantic document non-regression
        run: |
          previous_docs=$(find previous -name stage3_financial_documents.csv.gz -print -quit)
          previous_audit=$(find previous -name stage3_financial_raw_audit.json -print -quit)
          test -n "$previous_docs" && test -n "$previous_audit"
          python scripts/compare_stage3_s3g1j_v17_25_full_final.py \
            --previous "$previous_docs" \
            --current build/final/stage3_financial_documents.csv.gz \
            --previous-audit "$previous_audit" \
            --current-audit build/final/stage3_financial_raw_audit.json \
            --out build/final/stage3_s3g1j_v17_25_full_basis_non_regression.json
      - name: Enforce full numeric semantic non-regression
        run: |
          previous_values=$(find previous -name stage3_financial_raw_values.csv.gz -print -quit)
          test -n "$previous_values"
          python scripts/compare_stage3_s3g1j_v17_25_full_values.py \
            --previous "$previous_values" \
            --current build/final/stage3_financial_raw_values.csv.gz \
            --out build/final/stage3_s3g1j_v17_25_full_values_non_regression.json
      - name: Record execution verdict separately from data verdict
        run: |
          python - <<'PY'
          import json
          audit=json.load(open('build/final/stage3_financial_raw_audit.json',encoding='utf-8'))
          docs=json.load(open('build/final/stage3_s3g1j_v17_25_full_basis_non_regression.json',encoding='utf-8'))
          values=json.load(open('build/final/stage3_s3g1j_v17_25_full_values_non_regression.json',encoding='utf-8'))
          assert docs['pass'] is True and docs['errors']==[]
          assert values['pass'] is True and values['errors']==[]
          execution={
            'gate':'S3G1J_V17_25_FINALIZE_EXISTING_64_SHARDS_V3',
            'source_run':30692117760,
            'source_head':'f9329e2f6a83d38dfd86291a4fd7d4bbfbf1b6b1',
            'execution_pass':True,
            'document_non_regression_pass':True,
            'numeric_non_regression_pass':True,
            'final_data_gate_pass':audit['pass'],
            'final_data_verdict':'PASS' if audit['pass'] else 'FAIL_CLOSED',
            'canonical_version_count':audit['canonical_version_count'],
            'document_count':audit['document_count'],
            'numeric_observation_count':audit['numeric_observation_count'],
            'document_error_count':audit['document_error_count'],
            'unresolved_tie_count':audit['unresolved_tie_count'],
            'financial_values_sha256':audit['financial_values_sha256'],
            'financial_documents_sha256':audit['financial_documents_sha256'],
            'changed_announcement_ids':docs['actual_changed_announcement_ids'],
            'non_target_numeric_semantic_sha256':values['current_non_target_semantic_sha256'],
            'unexpected_regression_count':docs['unexpected_regression_count'],
            'stage3_status':'NOT_READY' if not audit['pass'] else 'FINAL_REVIEW_REQUIRED',
            'stage4_alpha_locked':True,
            'errors':[],
          }
          json.dump(execution,open('build/final/stage3_s3g1j_v17_25_full_execution.json','w',encoding='utf-8'),ensure_ascii=False,indent=2)
          print(json.dumps(execution,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stage3-s3g1j-v17-25-full-final-v3
          path: build/final
          retention-days: 90
          compression-level: 0
