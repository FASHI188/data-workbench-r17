name: Stage3 Cleanup Stale Actions Queue

on:
  pull_request:
    branches: [stage3-point-in-time-features]
    types: [opened, reopened, synchronize]
    paths:
      - '.github/workflows/stage3-clean-stale-actions.yml'

permissions:
  contents: read
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      KEEP_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Cancel obsolete PR runs from older Stage3 validation heads
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          : "${KEEP_HEAD_SHA:?missing current PR head SHA}"
          gh api --paginate "repos/$repo/actions/runs?per_page=100&status=queued" > /tmp/queued.json
          gh api --paginate "repos/$repo/actions/runs?per_page=100&status=in_progress" > /tmp/running.json
          jq -r --arg keep "$KEEP_HEAD_SHA" \
            '.workflow_runs[] | select(.event=="pull_request" and .head_sha != $keep) | .id' \
            /tmp/queued.json /tmp/running.json | sort -nu > /tmp/candidates.txt
          cancelled=0
          while read -r run; do
            test -n "$run" || continue
            echo "Cancelling stale PR run $run"
            gh run cancel "$run" -R "$repo" || true
            cancelled=$((cancelled+1))
          done < /tmp/candidates.txt
          echo "Cancelled/attempted stale PR runs: $cancelled"
          echo "Preserved runs whose head_sha=$KEEP_HEAD_SHA"
