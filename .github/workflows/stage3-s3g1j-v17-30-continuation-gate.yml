name: Stage3 S3G1J V17.30 Continuation Gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/stage3-s3g1j-v17-30-continuation-gate.yml'
      - 'governance/stage3_s3g1j_v17_30_acceptance_recheck.marker'

permissions:
  contents: read
  actions: read
  pull-requests: read

env:
  GH_TOKEN: ${{ github.token }}
  SOURCE_PR: '126'
  SOURCE_HEAD: '71b19f55648bdef6ded5e40335da9b6f09a8d44c'
  SOURCE_RUN: '31480775354'
  SOURCE_WORKFLOW: 'Stage3 S3G1J V17.30 Fresh Full 64 Shard R4'
  SHARD_PREFIX: 'stage3-s3g1j-v17-30-r4-full-final-shard-'
  LOCKED_INPUT_ARTIFACT: 'stage3-s3g1j-v17-30-r4-locked-input'

jobs:
  continuation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Lock exact closed-unmerged PR126 source run
        shell: bash
        run: |
          set -euo pipefail
          pr=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$SOURCE_PR")
          test "$(jq -r '.state' <<<"$pr")" = closed
          test "$(jq -r '.merged' <<<"$pr")" = false
          test "$(jq -r '.head.sha' <<<"$pr")" = "$SOURCE_HEAD"
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN")
          test "$(jq -r '.name' <<<"$run")" = "$SOURCE_WORKFLOW"
          test "$(jq -r '.head_sha' <<<"$run")" = "$SOURCE_HEAD"
          test "$(jq -r '.event' <<<"$run")" = pull_request
          test "$(jq -r '.status' <<<"$run")" = completed
          test "$(jq -r '.conclusion' <<<"$run")" = success
          echo "R4_EXACT_SOURCE_LOCKED head=$SOURCE_HEAD run=$SOURCE_RUN"
      - name: Require exact 64 shard artifacts and locked input
        shell: bash
        run: |
          set -euo pipefail
          artifacts=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN/artifacts?per_page=100")
          test "$(jq -r --arg prefix "$SHARD_PREFIX" '[.artifacts[]|select(.name|startswith($prefix))]|length' <<<"$artifacts")" = 64
          test "$(jq -r --arg name "$LOCKED_INPUT_ARTIFACT" '[.artifacts[]|select(.name==$name)]|length' <<<"$artifacts")" = 1
          test "$(jq -r --arg prefix "$SHARD_PREFIX" '[.artifacts[]|select((.name|startswith($prefix)) and .expired==true)]|length' <<<"$artifacts")" = 0
          test "$(jq -r --arg name "$LOCKED_INPUT_ARTIFACT" '[.artifacts[]|select(.name==$name and .expired==true)]|length' <<<"$artifacts")" = 0
          python - <<'PY'
          import json,os,subprocess,pathlib
          repo=os.environ['GITHUB_REPOSITORY']; run=os.environ['SOURCE_RUN']; prefix=os.environ['SHARD_PREFIX']
          payload=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/actions/runs/{run}/artifacts?per_page=100'],text=True))
          rows=[]
          for a in payload['artifacts']:
              if a['name'].startswith(prefix):
                  suffix=a['name'][len(prefix):]
                  assert suffix.isdigit(),a['name']
                  rows.append({'shard':int(suffix),'artifact_id':a['id'],'name':a['name'],'digest':a.get('digest'),'expired':a['expired'],'size_in_bytes':a['size_in_bytes']})
          assert [r['shard'] for r in sorted(rows,key=lambda x:x['shard'])]==list(range(64))
          assert len({r['artifact_id'] for r in rows})==64
          assert len({r['digest'] for r in rows})==64
          assert all(r['expired'] is False for r in rows)
          out=pathlib.Path('build/v17_30_continuation'); out.mkdir(parents=True,exist_ok=True)
          report={'gate':'S3G1J_V17_30_CONTINUATION_SOURCE_LOCK_V2','source_pr':126,'source_head':os.environ['SOURCE_HEAD'],'source_run':int(run),'shard_count':64,'shards':sorted(rows,key=lambda x:x['shard']),'pass':True,'errors':[]}
          (out/'stage3_s3g1j_v17_30_continuation_source_lock.json').write_text(json.dumps(report,ensure_ascii=False,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print(json.dumps({'source_head':report['source_head'],'source_run':report['source_run'],'shard_count':64,'pass':True},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stage3-s3g1j-v17-30-continuation-source-lock
          path: build/v17_30_continuation/
          if-no-files-found: error
          retention-days: 90
