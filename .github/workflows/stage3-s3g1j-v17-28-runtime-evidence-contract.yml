name: Stage3 S3G1J V17.28 Runtime Evidence Contract

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'governance/stage3_s3g1j_runtime_manifest.json'
      - 'governance/stage3_workflow_activation_manifest.json'
      - 'governance/stage3_s3g1j_v17_28_runtime_promotion.json'
      - 'governance/stage3_s3g1j_v17_28_full_final.json'
      - 'governance/stage3_s3g1j_v17_29_full_final.json'
      - 'tests/test_stage3_v17_27_runtime_promotion.py'
      - 'tests/test_stage3_v17_28_runtime_promotion.py'
      - '.github/workflows/stage3-s3g1j-v17-28-runtime-evidence-contract.yml'

permissions:
  contents: read
  actions: read
  pull-requests: read

env:
  GH_TOKEN: ${{ github.token }}
  PYTHONPATH: scripts
  WRAPPER_PR: '94'
  WRAPPER_HEAD: '6969c58ee60314e3e897e55b132266612c602777'
  WRAPPER_MERGE_COMMIT: 'd7c38e71c9155d404df1c08feba9d66fac0a4d7a'
  WRAPPER_RUN: '30978715158'
  WRAPPER_ARTIFACT_ID: '8919289427'
  WRAPPER_ARTIFACT: 'stage3-s3g1j-v17-28-runtime-wrapper'
  WRAPPER_DIGEST: 'sha256:f8639b4a2eac2d09b16586365b7932d255457ce66aad2484547bb517d0d185a6'
  WRAPPER_REPORT_SHA256: '8b19a8640b5644f216fe478576e25efaabddabe47ce1029e6cead624fe40664e'

jobs:
  runtime-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
      - name: Install verified runtime
        run: python -m pip install --disable-pip-version-check -c requirements/constraints-verified.txt requests pymupdf
      - name: Lock merged wrapper PR and exact artifact
        shell: bash
        run: |
          set -euo pipefail
          pr=$(gh pr view "$WRAPPER_PR" -R "$GITHUB_REPOSITORY" --json headRefOid,mergedAt,mergeCommit)
          test "$(jq -r '.headRefOid' <<<"$pr")" = "$WRAPPER_HEAD"
          test -n "$(jq -r '.mergedAt // ""' <<<"$pr")"
          test "$(jq -r '.mergeCommit.oid' <<<"$pr")" = "$WRAPPER_MERGE_COMMIT"
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$WRAPPER_RUN")
          test "$(jq -r '.head_sha' <<<"$run")" = "$WRAPPER_HEAD"
          test "$(jq -r '.conclusion' <<<"$run")" = success
          artifacts=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$WRAPPER_RUN/artifacts?per_page=100")
          test "$(jq -r --arg name "$WRAPPER_ARTIFACT" '[.artifacts[] | select(.name==$name)] | length' <<<"$artifacts")" = 1
          test "$(jq -r --arg name "$WRAPPER_ARTIFACT" '.artifacts[] | select(.name==$name) | .id' <<<"$artifacts")" = "$WRAPPER_ARTIFACT_ID"
          test "$(jq -r --arg name "$WRAPPER_ARTIFACT" '.artifacts[] | select(.name==$name) | .digest' <<<"$artifacts")" = "$WRAPPER_DIGEST"
          test "$(jq -r --arg name "$WRAPPER_ARTIFACT" '.artifacts[] | select(.name==$name) | .expired' <<<"$artifacts")" = false
      - uses: actions/download-artifact@v4
        with:
          name: stage3-s3g1j-v17-28-runtime-wrapper
          path: accepted
          repository: FASHI188/data-workbench-r17
          run-id: 30978715158
          github-token: ${{ github.token }}
      - name: Verify immutable wrapper report
        shell: bash
        run: |
          set -euo pipefail
          report=$(find accepted -name stage3_s3g1j_v17_28_runtime_wrapper.json -print -quit)
          test -n "$report"
          test "$(sha256sum "$report" | awk '{print $1}')" = "$WRAPPER_REPORT_SHA256"
          REPORT="$report" python - <<'PY'
          import json,os
          report=json.load(open(os.environ['REPORT'],encoding='utf-8'))
          assert report['gate']=='S3G1J_V17_28_RUNTIME_WRAPPER_IMPLEMENTATION'
          assert report['candidate_run']==30827493788
          assert report['target_count']==2
          assert report['real_source_promotion_pass'] is True
          assert report['non_target_delegation_contract_pass'] is True
          assert report['formal_runtime_authority_before_activation']=='V17.27'
          assert report['v17_28_authority_activated'] is False
          assert report['fresh_64_shard_execution_started'] is False
          assert report['pass'] is True and report['errors']==[]
          print('S3G1J_V17_28_WRAPPER_REPORT_IMMUTABLE_PASS')
          PY
      - name: Verify historical V17.28 runtime and completed full-basis evidence
        run: |
          python -m unittest \
            tests.test_stage3_v17_28_runtime_promotion \
            tests.test_stage3_v17_27_runtime_promotion \
            tests.test_stage3_v17_28_full_final_evidence \
            -v
          python -m py_compile \
            scripts/stage3_financial_pdf_parser_v20.py \
            scripts/stage3_financial_pdf_parser_v20_candidate.py \
            scripts/extract_stage3_financial_pdf_values_v18.py
      - name: Verify V17.28 history under accepted V17.30 full-basis authority
        run: |
          python - <<'PY'
          import json
          runtime=json.load(open('governance/stage3_s3g1j_runtime_manifest.json',encoding='utf-8'))
          activation=json.load(open('governance/stage3_workflow_activation_manifest.json',encoding='utf-8'))
          promotion=json.load(open('governance/stage3_s3g1j_v17_28_runtime_promotion.json',encoding='utf-8'))
          full=json.load(open('governance/stage3_s3g1j_v17_28_full_final.json',encoding='utf-8'))
          current29=json.load(open('governance/stage3_s3g1j_v17_29_full_final.json',encoding='utf-8'))
          assert runtime['schema_version']>=15
          assert runtime['formal_runtime']['runtime_generation']=='V17.30'
          assert runtime['current_production_authority']['generation']=='V17.30'
          latest=runtime['full_basis_last_completed_final']
          assert latest['generation']=='V17.30' and latest['run']==31518370789
          assert latest['numeric_observations']==1051826 and latest['document_error_count']==1362 and latest['unresolved_tie_count']==1279
          assert latest['verdict']=='FAIL_CLOSED'
          prev=runtime['previous_last_completed_full_basis_final']
          assert prev['generation']=='V17.29' and prev['run']==31389854868 and prev['artifact_id']==9063271903
          assert runtime['next_full_basis_required']['status']=='NONE_CURRENT_RUNTIME_ACCEPTED'
          current=activation['accepted_production_runtime']
          assert current['generation']=='V17.30' and current['full_basis_execution_pending'] is False
          assert current['last_completed_full_basis_generation']=='V17.30' and current['last_completed_full_basis_run']==31518370789
          assert current['data_verdict']=='FAIL_CLOSED'
          historic=activation['accepted_v17_28_full_basis_evidence']
          assert historic['run']==30997260730
          assert historic['historical_full_basis_authority_retained'] is True
          assert historic['last_completed_full_basis_authority'] is False
          assert promotion['last_completed_full_basis']['generation']=='V17.27'
          assert promotion['next_full_basis']['status']=='REQUIRED_NOT_STARTED'
          assert full['accepted_run']['run_id']==30997260730
          assert full['full_basis_result']['numeric_observation_count']==1051799
          assert full['full_basis_result']['document_error_count']==1371
          assert full['full_basis_result']['unresolved_tie_count']==1288
          assert current29['accepted_run']['run_id']==31389854868
          assert current29['full_basis_result']['numeric_observation_count']==1051820
          assert current29['full_basis_result']['final_data_verdict']=='FAIL_CLOSED'
          assert runtime['project_status']['stage3']=='NOT_READY'
          assert runtime['project_status']['stage4']=='LOCKED'
          assert runtime['project_status']['alpha_training']=='NOT_ALLOWED'
          assert runtime['project_status']['live_signals']=='NOT_ALLOWED'
          print('S3G1J_V17_28_HISTORICAL_RUNTIME_EVIDENCE_UNDER_ACCEPTED_V17_30_PASS')
          PY
