name: Stage4 Alpha V1 Development Training Authorization

on:
  push:
    branches:
      - agent/stage4-alpha-v1-training-auth
    paths:
      - 'governance/stage4_alpha_v1_training_execution_authorization.json'
      - 'scripts/audit_stage4_alpha_v1_training_authorization.py'
      - '.github/workflows/stage4-alpha-v1-training-authorization.yml'
  pull_request:
    branches:
      - agent/stage3-clean-integration
    paths:
      - 'governance/stage4_alpha_v1_training_execution_authorization.json'
      - 'scripts/audit_stage4_alpha_v1_training_authorization.py'
      - '.github/workflows/stage4-alpha-v1-training-authorization.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  DEV_LABEL_AID: '9216418323'
  DEV_LABEL_ZIP_SHA: 'c4c8c475d79e964265dceec66da1673f9327469edc33531d6a21df8b61627e88'
  DEV_LABEL_SHA: '092061da5666215dcc1f4fa75ec0b1cdbcc43969560755e7cdae6de55e64d673'
  SPLIT_SEAL_SHA: '98579c8d1b73a63bf18ee47a5cea94b730037d37979d7e38d0a98405efc2df72'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  authorization-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
      - name: Install exact authorized runtime
        run: |
          python -m pip install --disable-pip-version-check \
            numpy==2.5.1 scipy==1.17.0 scikit-learn==1.9.0 pyarrow==25.0.0 duckdb==1.3.2
      - name: Audit frozen authorization contract
        run: |
          python scripts/audit_stage4_alpha_v1_training_authorization.py | tee training_authorization_audit.json
      - name: Prove exact runtime constructors without fitting
        run: |
          python - <<'PY'
          import json
          import duckdb,numpy,pyarrow,scipy,sklearn
          from scipy.stats import spearmanr
          from sklearn.linear_model import Ridge
          from sklearn.ensemble import HistGradientBoostingRegressor
          assert numpy.__version__=='2.5.1'
          assert scipy.__version__=='1.17.0'
          assert sklearn.__version__=='1.9.0'
          assert pyarrow.__version__=='25.0.0'
          assert duckdb.__version__=='1.3.2'
          for a in (1.0,10.0,100.0):
              m=Ridge(alpha=a,solver='lsqr',tol=1e-4)
              assert m.get_params()['alpha']==a and m.get_params()['solver']=='lsqr'
          for lr in (0.03,0.07):
              for leaf in (15,31):
                  for l2 in (1.0,10.0):
                      m=HistGradientBoostingRegressor(loss='squared_error',learning_rate=lr,max_iter=200,max_leaf_nodes=leaf,l2_regularization=l2,min_samples_leaf=20,max_bins=255,max_features=1.0,categorical_features=None,early_stopping=False,random_state=20260813)
                      p=m.get_params()
                      assert p['early_stopping'] is False and p['random_state']==20260813
          r=spearmanr([1.0,2.0,3.0],[1.0,3.0,2.0]).statistic
          assert abs(r-0.5)<1e-12
          print(json.dumps({'runtime_constructor_smoke':'PASS','model_fit_executed':False}))
          PY
      - name: Re-download and hash the exact development-label evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/dev-label-evidence
          curl --fail --location --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${DEV_LABEL_AID}/zip" \
            -o build/dev-labels.zip
          echo "${DEV_LABEL_ZIP_SHA}  build/dev-labels.zip" | sha256sum -c -
          unzip -q build/dev-labels.zip -d build/dev-label-evidence
          echo "${DEV_LABEL_SHA}  build/dev-label-evidence/development_labels.parquet" | sha256sum -c -
          echo "${SPLIT_SEAL_SHA}  build/dev-label-evidence/development_split_seal.json" | sha256sum -c -
          python - <<'PY'
          import json
          p='build/dev-label-evidence/'
          m=json.load(open(p+'execution_manifest.json',encoding='utf-8'))
          a=json.load(open(p+'independent_audit.json',encoding='utf-8'))
          s=json.load(open(p+'development_split_seal.json',encoding='utf-8'))
          assert a['pass'] is True
          assert m['label_rows']==5197648 and m['valid_20d_rows']==5103016
          assert m['oos_labels_materialized'] is False and m['lockbox_labels_materialized'] is False
          assert m['model_fit_allowed'] is False and m['live_signal_allowed'] is False
          assert len(s['blocks'])==6 and len(s['splits'])==5
          assert all(x['future_train_to_past_test'] is False for x in s['splits'])
          PY
      - name: Prove authorization gate has no trainer or model weights
        shell: bash
        run: |
          set -euo pipefail
          test ! -e scripts/run_stage4_alpha_v1_development_training.py
          test ! -e models/stage4_alpha_v1
          test ! -e artifacts/stage4_alpha_v1_training
          ! grep -R --line-number -E '\.fit\(|fit_predict\(|partial_fit\(' scripts/audit_stage4_alpha_v1_training_authorization.py
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            changed="$(git diff --name-only '${{ github.event.pull_request.base.sha }}' HEAD)"
            forbidden="$(printf '%s\n' "$changed" | grep -E '^(data/stage2_final/|data/stage3_final/|models/|artifacts/stage4_alpha_v1_training/)' || true)"
            test -z "$forbidden" || { echo "$forbidden"; exit 1; }
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: stage4-alpha-v1-training-authorization-audit
          path: training_authorization_audit.json
          retention-days: 90
