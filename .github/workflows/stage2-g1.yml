name: Stage2 G1 Official Master

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/fetch_exchange_master.py'
      - 'scripts/reconcile_current_master.py'
      - 'scripts/probe_exchange_sources.py'
      - 'scripts/audit_stage2.py'
      - 'scripts/audit_security_history.py'
      - 'tests/test_fetch_exchange_master.py'
      - 'config/stage2_hard_gates.json'
      - '.github/workflows/stage2-g1.yml'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/fetch_exchange_master.py'
      - 'scripts/reconcile_current_master.py'
      - 'scripts/probe_exchange_sources.py'
      - 'scripts/audit_stage2.py'
      - 'scripts/audit_security_history.py'
      - 'tests/test_fetch_exchange_master.py'
      - 'config/stage2_hard_gates.json'
      - '.github/workflows/stage2-g1.yml'

permissions:
  contents: write

jobs:
  build-current-master:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test/runtime dependencies
        run: python -m pip install --disable-pip-version-check requests pytest openpyxl

      - name: Regression tests
        run: pytest -q

      - name: Probe exchange-owned candidate sources
        shell: bash
        run: |
          mkdir -p data
          python scripts/probe_exchange_sources.py > data/source_probe_stdout.log 2> data/source_probe_stderr.log || true
          cat data/source_probe.json || true

      - name: Fetch current official exchange master candidate
        shell: bash
        run: |
          mkdir -p data
          set +e
          python scripts/fetch_exchange_master.py --allow-derived-szse-board > data/fetch_stdout.log 2> data/fetch_stderr.log
          code=$?
          echo "fetch_exit_code=$code" >> "$GITHUB_ENV"
          cat data/fetch_stdout.log || true
          cat data/fetch_stderr.log || true
          exit 0

      - name: Reconcile against independent exchange-owned controls
        if: env.fetch_exit_code == '0'
        shell: bash
        run: |
          set +e
          python scripts/reconcile_current_master.py > data/reconcile_stdout.log 2> data/reconcile_stderr.log
          code=$?
          echo "reconcile_exit_code=$code" >> "$GITHUB_ENV"
          cat data/reconcile_stdout.log || true
          cat data/reconcile_stderr.log || true
          exit 0

      - name: Run fail-closed Stage2 audit
        shell: bash
        run: |
          mkdir -p data
          set +e
          python scripts/audit_stage2.py > data/stage2_audit.json 2> data/audit_stderr.log
          code=$?
          echo "audit_exit_code=$code" >> "$GITHUB_ENV"
          cat data/stage2_audit.json || true
          cat data/audit_stderr.log || true
          exit 0

      - name: Upload candidate and audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: stage2-g1-evidence
          path: |
            data/current_master
            data/stage2_audit.json
            data/source_probe.json
            data/source_probe_stdout.log
            data/source_probe_stderr.log
            data/fetch_stdout.log
            data/fetch_stderr.log
            data/reconcile_stdout.log
            data/reconcile_stderr.log
            data/audit_stderr.log
          if-no-files-found: warn
          retention-days: 7

      - name: Commit frozen candidate and audit evidence
        if: github.event_name == 'push' && env.fetch_exit_code == '0'
        shell: bash
        run: |
          git config user.name "stage2-bot"
          git config user.email "stage2-bot@users.noreply.github.com"
          git add data/current_master data/stage2_audit.json data/source_probe.json
          if git diff --cached --quiet; then
            echo "No data change"
            exit 0
          fi
          git commit -m "stage2: freeze official current-master candidate [skip ci]"
          git push

      - name: Mark G1 acquisition or reconciliation failure after evidence upload
        if: env.fetch_exit_code != '0' || env.reconcile_exit_code != '0'
        run: |
          echo "G1 official acquisition/reconciliation failed; evidence artifact was uploaded."
          exit 1
