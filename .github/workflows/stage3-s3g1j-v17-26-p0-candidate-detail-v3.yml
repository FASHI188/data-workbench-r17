name: Stage3 S3G1J V17.26 P0 Candidate Detail V3

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/accept_stage3_s3g1j_v17_26_p0_candidate_detail_v3.py'
      - '.github/workflows/stage3-s3g1j-v17-26-p0-candidate-detail-v3.yml'

permissions:
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ github.token }}
  PYTHONPATH: scripts
  CLASSIFIER_RUN: '30734063100'
  CLASSIFIER_HEAD: 'd9dc3119cc710a46174fb9d5ce9a6f1518ea5c50'
  CLASSIFIER_ARTIFACT: 'stage3-s3g1j-v17-26-residual-classification-v2'
  CLASSIFIER_DIGEST: 'sha256:f667e5e494e6ac1456a370b5dab47677b4925d0466beedceec3e47bdeb5f16a5'
  FULL_RUN: '30733013665'
  FULL_HEAD: 'ed81a8f167c7b158167a8bdafa1799b7047666af'
  FULL_ARTIFACT: 'stage3-s3g1j-v17-26-full-final'
  FULL_DIGEST: 'sha256:7f2e707e9192af527ff0444b48caf6bebfbfa1ef7559ec2810b6f47b1790567b'
  BASE_RUN: '30734944468'
  BASE_HEAD: '57cca23e3d7b390a93446dbd99438e3fcb7f6a6c'
  BASE_ARTIFACT: 'stage3-s3g1j-v17-26-current-p0-diagnostic'
  BASE_DIGEST: 'sha256:08afc1cde3e48243a7914320baa6ef96b64cf41d55b000063091b3805d171046'

jobs:
  candidate-detail:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
      - name: Install verified diagnostic runtime
        run: python -m pip install --disable-pip-version-check -c requirements/constraints-verified.txt requests pymupdf
      - name: Lock classifier, full-basis and accepted base-diagnostic artifacts
        shell: bash
        run: |
          set -euo pipefail
          for prefix in CLASSIFIER FULL BASE; do
            run_var="${prefix}_RUN"
            head_var="${prefix}_HEAD"
            artifact_var="${prefix}_ARTIFACT"
            digest_var="${prefix}_DIGEST"
            run_id="${!run_var}"
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" > "/tmp/${prefix,,}-run.json"
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts?per_page=100" > "/tmp/${prefix,,}-artifacts.json"
          done
          python - <<'PY'
          import json, os
          for prefix in ('CLASSIFIER','FULL','BASE'):
              low=prefix.lower()
              run=json.load(open(f'/tmp/{low}-run.json',encoding='utf-8'))
              assert run['head_sha']==os.environ[f'{prefix}_HEAD'],(prefix,run['head_sha'])
              assert run['conclusion']=='success',(prefix,run['conclusion'])
              rows=json.load(open(f'/tmp/{low}-artifacts.json',encoding='utf-8'))['artifacts']
              matches=[row for row in rows if row['name']==os.environ[f'{prefix}_ARTIFACT']]
              assert len(matches)==1,(prefix,len(matches))
              artifact=matches[0]
              assert artifact['digest']==os.environ[f'{prefix}_DIGEST'],(prefix,artifact['digest'])
              assert artifact['workflow_run']['head_sha']==os.environ[f'{prefix}_HEAD']
              assert not artifact['expired']
          print('S3G1J_V17_26_P0_CANDIDATE_DETAIL_INPUT_LOCK_PASS')
          PY
      - name: Compile V3 acceptance contract
        run: |
          python -m py_compile \
            scripts/diagnose_stage3_s3g1j_v17_26_p0_candidate_spatial.py \
            scripts/accept_stage3_s3g1j_v17_26_p0_candidate_detail_v3.py
      - uses: actions/download-artifact@v4
        with:
          name: stage3-s3g1j-v17-26-residual-classification-v2
          path: classifier
          repository: FASHI188/data-workbench-r17
          run-id: 30734063100
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: stage3-s3g1j-v17-26-full-final
          path: full
          repository: FASHI188/data-workbench-r17
          run-id: 30733013665
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: stage3-s3g1j-v17-26-current-p0-diagnostic
          path: base
          repository: FASHI188/data-workbench-r17
          run-id: 30734944468
          github-token: ${{ github.token }}
      - name: Recompute detailed candidate identities from exact source PDFs
        shell: bash
        run: |
          set -euo pipefail
          p0=$(find classifier -name s3g1j_v17_26_p0_safe_near_complete.csv.gz -print -quit)
          documents=$(find full -name stage3_financial_documents.csv.gz -print -quit)
          base_report=$(find base -name stage3_s3g1j_v17_26_p0_diagnostic.json -print -quit)
          test -n "$p0" && test -n "$documents" && test -n "$base_report"
          set +e
          python scripts/diagnose_stage3_s3g1j_v17_26_p0_candidate_spatial.py \
            --p0-ledger "$p0" \
            --documents "$documents" \
            --base-report "$base_report" \
            --out build/p0/stage3_s3g1j_v17_26_p0_candidate_spatial_v2_raw.json
          rc=$?
          set -e
          test "$rc" -eq 2
          python scripts/accept_stage3_s3g1j_v17_26_p0_candidate_detail_v3.py \
            --raw-report build/p0/stage3_s3g1j_v17_26_p0_candidate_spatial_v2_raw.json \
            --out build/p0/stage3_s3g1j_v17_26_p0_candidate_detail_v3.json
      - name: Require falsified-hypothesis and exact accepted observation
        run: |
          python - <<'PY'
          import json
          raw=json.load(open('build/p0/stage3_s3g1j_v17_26_p0_candidate_spatial_v2_raw.json',encoding='utf-8'))
          accepted=json.load(open('build/p0/stage3_s3g1j_v17_26_p0_candidate_detail_v3.json',encoding='utf-8'))
          assert raw['pass'] is False and raw['errors']==[]
          assert accepted['pass'] is True and accepted['errors']==[]
          assert accepted['prior_hypothesis_rejected'] is True
          assert accepted['identity_present_but_public_gate_rejected_count']==5
          assert accepted['identity_present_but_public_gate_rejected_announcement_ids']==[
              '1200907104','1201708762','1202195310','1202774611','1203358200'
          ]
          assert accepted['period_or_role_gate_removed_candidates_count']==2
          assert accepted['period_or_role_gate_removed_candidates_announcement_ids']==[
              '1204077386','1205543437'
          ]
          assert accepted['formal_public_candidate_recovered_count']==0
          assert len(accepted['identity_details'])==5
          assert all(
              detail['best_identity']['identity_tolerance_pass'] is True
              for detail in accepted['identity_details']
          )
          assert accepted['parser_changed'] is False
          assert accepted['runtime_authority_changed'] is False
          assert accepted['production_data_changed'] is False
          assert accepted['trained_model_changed'] is False
          assert accepted['stage3_status']=='NOT_READY'
          assert accepted['stage4_alpha_locked'] is True
          print(json.dumps({k:v for k,v in accepted.items() if k not in ('identity_details','period_or_role_details')},ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stage3-s3g1j-v17-26-p0-candidate-detail-v3
          path: build/p0
          retention-days: 90
          compression-level: 0
