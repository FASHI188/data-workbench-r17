name: Stage4 Alpha V1 OOS Label Completion Authorization Reservation V1.2

on:
  pull_request:
    branches:
      - agent/stage3-clean-integration
    paths:
      - '.github/workflows/stage4-alpha-v1-oos-label-completion-authorization-reservation-v1-2.yml'
      - 'governance/accepted_project_state.json'
      - 'governance/project_module_index.json'
      - 'governance/stage4_alpha_v1_oos_label_completion_authorization_reservation_v1_2.json'
      - 'governance/stage4_alpha_v1_oos_label_completion_authorization_reservation_audit_v1_2.json'
      - 'scripts/audit_stage4_alpha_v1_oos_label_completion_authorization_reservation_v1_2.py'

permissions:
  contents: read

jobs:
  static-governance-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Detect V1.2 armed successor
        id: armed_v12
        shell: bash
        run: |
          if test -f governance/stage4_alpha_v1_oos_label_completion_authorization_v1_2.json; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify V1.2 armed successor
        if: steps.armed_v12.outputs.present == 'true'
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('governance/stage4_alpha_v1_oos_label_completion_authorization_v1_2.json').read_text())
          s=json.loads(Path('governance/accepted_project_state.json').read_text())
          assert a['fingerprint']=='0a7c2e5ed7777bc84ad4db22b91c5e84da5dc819a186d743d19bb603b158f10a'
          assert a['status']=='AUTHORIZED_SINGLE_USE_OOS_LABEL_COMPLETION_V1'
          assert a['fingerprint_basis']['authorization_armed'] is True
          assert a['fingerprint_basis']['armed_runs_remaining']==1
          assert s['permissions']['oos_execution_pr_creation_allowed'] is False
          assert s['permissions']['oos_label_access_allowed'] is False
          assert s['permissions']['oos_label_bearing_execution_runs_remaining']==1
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
      - name: Audit V1.2 reservation
        if: steps.armed_v12.outputs.present != 'true'
        run: python scripts/audit_stage4_alpha_v1_oos_label_completion_authorization_reservation_v1_2.py
      - name: Prove no OOS execution surface
        shell: bash
        run: |
          set -euo pipefail
          test ! -e build/oos
          test ! -e build/out
          ! grep -n -E 'download-artifact|curl|wget|gh[[:space:]]+api|read_parquet\(|run_stage4_alpha_v1_oos_label_completion.py[[:space:]]+--authorization' .github/workflows/stage4-alpha-v1-oos-label-completion-authorization-reservation-v1-2.yml | grep -v 'grep -n -E'
      - name: Prove exact reservation scope
        if: steps.armed_v12.outputs.present != 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only "$BASE_SHA" HEAD | sort > /tmp/changed.txt
          cat > /tmp/expected.txt <<'EOF'
          .github/workflows/stage4-alpha-v1-oos-label-completion-consumed-incomplete.yml
          .github/workflows/stage4-alpha-v1-oos-label-completion-repair-acceptance-v1-1.yml
          .github/workflows/stage4-alpha-v1-oos-label-completion-authorization-reservation-v1-2.yml
          governance/accepted_project_state.json
          governance/project_module_index.json
          governance/stage4_alpha_v1_oos_label_completion_authorization_reservation_audit_v1_2.json
          governance/stage4_alpha_v1_oos_label_completion_authorization_reservation_v1_2.json
          scripts/audit_stage4_alpha_v1_oos_label_completion_authorization_reservation_v1_2.py
          EOF
          sort -o /tmp/expected.txt /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/changed.txt
      - name: Prove consumed evidence and repaired implementation untouched
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          forbidden="$(git diff --name-only "$BASE_SHA" HEAD --             governance/stage4_alpha_v1_oos_validation_consumed_incomplete_evidence.json             governance/stage4_alpha_v1_oos_label_completion_consumed_incomplete_evidence.json             governance/stage4_alpha_v1_oos_label_completion_implementation_repair_v1_1.json             governance/stage4_alpha_v1_oos_label_completion_implementation_repair_acceptance_v1_1.json             scripts/run_stage4_alpha_v1_oos_label_completion.py             scripts/stage4_alpha_v1_label_materialization.py             scripts/stage4_alpha_v1_alpha_evaluation.py             data/stage2_final data/stage3_final models)"
          test -z "$forbidden"
