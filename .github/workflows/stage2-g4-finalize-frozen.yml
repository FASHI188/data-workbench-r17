name: Stage2 G4 Finalize Frozen State

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/reclassify_g4_delisting_rules.py'
      - 'scripts/audit_g4_security_state.py'
      - '.github/workflows/stage2-g4-finalize-frozen.yml'
      - 'config/g4_finalize_trigger.json'

permissions:
  contents: read
  actions: read

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN: '30233614162'
    steps:
      - uses: actions/checkout@v4
      - name: Download frozen G4 source state
        run: gh run download "$SOURCE_RUN" -R "$GITHUB_REPOSITORY" -n stage2-g4-daily-security-state -D frozen-g4
      - name: Locate and reclassify historical delisting rules
        shell: bash
        run: |
          src=$(dirname "$(find frozen-g4 -name 'g4_state_shard00.csv.gz' -print -quit)")
          test -n "$src"
          python scripts/reclassify_g4_delisting_rules.py --input "$src" --out build/g4-final
      - name: Final G4 hard audit
        run: python scripts/audit_g4_security_state.py --root build/g4-final --out data/security_state
      - uses: actions/upload-artifact@v4
        with:
          name: stage2-g4-final-evidence
          path: |
            build/g4-final
            data/security_state
          retention-days: 90
          compression-level: 0
