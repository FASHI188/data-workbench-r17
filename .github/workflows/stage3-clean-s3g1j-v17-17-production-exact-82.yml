name: Stage3 Clean S3G1J V17.17 Production Exact-82 Acceptance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/stage3_financial_spatial_alias_v17_17.py'
      - 'scripts/stage3_financial_pdf_parser_v12.py'
      - 'scripts/extract_stage3_financial_pdf_values_v12.py'
      - 'scripts/accept_stage3_s3g1j_v17_17_production_exact82.py'
      - 'tests/test_stage3_v17_17_production_parser.py'
      - '.github/workflows/stage3-clean-s3g1j-v17-17-production-exact-82.yml'

permissions:
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ github.token }}
  FROZEN_RUN: '30424465440'
  FROZEN_HEAD: 'be42608b75f77af13c36620da7e7fa03c563afde'
  FROZEN_ARTIFACT: 'stage3-s3g1j-v15-single-source-input'
  FROZEN_DIGEST: 'sha256:272f52239adc2fc5d4343ec091495dffcd39324b425784cdf5a7491f63a2e6fd'
  ACCEPTED_RUN: '30510347556'
  ACCEPTED_HEAD: 'e98d26b962a58cecc5c6416214e3c798c5e8a49e'
  ACCEPTED_ARTIFACT: 'stage3-s3g1j-v17-11-column-evidence-acceptance'
  ACCEPTED_DIGEST: 'sha256:b1143faaf2c1a91fd64e21ef35c05e787200d957f888613fa2f2a2fc23c43ad9'
  V17_15_RUN: '30535567713'
  V17_15_HEAD: '55ce359de27f32343f272b4d53d167f08ee38ea1'
  V17_15_ARTIFACT: 'stage3-s3g1j-v17-15-exact-82-safety-replay'
  V17_15_DIGEST: 'sha256:6bb7fe3530c1f56486092a99476e7a72669b40f172334281920ca244e785ba98'
  V17_17_EXPERIMENT_RUN: '30548199275'
  V17_17_EXPERIMENT_HEAD: 'c9fe774466cd146fbab394a906d409d2086ff2d6'
  V17_17_EXPERIMENT_ARTIFACT: 'stage3-s3g1j-v17-17-exact-81-safety-replay'
  V17_17_EXPERIMENT_DIGEST: 'sha256:695c328f9f989ed181833247cea38868e424cedea0fcfc7a6ee28f0ab835307e'
  V17_17_PRODUCTION81_RUN: '30550485070'
  V17_17_PRODUCTION81_HEAD: '93c712498ade4167c7e9adb91d01dcd4a886eb51'
  V17_17_PRODUCTION81_ARTIFACT: 'stage3-s3g1j-v17-17-production-exact-81-acceptance'
  V17_17_PRODUCTION81_DIGEST: 'sha256:7606566fd37633c6c47f0efd7f9f6605819077a582d61b5aa06ee87d30421e5c'
  PYTHONPATH: scripts

jobs:
  lock-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
      - name: Install exact verified runtime dependencies
        run: python -m pip install --disable-pip-version-check --constraint requirements/constraints-verified.txt requests PyMuPDF
      - name: Lock frozen and accepted evidence chain
        shell: bash
        run: |
          set -euo pipefail
          lock_run_artifact() {
            run="$1"; expected_head="$2"; artifact="$3"; expected_digest="$4"
            test "$(gh run view "$run" -R "$GITHUB_REPOSITORY" --json conclusion --jq '.conclusion')" = success
            test "$(gh run view "$run" -R "$GITHUB_REPOSITORY" --json headSha --jq '.headSha')" = "$expected_head"
            actual=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/artifacts" --jq ".artifacts[] | select(.name==\"$artifact\") | .digest")
            test "$actual" = "$expected_digest"
          }
          lock_run_artifact "$FROZEN_RUN" "$FROZEN_HEAD" "$FROZEN_ARTIFACT" "$FROZEN_DIGEST"
          lock_run_artifact "$ACCEPTED_RUN" "$ACCEPTED_HEAD" "$ACCEPTED_ARTIFACT" "$ACCEPTED_DIGEST"
          lock_run_artifact "$V17_15_RUN" "$V17_15_HEAD" "$V17_15_ARTIFACT" "$V17_15_DIGEST"
          lock_run_artifact "$V17_17_EXPERIMENT_RUN" "$V17_17_EXPERIMENT_HEAD" "$V17_17_EXPERIMENT_ARTIFACT" "$V17_17_EXPERIMENT_DIGEST"
          lock_run_artifact "$V17_17_PRODUCTION81_RUN" "$V17_17_PRODUCTION81_HEAD" "$V17_17_PRODUCTION81_ARTIFACT" "$V17_17_PRODUCTION81_DIGEST"
      - name: Run V17.17 production parser contracts
        run: python -m unittest tests.test_stage3_v17_17_production_parser -v
      - name: Import production runtime closure
        run: |
          python - <<'PY'
          import extract_stage3_financial_pdf_values_v12 as extractor
          import stage3_financial_pdf_parser_v12 as parser
          assert extractor.METHOD.endswith('V17_17_STRICT_TOTAL_EQUITY_PAIRED_HEADER_FINAL_FALLBACK')
          assert parser.METHOD=='V17_17_STRICT_TOTAL_EQUITY_PAIRED_HEADER_FINAL_FALLBACK'
          print('S3G1J_V17_17_COMBINED_PRODUCTION_RUNTIME_IMPORT_PASS')
          PY

  accept:
    needs: lock-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 7, 9]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
      - name: Install exact verified runtime dependencies
        run: python -m pip install --disable-pip-version-check --constraint requirements/constraints-verified.txt requests PyMuPDF
      - name: Restore exact accepted V17.11 residual source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf prepared accepted build/s3g1j-v17-17-production82
          gh run download "$FROZEN_RUN" -R "$GITHUB_REPOSITORY" -n "$FROZEN_ARTIFACT" -D prepared
          gh run download "$ACCEPTED_RUN" -R "$GITHUB_REPOSITORY" -n "$ACCEPTED_ARTIFACT" -D accepted
          test -f prepared/single_source_residual_versions.csv.gz
          test -f accepted/v17_11_column_evidence_acceptance.json
      - name: Run production parser over exact 82 residuals
        shell: bash
        run: |
          set +e
          out="build/s3g1j-v17-17-production82/shard${{ matrix.shard }}.json"
          mkdir -p "$(dirname "$out")"
          python scripts/accept_stage3_s3g1j_v17_17_production_exact82.py \
            --versions prepared/single_source_residual_versions.csv.gz \
            --acceptance accepted/v17_11_column_evidence_acceptance.json \
            --shard ${{ matrix.shard }} --shards 64 --out "$out" \
            > "${out%.json}.stdout.log" 2> "${out%.json}.stderr.log"
          code=$?
          echo "ACCEPT_EXIT=$code" >> "$GITHUB_ENV"
          cat "${out%.json}.stdout.log" || true
          tail -100 "${out%.json}.stderr.log" || true
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage3-s3g1j-v17-17-production-exact82-${{ matrix.shard }}
          path: build/s3g1j-v17-17-production82
          retention-days: 90
          compression-level: 0
      - name: Preserve production acceptance execution failure
        if: env.ACCEPT_EXIT != '0'
        run: exit 1

  summarize:
    needs: accept
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: stage3-s3g1j-v17-17-production-exact82-*
          path: candidate
          merge-multiple: true
      - name: Require exact combined production recovery set
        shell: bash
        run: |
          set +e
          python - <<'PY'
          import glob,json,os,sys
          expected={'1212731093','1225153907'}
          paths=sorted(glob.glob('candidate/shard*.json'))
          reports=[json.load(open(path,encoding='utf-8')) for path in paths]
          errors=[]
          if [row.get('shard') for row in reports] != [0,1,7,9]:
              errors.append({'code':'SHARD_SET_MISMATCH','actual':[row.get('shard') for row in reports]})
          if not all(row.get('pass') is True for row in reports):
              errors.append({'code':'SHARD_ACCEPTANCE_FAILED','details':[row.get('errors') for row in reports]})
          rows=[item for report in reports for item in report.get('results') or []]
          ids={str(row['announcement_id']) for row in rows}
          recovered={str(row['announcement_id']) for row in rows if row.get('production_balance_sheet_recovered')}
          if len(rows)!=82 or len(ids)!=82:
              errors.append({'code':'EXACT_82_ACCOUNTING_FAILED','rows':len(rows),'unique_ids':len(ids)})
          if recovered != expected:
              errors.append({
                  'code':'RECOVERY_SET_MISMATCH',
                  'expected':sorted(expected),
                  'actual':sorted(recovered),
                  'unexpected':sorted(recovered-expected),
                  'missing':sorted(expected-recovered),
              })
          report={
              'gate':'S3G1J_V17_17_COMBINED_PRODUCTION_EXACT_82_ACCEPTANCE',
              'pass':not errors,
              'production_parser_changed':True,
              'input_count':82,
              'source_sha_match_count':len(rows),
              'production_recovered_count':len(recovered),
              'production_recovered_announcement_ids':sorted(recovered),
              'remaining_fail_closed_count':82-len(recovered),
              'recovery_definition':'A_L_E_FOUND_AND_VALIDATED_BALANCE_SHEET_BLOCK_AND_NO_VALIDATION_ERRORS',
              'accounting_tolerance':'0.005',
              'global_row_tolerance_changed':False,
              'e_equals_a_minus_l_inference':False,
              'stage4_alpha_locked':True,
              'per_shard':[{k:row.get(k) for k in ('shard','input_count','processed_count','recovered_count','recovered_announcement_ids')} for row in reports],
              'errors':errors,
          }
          os.makedirs('summary',exist_ok=True)
          json.dump(report,open('summary/s3g1j_v17_17_combined_production_exact_82_acceptance.json','w',encoding='utf-8'),ensure_ascii=False,indent=2)
          print(json.dumps(report,ensure_ascii=False,indent=2))
          sys.exit(0 if report['pass'] else 2)
          PY
          code=$?
          echo "SUMMARY_EXIT=$code" >> "$GITHUB_ENV"
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage3-s3g1j-v17-17-combined-production-exact-82-acceptance
          path: |
            summary
            candidate
          retention-days: 90
          compression-level: 0
      - name: Preserve fail-closed combined production verdict
        if: env.SUMMARY_EXIT != '0'
        run: exit 1
