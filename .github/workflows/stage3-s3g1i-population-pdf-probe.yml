name: Stage3 S3G1I Stratified PDF Population Probe

# Gate full-market PDF extraction with a stratified 2015-2026 population check.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [reopened, synchronize]
    paths:
      - 'scripts/probe_stage3_financial_pdf_population.py'
      - 'scripts/stage3_financial_pdf_parser.py'
      - '.github/workflows/stage3-s3g1i-population-pdf-probe.yml'

permissions:
  contents: read
  actions: read

env:
  REPORT_VERSIONS_RUN: '30270405448'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests pymupdf
      - name: Restore canonical financial report version ledger
        run: |
          rm -rf versions
          gh run download "$REPORT_VERSIONS_RUN" -R "$GITHUB_REPOSITORY" \
            -n stage3-s3g1g-financial-report-versions -D versions
          test -f versions/stage3_financial_report_versions.csv.gz
      - name: Run stratified 2015-2026 original-PDF extraction probe
        shell: bash
        run: |
          set +e
          mkdir -p data/stage3_financial_population_probe
          python scripts/probe_stage3_financial_pdf_population.py \
            --versions versions/stage3_financial_report_versions.csv.gz \
            --out data/stage3_financial_population_probe --per-cell 2 \
            > data/stage3_financial_population_probe/stdout.log \
            2> data/stage3_financial_population_probe/stderr.log
          code=$?
          echo "S3G1I_EXIT=$code" >> "$GITHUB_ENV"
          cat data/stage3_financial_population_probe/stage3_financial_pdf_population_probe.json || true
          cat data/stage3_financial_population_probe/stderr.log || true
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: stage3-s3g1i-financial-pdf-population-probe
          path: data/stage3_financial_population_probe
          retention-days: 90
          compression-level: 0
      - name: Preserve fail-closed population-probe status
        if: env.S3G1I_EXIT != '0'
        run: exit 1
