name: Stage2 G2 Current Lifecycle Bootstrap

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/seed_current_lifecycle.py'
      - 'scripts/build_security_history.py'
      - 'scripts/audit_security_history.py'
      - 'data/current_master/**'
      - '.github/workflows/stage2-g2-bootstrap.yml'

permissions:
  contents: write

jobs:
  bootstrap-current-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Seed current LIST events
        run: python scripts/seed_current_lifecycle.py

      - name: Initialize event ledger from current seed
        shell: bash
        run: |
          mkdir -p data/security_lifecycle
          cp data/security_lifecycle/current_list_seed.csv data/security_lifecycle/events.csv

      - name: Write fail-closed G2 manifest
        shell: bash
        run: |
          cat > data/security_lifecycle/manifest.json <<'JSON'
          {
            "version": "V3.2.18-g2-current-bootstrap",
            "status": "CURRENT_ONLY_BOOTSTRAP",
            "as_of": "2026-07-24",
            "coverage_start": null,
            "coverage_end": "2026-07-24",
            "historical_backfill_complete": false,
            "notes": [
              "Current exchange master seeds LIST events for securities still active as of 2026-07-24.",
              "Evidence class is RETROSPECTIVE_PRIMARY.",
              "This bootstrap does not include securities delisted before the current snapshot and cannot satisfy G2."
            ]
          }
          JSON

      - name: Build current lifecycle intervals
        run: python scripts/build_security_history.py

      - name: Run fail-closed G2 audit
        shell: bash
        run: |
          set +e
          python scripts/audit_security_history.py > data/security_lifecycle/g2_audit.json
          code=$?
          echo "g2_audit_exit_code=$code" >> "$GITHUB_ENV"
          cat data/security_lifecycle/g2_audit.json
          exit 0

      - name: Require exact current projection before committing bootstrap
        shell: bash
        run: |
          python - <<'PY'
          import json
          p='data/security_lifecycle/g2_audit.json'
          r=json.load(open(p,encoding='utf-8'))
          assert r['current_master_count'] == 3191, r
          assert r['current_open_interval_count'] == 3191, r
          assert not any(str(x).startswith('current projection mismatch') for x in r['errors']), r
          assert r['pass'] is False, 'G2 must remain fail-closed until historical backfill is complete'
          print('current projection exact; G2 correctly remains FAIL/IN_PROGRESS')
          PY

      - name: Commit current-only bootstrap evidence
        shell: bash
        run: |
          git config user.name "stage2-bot"
          git config user.email "stage2-bot@users.noreply.github.com"
          git add data/security_lifecycle
          if git diff --cached --quiet; then
            echo "No lifecycle bootstrap change"
            exit 0
          fi
          git commit -m "stage2: freeze G2 current lifecycle bootstrap [skip ci]"
          git push
