name: Stage2 G2 Current Lifecycle Bootstrap

# Historical diagnostic only. Stage2 V3.2.25 final freeze supersedes this current-only bootstrap.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap-current-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
      - name: Seed current LIST events
        run: python scripts/seed_current_lifecycle.py
      - name: Initialize event ledger from current seed
        shell: bash
        run: |
          mkdir -p data/security_lifecycle
          cp data/security_lifecycle/current_list_seed.csv data/security_lifecycle/events.csv
      - name: Write fail-closed G2 bootstrap manifest
        shell: bash
        run: |
          cat > data/security_lifecycle/manifest.json <<'JSON'
          {
            "version": "V3.2.18-g2-current-bootstrap",
            "status": "CURRENT_ONLY_BOOTSTRAP",
            "as_of": "2026-07-24",
            "coverage_start": null,
            "coverage_end": "2026-07-24",
            "historical_backfill_complete": false,
            "superseded_by": "data/stage2_final/manifest.json",
            "notes": [
              "Current exchange master seeds LIST events for securities still active as of 2026-07-24.",
              "Evidence class is RETROSPECTIVE_PRIMARY.",
              "This bootstrap does not include securities delisted before the current snapshot and cannot satisfy G2."
            ]
          }
          JSON
      - name: Build current lifecycle intervals
        run: python scripts/build_security_history.py
      - name: Run expected fail-closed G2 audit
        id: g2-audit
        shell: bash
        run: |
          code=0
          python scripts/audit_security_history.py > data/security_lifecycle/g2_audit.json || code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          cat data/security_lifecycle/g2_audit.json || true
      - name: Require exact current projection and expected non-final status
        shell: bash
        run: |
          python - <<'PY'
          import json
          r=json.load(open('data/security_lifecycle/g2_audit.json',encoding='utf-8'))
          assert r['current_master_count'] == 3191, r
          assert r['current_open_interval_count'] == 3191, r
          assert not any(str(x).startswith('current projection mismatch') for x in r['errors']), r
          assert r['pass'] is False, 'bootstrap must never satisfy final G2'
          print('CURRENT_ONLY_BOOTSTRAP_EXPECTED_FAIL_CLOSED')
          PY
      - name: Upload bootstrap diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage2-g2-current-bootstrap-diagnostic
          path: data/security_lifecycle
          retention-days: 30
      - name: Require bootstrap audit to remain non-final
        if: steps.g2-audit.outputs.exit_code == '0'
        run: |
          echo "Unexpected: current-only bootstrap audit returned success."
          exit 1
