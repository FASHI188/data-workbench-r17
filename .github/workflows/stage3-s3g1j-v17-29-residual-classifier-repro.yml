name: Stage3 S3G1J V17.29 Residual Classification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/classify_stage3_s3g1j_v17_29_residuals.py'
      - 'scripts/deterministic_gzip_stored.py'
      - 'scripts/run_stage3_s3g1j_v17_29_residual_classifier.py'
      - 'scripts/verify_stage3_s3g1j_v17_29_residual_classification.py'
      - 'tests/test_stage3_v17_29_residual_classification.py'
      - '.github/workflows/stage3-s3g1j-v17-29-residual-classifier-repro.yml'

permissions:
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ github.token }}
  PYTHONPATH: scripts
  SOURCE_RUN: '31389854868'
  SOURCE_HEAD: '22fa37064eeb8a49ad5292dd2be48bd7b674c673'
  SOURCE_ARTIFACT_ID: '9063271903'
  SOURCE_ARTIFACT: 'stage3-s3g1j-v17-29-full-final'
  SOURCE_DIGEST: 'sha256:71a4daa6c8372f3d64080b5fa5b787914292d889da7051de699eb6610189c726'
  PREVIOUS_RUN: '31022605702'
  PREVIOUS_HEAD: 'b997f7b91cb2a5fcbb5d8473f428effd26ed5bf0'
  PREVIOUS_ARTIFACT_ID: '8937238672'
  PREVIOUS_ARTIFACT: 'stage3-s3g1j-v17-28-residual-classification-v1'
  PREVIOUS_DIGEST: 'sha256:2c54496b329b719c09f299fe0c2d61ece4b05a0c8859b4a39441012abfb248ad'

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
      - name: Verify current V17.29 authority and project locks
        run: |
          python - <<'PY'
          import json
          r=json.load(open('governance/stage3_s3g1j_runtime_manifest.json',encoding='utf-8'))
          p=json.load(open('data/project_status.json',encoding='utf-8'))
          latest=r['full_basis_last_completed_final']
          assert r['schema_version']==13 and r['formal_runtime']['runtime_generation']=='V17.29'
          assert latest['generation']=='V17.29' and latest['run']==31389854868 and latest['artifact_id']==9063271903
          assert latest['artifact_digest']=='sha256:71a4daa6c8372f3d64080b5fa5b787914292d889da7051de699eb6610189c726'
          assert latest['document_error_count']==1364 and latest['unresolved_tie_count']==1281 and latest['verdict']=='FAIL_CLOSED'
          assert p['stage3']['status']=='NOT_READY' and p['stage4_unlocked'] is False
          assert p['alpha_training_allowed'] is False and p['live_signal_allowed'] is False
          print('V17_29_RESIDUAL_SOURCE_AUTHORITY_PASS')
          PY
      - name: Lock V17.29 source and V17.28 previous classifier artifacts
        shell: bash
        run: |
          set -euo pipefail
          lock_artifact() {
            local run="$1" head="$2" artifact_id="$3" name="$4" digest="$5"
            payload=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run")
            test "$(jq -r '.status' <<<"$payload")" = completed
            test "$(jq -r '.conclusion' <<<"$payload")" = success
            test "$(jq -r '.head_sha' <<<"$payload")" = "$head"
            artifacts=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/artifacts?per_page=100")
            test "$(jq -r --arg name "$name" '[.artifacts[]|select(.name==$name)]|length' <<<"$artifacts")" = 1
            test "$(jq -r --arg name "$name" '.artifacts[]|select(.name==$name)|.id' <<<"$artifacts")" = "$artifact_id"
            test "$(jq -r --arg name "$name" '.artifacts[]|select(.name==$name)|.digest' <<<"$artifacts")" = "$digest"
            test "$(jq -r --arg name "$name" '.artifacts[]|select(.name==$name)|.workflow_run.head_sha' <<<"$artifacts")" = "$head"
            test "$(jq -r --arg name "$name" '.artifacts[]|select(.name==$name)|.expired' <<<"$artifacts")" = false
          }
          lock_artifact "$SOURCE_RUN" "$SOURCE_HEAD" "$SOURCE_ARTIFACT_ID" "$SOURCE_ARTIFACT" "$SOURCE_DIGEST"
          lock_artifact "$PREVIOUS_RUN" "$PREVIOUS_HEAD" "$PREVIOUS_ARTIFACT_ID" "$PREVIOUS_ARTIFACT" "$PREVIOUS_DIGEST"
      - name: Compile and unit-test fail-closed classifier
        run: |
          python -m py_compile scripts/classify_stage3_s3g1j_v17_29_residuals.py scripts/deterministic_gzip_stored.py scripts/run_stage3_s3g1j_v17_29_residual_classifier.py scripts/verify_stage3_s3g1j_v17_29_residual_classification.py
          python -m unittest tests.test_stage3_v17_29_residual_classification -v
      - uses: actions/download-artifact@v4
        with:
          name: stage3-s3g1j-v17-29-full-final
          path: source
          repository: FASHI188/data-workbench-r17
          run-id: 31389854868
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: stage3-s3g1j-v17-28-residual-classification-v1
          path: previous
          repository: FASHI188/data-workbench-r17
          run-id: 31022605702
          github-token: ${{ github.token }}
      - name: Build fixed-byte V17.29 classification
        shell: bash
        run: |
          set -euo pipefail
          documents=$(find source -name stage3_financial_documents.csv.gz -print -quit)
          previous=$(find previous -name s3g1j_v17_28_residual_classification.csv.gz -print -quit)
          test -n "$documents" && test -n "$previous"
          python scripts/run_stage3_s3g1j_v17_29_residual_classifier.py --documents "$documents" --previous-ledger "$previous" --out-root build/classification
      - name: Verify exact counts migration and cross-runtime hashes
        run: python scripts/verify_stage3_s3g1j_v17_29_residual_classification.py --summary build/classification/s3g1j_v17_29_residual_classification_summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: stage3-s3g1j-v17-29-residual-classification-v1
          path: build/classification
          retention-days: 90
          compression-level: 0
