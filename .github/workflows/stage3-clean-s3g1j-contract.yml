name: Stage3 Clean S3G1J Runtime Contract
# Contract for the current source-locked runtime plus retained fail-closed evidence and regressions.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'governance/stage3_s3g1j_runtime_manifest.json'
      - 'governance/stage3_s3g1j_v17_26_full_final.json'
      - 'governance/stage3_s3g1j_v17_27_candidate_safety.json'
      - 'governance/stage3_s3g1j_v17_27_full_final.json'
      - 'governance/stage3_s3g1j_v17_28_candidate_safety.json'
      - 'governance/stage3_s3g1j_v17_28_runtime_promotion.json'
      - 'governance/stage3_s3g1j_v17_28_full_final.json'
      - 'governance/stage3_s3g1j_v17_29_exact_source_safety.json'
      - 'governance/stage3_s3g1j_v17_29_candidate_acceptance.json'
      - 'governance/stage3_s3g1j_v17_29_production_promotion_safety.json'
      - 'governance/stage3_s3g1j_v17_29_runtime_promotion.json'
      - 'tests/test_stage3_s3g1j_v17_29_exact_source_safety_evidence.py'
      - 'tests/test_stage3_s3g1j_v17_29_candidate_acceptance_evidence.py'
      - 'tests/test_stage3_s3g1j_v17_29_production_promotion_evidence.py'
      - 'tests/test_stage3_v17_29_runtime_wrapper.py'
      - 'tests/test_stage3_v17_29_runtime_promotion.py'
      - '.github/workflows/stage3-s3g1j-v17-29-exact-source-safety-evidence-contract.yml'
      - '.github/workflows/stage3-s3g1j-v17-29-candidate-evidence-contract.yml'
      - '.github/workflows/stage3-s3g1j-v17-29-production-promotion-evidence-contract.yml'
      - '.github/workflows/stage3-s3g1j-v17-29-runtime-evidence-contract.yml'
      - 'governance/stage3_workflow_activation_manifest.json'
      - 'config/stage3_s3g1j_v10_diagnostic_samples.json'
      - 'scripts/extract_stage3_financial_pdf_values*.py'
      - 'scripts/stage3_financial_pdf_parser*.py'
      - 'scripts/stage3_financial_coordinate_fallback*.py'
      - 'scripts/stage3_financial_spatial_alias*.py'
      - 'scripts/stage3_financial_statement_blocks*.py'
      - 'scripts/select_stage3_financial_report_versions*.py'
      - 'scripts/compare_stage3_financial_report_versions_v3.py'
      - 'scripts/compare_stage3_s3g1j_v17_26_*.py'
      - 'scripts/compare_stage3_s3g1j_v17_27_*.py'
      - 'scripts/compare_stage3_s3g1j_v17_28_*.py'
      - 'scripts/build_stage3_partial_body_ledger_v12.py'
      - 'scripts/build_stage3_s3g1j_v17_26_exact_target_ledger.py'
      - 'scripts/build_stage3_s3g1j_v17_27_candidate_full.py'
      - 'scripts/promote_stage3_s3g1j_v17_26_full_shards*.py'
      - 'scripts/accept_stage3_s3g1j_v17_*.py'
      - 'scripts/finalize_stage3_financial_pdf_values.py'
      - 'tests/test_stage3_financial_*.py'
      - 'tests/test_stage3_s3g1j_v17_27_normal_equity_candidate.py'
      - 'tests/test_stage3_s3g1j_v17_28_split_equity_candidate.py'
      - 'tests/test_stage3_unique_usable_tie_v15.py'
      - 'tests/test_stage3_statement_blocks_v16_3.py'
      - 'tests/test_stage3_v16_contextual_parser.py'
      - 'tests/test_stage3_v17_*.py'
      - '.github/workflows/stage3-clean-s3g1j-contract.yml'

permissions:
  contents: read

env:
  PYTHONPATH: scripts

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
      - name: Install verified Stage3 runtime
        run: python -m pip install --disable-pip-version-check -c requirements/constraints-verified.txt requests pymupdf pytest
      - name: Verify V17.29 runtime wrapper and retained V17.28/V17.27/V17.26 authority evidence
        run: |
          python -m unittest \
            tests.test_stage3_v17_29_runtime_wrapper \
            tests.test_stage3_v17_29_runtime_promotion \
            tests.test_stage3_v17_28_runtime_promotion \
            tests.test_stage3_v17_28_runtime_wrapper \
            tests.test_stage3_v17_28_full_final_evidence \
            tests.test_stage3_v17_27_runtime_promotion \
            tests.test_stage3_v17_27_full_final_evidence \
            tests.test_stage3_v17_26_runtime_promotion \
            tests.test_stage3_v17_26_full_final_evidence \
            -v
      - name: Import current V17.29 runtime and retained V17.28 full-basis authority
        run: |
          python - <<'PY'
          import json
          import extract_stage3_financial_pdf_values_v19 as extractor
          import stage3_financial_pdf_parser_v21 as parser
          import finalize_stage3_financial_pdf_values as finalizer

          manifest=json.load(open('governance/stage3_s3g1j_runtime_manifest.json',encoding='utf-8'))
          activation=json.load(open('governance/stage3_workflow_activation_manifest.json',encoding='utf-8'))
          promotion=json.load(open('governance/stage3_s3g1j_v17_29_runtime_promotion.json',encoding='utf-8'))
          full=json.load(open('governance/stage3_s3g1j_v17_28_full_final.json',encoding='utf-8'))
          previous=json.load(open('governance/stage3_s3g1j_v17_27_full_final.json',encoding='utf-8'))

          assert manifest['schema_version']==12
          assert manifest['integration_branch']=='agent/stage3-clean-integration'
          assert manifest['current_production_authority']['generation']=='V17.29'
          assert manifest['current_production_authority']['status']=='RUNTIME_PROMOTED_FULL_BASIS_PENDING_FAIL_CLOSED'
          assert manifest['current_production_authority']['full_basis_evidence_manifest'] is None
          assert manifest['formal_runtime']['runtime_generation']=='V17.29'
          assert manifest['formal_runtime']['parser_method']==parser.METHOD
          assert manifest['formal_runtime']['extractor_method']==extractor.METHOD
          assert manifest['formal_runtime']['parser_git_blob']=='37ab001356c479808e3fa5f67f2270649e3130ba'
          assert manifest['formal_runtime']['extractor_git_blob']=='7be4f17357e92144c3f54ddd4951ec57a0878049'
          latest=manifest['full_basis_last_completed_final']
          assert latest['generation']=='V17.28'
          assert latest['run']==30997260730
          assert latest['artifact_id']==8927455692
          assert latest['numeric_observations']==1051799
          assert latest['document_error_count']==1371
          assert latest['unresolved_tie_count']==1288
          assert latest['execution_verdict']=='PASS'
          assert latest['verdict']=='FAIL_CLOSED'
          next_basis=manifest['next_full_basis_required']
          assert next_basis['generation']=='V17.29'
          assert next_basis['status']=='REQUIRED_NOT_STARTED'
          assert next_basis['expected_numeric_observations']==1051820
          assert next_basis['expected_document_error_count']==1364
          assert next_basis['expected_unresolved_tie_count']==1281
          assert next_basis['expected_values_are_not_yet_production_acceptance'] is True
          assert manifest['project_status']=={
              'stage3':'NOT_READY',
              'stage4':'LOCKED',
              'alpha_training':'NOT_ALLOWED',
              'live_signals':'NOT_ALLOWED',
              'main_changed':False,
          }

          assert callable(extractor.parse_pdf_bytes)
          assert extractor.RUNTIME_GENERATION=='V17.29'
          assert extractor.METHOD=='CNINFO_ORIGINAL_PDF_PYMUPDF_V19_V17_29_EXACT_SOURCE_SPLIT_GROUP_EQUITY_PRODUCTION'
          assert extractor.METHODOLOGY_VERSION=='V3.3.13-V17.29'
          assert extractor.SHARD_GATE=='S3G1J_FINANCIAL_PDF_EXTRACTION_SHARD_V17_29'
          assert parser.METHOD=='V17_29_EXACT_SOURCE_SPLIT_GROUP_EQUITY_PRODUCTION'
          assert len(parser.TARGETS)==7
          assert set(parser.ALLOWED_CONCEPTS)=={'TOTAL_ASSETS','TOTAL_LIABILITIES','TOTAL_EQUITY'}
          assert parser.PROMOTION_SAFETY_RUN==31311296836
          assert parser.PROMOTION_SAFETY_ARTIFACT_ID==9037500964

          assert promotion['generation']=='V17.29'
          assert promotion['wrapper_implementation']['pr']==109
          assert promotion['wrapper_implementation']['closed_without_merge'] is True
          assert promotion['wrapper_implementation']['head_sha']=='04a014f852bff57aef57542553864fcd3f1df13d'
          assert promotion['wrapper_implementation']['acceptance_run']==31312709490
          assert promotion['wrapper_implementation']['acceptance_artifact_id']==9037869497
          assert promotion['next_full_basis']['status']=='REQUIRED_NOT_STARTED'
          assert promotion['next_full_basis']['expected_values_are_not_production_acceptance'] is True

          assert full['accepted_run']['run_id']==30997260730
          assert full['accepted_run']['artifact_id']==8927455692
          assert full['full_basis_result']['numeric_observation_count']==1051799
          assert full['full_basis_result']['document_error_count']==1371
          assert full['full_basis_result']['unresolved_tie_count']==1288
          assert full['full_basis_result']['execution_pass'] is True
          assert full['full_basis_result']['final_data_verdict']=='FAIL_CLOSED'
          assert previous['accepted_run']['run_id']==30806818977

          assert activation['schema_version']==14
          current=activation['accepted_production_runtime']
          assert current['generation']=='V17.29'
          assert current['full_basis_execution_pending'] is True
          assert current['last_completed_full_basis_generation']=='V17.28'
          assert current['last_completed_full_basis_run']==30997260730
          assert current['execution_verdict']=='PENDING'
          assert current['data_verdict']=='FAIL_CLOSED'
          assert current['expected_values_are_not_production_acceptance'] is True
          assert callable(finalizer._validate_shard_manifests)
          print('S3G1J_V17_29_RUNTIME_V17_28_LAST_BASIS_IMPORT_PASS')
          PY
      - name: Run inherited pure fail-closed regression contracts
        run: |
          python -m unittest \
            tests.test_stage3_financial_balance_block_v4 \
            tests.test_stage3_financial_balance_block_v5 \
            tests.test_stage3_financial_balance_block_v6 \
            tests.test_stage3_financial_balance_title_v8 \
            tests.test_stage3_financial_pdf_issuer_gate_v9 \
            tests.test_stage3_financial_pdf_parser_v11 \
            tests.test_stage3_financial_pdf_parser_v13 \
            tests.test_stage3_financial_tie_resolution \
            tests.test_stage3_unique_usable_tie_v15 \
            tests.test_stage3_statement_blocks_v16_3 \
            tests.test_stage3_v16_contextual_parser \
            tests.test_stage3_v17_explicit_dual_evidence \
            tests.test_stage3_v17_column_evidence \
            tests.test_stage3_v17_15_adjacent_bridge \
            tests.test_stage3_v17_15_production_parser \
            tests.test_stage3_v17_17_production_parser \
            -v
      - name: Run V17.21 and V17.24 inherited final-chain regressions
        run: |
          python -m unittest \
            tests.test_stage3_v17_21_production_parser \
            tests.test_stage3_v17_24_corrupted_equity \
            tests.test_stage3_v17_24_production_parser \
            tests.test_stage3_v17_24_acceptance_baseline \
            -v
      - name: Run V17.25 inherited production regressions
        run: |
          python -m unittest \
            tests.test_stage3_v17_25_generic_group_witness \
            tests.test_stage3_v17_25_production_parser \
            tests.test_stage3_v17_25_runtime_promotion \
            -v
      - name: Run V17.26 retained historical regressions
        run: |
          python -m unittest \
            tests.test_stage3_v17_26_balance_only_parser \
            tests.test_stage3_v17_26_full_final_comparator \
            tests.test_stage3_v17_26_full_final_evidence \
            tests.test_stage3_v17_26_runtime_promotion \
            -v
      - name: Run V17.27 retained candidate, production and full-final regressions
        run: |
          python -m unittest \
            tests.test_stage3_s3g1j_v17_27_normal_equity_candidate \
            tests.test_stage3_v17_27_runtime_promotion \
            tests.test_stage3_v17_27_full_final_evidence \
            tests.test_stage3_v17_27_full_final_comparator \
            tests.test_stage3_v17_27_full_final_comparator_v2 \
            -v
      - name: Run V17.28 retained candidate, production and full-final regressions
        run: |
          python -m unittest \
            tests.test_stage3_s3g1j_v17_28_split_equity_candidate \
            tests.test_stage3_v17_28_runtime_wrapper \
            tests.test_stage3_v17_28_runtime_promotion \
            tests.test_stage3_v17_28_full_final_comparator \
            tests.test_stage3_v17_28_full_final_evidence \
            -v
      - name: Run V17.29 runtime-wrapper regression
        run: python -m unittest tests.test_stage3_v17_29_runtime_wrapper tests.test_stage3_v17_29_runtime_promotion -v
      - name: Run official-PDF coordinate fallback regression
        run: python -m unittest tests.test_stage3_financial_coordinate_fallback_v14_integration -v
