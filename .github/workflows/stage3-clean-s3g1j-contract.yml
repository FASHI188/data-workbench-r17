name: Stage3 Clean S3G1J Runtime Contract
# Contract for the whitelisted production runtime closure and fail-closed regressions.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'governance/stage3_s3g1j_runtime_manifest.json'
      - 'config/stage3_s3g1j_v10_diagnostic_samples.json'
      - 'scripts/extract_stage3_financial_pdf_values*.py'
      - 'scripts/stage3_financial_pdf_parser*.py'
      - 'scripts/stage3_financial_coordinate_fallback*.py'
      - 'scripts/stage3_financial_spatial_alias*.py'
      - 'scripts/stage3_financial_statement_blocks*.py'
      - 'scripts/select_stage3_financial_report_versions*.py'
      - 'scripts/compare_stage3_financial_report_versions_v3.py'
      - 'scripts/build_stage3_partial_body_ledger_v12.py'
      - 'scripts/accept_stage3_s3g1j_v17_24_production*.py'
      - 'scripts/finalize_stage3_financial_pdf_values.py'
      - 'tests/test_stage3_financial_*.py'
      - 'tests/test_stage3_unique_usable_tie_v15.py'
      - 'tests/test_stage3_statement_blocks_v16_3.py'
      - 'tests/test_stage3_v16_contextual_parser.py'
      - 'tests/test_stage3_v17_*.py'
      - '.github/workflows/stage3-clean-s3g1j-contract.yml'

permissions:
  contents: read

env:
  PYTHONPATH: scripts

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
      - name: Install verified Stage3 runtime
        run: python -m pip install --disable-pip-version-check -c requirements/constraints-verified.txt requests pymupdf pytest
      - name: Verify V17.24 runtime provenance remains fail-closed
        run: |
          python - <<'PY'
          import json
          x=json.load(open('governance/stage3_s3g1j_runtime_manifest.json',encoding='utf-8'))
          assert x['schema_version']==5, x
          assert x['integration_branch']=='agent/stage3-clean-integration'
          assert x['integration_commit']=='6e03376556a31e2fc6fdc9e0bb9e8fd1ef30a8fe'
          assert x['file_count']==70, x

          p15=x['v17_15_promotion']
          assert p15['accepted_production_exact_82_run']==30535567713
          assert p15['source_sha_match_count']==82
          assert p15['promoted_recovery_announcement_ids']==['1225153907']
          assert p15['remaining_fail_closed_count']==81

          p17=x['v17_17_promotion']
          assert p17['combined_production_exact_82_run']==30551663340
          assert p17['combined_production_recovered_announcement_ids']==['1212731093','1225153907']
          assert p17['remaining_fail_closed_count']==80

          p21=x['v17_21_promotion']
          assert p21['production_acceptance_run']==30645504197
          assert p21['production_acceptance_head_sha']=='ae967fda2c53796e9b886b54f1ab7b7ea69f6623'
          assert p21['combined_production_exact_82_artifact_digest']=='sha256:3779e0a7a6f6697ade3a58d6463a2200bf06b83855b4800a5750ebed5ca312f5'
          assert p21['combined_production_recovered_announcement_ids']==['1212731093','1219311356','1225153907']
          assert p21['remaining_fail_closed_count']==79

          p24=x['v17_24_promotion']
          assert p24['candidate_safety_run']==30650516337
          assert p24['superseded_false_positive_run']==30651790668
          assert p24['accepted_production_run']==30685830808
          assert p24['accepted_production_head_sha']=='92de74e7898be36239dc163e3811c9ae3f732e60'
          assert p24['accepted_production_artifact']=='stage3-s3g1j-v17-24-production-acceptance-compat'
          assert p24['accepted_production_artifact_digest']=='sha256:4865dd03537c70208d2a4358cf8b54ab65408510fce838017a4bf77bee30a98d'
          assert p24['source_sha_match_count']==82
          assert p24['combined_production_recovered_count']==4
          assert p24['combined_production_recovered_announcement_ids']==['1212731093','1219311356','1221568845','1225153907']
          assert p24['v17_24_incremental_recovery_announcement_ids']==['1221568845']
          assert p24['remaining_fail_closed_count']==78
          assert p24['prior_recovery_blocks_equal_v17_21_authority'] is True
          assert p24['legacy_no_inference_key_compatibility'] is True
          assert p24['production_wiring_status']=='PRODUCTION_ACCEPTED_NOT_FINAL'

          full=x['full_basis_v17_21_final']
          assert full['run']==30649251360
          assert full['artifact_digest']=='sha256:7faff72949a6e0a98f49088bce99bc2df37c7cbcb0259b39d1b2655fc02f6086'
          assert full['canonical_report_version_moments']==121354
          assert full['document_rows']==121354
          assert full['numeric_observations']==1051772
          assert full['document_error_count']==1380
          assert full['unresolved_tie_count']==1297
          assert full['single_canonical_parser_failure_count']==1196
          assert full['verdict']=='FAIL_CLOSED'

          h=x['hard_invariants']
          assert h['accounting_identity_tolerance']=='0.005'
          assert h['original_pdf_authority'] is True
          assert h['source_sha_required'] is True
          assert h['point_in_time_policy_preserved'] is True
          assert h['declared_issuer_gate_preserved'] is True
          assert h['unreliable_parse_fail_closed'] is True
          assert h['current_f10_historical_backfill_forbidden'] is True
          assert h['global_row_tolerance_changed'] is False
          assert h['e_equals_a_minus_l_inference'] is False
          assert h['corrupted_equity_alias']=='所有者权益（或d股东权益）合计'
          assert h['corrupted_equity_amount_column_count']==2
          assert h['prior_recovery_block_equality_required'] is True
          assert h['formal_shard_count']==64
          assert h['formal_runtime_generation']=='V17.24'
          assert h['formal_shard_gate']=='S3G1J_FINANCIAL_PDF_EXTRACTION_SHARD_V17_24'
          assert h['formal_parser_method']=='CNINFO_ORIGINAL_PDF_PYMUPDF_V14_V17_24_EXACT_CORRUPTED_GROUP_EQUITY_ALIAS_FINAL_FALLBACK'
          assert h['formal_methodology_version']=='V3.3.4-V17.24'
          assert h['formal_shard_gzip_mtime']==0
          assert h['formal_shard_embedded_filename']==''
          assert h['formal_numeric_source_format']=='PDF'
          assert h['mixed_runtime_generation_forbidden'] is True
          assert h['stage4_alpha_locked'] is True

          tests=x['tests']
          assert tests['v17_24_corrupted_equity_contracts']==3
          assert tests['v17_24_production_parser_contracts']==4
          assert tests['v17_24_acceptance_baseline_contracts']==3
          assert tests['v17_24_combined_production_exact_82_source_sha_replay']==82
          assert tests['v17_24_residual_source_sha_replay']==79
          assert x['production_final_status']=='NOT_FINAL'
          PY
      - name: Import promoted V17.24 production runtime closure
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0,'scripts')
          import accept_stage3_s3g1j_v17_24_production_v2 as acceptance
          import extract_stage3_financial_pdf_values_v14 as extractor
          import stage3_financial_pdf_parser_v15 as parser
          import stage3_financial_spatial_alias_v17_24 as corrupted_equity
          import finalize_stage3_financial_pdf_values as finalizer
          assert callable(extractor.parse_pdf_bytes)
          assert extractor.METHOD=='CNINFO_ORIGINAL_PDF_PYMUPDF_V14_V17_24_EXACT_CORRUPTED_GROUP_EQUITY_ALIAS_FINAL_FALLBACK'
          assert extractor.METHODOLOGY_VERSION=='V3.3.4-V17.24'
          assert extractor.SHARD_GATE=='S3G1J_FINANCIAL_PDF_EXTRACTION_SHARD_V17_24'
          assert callable(extractor._rewrite_v17_24_shard_manifest)
          assert parser.METHOD=='V17_24_EXACT_CORRUPTED_GROUP_EQUITY_ALIAS_FINAL_FALLBACK'
          assert corrupted_equity.CORRUPTED_EQUITY_ALIAS=='所有者权益（或d股东权益）合计'
          assert callable(corrupted_equity.diagnose_spatial_balance_sheet_v17_24)
          assert callable(acceptance._validate_recovery)
          assert callable(finalizer._validate_shard_manifests)
          print('S3G1J_V17_24_PRODUCTION_RUNTIME_IMPORT_PASS')
          PY
      - name: Run inherited pure fail-closed regression contracts
        run: |
          python -m unittest \
            tests.test_stage3_financial_balance_block_v4 \
            tests.test_stage3_financial_balance_block_v5 \
            tests.test_stage3_financial_balance_block_v6 \
            tests.test_stage3_financial_balance_title_v8 \
            tests.test_stage3_financial_pdf_issuer_gate_v9 \
            tests.test_stage3_financial_pdf_parser_v11 \
            tests.test_stage3_financial_pdf_parser_v13 \
            tests.test_stage3_financial_tie_resolution \
            tests.test_stage3_unique_usable_tie_v15 \
            tests.test_stage3_statement_blocks_v16_3 \
            tests.test_stage3_v16_contextual_parser \
            tests.test_stage3_v17_explicit_dual_evidence \
            tests.test_stage3_v17_column_evidence \
            tests.test_stage3_v17_15_adjacent_bridge \
            tests.test_stage3_v17_15_production_parser \
            tests.test_stage3_v17_17_production_parser \
            -v
      - name: Run V17.21 final-chain regressions
        run: python -m unittest tests.test_stage3_v17_21_production_parser -v
      - name: Run V17.24 production and authority regressions
        run: |
          python -m unittest \
            tests.test_stage3_v17_24_corrupted_equity \
            tests.test_stage3_v17_24_production_parser \
            tests.test_stage3_v17_24_acceptance_baseline \
            -v
      - name: Run official-PDF coordinate fallback regression
        run: python -m unittest tests.test_stage3_financial_coordinate_fallback_v14_integration -v
