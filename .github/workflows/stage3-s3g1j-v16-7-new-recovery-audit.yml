name: Stage3 S3G1J V16.7 New Recovery Independent Audit

on:
  pull_request:
    branches: [stage3-s3g1j-coordinate-table-v14]
    paths:
      - '.github/workflows/stage3-s3g1j-v16-7-new-recovery-audit.yml'
      - 'scripts/probe_stage3_s3g1j_v16_7_new_recovery_independent_audit.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ github.token }}
  FROZEN_127_RUN: '30424465440'
  PYTHONPATH: scripts

jobs:
  audit-seven-new-recoveries:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests pymupdf
      - name: Restore exact frozen 127 single-canonical input
        run: |
          rm -rf prepared audit
          gh run download "$FROZEN_127_RUN" -R "$GITHUB_REPOSITORY" \
            -n stage3-s3g1j-v15-single-source-input -D prepared
          test -f prepared/single_source_residual_versions.csv.gz
      - name: Independently audit seven new recovery claims on official PDFs
        run: |
          python scripts/probe_stage3_s3g1j_v16_7_new_recovery_independent_audit.py \
            --versions prepared/single_source_residual_versions.csv.gz \
            --out audit/new_recovery_independent_audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage3-s3g1j-v16-7-new-recovery-audit
          path: audit/new_recovery_independent_audit.json
          retention-days: 90
          compression-level: 0
