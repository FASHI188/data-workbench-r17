name: Freshness Forward Phase1 - Master Lifecycle

on:
  workflow_dispatch:
  push:
    branches:
      - agent/freshness-v2-execution-20260812
    paths:
      - '.github/workflows/freshness-forward-phase1.yml'
      - 'scripts/fetch_exchange_master.py'
      - 'scripts/reconcile_current_master.py'
      - 'scripts/audit_forward_current_master.py'
      - 'scripts/build_forward_lifecycle_seed.py'
      - 'scripts/fetch_historical_lifecycle.py'
      - 'scripts/build_security_history.py'
      - 'scripts/audit_security_history.py'
      - 'tests/test_freshness_forward_harness.py'
      - 'config/stage2_hard_gates.json'
      - 'requirements/constraints-verified.txt'
      - '.python-version'

permissions:
  contents: read

env:
  PYTHONPATH: scripts

concurrency:
  group: freshness-forward-phase1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  master-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout exact execution branch
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
      - name: Install verified dependencies
        run: python -m pip install --disable-pip-version-check -c requirements/constraints-verified.txt requests pytest openpyxl
      - name: Prepare evidence directory and preserve frozen seed
        run: |
          mkdir -p build/freshness-phase1
          cp data/security_lifecycle/current_list_seed.csv build/freshness-phase1/frozen_current_list_seed.csv
      - name: Stage2 G1/G2 and forward-harness exact regression tests
        run: pytest -q tests/test_fetch_exchange_master.py tests/test_fetch_historical_lifecycle.py tests/test_security_code_transitions.py tests/test_freshness_forward_harness.py
      - name: Fetch current official exchange master candidate
        id: g1fetch
        shell: bash
        run: |
          set +e
          code=99
          for attempt in 1 2 3; do
            rm -rf data/current_master
            mkdir -p data/current_master
            echo "official G1 attempt=$attempt" >> build/freshness-phase1/g1_attempts.log
            python scripts/fetch_exchange_master.py --allow-derived-szse-board > build/freshness-phase1/g1_fetch_stdout_attempt${attempt}.log 2> build/freshness-phase1/g1_fetch_stderr_attempt${attempt}.log
            code=$?
            echo "attempt=$attempt exit=$code" >> build/freshness-phase1/g1_attempts.log
            if [ "$code" -eq 0 ]; then break; fi
            sleep $((attempt * 8))
          done
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Reconcile current master against independent official controls
        id: g1reconcile
        if: ${{ fromJSON(steps.g1fetch.outputs.exit_code || '99') == 0 }}
        shell: bash
        run: |
          set +e
          python scripts/reconcile_current_master.py > build/freshness-phase1/g1_reconcile_stdout.log 2> build/freshness-phase1/g1_reconcile_stderr.log
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Audit forward current master fail-closed
        id: g1audit
        if: ${{ fromJSON(steps.g1reconcile.outputs.exit_code || '99') == 0 }}
        shell: bash
        run: |
          set +e
          python scripts/audit_forward_current_master.py > build/freshness-phase1/g1_forward_audit.json 2> build/freshness-phase1/g1_forward_audit_stderr.log
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Build disposable forward lifecycle seed from fresh master
        id: seed
        if: ${{ fromJSON(steps.g1audit.outputs.exit_code || '99') == 0 }}
        shell: bash
        run: |
          set +e
          python scripts/build_forward_lifecycle_seed.py > build/freshness-phase1/forward_seed_stdout.log 2> build/freshness-phase1/forward_seed_stderr.log
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Fetch official lifecycle history against fresh current identity set
        id: g2fetch
        if: ${{ fromJSON(steps.seed.outputs.exit_code || '99') == 0 }}
        shell: bash
        run: |
          set +e
          code=99
          for attempt in 1 2 3; do
            rm -rf data/security_lifecycle/raw data/security_lifecycle/events.csv data/security_lifecycle/manifest.json data/security_lifecycle/security_intervals.csv
            echo "official G2 attempt=$attempt" >> build/freshness-phase1/g2_attempts.log
            python scripts/fetch_historical_lifecycle.py > build/freshness-phase1/g2_fetch_stdout_attempt${attempt}.log 2> build/freshness-phase1/g2_fetch_stderr_attempt${attempt}.log
            code=$?
            echo "attempt=$attempt exit=$code" >> build/freshness-phase1/g2_attempts.log
            if [ "$code" -eq 0 ]; then break; fi
            sleep $((attempt * 8))
          done
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Build survivorship-free lifecycle intervals
        id: g2build
        if: ${{ fromJSON(steps.g2fetch.outputs.exit_code || '99') == 0 }}
        shell: bash
        run: |
          set +e
          python scripts/build_security_history.py > build/freshness-phase1/g2_build_stdout.log 2> build/freshness-phase1/g2_build_stderr.log
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Audit lifecycle fail-closed
        id: g2audit
        if: ${{ fromJSON(steps.g2build.outputs.exit_code || '99') == 0 }}
        shell: bash
        run: |
          set +e
          python scripts/audit_security_history.py > build/freshness-phase1/g2_audit.json 2> build/freshness-phase1/g2_audit_stderr.log
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Write phase1 summary
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path
          def read(path):
              p=Path(path)
              if not p.exists(): return None
              try: return json.loads(p.read_text(encoding='utf-8'))
              except Exception: return None
          def count_seed(path):
              p=Path(path)
              if not p.exists(): return None
              with p.open(encoding='utf-8',newline='') as f: return sum(1 for _ in csv.DictReader(f))
          manifest=read('data/current_master/manifest.json') or {}
          g1=read('build/freshness-phase1/g1_forward_audit.json') or {}
          g2=read('build/freshness-phase1/g2_audit.json') or {}
          seed=read('build/freshness-phase1/forward_lifecycle_seed.json') or {}
          out={
              'schema_version':3,
              'execution_head':'${{ github.sha }}',
              'current_master_as_of':(manifest.get('szse') or {}).get('as_of'),
              'current_master_fetched_at_utc':manifest.get('fetched_at_utc'),
              'current_master_hard_gate_status':manifest.get('hard_gate_status'),
              'g1_forward_pass':g1.get('pass'),
              'frozen_seed_rows':count_seed('build/freshness-phase1/frozen_current_list_seed.csv'),
              'forward_seed_rows':seed.get('rows'),
              'forward_seed_sha256':seed.get('seed_sha256'),
              'g2_pass':g2.get('pass'),
              'g1_fetch_exit':'${{ steps.g1fetch.outputs.exit_code }}',
              'g1_reconcile_exit':'${{ steps.g1reconcile.outputs.exit_code }}',
              'g1_audit_exit':'${{ steps.g1audit.outputs.exit_code }}',
              'seed_exit':'${{ steps.seed.outputs.exit_code }}',
              'g2_fetch_exit':'${{ steps.g2fetch.outputs.exit_code }}',
              'g2_build_exit':'${{ steps.g2build.outputs.exit_code }}',
              'g2_audit_exit':'${{ steps.g2audit.outputs.exit_code }}',
              'authoritative':False,
              'purpose':'freshness candidate evidence only; does not mutate frozen Stage2/Stage3 or unlock Stage4',
          }
          Path('build/freshness-phase1/summary.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - name: Preserve phase1 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: freshness-forward-phase1-master-lifecycle
          path: |
            build/freshness-phase1
            data/current_master
            data/security_lifecycle
          if-no-files-found: warn
          compression-level: 0
          retention-days: 90
      - name: Fail closed after evidence upload
        if: ${{ fromJSON(steps.g1fetch.outputs.exit_code || '99') != 0 || fromJSON(steps.g1reconcile.outputs.exit_code || '99') != 0 || fromJSON(steps.g1audit.outputs.exit_code || '99') != 0 || fromJSON(steps.seed.outputs.exit_code || '99') != 0 || fromJSON(steps.g2fetch.outputs.exit_code || '99') != 0 || fromJSON(steps.g2build.outputs.exit_code || '99') != 0 || fromJSON(steps.g2audit.outputs.exit_code || '99') != 0 }}
        run: exit 1
