name: Freshness Forward Phase1 - Master Lifecycle Delta

on:
  workflow_dispatch:
  push:
    branches:
      - agent/freshness-v2-execution-20260812
    paths:
      - '.github/workflows/freshness-forward-phase1.yml'
      - 'scripts/audit_forward_current_master.py'
      - 'scripts/audit_forward_lifecycle_delta.py'
      - 'scripts/build_forward_lifecycle_seed.py'
      - 'tests/test_freshness_forward_harness.py'
      - 'data/stage2_final/manifest.json'
      - 'data/security_lifecycle/current_list_seed.csv'
      - 'requirements/constraints-verified.txt'
      - '.python-version'

permissions:
  contents: read
  actions: read

env:
  PYTHONPATH: scripts
  G1_ANCHOR_RUN: '31615123259'
  G1_ANCHOR_HEAD: 'e790fa3bf835be3c2baa1f5fb831381281105364'
  G1_ANCHOR_ARTIFACT: '9148909854'
  G1_ANCHOR_DIGEST: '1b73ea7f57c475bb63b2e126d0eec669f4847e3ba2cfaa79b284d3ade24c6295'

concurrency:
  group: freshness-forward-phase1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  master-lifecycle-delta:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact execution branch
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
      - name: Install verified dependencies
        run: python -m pip install --disable-pip-version-check -c requirements/constraints-verified.txt pytest
      - name: Prepare evidence directory and preserve frozen seed
        run: |
          mkdir -p build/freshness-phase1
          cp data/security_lifecycle/current_list_seed.csv build/freshness-phase1/frozen_current_list_seed.csv
      - name: Forward harness regression tests
        run: pytest -q tests/test_freshness_forward_harness.py
      - name: Download exact successful same-day G1 official evidence anchor
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${G1_ANCHOR_ARTIFACT}/zip" \
            -o build/freshness-phase1/g1_anchor.zip
          echo "${G1_ANCHOR_DIGEST}  build/freshness-phase1/g1_anchor.zip" | sha256sum -c -
          mkdir -p build/freshness-phase1/g1_anchor
          unzip -q build/freshness-phase1/g1_anchor.zip -d build/freshness-phase1/g1_anchor
      - name: Verify exact G1 anchor internal files
        shell: bash
        run: |
          set -euo pipefail
          cd build/freshness-phase1/g1_anchor
          echo 'b08b0fb6daceac1cb1c7b1168d4c609c83fa9b27b10736dd91987c15df80d21b  data/current_master/manifest.json' | sha256sum -c -
          echo '30935ebc44be6a0f1355fe973a6e3c0b8775bd21d4753455511389501763245d  data/current_master/reconciliation.json' | sha256sum -c -
          echo '9017eedf3e24750a234d54e2c616df31d5d82c756a555e0ce06c65a32997f25b  data/current_master/cn_main_a.csv' | sha256sum -c -
          echo '2b39f863f7759b01d75c17fddc2bfa3ceafc10fa3e68462944cd9f34d8e6d416  data/current_master/sse_main_a.csv' | sha256sum -c -
          echo '8a519f272b4b89e53f559e4b9a18a84146cd04955b8817c26982863286e9df0d  data/current_master/szse_main_a.csv' | sha256sum -c -
      - name: Materialize anchored fresh current master in disposable workspace
        run: |
          rm -rf data/current_master
          cp -a build/freshness-phase1/g1_anchor/data/current_master data/current_master
      - name: Audit anchored forward current master fail-closed
        id: g1audit
        shell: bash
        run: |
          set +e
          python scripts/audit_forward_current_master.py > build/freshness-phase1/g1_forward_audit.json 2> build/freshness-phase1/g1_forward_audit_stderr.log
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Audit lifecycle freshness as frozen-to-current identity delta
        id: lifecycle
        if: ${{ fromJSON(steps.g1audit.outputs.exit_code || '99') == 0 }}
        shell: bash
        run: |
          set +e
          python scripts/audit_forward_lifecycle_delta.py > build/freshness-phase1/lifecycle_forward_delta.json 2> build/freshness-phase1/lifecycle_forward_delta_stderr.log
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Build disposable forward lifecycle seed for downstream freshness phases
        id: seed
        if: ${{ fromJSON(steps.lifecycle.outputs.exit_code || '99') == 0 }}
        shell: bash
        run: |
          set +e
          python scripts/build_forward_lifecycle_seed.py > build/freshness-phase1/forward_seed_stdout.log 2> build/freshness-phase1/forward_seed_stderr.log
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Write phase1 summary
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path
          def read(path):
              p=Path(path)
              if not p.exists(): return None
              try: return json.loads(p.read_text(encoding='utf-8'))
              except Exception: return None
          def count_seed(path):
              p=Path(path)
              if not p.exists(): return None
              with p.open(encoding='utf-8',newline='') as f: return sum(1 for _ in csv.DictReader(f))
          manifest=read('data/current_master/manifest.json') or {}
          g1=read('build/freshness-phase1/g1_forward_audit.json') or {}
          life=read('build/freshness-phase1/lifecycle_forward_delta.json') or {}
          seed=read('build/freshness-phase1/forward_lifecycle_seed.json') or {}
          out={
              'schema_version':4,
              'execution_head':'${{ github.sha }}',
              'g1_anchor_run':int('${{ env.G1_ANCHOR_RUN }}'),
              'g1_anchor_head':'${{ env.G1_ANCHOR_HEAD }}',
              'g1_anchor_artifact':int('${{ env.G1_ANCHOR_ARTIFACT }}'),
              'g1_anchor_digest':'sha256:${{ env.G1_ANCHOR_DIGEST }}',
              'current_master_as_of':(manifest.get('szse') or {}).get('as_of'),
              'current_master_fetched_at_utc':manifest.get('fetched_at_utc'),
              'g1_forward_pass':g1.get('pass'),
              'frozen_seed_rows':count_seed('build/freshness-phase1/frozen_current_list_seed.csv'),
              'fresh_current_rows':g1.get('rows'),
              'lifecycle_forward_pass':life.get('pass'),
              'lifecycle_added_count':life.get('added_count'),
              'lifecycle_removed_count':life.get('removed_count'),
              'lifecycle_additions':life.get('additions'),
              'forward_seed_rows':seed.get('rows'),
              'forward_seed_sha256':seed.get('seed_sha256'),
              'g1_audit_exit':'${{ steps.g1audit.outputs.exit_code }}',
              'lifecycle_exit':'${{ steps.lifecycle.outputs.exit_code }}',
              'seed_exit':'${{ steps.seed.outputs.exit_code }}',
              'phase1_pass': bool(g1.get('pass') and life.get('pass') and seed.get('status')=='FORWARD_SEED_BUILT'),
              'authoritative':False,
              'purpose':'forward G1 + lifecycle freshness evidence; Stage2/Stage3 frozen artifacts remain unchanged; Stage4 remains locked',
          }
          Path('build/freshness-phase1/summary.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - name: Preserve phase1 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: freshness-forward-phase1-master-lifecycle-delta
          path: |
            build/freshness-phase1/summary.json
            build/freshness-phase1/g1_forward_audit.json
            build/freshness-phase1/lifecycle_forward_delta.json
            build/freshness-phase1/forward_lifecycle_seed.json
            build/freshness-phase1/frozen_current_list_seed.csv
            data/current_master
            data/security_lifecycle/current_list_seed.csv
          if-no-files-found: warn
          compression-level: 0
          retention-days: 90
      - name: Fail closed after evidence upload
        if: ${{ fromJSON(steps.g1audit.outputs.exit_code || '99') != 0 || fromJSON(steps.lifecycle.outputs.exit_code || '99') != 0 || fromJSON(steps.seed.outputs.exit_code || '99') != 0 }}
        run: exit 1
