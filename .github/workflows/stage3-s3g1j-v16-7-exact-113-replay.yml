name: Stage3 S3G1J V16.7 Exact 113 Single Source Replay

on:
  pull_request:
    branches: [stage3-s3g1j-coordinate-table-v14]
    paths:
      - '.github/workflows/stage3-s3g1j-v16-7-exact-113-replay.yml'
      - 'scripts/probe_stage3_s3g1j_v16_7_exact_113_replay.py'
      - 'scripts/stage3_financial_pdf_parser_v10.py'
      - 'scripts/stage3_financial_spatial_alias_v16_7.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ github.token }}
  FROZEN_127_RUN: '30424465440'
  V16_PRODUCTION_RUN: '30432739832'
  PYTHONPATH: scripts

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require accepted V16.7 production fallback
        run: test "$(gh run view "$V16_PRODUCTION_RUN" -R "$GITHUB_REPOSITORY" --json conclusion --jq .conclusion)" = success
      - name: Verify exact frozen 127 input artifact exists
        run: |
          rm -rf prepared
          gh run download "$FROZEN_127_RUN" -R "$GITHUB_REPOSITORY" \
            -n stage3-s3g1j-v15-single-source-input -D prepared
          test -f prepared/single_source_residual_versions.csv.gz
          python - <<'PY'
          import csv,gzip
          with gzip.open('prepared/single_source_residual_versions.csv.gz','rt',encoding='utf-8',newline='') as f:
              rows=list(csv.DictReader(f))
          assert len(rows)==127, len(rows)
          print('FROZEN_127_INPUT_PASS',len(rows))
          PY

  replay:
    needs: lock
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0,1,7,9]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests pymupdf
      - name: Restore exact frozen 127 single-canonical input
        run: |
          rm -rf prepared build/v16-exact-113
          gh run download "$FROZEN_127_RUN" -R "$GITHUB_REPOSITORY" \
            -n stage3-s3g1j-v15-single-source-input -D prepared
          test -f prepared/single_source_residual_versions.csv.gz
      - name: Reconstruct V14 baseline and apply V16 on same PDF bytes
        run: |
          mkdir -p build/v16-exact-113
          python scripts/probe_stage3_s3g1j_v16_7_exact_113_replay.py \
            --versions prepared/single_source_residual_versions.csv.gz \
            --shard ${{ matrix.shard }} --shards 64 \
            --out build/v16-exact-113/shard${{ matrix.shard }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage3-s3g1j-v16-exact-113-${{ matrix.shard }}
          path: build/v16-exact-113/shard${{ matrix.shard }}.json
          retention-days: 90
          compression-level: 0

  summarize:
    needs: replay
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: stage3-s3g1j-v16-exact-113-*
          path: residuals
          merge-multiple: true
      - name: Enforce exact V14=113 baseline and summarize V16 increment
        run: |
          python - <<'PY'
          import glob,json,os
          paths=sorted(glob.glob('residuals/shard*.json'))
          rows=[json.load(open(p,encoding='utf-8')) for p in paths]
          rows.sort(key=lambda x:x['shard'])
          assert [r['shard'] for r in rows]==[0,1,7,9], rows
          assert all(r['pass'] for r in rows), [r['errors'] for r in rows]
          assert sum(r['input_single_source_count'] for r in rows)==127
          assert sum(r['v14_remaining_count'] for r in rows)==113
          assert sum(r['v14_success_count'] for r in rows)==14
          assert sum(len(r['v14_success_path_regressions']) for r in rows)==0
          recoveries=[x for r in rows for x in r['v16_new_recoveries']]
          remaining=[x for r in rows for x in r['v16_remaining']]
          report={
            'gate':'S3G1J_V16_7_EXACT_113_SINGLE_SOURCE_REPLAY',
            'pass': True,
            'frozen_input_count':127,
            'v14_success_count':14,
            'v14_remaining_count':113,
            'v16_new_recovery_count':len(recoveries),
            'v16_remaining_count':len(remaining),
            'all_v14_success_paths_unchanged':True,
            'all_v16_recoveries_have_period_column_identity_evidence':all(
              x['arbitration_ok'] and x['expected_date_ok'] and x['period_gate_ok'] and x['column_gate_ok']
              for x in recoveries
            ),
            'per_shard':[{k:r[k] for k in ('shard','input_single_source_count','v14_success_count','v14_remaining_count','v16_new_recovery_count','v16_remaining_count')} for r in rows],
            'v16_new_recoveries':recoveries,
            'v16_remaining':remaining,
            'stage4_alpha_locked':True,
          }
          assert report['v16_new_recovery_count'] + report['v16_remaining_count'] == 113
          assert report['all_v16_recoveries_have_period_column_identity_evidence']
          os.makedirs('summary',exist_ok=True)
          json.dump(report,open('summary/v16_exact_113_replay.json','w',encoding='utf-8'),ensure_ascii=False,indent=2)
          print(json.dumps({k:report[k] for k in ('frozen_input_count','v14_success_count','v14_remaining_count','v16_new_recovery_count','v16_remaining_count','all_v14_success_paths_unchanged','all_v16_recoveries_have_period_column_identity_evidence')},ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stage3-s3g1j-v16-exact-113-summary
          path: summary/v16_exact_113_replay.json
          retention-days: 90
          compression-level: 0
