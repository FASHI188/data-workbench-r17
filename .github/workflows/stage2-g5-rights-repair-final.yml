name: Stage2 G5 Rights Repair and Finalize

on:
  workflow_dispatch:
  push:
    branches: [agent/stage2-security-identity-final]
    paths:
      - 'config/g5_identity_final_trigger.json'
  pull_request:
    branches: [main]
    types: [synchronize, reopened]
    paths:
      - 'config/g5_identity_final_trigger.json'
      - '.github/workflows/stage2-g5-rights-repair-final.yml'

permissions:
  contents: read
  actions: read

jobs:
  lock-g4:
    runs-on: ubuntu-latest
    outputs:
      g4_run: ${{ steps.lock.outputs.g4_run }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Lock an explicitly approved successful G4 identity run
        id: lock
        shell: bash
        run: |
          set -euo pipefail
          run=$(python - <<'PY'
          import json
          x=json.load(open('config/g5_identity_final_trigger.json',encoding='utf-8'))
          v=x.get('g4_run')
          assert isinstance(v,int) and v>0, x
          print(v)
          PY
          )
          conclusion=$(gh run view "$run" -R "$GITHUB_REPOSITORY" --json conclusion --jq '.conclusion')
          branch=$(gh run view "$run" -R "$GITHUB_REPOSITORY" --json headBranch --jq '.headBranch')
          test "$conclusion" = "success"
          test "$branch" = "agent/stage2-security-identity-final"
          gh run download "$run" -R "$GITHUB_REPOSITORY" -n stage2-g4-identity-final-evidence -D /tmp/g4-lock-check
          test -f "$(find /tmp/g4-lock-check -name g4_audit.json -print -quit)"
          python - <<'PY'
          import json,glob
          p=glob.glob('/tmp/g4-lock-check/**/g4_audit.json',recursive=True)[0]
          r=json.load(open(p,encoding='utf-8'))
          assert r.get('pass') is True, r
          assert r.get('tradable_states_missing_g3') == 0, r
          assert r.get('601268_all_suspended') is True, r
          assert r.get('600656_2016_05_12_nontrading') is True, r
          assert not r.get('errors'), r
          PY
          echo "g4_run=$run" >> "$GITHUB_OUTPUT"

  merge:
    needs: lock-g4
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      G2_SOURCE_RUN: '30242396006'
      PRIMARY_SOURCE_RUN: '30234301114'
      RIGHTS_SOURCE_RUN: '30240202162'
    steps:
      - uses: actions/checkout@v4
      - name: Download corrected G2 code-time lifecycle evidence
        run: |
          gh run download "$G2_SOURCE_RUN" -R "$GITHUB_REPOSITORY" -n stage2-g2-historical-evidence -D g2
          cp g2/security_intervals.csv data/security_lifecycle/security_intervals.csv
      - name: Download frozen primary CNINFO, SSE native, and repaired SZSE rights evidence
        shell: bash
        run: |
          mkdir -p build/g5-final data/g5-official
          gh run download "$PRIMARY_SOURCE_RUN" -R "$GITHUB_REPOSITORY" -n g5-final-sse-control -D build/g5-final
          for i in 0 1 2 3 4 5 6 7; do
            gh run download "$PRIMARY_SOURCE_RUN" -R "$GITHUB_REPOSITORY" -n "g5-final-cninfo-$i" -D build/g5-final
          done
          for i in 0 1 2 3; do
            gh run download "$RIGHTS_SOURCE_RUN" -R "$GITHUB_REPOSITORY" -n "g5-rights-szse-$i" -D build/g5-final
          done
      - name: Merge, code-time remap, and reconcile official action ledger with preserved diagnostics
        shell: bash
        run: |
          set +e
          python scripts/merge_g5_cninfo_primary.py --root build/g5-final --out data/g5-official > data/g5-official/merge_stdout.log 2> data/g5-official/merge_stderr.log
          code=$?
          echo "G5_MERGE_EXIT=$code" >> "$GITHUB_ENV"
          cat data/g5-official/g5_official_action_audit.json || true
          cat data/g5-official/merge_stderr.log || true
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: g5-identity-official-ledger
          path: data/g5-official
          retention-days: 90
          compression-level: 0
      - name: Preserve merge fail-closed status
        if: env.G5_MERGE_EXIT != '0'
        run: exit 1

  adjustment:
    needs: [lock-g4, merge]
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      GH_TOKEN: ${{ github.token }}
      G3_IDENTITY_RUN: '30242395968'
      G4_IDENTITY_RUN: ${{ needs.lock-g4.outputs.g4_run }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: g5-identity-official-ledger
          path: data/g5-official
      - name: Download repaired G3 and approved G4 evidence
        shell: bash
        run: |
          gh run download "$G3_IDENTITY_RUN" -R "$GITHUB_REPOSITORY" -n stage2-g3-identity-repaired-ohlcv -D g3-identity
          gh run download "$G4_IDENTITY_RUN" -R "$GITHUB_REPOSITORY" -n stage2-g4-identity-final-evidence -D g4-identity
      - name: Verify independently filed 600649 bootstrap control source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' > /tmp/bootstrap.env
          import json
          x=json.load(open('config/g5_suspended_reference_bootstrap.json',encoding='utf-8'))
          assert len(x)==1
          r=x[0]
          print('URL='+r['source_url'])
          print('SHA='+r['source_sha256'])
          PY
          source /tmp/bootstrap.env
          curl -L --fail --retry 3 --retry-delay 2 -A 'Mozilla/5.0' -e 'https://www.cninfo.com.cn/' "$URL" -o /tmp/600649_control.pdf
          echo "$SHA  /tmp/600649_control.pdf" | sha256sum -c -
      - name: Build adjustment chain with G3 primary references and audited suspended bootstrap
        shell: bash
        run: |
          set +e
          mkdir -p data/g5-adjustment
          szdir=$(find g3-identity -type d -path '*/build/g3/szse' -print -quit)
          test -n "$szdir"
          g3root=$(dirname "$(dirname "$(dirname "$szdir")")")
          python scripts/build_g5_adjustment_from_g3.py --actions data/g5-official/g5_official_actions.csv.gz --g3-root "$g3root" --g4-root g4-identity --out data/g5-adjustment > data/g5-adjustment/adjustment_stdout.log 2> data/g5-adjustment/adjustment_stderr.log
          code=$?
          echo "G5_ADJUSTMENT_EXIT=$code" >> "$GITHUB_ENV"
          cat data/g5-adjustment/g5_adjustment_audit.json || true
          cat data/g5-adjustment/adjustment_stderr.log || true
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: g5-identity-adjustment-chain
          path: data/g5-adjustment
          retention-days: 90
          compression-level: 0
      - name: Preserve adjustment fail-closed status
        if: env.G5_ADJUSTMENT_EXIT != '0'
        run: exit 1

  factor-control:
    needs: adjustment
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      FACTOR_SOURCE_RUN: '30232698608'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: g5-identity-adjustment-chain
          path: data/g5-adjustment
      - name: Download independent BaoStock factor evidence
        run: gh run download "$FACTOR_SOURCE_RUN" -R "$GITHUB_REPOSITORY" -p 'g5-actions-*' -D factor-control
      - name: Audit independent factors under the same code-time identity with preserved diagnostics
        shell: bash
        run: |
          set +e
          mkdir -p data/g5-control
          python scripts/audit_g5_baostock_factor_control.py --factor-root factor-control --chain data/g5-adjustment/g5_adjustment_chain.csv.gz --out data/g5-control > data/g5-control/factor_stdout.log 2> data/g5-control/factor_stderr.log
          code=$?
          echo "G5_FACTOR_EXIT=$code" >> "$GITHUB_ENV"
          cat data/g5-control/g5_baostock_control.json || true
          cat data/g5-control/factor_stderr.log || true
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: g5-identity-factor-control
          path: data/g5-control
          retention-days: 90
      - name: Preserve factor-control fail-closed status
        if: env.G5_FACTOR_EXIT != '0'
        run: exit 1

  finalize:
    needs: [lock-g4, merge, adjustment, factor-control]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: g5-identity-official-ledger
          path: data/g5-official
      - uses: actions/download-artifact@v4
        with:
          name: g5-identity-adjustment-chain
          path: data/g5-adjustment
      - uses: actions/download-artifact@v4
        with:
          name: g5-identity-factor-control
          path: data/g5-control
      - name: Final G5 hard audit with preserved diagnostics
        shell: bash
        run: |
          set +e
          mkdir -p data/corporate_actions
          python scripts/finalize_g5_audit.py --official-audit data/g5-official/g5_official_action_audit.json --adjustment-audit data/g5-adjustment/g5_adjustment_audit.json --control-audit data/g5-control/g5_baostock_control.json --out data/corporate_actions > data/corporate_actions/finalize_stdout.log 2> data/corporate_actions/finalize_stderr.log
          code=$?
          echo "G5_FINAL_EXIT=$code" >> "$GITHUB_ENV"
          cat data/corporate_actions/g5_audit.json || true
          cat data/corporate_actions/finalize_stderr.log || true
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: stage2-g5-identity-final-evidence
          path: |
            data/g5-official
            data/g5-adjustment
            data/g5-control
            data/corporate_actions
          retention-days: 90
          compression-level: 0
      - name: Preserve final G5 fail-closed status
        if: env.G5_FINAL_EXIT != '0'
        run: exit 1
